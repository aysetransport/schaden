  const eintraege = [['fall', '⚠', 'Schadensfall'], ['tour', '🚚', 'Tour (heute)'], ['firma', '🏢', 'Firma'], ['interessent', '🎯', 'Interessent'], ['mitarbeiter', '👤', 'Mitarbeiter'],
    ['abwesenheit', '🏖', 'Abwesenheit'], ['fahrzeug', '🚐', 'Fahrzeug'], ['rechnung', '€', 'Rechnung'], ['angebot', '📄', 'Angebot'], ['rechnung-touren', '🧾', 'Rechnung aus Touren'],
    ...(MAIL.konto ? [['mail', '✉', 'E-Mail']] : []), ['anruf', '📞', 'Anrufliste (Akquise)']];
  dialog(`<h2>Neu anlegen</h2><div class="kacheln">${eintraege.map(([k, s, l]) => `<button class="kachel" data-neu-art="${k}"><span>${s}</span>${l}</button>`).join('')}</div>
    <div class="dialog-knoepfe"><button class="knopf" data-zu>Abbrechen</button></div>`);
  $('#dialog').onclick = e => {
    const b = e.target.closest('[data-neu-art]'); if (!b) return;
    $('#dialog').onclick = null; $('#dialog').close();
    ({ fall: () => { ANSICHT.bereich = 'faelle'; gehe('#/neu'); }, tour: () => { ANSICHT.bereich = 'touren'; ANSICHT.tourTag = heute(); gehe('#/'); setTimeout(() => TourAktionen.neu(heute()), 0); },
      firma: () => crmDialog('auftraggeber', null, null, id => { ANSICHT.bereich = 'firmen'; gehe('#/firma/' + id); }), interessent: interessentDialog,
      mitarbeiter: () => mitarbeiterDialog(null), abwesenheit: () => abwesenheitDialog(null), fahrzeug: () => fahrzeugDialog(null),
      rechnung: () => belegNeuDialog('RECHNUNG'), angebot: () => belegNeuDialog('ANGEBOT'), 'rechnung-touren': () => rechnungAusTouren(), mail: () => mailAnFirma(), anruf: anruflisteStarten })[b.dataset.neuArt]();
  };
}
$('#neu-knopf').onclick = neuMenue;
$('#app-titel').onclick = () => bereichWechseln('uebersicht');

// ---------- Übersicht ----------
function zeichneUebersicht() {
  const k = finanzKennzahlen(), w = wiedervorlagen(), kz = kennzahlen(faelle()), t = heute();
  const lage = tagesLage(t), heuteTouren = lage.touren.filter(x => x.kennzeichen || x.fahrerId), fr = freiAm(t);
  const morgen = tourenAm(plusTage(t, 1)).filter(x => x.kennzeichen || x.fahrerId);
  const probleme = heuteTouren.reduce((n, x) => n + tourHinweise(x, lage).filter(([f]) => f === 'rot').length, 0);
  const chancen = alle('chancen').filter(c => (CHANCEN_PHASE[c.phase] || CHANCEN_PHASE.ANFRAGE)[1]);
  const interessenten = auftraggeberListe().filter(f => f.status === 'INTERESSENT').length;
  const neueMails = Object.values(mails()).filter(ungelesen).length;
  const kachel = (wert, label, ziel, farbe = '') => `<button class="kennzahl ${farbe}" data-gehe-bereich="${ziel}"><b>${wert}</b><span>${label}</span></button>`;
  const fristen = [...fahrzeugTermine(), ...personalTermine()].sort((a, b) => a.datum.localeCompare(b.datum));
  const begruessung = (h => (h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend'))(new Date().getHours());
  return `<div class="seitenkopf"><h1>${begruessung}${S.einstellungen.bearbeiter ? ', ' + esc(S.einstellungen.bearbeiter.split(' ')[0]) : ''}</h1><div class="sk-haupt"><span class="leise">${esc(datumMitTag(t))}</span></div></div>
    <div class="dashboard">
      <div class="karte block"><h3>🚚 Heute unterwegs</h3>
        <div class="kennzahlen vier" style="margin:0">${kachel(heuteTouren.length, 'Touren heute', 'touren')}${kachel(Object.keys(lage.personen).length, 'Personal im Einsatz', 'touren')}
          ${kachel(fr.weg.length, 'abwesend', 'personal', fr.weg.length ? 'gelb' : '')}${kachel(probleme, 'Probleme im Plan', 'touren', probleme ? 'rot' : '')}</div>
        <p class="leise" style="margin-top:8px">${fr.frei.length} Leute und ${fr.fahrzeuge.length} Fahrzeuge frei · morgen ${morgen.length ? morgen.length + ' Touren geplant' : '<b>noch nichts geplant</b>'}</p>
        <div class="zeile" style="margin-top:8px"><button class="knopf voll" data-gehe-bereich="touren">Tagesplan öffnen</button>${!morgen.length ? `<button class="knopf" data-tour-tag="${plusTage(t, 1)}">Morgen planen</button>` : ''}</div></div>
      <div class="karte block"><h3>⏱ Heute zu tun (${w.ueberfaellig.length + w.heute.length})</h3>
        ${[...w.ueberfaellig, ...w.heute].slice(0, 7).map(x => terminEintrag(x)).join('') || '<p class="leise">Nichts fällig. 👍</p>'}
        ${w.ueberfaellig.length + w.heute.length > 7 ? '<button class="knopf text" data-gehe-bereich="termine">Alle Termine →</button>' : ''}</div>
      <div class="karte block"><h3>⚠ Schäden</h3><div class="kennzahlen vier" style="margin:0">${kachel(kz.offen, 'offen', 'faelle')}${kachel(kz.faellig, 'fällig', 'faelle', kz.faellig ? 'rot' : '')}
        ${kachel(geld(kz.forderung), 'Forderungen', 'faelle')}${kachel(faelle().filter(f => (f.schadensdatum || '') >= zeitraum('MONAT').von).length, 'diesen Monat', 'faelle')}</div></div>
      <div class="karte block"><h3>€ Finanzen</h3><div class="kennzahlen vier" style="margin:0">${kachel(geld(k.offen), `offen (${k.offenAnzahl})`, 'finanzen')}${kachel(geld(k.ueberfaellig), `überfällig (${k.ueberfaelligAnzahl})`, 'finanzen', k.ueberfaelligAnzahl ? 'rot' : '')}
        ${kachel(geld(k.monat), 'Umsatz Monat', 'finanzen')}${kachel(alle('touren').filter(x => tourGefahren(x) && x.datum <= t && x.datum >= plusTage(t, -90) && !(x.belegId && S.belege[x.belegId] && !S.belege[x.belegId].geloescht)).length, 'Touren nicht abgerechnet', 'auswertung')}</div>
        <div class="zeile" style="margin-top:8px"><button class="knopf" data-rechnung-touren="">🧾 Rechnung aus Touren</button></div></div>
      <div class="karte block"><h3>🎯 Vertrieb</h3><div class="kennzahlen vier" style="margin:0">${kachel(interessenten, 'Interessenten', 'firmen')}${kachel(chancen.length, 'offene Chancen', 'firmen')}
        ${kachel(geld(chancen.reduce((n, c) => n + (c.wertCent || 0), 0)), 'Wert der Chancen', 'firmen')}${kachel(auftraggeberListe().filter(langeKeinKontakt).length, 'lange ohne Kontakt', 'firmen')}</div>
        <div class="zeile" style="margin-top:8px"><button class="knopf" data-uebersicht="anrufliste">📞 Anrufliste starten</button><button class="knopf" data-uebersicht="interessent">＋ Interessent</button></div></div>
      <div class="karte block"><h3>📋 Fristen (${FRIST_VORLAUF} Tage)</h3>
        ${fristen.slice(0, 6).map(x => terminEintrag(x)).join('') || '<p class="leise">Keine Fristen von Fahrzeugen oder Personal fällig.</p>'}</div>
      ${MAIL.konto ? `<div class="karte block"><h3>✉ Postfach</h3><div class="kennzahlen vier" style="margin:0">${kachel(neueMails, 'ungelesen', 'postfach', neueMails ? 'blau' : '')}
        ${kachel(Object.values(mails()).filter(m => !istZugeordnet(m) && !m.ablage).length, 'nicht zugeordnet', 'postfach')}${kachel(Object.keys(geplanteMails()).length, 'geplant', 'postfach')}${kachel(Object.keys(entwuerfe()).length, 'Entwürfe', 'postfach')}</div></div>` : ''}
    </div>`;
}
$('#liste').addEventListener('click', e => {
  const u = e.target.closest('[data-uebersicht]'); if (!u) return;
  ({ anrufliste: anruflisteStarten, interessent: interessentDialog })[u.dataset.uebersicht]();
});

const ANSICHT = { filter: 'OFFEN', suche: '', notiz: '', bereich: 'firmen', firmenSuche: '', firmenStatus: '', firmaFuerNeuenFall: '' };
try { const b = localStorage.getItem('crm-bereich'); if (b && b in BEREICHE) ANSICHT.bereich = b; } catch {}
function route() {
  const [, art = '', id = ''] = location.hash.split('/');
  return { art, id };
}
const gehe = hash => { if (location.hash === hash) zeichne(); else location.hash = hash; };

function toast(text, ms = 3500) {
  const el = $('#toast'); el.textContent = text; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, ms);
}
function dialog(html, { schliessbar = true } = {}) {
  const d = $('#dialog'); d.innerHTML = html; d.oncancel = e => { if (!schliessbar) e.preventDefault(); };
  if (!d.open) d.showModal(); return d;
}
function bestaetige(titel, text, knopf, dann) {
  dialog(`<h2>${esc(titel)}</h2><p>${esc(text)}</p><div class="dialog-knoepfe"><button class="knopf text" data-zu>Abbrechen</button><button class="knopf text gefahr" id="ja">${esc(knopf)}</button></div>`);
  $('#ja').onclick = () => { $('#dialog').close(); dann(); };
}
document.addEventListener('click', e => { if (e.target.closest('[data-zu]')) $('#dialog').close(); });

function zeichne() {
  const r = route();
  if (!BEREICHE[ANSICHT.bereich]) ANSICHT.bereich = 'uebersicht';
  const breit = BREIT.has(ANSICHT.bereich);
  document.body.classList.toggle('zeigt-detail', !!r.art);
  document.body.classList.toggle('breit', breit && !r.art);
  document.body.classList.toggle('breit-detail', breit && !!r.art);
  $('#zurueck').hidden = !r.art;
  zeichneNavi(); zeichneListe(r); zeichneDetail(r); zeichneSync();
}

function zeichneListe(r = route()) {
  if (ANSICHT.bereich !== 'faelle') {
    const el = $('#liste'), fokus = document.activeElement && document.activeElement.id === 'firmen-suche';

    // Während in der Tourenplanung getippt wird, nicht neu zeichnen (z. B. bei einem Abgleich im Hintergrund).
    if (ANSICHT.bereich === 'touren' && tourEingabeOffen()) {
      clearTimeout(zeichneListe.spaeter); zeichneListe.spaeter = setTimeout(() => zeichneListe(), 1500); return;
    }
    const inhalt = { termine: () => zeichneTermine(), postfach: () => zeichnePostfach(r), finanzen: () => zeichneFinanzen(r), fuhrpark: () => zeichneFuhrpark(r), uebersicht: () => zeichneUebersicht(),
      touren: () => zeichneTouren(), personal: () => zeichnePersonal(r), auswertung: () => zeichneAuswertung() }[bereichSichtbar(ANSICHT.bereich) ? ANSICHT.bereich : 'uebersicht'];
    el.innerHTML = inhalt ? inhalt() : zeichneFirmenliste(r);
    if (fokus) { const s = $('#firmen-suche'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    return;
  }
  const k = kennzahlen(faelle());
  const liste = filtereUndSortiere(faelle(), ANSICHT.filter, ANSICHT.suche);
  const el = $('#liste');
  const fokusSuche = document.activeElement && document.activeElement.id === 'suche';
  const karten = liste.map(f => {
    const fk = faelligkeit(f);
    const text = fk.art === 'kommend' && fk.tage > 7 ? 'Wiedervorlage ' + datumText(f.wiedervorlageAm) : fk.text;
    const naechstes = [f.wartetAuf && 'Wartet auf ' + PARTNER[f.wartetAuf], f.wiedervorlageNotiz].filter(Boolean).join(' · ');
    return `<button class="karte klickbar ${r.id === f.id ? 'gewaehlt' : ''}" data-fall="${f.id}">
      <div class="zeile eng"><span class="titel fuell">${esc(anzeigeName(f))}</span><span class="marke ${status(f).farbe}">${esc(status(f).label)}</span></div>
      <div class="leise">${esc([f.fallnummer, f.tour, f.schadensdatum && 'Schaden vom ' + datumText(f.schadensdatum)].filter(Boolean).join(' · '))}</div>
      ${f.beschreibung ? `<div class="zwei-zeilen">${esc(f.beschreibung)}</div>` : ''}
      ${status(f).offen && naechstes ? `<div class="leise">${esc(naechstes)}</div>` : ''}
      <div class="zeile eng" style="margin-top:6px">${fk.art !== 'keine' ? `<span class="marke ${fk.farbe}">⏱ ${esc(text)}</span>` : status(f).offen ? '<span class="leise">Keine Wiedervorlage</span>' : ''}
        <span class="fuell"></span>${f.forderungCent != null ? `<b>${geld(f.forderungCent)}</b>` : ''}</div></button>`;
  }).join('');
  const leer = !faelle().length
    ? `<div class="leer">🚚<b>Noch keine Schadensfälle</b>Lege den ersten Fall an – so geht keine Wiedervorlage unter.<br><br><button class="knopf voll" data-neu>Ersten Fall anlegen</button></div>`
    : `<div class="leer"><b>${ANSICHT.suche.trim() ? 'Keine Treffer' : { FAELLIG: 'Nichts fällig', OFFEN: 'Keine offenen Fälle', ABGESCHLOSSEN: 'Noch nichts abgeschlossen', ALLE: 'Keine Fälle' }[ANSICHT.filter]}</b>
        ${ANSICHT.suche.trim() ? `Zu „${esc(ANSICHT.suche.trim())}“ wurde in dieser Ansicht nichts gefunden.` : ANSICHT.filter === 'FAELLIG' ? 'Heute muss bei keinem Fall nachgehakt werden.' : 'In dieser Ansicht gibt es derzeit keine Fälle.'}</div>`;
  el.innerHTML = seitenkopf('Schadensfälle', '<button class="knopf voll" data-neu>＋ Neuer Fall</button>', '<button class="knopf" data-schaden-csv>CSV</button><button class="knopf" data-gehe-bereich="auswertung">📊 Auswertungen</button>') + `
    <div class="kennzahlen">
      <button class="kennzahl ${k.faellig ? 'rot' : ''}" data-filter="FAELLIG"><b>${k.faellig}</b><span>Fällig</span></button>
      <button class="kennzahl" data-filter="OFFEN"><b>${k.offen}</b><span>Offen</span></button>
      <button class="kennzahl" data-filter="OFFEN"><b>${geld(k.forderung)}</b><span>Offene Forderungen</span></button>
    </div>
    <input class="suche" id="suche" type="search" placeholder="Name, Tour, Fall-Nr., Stichwort …" aria-label="Suche" value="${esc(ANSICHT.suche)}">
    <div class="chips" role="group" aria-label="Ansicht">${Object.entries(FILTER).map(([wert, label]) =>
      `<button class="chip" data-filter="${wert}" aria-pressed="${ANSICHT.filter === wert}">${label}${wert === 'FAELLIG' ? ` (${k.faellig})` : wert === 'OFFEN' ? ` (${k.offen})` : ''}</button>`).join('')}</div>
    <div id="karten">${liste.length ? karten : leer}</div>`;
  if (fokusSuche) { const s = $('#suche'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}
$('#liste').addEventListener('input', e => { if (e.target.id === 'suche') { ANSICHT.suche = e.target.value; zeichneListe(); } });
$('#liste').addEventListener('click', e => {
  const f = e.target.closest('[data-filter]'), fall = e.target.closest('[data-fall]');
  if (f) { ANSICHT.filter = f.dataset.filter; zeichneListe(); return; }
  const ziel = fall ? '#/fall/' + fall.dataset.fall : e.target.closest('[data-neu]') ? '#/neu' : '';
  if (ziel && formularSchliessen()) { formularStand = $('#fall-form') ? formularWerte() : ''; gehe(ziel); }
});
$('#zurueck').onclick = () => { if (!formularSchliessen()) return; gehe('#/'); };
$('#einstellungen-knopf').onclick = () => gehe('#/einstellungen');
$('#sync').onclick = () => (!mitCloud() ? gehe('#/einstellungen') : !PIN ? anmeldung() : abgleich());

function zeichneDetail(r = route()) {
  const el = $('#detail');
  if (r.art === 'neu' || r.art === 'bearbeiten') { if (!el.querySelector('#fall-form') || el.dataset.id !== r.art + r.id) zeichneFormular(r); return; }
  el.dataset.id = '';
  if (r.art === 'einstellungen') { zeichneEinstellungen(); return; }
  if (r.art === 'firma') { zeichneFirma(r.id); return; }
  if (r.art === 'fahrzeug') { zeichneFahrzeug(r.id); return; }
  if (r.art === 'mitarbeiter') { zeichneMitarbeiter(r.id); return; }
  if (r.art === 'mail') { zeichneMail(decodeURIComponent(r.id)); return; }
  if (r.art === 'beleg') {
    // Nicht neu zeichnen, während im Formular getippt wird (z. B. bei einem Abgleich im Hintergrund).
    const tippt = el.dataset.id === 'beleg' + r.id && document.activeElement && document.activeElement.closest('#beleg-form') && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!tippt) zeichneBeleg(r.id);
    return;
  }
  const f = r.art === 'fall' ? S.faelle[r.id] : null;
  if (!f || f.geloescht) {
    if (r.art === 'fall') { gehe('#/'); return; } // Fall wurde gelöscht (hier oder auf einem anderen Gerät)
    el.innerHTML = '<div class="leer"><b>Nichts ausgewählt</b>Links etwas auswählen – oder oben suchen bzw. mit „＋ Neu“ anlegen.</div>';
    return;
  }
  const fk = faelligkeit(f), anl = anlagenVon(f.id);
  const zeilen = paare => paare.filter(([, w]) => w && String(w).trim()).map(([l, w]) => `<dt>${l}</dt><dd>${esc(String(w).trim())}</dd>`).join('');
  const block = (titel, paare, leer) => { const z = zeilen(paare); return z || leer ? `<h3>${titel}</h3>${z ? `<dl>${z}</dl>` : `<p class="leise">${leer}</p>`}` : ''; };
  const zusatz = [f.wartetAuf && 'Wartet auf ' + PARTNER[f.wartetAuf], f.wiedervorlageNotiz].filter(Boolean).join(' · ');
  const firmaDesFalls = f.auftraggeberUuid && S.auftraggeber[f.auftraggeberUuid] && !S.auftraggeber[f.auftraggeberUuid].geloescht ? S.auftraggeber[f.auftraggeberUuid] : (f.auftraggeber && firmaZumNamen(f.auftraggeber));
  const notizFokus = document.activeElement && document.activeElement.id === 'notiz';
  el.innerHTML = `
    <div class="karte">
      <div class="zeile eng"><h2 class="gross fuell">${esc(anzeigeName(f))}</h2>
        <button class="symbol" data-akt="bearbeiten" aria-label="Bearbeiten">✎</button><button class="symbol" data-akt="mehr" aria-label="Weitere Aktionen">⋮</button></div>
      <p class="leise">Fall ${esc(f.fallnummer)} · ${esc(SCHADENSART[f.schadensart] || '')}${f.schadensdatum ? ' am ' + datumText(f.schadensdatum) : ''}</p>
      <div class="zeile" style="margin-top:10px"><span class="marke ${status(f).farbe}">${esc(status(f).label)}</span><button class="knopf text" data-akt="status">Status ändern</button>
        <span class="fuell"></span>${f.forderungCent != null ? `<span style="text-align:right"><span class="leise">Forderung</span><br><b>${geld(f.forderungCent)}</b></span>` : ''}</div>
    </div>
    <div class="wv ${fk.faellig ? fk.farbe : ''}" id="wiedervorlage">
      <div class="titel">⏱ Wiedervorlage</div>
      ${!status(f).offen ? '<p>Der Fall ist abgeschlossen – es wird nicht mehr nachgehakt.</p>' : `
        <p>${f.wiedervorlageAm ? `<b>${datumMitTag(f.wiedervorlageAm)} · ${fk.text}</b>` : 'Kein Termin geplant.'}</p>${zusatz ? `<p>${esc(zusatz)}</p>` : ''}
        <div class="zeile" style="margin-top:10px"><button class="knopf voll" data-akt="nachgehakt">✓ Nachgehakt</button>
          <button class="knopf" data-akt="termin">${f.wiedervorlageAm ? 'Termin ändern' : 'Termin setzen'}</button></div>`}
    </div>
    <div class="kontakt">
      <button class="knopf tonal" data-akt="anrufen" ${f.kundeTelefon || f.auftraggeberTelefon ? '' : 'disabled'}>☎ Anrufen</button>
      <button class="knopf tonal" data-akt="email">✉ E-Mail</button>
      <button class="knopf tonal" data-akt="nachricht">💬 Nachricht</button>
    </div>
    <div class="karte block">
      ${block('Schaden', [['Beschreibung', f.beschreibung], ['Schadensort', f.schadensort], ['Gemeldet am', datumText(f.meldedatum)]], 'Noch keine Beschreibung erfasst.')}
      ${block('Geschädigter', [['Name', f.kundeName], ['Firma', f.kundeFirma], ['Telefon', f.kundeTelefon], ['E-Mail', f.kundeEmail], ['Anschrift', f.kundeAnschrift], ['Zeichen', f.kundenAktenzeichen]], 'Keine Kontaktdaten erfasst.')}
      ${block('Auftraggeber', [['Firma', f.auftraggeber], ['Ansprechpartner', f.auftraggeberKontakt], ['Telefon', f.auftraggeberTelefon], ['E-Mail', f.auftraggeberEmail], ['Zeichen', f.auftraggeberZeichen], ['Auftrags-Nr.', f.auftragsReferenz]], 'Kein Auftraggeber erfasst.')}
      ${firmaDesFalls ? `<a class="knopf text" id="zur-firma" href="#/firma/${firmaDesFalls.id}">Firma im CRM öffnen</a>` : ''}
      ${block('Transport', [['Tour', f.tour], ['Fahrzeug', f.fahrzeug], ['Fahrer', f.fahrer], ['Beifahrer', beifahrer(f)]], 'Keine Angaben zum Transport.')}
      ${(() => { const t = f.tourId && S.touren[f.tourId] && !S.touren[f.tourId].geloescht ? S.touren[f.tourId] : null, z = fahrzeugZumKz(f.fahrzeug);
        const leute = [f.fahrer, f.beifahrer1, f.beifahrer2].map(n => n && maZumNamen(n)).filter(Boolean);
        return t || z || leute.length ? `<div class="zeile" style="margin-top:6px">${t ? `<button class="knopf text" data-tour-tag="${t.datum}">🚚 Tour am ${esc(datumText(t.datum))}</button>` : f.schadensdatum && tourenAm(f.schadensdatum).length ? `<button class="knopf text" data-tour-tag="${f.schadensdatum}">🚚 Tagesplan ${esc(datumText(f.schadensdatum))}</button>` : ''}
          ${z ? `<button class="knopf text" data-fahrzeug="${z.id}">🚐 ${esc(z.kennzeichen)}</button>` : ''}${leute.map(m => `<button class="knopf text" data-mitarbeiter="${m.id}">👤 ${esc(m.name)}</button>`).join('')}</div>` : ''; })()}
      ${block('Regulierung', [['Vergleich / Regulierung', f.vergleichCent != null ? geld(f.vergleichCent) : ''], ['Zahlungsfrist', datumText(f.zahlungsfrist)], ['Schadennr. Versicherung', f.versicherungsNummer]], '')}
    </div>

let formularStand = '';

function zeichneFormular(r) {

  if (r.art === 'bearbeiten' && !alt) { gehe('#/'); return; }
  const f = alt ? { ...alt, forderung: alt.forderungCent != null ? geldOhneSymbol(alt.forderungCent) : '', vergleich: alt.vergleichCent != null ? geldOhneSymbol(alt.vergleichCent) : '' }

  formularStand = formularWerte();
  $('#aus-touren').onclick = () => tourInsFormular();
  const auswahl = $('#ag-auswahl');
  if (auswahl) auswahl.onchange = () => {
    const e = S.auftraggeber[auswahl.value]; if (!e) return;
    const setze = (name, wert) => { $(`#fall-form [name="${name}"]`).value = wert || ''; };
    const k = schadenKontakt(e.id);
    setze('auftraggeber', e.name); setze('auftraggeberKontakt', k?.name); setze('auftraggeberTelefon', k?.telefon || e.telefon); setze('auftraggeberEmail', k?.email || e.email);

  if (!e) return {};
  const k = schadenKontakt(e.id);
  return { auftraggeber: e.name, auftraggeberKontakt: k?.name || '', auftraggeberTelefon: k?.telefon || e.telefon || '', auftraggeberEmail: k?.email || e.email || '' };
}

    S.einstellungen.textbausteine = e.target.value.split('\n').map(z => z.match(/^([^:]{1,40}):\s*(.+)$/)).filter(Boolean).map(([, t, x]) => ({ titel: t.trim(), text: x.replace(/\\n/g, '\n') }));
    speichere();
  }
  const r = e.target.dataset.rechnung; if (r) { S.einstellungen.rechnung = { ...rechnungsDaten(), [r]: e.target.value }; speichere(); }
});
$('#detail').addEventListener('change', async e => {
  if (e.target.id !== 'crm-import' || !e.target.files.length) return;
  try {
    const r = crmImportieren(await e.target.files[0].text());

});
$('#detail').addEventListener('click', e => {
  const tage = e.target.closest('[data-wv-tage]');
  if (tage) { S.einstellungen.wiedervorlageTage = Number(tage.dataset.wvTage); speichere(); zeichneEinstellungen(); return; }
  const at = e.target.closest('[data-arbeitstage]'), nu = e.target.closest('[data-nav-unten]');
  if (at) { S.einstellungen.arbeitstageWoche = Number(at.dataset.arbeitstage); speichere(); zeichneEinstellungen(); return; }
  if (nu) {
    const l = navUnten().filter(k => k !== nu.dataset.navUnten);
    if (!navUnten().includes(nu.dataset.navUnten)) { if (l.length >= 4) l.shift(); l.push(nu.dataset.navUnten); }
    S.einstellungen.navUnten = l.length ? l : NAV_UNTEN_VORGABE; speichere(); zeichneEinstellungen(); zeichneNavi(); return;
  }
  switch (e.target.id) {
    case 'tp-import-knopf': tpImportDialog(); break;
    case 'ea-knopf': einsatzartenDialog(); break;
    default: {
      const einrichten = e.target.closest('[data-mail-einrichten]'), entfernen = e.target.closest('[data-mail-entfernen]');
      if (einrichten) mailKontoDialog(einrichten.dataset.mailEinrichten);
      else if (e.target.closest('[data-mail-abrufen]')) postfachAbrufen(true);
      else if (entfernen) {
        const art = entfernen.dataset.mailEntfernen;
        bestaetige('E-Mail-Konto entfernen?', 'Konto und Passwort werden von diesem Rechner entfernt. Bereits zugeordnete Mails bleiben im Verlauf.', 'Entfernen',
          async () => { await window.desktop.mail.trennen(art); MAIL.konten[art] = null; aktualisiereKonto(); zeichne(); toast('E-Mail-Konto entfernt'); });
      }
    }
    case 'jetzt': abgleich(); break;
    case 'abmelden': PIN = ''; try { localStorage.removeItem(PIN_SPEICHER); } catch {} SYNC.fehler = ''; zeichneSync(); toast('Abgemeldet. Zum Anmelden oben auf „Anmeldung nötig“ tippen.'); break;
    case 'verbinden': {
      const url = $('#cloud-url').value.trim();
      if (!/^https?:\/\/.+/.test(url)) { toast('Bitte die vollständige Adresse eintragen (beginnt mit https://).'); break; }
      S.apiUrl = url; S.nurLokal = false; speichere(); zeichne(); abgleich(); break;
    }
    case 'belege-leeren': {
      const n = alle('belege').length;
      if (!n) { toast('Es gibt keine Angebote oder Rechnungen.'); break; }
      bestaetige(`Alle ${n} Angebote und Rechnungen löschen?`, 'Sie verschwinden samt der erfassten Zahlungen auf allen Geräten. Das lässt sich nicht rückgängig machen.', 'Alle löschen',
        () => { const z = BelegAktionen.alleLoeschen(); toast(`${z} Angebote und Rechnungen gelöscht`); });
      break;
    }
    case 'crm-csv': {
      if (!alle('auftraggeber').length) { toast('Es gibt noch keine Firmen zum Exportieren'); break; }
      for (const [name, inhalt] of Object.entries(crmCsvDateien())) {
        ladeHerunter(`CRM_${name}_${heute()}.csv`, inhalt);
      }
      break;
    }
    case 'csv': {
      if (!faelle().length) { toast('Es gibt noch keine Fälle zum Exportieren'); break; }
      const zahl = {}; for (const a of alle('anlagen')) zahl[a.fallId] = (zahl[a.fallId] || 0) + 1;
      ladeHerunter(`Schadensfaelle_${heute()}.csv`, csvErstellen(faelle(), zahl)); break;
    }
  }
});

// ============================== CRM: Firmen (Auftraggeber) ==============================
// Gleiche Daten und Regeln wie in der Android-App; alles gleicht sich über die Cloud ab.
const FIRMEN_STATUS = { INTERESSENT: ['Interessent', 'violett'], AKTIV: ['Aktiv', 'gruen'], PAUSIERT: ['Pausiert', 'gelb'], EHEMALIG: ['Ehemalig', 'grau'] };
const ADRESS_ART = { HAUPTSITZ: 'Hauptsitz', LAGER: 'Lager', FILIALE: 'Filiale', RECHNUNG: 'Rechnungsadresse', SONSTIGE: 'Sonstige' };
const AKTIVITAET_ART = { ANRUF: 'Anruf', EMAIL: 'E-Mail', TREFFEN: 'Treffen', ANGEBOT: 'Angebot', SONSTIGES: 'Sonstiges' };
const CHANCEN_PHASE = { ANFRAGE: ['Anfrage', true], ANGEBOT: ['Angebot', true], VERHANDLUNG: ['Verhandlung', true], GEWONNEN: ['Gewonnen', false], VERLOREN: ['Verloren', false] };
const KONTAKT_PAUSE_TAGE = 60;
const schlagwortListe = e => [...new Map(String(e.schlagworte || '').split(',').map(x => x.trim()).filter(Boolean).map(x => [x.toLowerCase(), x])).values()];
const letzterKontakt = id => vonFirma('aktivitaeten', id).map(a => a.datum).sort().pop() || null;
const langeKeinKontakt = e => (e.status || 'AKTIV') === 'AKTIV' && (!letzterKontakt(e.id) || letzterKontakt(e.id) < plusTage(heute(), -KONTAKT_PAUSE_TAGE));
function preislisteText(e) {
  return `Preise und Konditionen – ${firmaName(e)}\n` + vonFirma('preise', e.id).sort((a, b) => a.bezeichnung.localeCompare(b.bezeichnung, 'de')).map(p =>
    `• ${p.bezeichnung}${p.betragCent != null ? ': ' + geld(p.betragCent) : ''}${p.einheit ? ' ' + p.einheit : ''}${p.gueltigAb ? ` (gültig ab ${datumText(p.gueltigAb)})` : ''}${p.notiz ? ' – ' + p.notiz : ''}`).join('\n');
}
const firmenStatus = e => FIRMEN_STATUS[e.status] || FIRMEN_STATUS.AKTIV;
const firmaName = e => [e.name, e.rechtsform].filter(Boolean).join(' ');
const vonFirma = (tabelle, id) => alle(tabelle).filter(x => x.firmaId === id);
const adresseText = a => [a.strasse, [a.plz, a.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');

/** Wiedervorlagen: offene CRM-Aufgaben und Wiedervorlagen offener Fälle, nach Fälligkeit eingeteilt. */
function wiedervorlagen() {
  const t = heute();
  const termine = [
    ...alle('aufgaben').filter(a => !a.erledigt && a.faelligAm).map(a => ({ art: 'aufgabe', datum: a.faelligAm, titel: a.text, zusatz: [S.auftraggeber[a.firmaId]?.name, a.kontakt].filter(Boolean).join(' · '), a })),
    ...faelle().filter(f => status(f).offen && f.wiedervorlageAm).map(f => ({ art: 'fall', datum: f.wiedervorlageAm, titel: `Fall ${f.fallnummer} · ${anzeigeName(f)}`,
      zusatz: [f.auftraggeber, f.wartetAuf && 'wartet auf ' + PARTNER[f.wartetAuf], f.wiedervorlageNotiz].filter(Boolean).join(' · '), f })),
    ...fahrzeugTermine(), ...personalTermine(),
    ...Object.entries(mails()).filter(([, m]) => m.erinnerungAm && m.ablage !== 'PAPIERKORB').map(([id, m]) => ({ art: 'mail', datum: m.erinnerungAm, titel: '✉ ' + (m.betreff || '(ohne Betreff)'), zusatz: m.eingehend ? m.von : 'an ' + (m.an || ''), mailId: id })),
  ].sort((a, b) => a.datum.localeCompare(b.datum) || a.titel.localeCompare(b.titel));
  return { ueberfaellig: termine.filter(x => x.datum < t), heute: termine.filter(x => x.datum === t), demnaechst: termine.filter(x => x.datum > t),
    ohneDatum: alle('aufgaben').filter(a => !a.erledigt && !a.faelligAm) };
}
const naechsterTermin = firma => { const w = wiedervorlagen(); return [...w.ueberfaellig, ...w.heute, ...w.demnaechst].find(x => (x.a ? x.a.firmaId === firma.id : x.f ? gehoertZu(x.f, firma) : false)); };

/** Volltextsuche: Fundstelle oder null. */
function firmaTreffer(e, such) {
  const p = t => String(t || '').toLowerCase().includes(such);
  if (p(e.name) || p(e.rechtsform)) return '';
  if (p(e.notizen)) return 'Notizen';
  if (p(e.schlagworte)) return 'Schlagwort';
  if (p(e.email) || p(e.telefon) || p(e.website)) return 'Kontaktdaten';
  let x = vonFirma('ansprechpartner', e.id).find(k => [k.name, k.thema, k.telefon, k.email, k.notiz].some(p)); if (x) return 'Ansprechpartner: ' + x.name;
  x = vonFirma('adressen', e.id).find(a => [a.strasse, a.plz, a.ort, a.notiz].some(p)); if (x) return 'Adresse: ' + adresseText(x);
  x = vonFirma('aktivitaeten', e.id).find(a => p(a.text) || p(a.kontakt)); if (x) return 'Kontakthistorie: ' + datumText(x.datum);
  x = vonFirma('aufgaben', e.id).find(a => !a.erledigt && p(a.text)); if (x) return 'Wiedervorlage: ' + x.text;
  x = vonFirma('dokumente', e.id).find(d => p(d.titel) || p(d.notiz)); if (x) return 'Dokument: ' + x.titel;
  x = faelle().find(f => gehoertZu(f, e) && filtereUndSortiere([f], 'ALLE', such).length); if (x) return 'Fall ' + x.fallnummer;
  return null;
}

function zeichneFirmenliste(r) {

    .filter(e => (ANSICHT.firmenStatus === 'PAUSE' ? langeKeinKontakt(e) : !ANSICHT.firmenStatus || e.status === ANSICHT.firmenStatus))
    .filter(e => !ANSICHT.schlagwort || schlagwortListe(e).some(w => w.toLowerCase() === ANSICHT.schlagwort.toLowerCase()))

  const karten = zeilen.map(({ e, treffer }) => {
    const t = naechsterTermin(e), offen = faelle().filter(f => gehoertZu(f, e) && status(f).offen).length;
    const tText = t && (t.datum < heute() ? `Überfällig seit ${datumText(t.datum)}` : t.datum === heute() ? 'Heute' : datumText(t.datum));

      ${offen || e.telefon || letzterKontakt(e.id) ? `<div class="leise">${esc([offen && (offen === 1 ? '1 offener Schadensfall' : offen + ' offene Schadensfälle'), letzterKontakt(e.id) && 'letzter Kontakt ' + datumText(letzterKontakt(e.id)), e.telefon].filter(Boolean).join(' · '))}</div>` : ''}
      ${t ? `<div class="leise" style="${t.datum <= heute() ? 'color:var(--rot-t)' : ''}">⏱ ${esc(tText)}: ${esc(t.titel)}</div>` : ''}</button>`;
  }).join('');
  const faelleTreffer = such ? filtereUndSortiere(faelle(), 'ALLE', such) : [];
  const leer = !alle('auftraggeber').length
    ? '<div class="leer">🏢<b>Noch keine Auftraggeber</b>Lege die erste Firma an oder importiere die Sicherung des Browser-CRM unter ⚙ → CRM. Auftraggeber aus Schadensfällen kommen automatisch dazu.</div>'
    : `<div class="leer"><b>Keine Treffer</b>${such ? `Zu „${esc(ANSICHT.firmenSuche.trim())}“ wurde nichts gefunden.` : 'In dieser Ansicht gibt es keine Firmen.'}</div>`;
  return seitenkopf('Firmen', '<button class="knopf voll" data-neue-firma>＋ Firma</button>', `<button class="knopf" data-firmen-akt="interessent">🎯 ＋ Interessent</button>
      <button class="knopf" data-firmen-akt="anrufliste">📞 Anrufliste</button><button class="knopf" data-firmen-akt="serienmail">✉ Serienmail</button>`) + `<input class="suche" id="firmen-suche" type="search" placeholder="Firma, Ansprechpartner, Notiz, Fall …" aria-label="Firmen durchsuchen" value="${esc(ANSICHT.firmenSuche)}">
    <div class="chips" role="group" aria-label="Status"><button class="chip" data-firmen-status="" aria-pressed="${!ANSICHT.firmenStatus}">Alle</button>
      <button class="chip" data-firmen-status="PAUSE" aria-pressed="${ANSICHT.firmenStatus === 'PAUSE'}">Lange kein Kontakt</button>${Object.entries(FIRMEN_STATUS).map(([k, [l]]) =>
      `<button class="chip" data-firmen-status="${k}" aria-pressed="${ANSICHT.firmenStatus === k}">${l}</button>`).join('')}</div>
    ${(() => { const w = [...new Map(auftraggeberListe().flatMap(schlagwortListe).map(x => [x.toLowerCase(), x])).values()].sort((a, b) => a.localeCompare(b, 'de'));
      return w.length ? `<div class="chips" role="group" aria-label="Schlagworte">${w.map(x => `<button class="chip" data-schlagwort="${esc(x)}" aria-pressed="${(ANSICHT.schlagwort || '').toLowerCase() === x.toLowerCase()}"># ${esc(x)}</button>`).join('')}</div>` : ''; })()}
    <div id="firmen">${karten || (faelleTreffer.length ? '' : leer)}</div>
    ${faelleTreffer.length ? `<h3 class="abschnitt">Schadensfälle</h3>${faelleTreffer.map(f => `<button class="karte klickbar" data-fall="${f.id}"><div class="zeile eng"><span class="titel fuell">${esc(anzeigeName(f))}</span><span class="marke ${status(f).farbe}">${esc(status(f).label)}</span></div><div class="leise">${esc([f.fallnummer, f.auftraggeber].filter(Boolean).join(' · '))}</div></button>`).join('')}` : ''}`;
}

/** Ein Termin in Listen (Termine, Übersicht): Aufgabe mit Haken, sonst Verweis auf Fall, Fahrzeug, Mitarbeiter oder Mail. */
function terminEintrag(x) {
  const unter = esc([x.datum && x.datum !== heute() && datumText(x.datum), x.zusatz].filter(Boolean).join(' · '));
  if (x.art === 'aufgabe') return `<div class="termin"><input type="checkbox" data-erledigt="${x.a.id}" aria-label="Erledigt"><button class="vorlage fuell" data-firma="${x.a.firmaId}"><b>${esc(x.titel)}</b><br><span class="leise">${unter}</span></button>
      <button class="knopf text" data-verschieben="${x.a.id}" data-tage="1">Morgen</button><button class="knopf text" data-verschieben="${x.a.id}" data-tage="7">+1 Woche</button></div>`;
  const [symbol, attr] = x.z ? ['🚐', `data-fahrzeug="${x.z.id}"`] : x.m ? ['👤', `data-mitarbeiter="${x.m.id}"`] : x.mailId ? ['✉', `data-mail="${esc(encodeURIComponent(x.mailId))}"`] : ['⚠', `data-fall="${x.f.id}"`];
  return `<div class="termin"><span class="termin-symbol">${symbol}</span><button class="vorlage fuell" ${attr}><b>${esc(x.titel)}</b><br><span class="leise">${unter}</span></button></div>`;
}
function zeichneTermine() {
  const w = wiedervorlagen();
  const eintrag = x => (x.art === 'aufgabe' || x.z || x.m || x.mailId ? terminEintrag(x) : x.art === 'aufgabe'
    ? `<div class="termin"><input type="checkbox" data-erledigt="${x.a.id}" aria-label="Erledigt"><button class="vorlage fuell" data-firma="${x.a.firmaId}"><b>${esc(x.titel)}</b><br><span class="leise">${esc([x.datum !== heute() && datumText(x.datum), x.zusatz].filter(Boolean).join(' · '))}</span></button>
      <button class="knopf text" data-verschieben="${x.a.id}" data-tage="1">Morgen</button><button class="knopf text" data-verschieben="${x.a.id}" data-tage="7">+1 Woche</button></div>`
    : x.z ? `<div class="termin"><span class="termin-symbol">🚐</span><button class="vorlage fuell" data-fahrzeug="${x.z.id}"><b>${esc(x.titel)}</b><br><span class="leise">${esc([x.datum !== heute() && datumText(x.datum), x.zusatz].filter(Boolean).join(' · '))}</span></button></div>`
    : `<div class="termin"><span class="termin-symbol">⚠</span><button class="vorlage fuell" data-fall="${x.f.id}"><b>${esc(x.titel)}</b><br><span class="leise">${esc([x.datum !== heute() && datumText(x.datum), x.zusatz].filter(Boolean).join(' · '))}</span></button></div>`);
  const gruppe = (titel, liste, farbe) => (liste.length ? `<h3 class="abschnitt" style="${farbe}">${titel} (${liste.length})</h3>${liste.map(eintrag).join('')}` : '');
  const ohne = w.ohneDatum.length ? `<h3 class="abschnitt">Ohne Datum</h3>${w.ohneDatum.map(a => eintrag({ art: 'aufgabe', datum: '', titel: a.text, zusatz: S.auftraggeber[a.firmaId]?.name || '', a })).join('')}` : '';
  const inhalt = gruppe('Überfällig', w.ueberfaellig, 'color:var(--rot-t)') + gruppe('Heute', w.heute, '') + gruppe('Demnächst', w.demnaechst, 'color:var(--leise)') + ohne;
  return seitenkopf('Termine', '', '<button class="knopf" data-ics>📅 Als Kalenderdatei (.ics)</button>') + `<div id="termine">${inhalt || '<div class="leer">⏱<b>Nichts zu tun</b>Hier erscheinen Wiedervorlagen bei Firmen und Schadensfällen, Fristen von Fahrzeugen und Personal, Geburtstage und Mail-Erinnerungen.</div>'}</div>`;
}

/** Kontakthistorie: festgehaltene Kontakte und Mails aus den Fällen der Firma. */
function historieVon(firma) {
  const fallIds = new Set(faelle().filter(f => gehoertZu(f, firma)).map(f => f.id));
  return [
    ...vonFirma('aktivitaeten', firma.id).map(a => ({ sort: a.datum + 'T' + (a.geaendertAm || '').slice(11), a })),
    ...alle('verlauf').filter(v => fallIds.has(v.fallId) && (v.typ === 'EMAIL_EINGANG' || v.typ === 'EMAIL_AUSGANG')).map(v => ({ sort: v.zeitpunkt, v })),
  ].sort((x, y) => y.sort.localeCompare(x.sort));
}

function zeichneFirma(id) {
  const e = S.auftraggeber[id];
  const el = $('#detail');
  if (!e || e.geloescht) { gehe('#/'); return; }
  const bereich = (titel, tabelle, inhalt, neuText = 'Hinzufügen') => `<div class="karte block" data-bereich-firma="${tabelle}"><div class="zeile eng"><h3 class="fuell" style="margin:0">${titel}</h3>
    <button class="knopf text" data-crm-neu="${tabelle}">＋ ${neuText}</button></div>${inhalt || '<p class="leise">Noch nichts eingetragen.</p>'}</div>`;
  const zeile = (tabelle, x, titel, unter) => `<button class="vorlage" data-crm="${tabelle}" data-crm-id="${x.id}"><b>${esc(titel)}</b>${unter ? `<br><span class="leise" style="white-space:pre-wrap">${esc(unter)}</span>` : ''}</button>`;
  const kontakte = kontakteVon(id).map(k => `<div class="zeile eng">${zeile('ansprechpartner', k, k.name, [k.thema, k.telefon, k.email].filter(Boolean).join(' · '))}
      ${k.telefon ? `<button class="symbol" data-oeffne="tel:${esc(k.telefon.replace(/[^\d+]/g, ''))}" aria-label="${esc(k.name)} anrufen">☎</button>` : ''}
      ${k.email ? `<button class="symbol" data-oeffne="mailto:${esc(k.email)}" aria-label="E-Mail an ${esc(k.name)}">✉</button>` : ''}</div>`).join('');
  const adressen = vonFirma('adressen', id).map(a => zeile('adressen', a, ADRESS_ART[a.art] || 'Adresse', [adresseText(a), a.notiz].filter(Boolean).join('\n'))).join('');
  const preise = vonFirma('preise', id).sort((a, b) => a.bezeichnung.localeCompare(b.bezeichnung, 'de')).map(p => zeile('preise', p,
    [p.bezeichnung, [p.betragCent != null && geld(p.betragCent), p.einheit].filter(Boolean).join(' ')].filter(Boolean).join(': '),
    [p.gueltigAb && 'gültig ab ' + datumText(p.gueltigAb), p.notiz].filter(Boolean).join(' · '))).join('');
  const aufgaben = vonFirma('aufgaben', id).sort((a, b) => (a.erledigt - b.erledigt) || String(a.faelligAm || '9').localeCompare(String(b.faelligAm || '9')));
  const offen = aufgaben.filter(a => !a.erledigt), erledigt = aufgaben.filter(a => a.erledigt);
  const aufgabeZeile = a => `<div class="termin"><input type="checkbox" data-erledigt="${a.id}" ${a.erledigt ? 'checked' : ''} aria-label="Erledigt">${zeile('aufgaben', a, a.text,
    [a.faelligAm && (a.faelligAm === heute() ? 'heute' : datumText(a.faelligAm)), a.kontakt].filter(Boolean).join(' · '))}</div>`;
  const historie = historieVon(e).slice(0, 50).map(h => (h.a
    ? zeile('aktivitaeten', h.a, `${datumText(h.a.datum)} · ${AKTIVITAET_ART[h.a.art] || ''}${h.a.kontakt ? ' · ' + h.a.kontakt : ''}`, h.a.text)
    : `<button class="vorlage" data-fall="${h.v.fallId}"><b>${zeitText(h.v.zeitpunkt)} · ${VERLAUF[h.v.typ][0]} · Fall ${esc(S.faelle[h.v.fallId]?.fallnummer || '')}</b><br><span class="leise zwei-zeilen" style="white-space:pre-wrap">${esc(h.v.text.split('\n\n')[0])}</span></button>`)).join('');
  const dokumente = vonFirma('dokumente', id).map(d => `<div class="zeile eng">${zeile('dokumente', d, d.titel, [d.link, d.notiz].filter(Boolean).join('\n'))}
      ${/^https?:\/\//i.test(d.link || '') ? `<a class="symbol" href="${esc(d.link)}" target="_blank" rel="noopener" aria-label="${esc(d.titel)} öffnen">↗</a>` : ''}</div>`).join('');
  const faelleDerFirma = faelle().filter(f => gehoertZu(f, e)).sort((a, b) => String(b.geaendertAm).localeCompare(String(a.geaendertAm)))
    .map(f => `<button class="vorlage" data-fall="${f.id}"><div class="zeile eng"><b class="fuell">${esc(f.fallnummer)} · ${esc(anzeigeName(f))}</b><span class="marke ${status(f).farbe}">${esc(status(f).label)}</span></div></button>`).join('');
  const chancen = vonFirma('chancen', id).sort((a, b) => Object.keys(CHANCEN_PHASE).indexOf(a.phase) - Object.keys(CHANCEN_PHASE).indexOf(b.phase))
    .map(c => zeile('chancen', c, [c.titel, c.wertCent != null && geld(c.wertCent)].filter(Boolean).join(' · '),
      [(CHANCEN_PHASE[c.phase] || CHANCEN_PHASE.ANFRAGE)[0], c.erwartetAm && 'Entscheidung bis ' + datumText(c.erwartetAm), c.notiz].filter(Boolean).join(' · '))).join('');
  const fd = faelle().filter(f => gehoertZu(f, e)), ch = vonFirma('chancen', id);
  const offeneCh = ch.filter(c => (CHANCEN_PHASE[c.phase] || CHANCEN_PHASE.ANFRAGE)[1]), summe = l => l.reduce((n, x) => n + (x || 0), 0);
  const kennzahlen = [['Schadensfälle', `${fd.filter(f => status(f).offen).length} offen / ${fd.length}`],
    summe(fd.filter(f => status(f).offen).map(f => f.forderungCent)) && ['Offene Forderungen', geld(summe(fd.filter(f => status(f).offen).map(f => f.forderungCent)))],
    summe(fd.map(f => f.vergleichCent)) && ['Gezahlt / verglichen', geld(summe(fd.map(f => f.vergleichCent)))],
    offeneCh.length && ['Offene Chancen', `${offeneCh.length} · ${geld(summe(offeneCh.map(c => c.wertCent)))}`],
    summe(ch.filter(c => c.phase === 'GEWONNEN').map(c => c.wertCent)) && ['Gewonnen', geld(summe(ch.filter(c => c.phase === 'GEWONNEN').map(c => c.wertCent)))],
    ['Letzter Kontakt', letzterKontakt(id) ? datumText(letzterKontakt(id)) : 'noch keiner']].filter(Boolean);

  el.innerHTML = `<div class="karte" id="stammdaten">
      <div class="zeile eng"><h2 class="gross fuell">${esc(firmaName(e))}</h2><span class="marke ${firmenStatus(e)[1]}">${firmenStatus(e)[0]}</span>
        <button class="symbol" data-firma-bearbeiten aria-label="Stammdaten bearbeiten">✎</button></div>
      ${e.telefon ? `<p><a href="tel:${esc(e.telefon.replace(/[^\d+]/g, ''))}">☎ ${esc(e.telefon)}</a></p>` : ''}
      ${e.email ? `<p><button class="knopf text" style="padding:0" data-oeffne="mailto:${esc(e.email)}">✉ ${esc(e.email)}</button></p>` : ''}
      ${e.website ? `<p><a href="${esc(/^https?:/i.test(e.website) ? e.website : 'https://' + e.website)}" target="_blank" rel="noopener">🌐 ${esc(e.website)}</a></p>` : ''}
      ${e.notizen ? `<p class="leise" style="white-space:pre-wrap;margin-top:6px">${esc(e.notizen)}</p>` : ''}
      ${schlagwortListe(e).length ? `<p class="leise" style="color:var(--primaer)">${schlagwortListe(e).map(w => '#' + esc(w)).join('  ')}</p>` : ''}
      ${!e.telefon && !e.email && !e.website && !e.notizen ? '<p class="leise">Telefon, E-Mail, Website und Notizen über ✎ eintragen.</p>' : ''}
      ${MAIL.konto ? '<button class="knopf" style="margin-top:8px" data-oeffne="mailto:' + esc(e.email || '') + '">✉ E-Mail schreiben</button>' : ''}</div>
    <div class="karte" id="kennzahlen"><dl>${kennzahlen.map(([l, w]) => `<dt>${esc(l)}</dt><dd>${esc(w)}</dd>`).join('')}</dl></div>
    ${akquiseHtml(e)}
    <div class="karte block"><div class="zeile eng"><h3 class="fuell" style="margin:0">Touren</h3><button class="knopf text" data-rechnung-touren="${id}">🧾 Rechnung aus Touren</button></div><div id="firma-touren">${firmaTourenHtml(e)}</div></div>
    ${bereich('Verkaufschancen', 'chancen', chancen)}
    ${bereich('Ansprechpartner', 'ansprechpartner', kontakte)}
    ${bereich('Adressen', 'adressen', adressen)}
    ${bereich('Preise und Konditionen', 'preise', preise + (preise ? '<button class="knopf text" data-preise-teilen>Preisliste kopieren</button>' : ''))}
    ${bereich('Wiedervorlagen', 'aufgaben', offen.map(aufgabeZeile).join('') + (erledigt.length ? `<details><summary class="leise" style="cursor:pointer;margin:6px 0">${erledigt.length} erledigt</summary>${erledigt.map(aufgabeZeile).join('')}</details>` : ''))}
    ${bereich('Kontakthistorie', 'aktivitaeten', historie, 'Kontakt festhalten')}
    ${bereich('Dokumente', 'dokumente', dokumente)}
    ${bereich('Angebote und Rechnungen', 'belege', vonFirma('belege', id).sort((x, y) => String(y.datum).localeCompare(String(x.datum))).map(x => belegKarte(x)).join(''), 'Rechnung')}
    ${bereich('Schadensfälle', 'faelle', faelleDerFirma, 'Neuer Fall')}`;
}

    ['telefon', 'Telefon', 'tel'], ['email', 'E-Mail', 'email'], ['website', 'Website'], ['schlagworte', 'Schlagworte, durch Komma getrennt (z. B. Möbel, Elektro, Küchen)'],
    ['kundennummer', 'Kundennummer'], ['ustId', 'USt-IdNr. der Firma'], ['zahlungszielTage', 'Zahlungsziel in Tagen (leer = Standard)'], ['notizen', 'Notizen', 'lang']]],
  ansprechpartner: ['Ansprechpartner', [['name', 'Name', 'pflicht'], ['thema', 'Zuständig für (Disposition, Abrechnung, Schäden, Geschäftsführung …)'], ['telefon', 'Telefon', 'tel'], ['email', 'E-Mail', 'email'], ['notiz', 'Notiz', 'lang']]],

  aktivitaeten: ['Kontakt', [['datum', 'Datum', 'date'], ['art', 'Art', AKTIVITAET_ART], ['kontakt', 'Ansprechpartner'], ['text', 'Was wurde besprochen?', 'lang pflicht']]],
  chancen: ['Verkaufschance', [['titel', 'Worum geht es? (z. B. Montage für neue Filiale)', 'pflicht'], ['phase', 'Phase', Object.fromEntries(Object.entries(CHANCEN_PHASE).map(([k, [l]]) => [k, l]))],

};
const CRM_VORGABEN = {
  auftraggeber: () => ({ status: 'AKTIV' }), adressen: () => ({ art: 'HAUPTSITZ' }), aktivitaeten: () => ({ datum: heute(), art: 'ANRUF' }),
  aufgaben: () => ({ faelligAm: plusTage(heute(), 7), erledigt: false }), chancen: () => ({ phase: 'ANFRAGE' }),
};

function crmDialog(tabelle, eintrag, firmaId, danach) {
  const neu = !eintrag;
  const [titel, felder] = CRM_FELDER[tabelle];
  const centFeld = tabelle === 'chancen' ? 'wertCent' : 'betragCent';
  const e = eintrag ? { ...eintrag, betrag: eintrag[centFeld] != null ? geldOhneSymbol(eintrag[centFeld]) : '' } : { ...(CRM_VORGABEN[tabelle] || (() => ({})))() };
  const namen = tabelle === 'aktivitaeten' || tabelle === 'aufgaben' ? kontakteVon(firmaId).map(k => k.name) : [];
  const feld = f => formularFeld(e, f, f[0] === 'kontakt' && namen.length ? 'crm-kontakte' : '');
  dialog(`<form method="dialog" id="crm-form"><h2>${neu ? (tabelle === 'aktivitaeten' ? 'Kontakt festhalten' : (tabelle === 'auftraggeber' ? 'Neue Firma' : 'Neu: ' + titel)) : titel}</h2>
    ${felder.map(feld).join('')}${tabelle === 'aktivitaeten' && neu ? '<label class="feld">Wiedervorlage am (optional)<input name="folgeAm" type="date"></label><label class="feld">Was ist dann zu tun?<input name="folgeText"></label>' : ''}
    ${tabelle === 'auftraggeber' && !neu && auftraggeberListe().length > 1 ? `<details><summary class="knopf text" style="display:inline-flex">Mit anderer Firma zusammenführen …</summary>
      <label class="feld">In diese Firma überführen<select id="zusammen-ziel"><option value="">– Firma wählen –</option>${auftraggeberListe().filter(x => x.id !== eintrag.id).map(x => `<option value="${x.id}">${esc(firmaName(x))}</option>`).join('')}</select></label>
      <button type="button" class="knopf" id="zusammen-los">Zusammenführen</button></details>` : ''}${namen.length ? `<datalist id="crm-kontakte">${namen.map(n => `<option value="${esc(n)}">`).join('')}</datalist>` : ''}
    <div class="dialog-knoepfe">${neu ? '' : '<button type="button" class="knopf text gefahr" id="crm-loeschen">Löschen</button>'}<span class="fuell"></span>
      <button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll">Speichern</button></div></form>`);
  $('#crm-form').onsubmit = ev => {
    ev.preventDefault();
    const w = Object.fromEntries([...new FormData(ev.target)].map(([k, v]) => [k, String(v).trim()]));
    const zeige = (name, text) => { const s = $(`#crm-form [data-fehler="${name}"]`); if (s) { s.textContent = text; s.hidden = !text; } return !text; };
    if ('email' in w && !zeige('email', w.email && !w.email.split(/[,;]/).every(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x.trim())) ? 'Die E-Mail-Adresse sieht unvollständig aus.' : '')) return;
    if ('betrag' in w) {
      if (!zeige('betrag', w.betrag && geldLesen(w.betrag) == null ? 'Bitte einen Betrag wie 89,50 eingeben.' : '')) return;
      w[centFeld] = w.betrag ? geldLesen(w.betrag) : null; delete w.betrag;
      if (tabelle === 'preise') w.gueltigAb = w.gueltigAb || null;
    }
    if ('erwartetAm' in w) w.erwartetAm = w.erwartetAm || null;
    const folge = { am: w.folgeAm, text: w.folgeText }; delete w.folgeAm; delete w.folgeText;
    if ('faelligAm' in w) w.faelligAm = w.faelligAm || null;
    if (tabelle === 'aktivitaeten') w.datum = w.datum || heute();
    $('#dialog').close();
    if (tabelle === 'auftraggeber') { const id = Aktionen.firmaSpeichern({ ...(eintrag || {}), ...w, id: eintrag?.id }); if (danach) danach(id); return; }
    Aktionen.crmSpeichern(tabelle, { ...(eintrag || (tabelle === 'aufgaben' ? { erledigt: false } : {})), ...w, firmaId, id: eintrag?.id });
    if (tabelle === 'aktivitaeten' && folge.am) {
      Aktionen.crmSpeichern('aufgaben', { firmaId, faelligAm: folge.am, kontakt: w.kontakt || '', erledigt: false, text: folge.text || 'Nachfassen: ' + String(w.text).split('\n')[0].slice(0, 80) });
    }
  };
  if ($('#zusammen-los')) $('#zusammen-los').onclick = () => {
    const ziel = S.auftraggeber[$('#zusammen-ziel').value]; if (!ziel) return;
    bestaetige(`In „${ziel.name}“ überführen?`, `Ansprechpartner, Adressen, Preise, Kontakthistorie, Wiedervorlagen, Chancen, Dokumente und Schadensfälle von „${eintrag.name}“ wandern zu „${ziel.name}“. „${eintrag.name}“ wird danach gelöscht.`, 'Zusammenführen',
      () => { Aktionen.firmenZusammenfuehren(eintrag, ziel); gehe('#/firma/' + ziel.id); });
  };
  if (!neu) $('#crm-loeschen').onclick = () => (tabelle === 'auftraggeber'
    ? bestaetige(`„${eintrag.name}“ löschen?`, 'Mit Ansprechpartnern, Adressen, Preisen, Kontakthistorie und Dokumenten – auf allen Geräten. Schadensfälle bleiben erhalten.', 'Löschen', () => { Aktionen.firmaLoeschen(eintrag); gehe('#/'); })
    : bestaetige('Eintrag löschen?', `„${eintrag.name || eintrag.titel || eintrag.bezeichnung || eintrag.text || ADRESS_ART[eintrag.art] || ''}“ wird gelöscht.`, 'Löschen', () => Aktionen.crmLoeschen(tabelle, eintrag)));
}

// ---------- Import der Sicherung des Browser-CRM ----------
function crmImportieren(text) {
  let d; try { d = JSON.parse(String(text).replace(/^﻿/, '')); } catch { d = null; }
  if (!d || !Array.isArray(d.firmen)) throw new Error('Die Datei ist keine Sicherung des Browser-CRM (es fehlt die Liste „firmen“).');
  const t = x => String(x ?? '').trim(), jetzt = jetztIso();
  const tag = x => (/^\d{4}-\d{2}-\d{2}/.test(t(x)) ? t(x).slice(0, 10) : null);
  const status = x => ({ interessent: 'INTERESSENT', lead: 'INTERESSENT', pausiert: 'PAUSIERT', ehemalig: 'EHEMALIG', inaktiv: 'EHEMALIG' }[t(x).toLowerCase()] || (FIRMEN_STATUS[t(x).toUpperCase()] ? t(x).toUpperCase() : 'AKTIV'));
  const adressArt = x => { const v = t(x).toLowerCase(); return v.startsWith('haupt') ? 'HAUPTSITZ' : v.startsWith('lager') ? 'LAGER' : v.startsWith('filial') ? 'FILIALE' : v.startsWith('rechnung') ? 'RECHNUNG' : ADRESS_ART[v.toUpperCase()] ? v.toUpperCase() : 'SONSTIGE'; };
  const aktArt = x => { const v = t(x).toLowerCase(); return v.startsWith('anruf') || v.startsWith('telefon') ? 'ANRUF' : v.includes('mail') ? 'EMAIL' : /^(treffen|termin|besuch)/.test(v) ? 'TREFFEN' : v.startsWith('angebot') ? 'ANGEBOT' : 'SONSTIGES'; };
  const cent = x => (x == null || x === '' ? null : typeof x === 'number' ? Math.round(x * 100) : geldLesen(String(x)));
  let neu = 0, zusammen = 0, eintraege = 0;
  for (const f of d.firmen) {
    const name = t(f && f.name); if (!name) continue;
    let firma = firmaZumNamen(name);
    if (!firma) {
      neu++;
      firma = merke('auftraggeber', { id: uuid(), name, rechtsform: t(f.rechtsform), status: status(f.status), telefon: t(f.telefon), email: t(f.email), website: t(f.website), notizen: t(f.notizen), geaendertAm: jetzt });
    } else {
      zusammen++;
      const notiz = t(f.notizen);
      const erg = { ...firma, rechtsform: firma.rechtsform || t(f.rechtsform), telefon: firma.telefon || t(f.telefon), email: firma.email || t(f.email), website: firma.website || t(f.website),
        notizen: !notiz || (firma.notizen || '').includes(notiz) ? firma.notizen || '' : [firma.notizen, notiz].filter(Boolean).join('\n\n'),
        status: (firma.status || 'AKTIV') === 'AKTIV' && t(f.status) ? status(f.status) : firma.status };
      if (JSON.stringify(ohneLokales(erg)) !== JSON.stringify(ohneLokales(firma))) merke('auftraggeber', { ...erg, geaendertAm: jetzt });
    }
    const id = firma.id, liste = x => (Array.isArray(x) ? x.filter(Boolean) : []);
    const dazu = (tabelle, e, gleich) => { if (vonFirma(tabelle, id).some(gleich)) return; merke(tabelle, { id: uuid(), firmaId: id, ...e, geaendertAm: jetzt }); eintraege++; };
    for (const k of liste(f.kontakte)) { const n = t(k.name) || t(k.email); if (n) dazu('ansprechpartner', { name: n, thema: t(k.thema), telefon: t(k.telefon), email: t(k.email), notiz: t(k.notiz) }, x => normal(x.name) === normal(n)); }
    for (const a of liste(f.adressen)) { if (!t(a.strasse) && !t(a.ort) && !t(a.plz)) continue; dazu('adressen', { art: adressArt(a.art), strasse: t(a.strasse), plz: t(a.plz), ort: t(a.ort), notiz: t(a.notiz) }, x => normal(x.strasse) === normal(a.strasse) && normal(x.ort) === normal(a.ort)); }
    for (const p of liste(f.preise)) { const b = t(p.bez || p.bezeichnung); if (!b) continue; const c = cent(p.betrag), ab = tag(p.ab); dazu('preise', { bezeichnung: b, betragCent: c, einheit: t(p.einheit), gueltigAb: ab, notiz: t(p.notiz) }, x => normal(x.bezeichnung) === normal(b) && x.gueltigAb === ab && x.betragCent === c); }
    for (const a of liste(f.aktivitaeten)) { const text = t(a.text); if (!text) continue; const dt = tag(a.datum) || heute(); dazu('aktivitaeten', { datum: dt, art: aktArt(a.art), text, kontakt: t(a.kontakt) }, x => x.datum === dt && x.text === text); }
    for (const a of liste(f.aufgaben)) { const text = t(a.text); if (!text) continue; const fa = tag(a.faellig); dazu('aufgaben', { faelligAm: fa, text, kontakt: t(a.kontakt), erledigt: a.erledigt === true }, x => x.text === text && (x.faelligAm || null) === fa); }
    for (const x of liste(f.dokumente)) { const ti = t(x.titel) || t(x.link); if (!ti) continue; dazu('dokumente', { titel: ti, link: t(x.link), notiz: t(x.notiz) }, y => y.titel === ti && (y.link || '') === t(x.link)); }
  }
  // Fälle, deren Auftraggeber jetzt als Firma existiert, verbinden.
  for (const f of faelle().filter(f => !f.auftraggeberUuid && (f.auftraggeber || '').trim())) { const firma = firmaZumNamen(f.auftraggeber); if (firma) fallMerken({ ...f, auftraggeberUuid: firma.id }); }
  nachAenderung();
  return { neu, zusammen, eintraege };
}

// ============================== Angebote, Rechnungen, Zahlstatus ==============================
// Belege (Tabelle „belege“): art ANGEBOT oder RECHNUNG, Positionen als JSON-Text, Beträge in Cent.
const BELEG_ART = { ANGEBOT: ['Angebot', 'A'], RECHNUNG: ['Rechnung', 'R'] };
const BELEG_STATUS = {
  ENTWURF: ['Entwurf', 'grau'], OFFEN: ['Offen', 'blau'], TEILBEZAHLT: ['Teilbezahlt', 'gelb'], BEZAHLT: ['Bezahlt', 'gruen'], STORNIERT: ['Storniert', 'grau'],
  ANGENOMMEN: ['Angenommen', 'gruen'], ABGELEHNT: ['Abgelehnt', 'rot'],
};
const MAHNSTUFEN = ['Zahlungserinnerung', '1. Mahnung', '2. Mahnung', 'Letzte Mahnung'];
const rechnungsDaten = () => Object.assign({ name: '', strasse: '', plzOrt: '', telefon: '', email: '', steuer: '', ustId: '', iban: '', bic: '', bank: '',
  zahlungsziel: 14, mwst: 19, fuss: '', startRechnung: 1, startAngebot: 1 }, S.einstellungen.rechnung || {});

const positionen = b => { try { const p = JSON.parse(b.positionen || '[]'); return Array.isArray(p) ? p : []; } catch { return []; } };
function belegSummen(b) {
  const netto = positionen(b).reduce((n, p) => n + Math.round((Number(p.menge) || 0) * (Number(p.einzelCent) || 0)), 0);
  const mwst = Math.round(netto * (Number(b.mwstProzent ?? 19) || 0) / 100);
  return { netto, mwst, brutto: netto + mwst };
}
const offenCent = b => Math.max(0, belegSummen(b).brutto - (b.bezahltCent || 0));
const istRechnungOffen = b => b.art === 'RECHNUNG' && ['OFFEN', 'TEILBEZAHLT'].includes(b.status);
const istUeberfaellig = b => istRechnungOffen(b) && b.faelligAm && b.faelligAm < heute();
function belegMarke(b) {
  if (istUeberfaellig(b)) return ['Überfällig' + (b.mahnstufe ? ' · ' + MAHNSTUFEN[Math.min(b.mahnstufe, 4) - 1] : ''), 'rot'];
  return BELEG_STATUS[b.status] || BELEG_STATUS.OFFEN;
}
/**
 * Nächste freie Nummer, z. B. R2026-0007 (Rechnung) oder A2026-0003 (Angebot). Die Startnummer aus den
 * Einstellungen gilt als Untergrenze – so lässt sich an einen bisherigen Nummernkreis anschließen.
 */
function naechsteBelegNummer(art, jahr = new Date().getFullYear()) {
  const praefix = `${BELEG_ART[art][1]}${jahr}-`;
  const start = Math.max(1, Math.floor(Number(rechnungsDaten()[art === 'RECHNUNG' ? 'startRechnung' : 'startAngebot']) || 1));
  const hoechste = alle('belege').filter(b => b.art === art && String(b.nummer || '').startsWith(praefix))
    .reduce((n, b) => Math.max(n, Number(String(b.nummer).slice(praefix.length)) || 0), start - 1);
  return praefix + String(hoechste + 1).padStart(4, '0');
}
const zahlungsziel = firma => Number((firma && firma.zahlungszielTage) || rechnungsDaten().zahlungsziel) || 14;
function rechnungsAdresse(firmaId) {
  const l = vonFirma('adressen', firmaId);
  return l.find(a => a.art === 'RECHNUNG') || l.find(a => a.art === 'HAUPTSITZ') || l[0] || null;
}

const BelegAktionen = {
  neu(art, firmaId, extra = {}) {
    const firma = S.auftraggeber[firmaId], rd = rechnungsDaten();
    const b = merke('belege', { id: uuid(), firmaId, art, nummer: naechsteBelegNummer(art), datum: heute(),
      faelligAm: art === 'RECHNUNG' ? plusTage(heute(), zahlungsziel(firma)) : plusTage(heute(), 30), status: 'ENTWURF', positionen: '[]',
      mwstProzent: Number(rd.mwst) || 19, bezahltCent: 0, bezahltAm: null, mahnstufe: 0, bezug: '', notiz: '', fallId: '',
      einleitung: art === 'RECHNUNG' ? 'für unsere Leistungen erlauben wir uns, wie folgt zu berechnen:' : 'vielen Dank für Ihre Anfrage. Gern bieten wir Ihnen an:',
      schluss: art === 'RECHNUNG' ? `Bitte überweisen Sie den Betrag bis zum {FAELLIG} ohne Abzug.` : 'Das Angebot gilt 30 Tage. Wir freuen uns auf Ihren Auftrag.',
      geaendertAm: jetztIso(), ...extra });
    nachAenderung(); return b.id;
  },
  speichern(b) { merke('belege', { ...b, geaendertAm: jetztIso() }); nachAenderung(); },
  zahlung(b, cent, am) {
    const bezahlt = (b.bezahltCent || 0) + cent, voll = bezahlt >= belegSummen(b).brutto;
    this.speichern({ ...b, bezahltCent: bezahlt, bezahltAm: am, status: voll ? 'BEZAHLT' : 'TEILBEZAHLT' });
    Aktionen.crmSpeichern('aktivitaeten', { firmaId: b.firmaId, datum: am, art: 'SONSTIGES', kontakt: '', text: `Zahlung ${geld(cent)} zu ${b.nummer} erhalten${voll ? ' – vollständig bezahlt' : ''}` });
  },
  zuRechnung(angebot) {
    const id = this.neu('RECHNUNG', angebot.firmaId, { positionen: angebot.positionen, mwstProzent: angebot.mwstProzent, bezug: angebot.id, fallId: angebot.fallId || '' });
    this.speichern({ ...angebot, status: 'ANGENOMMEN' });
    return id;
  },
  loeschen(b) { entferne('belege', b, { firmaId: b.firmaId, geaendertAm: jetztIso() }); nachAenderung(); },
  /** Alle Angebote und Rechnungen samt der erfassten Zahlungen entfernen (z. B. nach Tests). @return Anzahl */
  alleLoeschen() {
    const belege = alle('belege'), nummern = new Set(belege.map(b => b.nummer));
    for (const b of belege) entferne('belege', b, { firmaId: b.firmaId, geaendertAm: jetztIso() });
    for (const a of alle('aktivitaeten').filter(a => /^Zahlung .* zu (\S+) erhalten/.test(a.text || '') && nummern.has(a.text.match(/ zu (\S+) erhalten/)[1]))) {
      entferne('aktivitaeten', a, { firmaId: a.firmaId, geaendertAm: jetztIso() });
    }
    nachAenderung();
    return belege.length;
  },
};

/** Druckt HTML über einen unsichtbaren Rahmen – kein neues Fenster, das ein Popup-Blocker (oder die Windows-App) sperren könnte. */
function druckeHtml(html) {
  // Android: Druckdialog des Geräts (eine WebView kann nicht selbst drucken)
  if (window.desktop && window.desktop.drucke) { window.desktop.drucke(html).catch(e => toast('Drucken nicht möglich: ' + e.message)); return; }
  const alt = $('#druckrahmen'); if (alt) alt.remove();
  const r = document.createElement('iframe');
  r.id = 'druckrahmen'; r.setAttribute('aria-hidden', 'true');
  r.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  r.onload = () => setTimeout(() => { try { r.contentWindow.focus(); r.contentWindow.print(); } catch { toast('Drucken ist hier nicht möglich – bitte „PDF“ verwenden.'); } }, 200);
  r.srcdoc = html;
  document.body.appendChild(r);
}

// ---------- Übersicht und Finanzen (Liste) ----------
function finanzKennzahlen() {
  const b = alle('belege'), rechnungen = b.filter(x => x.art === 'RECHNUNG' && x.status !== 'STORNIERT' && x.status !== 'ENTWURF');
  const monat = heute().slice(0, 7), jahr = heute().slice(0, 4);
  const umsatz = l => l.reduce((n, x) => n + belegSummen(x).netto, 0);
  const proFirma = {};
  for (const r of rechnungen.filter(x => String(x.datum).startsWith(jahr))) proFirma[r.firmaId] = (proFirma[r.firmaId] || 0) + belegSummen(r).netto;
  return {
    offen: rechnungen.filter(istRechnungOffen).reduce((n, x) => n + offenCent(x), 0),
    offenAnzahl: rechnungen.filter(istRechnungOffen).length,
    ueberfaellig: rechnungen.filter(istUeberfaellig).reduce((n, x) => n + offenCent(x), 0),
    ueberfaelligAnzahl: rechnungen.filter(istUeberfaellig).length,
    monat: umsatz(rechnungen.filter(x => String(x.datum).startsWith(monat))),
    jahr: umsatz(rechnungen.filter(x => String(x.datum).startsWith(jahr))),
    angebote: b.filter(x => x.art === 'ANGEBOT' && x.status === 'OFFEN').reduce((n, x) => n + belegSummen(x).netto, 0),
    topFirmen: Object.entries(proFirma).sort((x, y) => y[1] - x[1]).slice(0, 5),
  };
}
const BELEG_FILTER = { OFFEN: 'Offen', UEBERFAELLIG: 'Überfällig', BEZAHLT: 'Bezahlt', ANGEBOTE: 'Angebote', ENTWURF: 'Entwürfe', ALLE: 'Alle' };

function zeichneFinanzen(r) {
  const k = finanzKennzahlen(), f = ANSICHT.belegFilter || 'OFFEN', such = String(ANSICHT.belegSuche || '').trim().toLowerCase();
  const liste = alle('belege').filter(b => {

/** Liest das Formular in den Beleg zurück. */
function belegAusFormular(b) {
  const form = $('#beleg-form'); if (!form) return b;
  const w = Object.fromEntries(new FormData(form));
  const pos = [...form.querySelectorAll('[data-pos]')].map(z => {
    const v = n => z.querySelector(`[name=${n}]`).value;
    return { bez: v('bez').trim(), einheit: v('einheit').trim(), menge: Number(String(v('menge')).replace(',', '.')) || 0, einzelCent: geldLesen(v('einzel')) ?? 0 };
  });
  return { ...b, datum: w.datum || b.datum, faelligAm: w.faelligAm || b.faelligAm, mwstProzent: Number(w.mwstProzent) || 0, einleitung: w.einleitung ?? b.einleitung,
    schluss: w.schluss ?? b.schluss, notiz: w.notiz ?? b.notiz, positionen: JSON.stringify(pos) };
}

async function belegMail(b, art = 'beleg') {
  if (!MAIL.konto) { toast('Kein E-Mail-Konto eingerichtet'); return; }
  try {
    const pdf = await belegPdf(b), firma = S.auftraggeber[b.firmaId] || {};
    const k = kontakteVon(b.firmaId).find(x => /abrechn|buchhalt|rechnung/i.test(x.thema || '') && x.email);
    const s = belegSummen(b);
    const texte = art === 'mahnung'
      ? [`${MAHNSTUFEN[Math.min(b.mahnstufe || 0, 3)]}: ${BELEG_ART[b.art][0]} ${b.nummer}`, `unsere Rechnung ${b.nummer} vom ${datumText(b.datum)} über ${geld(s.brutto)} war am ${datumText(b.faelligAm)} fällig. Offen sind noch ${geld(offenCent(b))}.\n\nSicher ist die Zahlung nur übersehen worden. Bitte überweisen Sie den offenen Betrag innerhalb von 7 Tagen. Sollte sich die Zahlung mit diesem Schreiben überschnitten haben, betrachten Sie es bitte als gegenstandslos.\n\nDie Rechnung finden Sie noch einmal im Anhang.`]
      : [`${BELEG_ART[b.art][0]} ${b.nummer}`, `anbei erhalten Sie unser${b.art === 'RECHNUNG' ? 'e Rechnung' : ' Angebot'} ${b.nummer} über ${geld(s.brutto)}${b.art === 'RECHNUNG' ? `, zahlbar bis ${datumText(b.faelligAm)}` : ''}.`];
    mailAnFirma({ firmaId: b.firmaId, an: (k && k.email) || firma.email || '', betreff: texte[0], inhalt: texte[1],
      anhaenge: [{ name: belegDateiname(b), mimeType: 'application/pdf', base64: pdf }],
      nachSenden: () => {
        const neu = { ...S.belege[b.id] };
        if (art === 'mahnung') neu.mahnstufe = (neu.mahnstufe || 0) + 1; else if (neu.status === 'ENTWURF') neu.status = 'OFFEN';
        BelegAktionen.speichern(neu);
      } });
  } catch (e) { toast(e.message, 6000); }
}

const mitarbeiterListe = (nurAktive = false) => alle('mitarbeiter').filter(m => !nurAktive || maAktiv(m)).sort((a, b) => String(a.name).localeCompare(String(b.name), 'de'));
const maVon = id => (id && S.mitarbeiter[id] && !S.mitarbeiter[id].geloescht ? S.mitarbeiter[id] : null);
const maName = id => (maVon(id) ? maVon(id).name : '');
/** Namen vergleichen ohne Groß-/Kleinschreibung und Reihenfolge („Demir, Ali“ = „Ali Demir“). */
const nameSchluessel = n => normal(n).replace(/[,.]/g, ' ').split(/\s+/).filter(Boolean).sort().join(' ');

const abwesenheitenVon = id => alle('abwesenheiten').filter(a => a.mitarbeiterId === id).sort((a, b) => String(b.von).localeCompare(String(a.von)));

const personalakteVon = id => alle('personaleintraege').filter(x => x.mitarbeiterId === id).sort((a, b) => String(b.datum).localeCompare(String(a.datum)));
const grundArt = g => (/urlaub/i.test(g || '') ? 'Urlaub' : /krank/i.test(g || '') ? 'Krank' : String(g || '').trim() || 'Sonstiges');

/** Internationale Nummer für WhatsApp/SMS (0171… → +49171…). */
const intNummer = n => { const s = String(n || '').replace(/[^0-9+]/g, ''); return s.startsWith('+') ? s : s.startsWith('00') ? '+' + s.slice(2) : s.startsWith('0') ? '+49' + s.slice(1) : s; };
/** Öffnet eine Webadresse (WhatsApp, Karten …) im Browser bzw. im passenden Programm. */
function oeffneLink(url) {
  window.__geoeffnet = url;
  if (window.desktop) { window.desktop.oeffneExtern(url).catch(() => toast('Kein Programm für diese Aktion gefunden.')); return; }
  window.open(url, '_blank', 'noopener');
}
const whatsapp = (tel, text) => oeffneLink(`https://wa.me/${intNummer(tel).replace('+', '')}?text=${encodeURIComponent(text || '')}`);

/** Arbeitstage zwischen zwei Daten (einschließlich), Mo–Fr bzw. Mo–Sa laut Einstellungen. */
function arbeitstage(von, bis) {
  if (!von || !bis || bis < von) return 0;
  const sechs = Number(S.einstellungen.arbeitstageWoche) === 6;
  let n = 0;
  for (let d = alsTag(von), ende = alsTag(bis); d <= ende; d.setDate(d.getDate() + 1)) { const w = d.getDay(); if (w !== 0 && (sechs || w !== 6)) n++; }
  return n;
}

/** Fristen eines Mitarbeiters (nur aktive), sortiert nach Datum. */
function personalFristen(m) {
  if (!maAktiv(m)) return [];
  return PERSONAL_FRISTEN.filter(([k]) => m[k]).map(([k, l]) => ({ feld: k, label: l, datum: m[k], tage: tageBis(m[k]) })).sort((a, b) => a.datum.localeCompare(b.datum));
}
/** Fristen und Geburtstage der nächsten Tage für „Termine“ und die Übersicht. */
function personalTermine() {
  const bis = plusTage(heute(), FRIST_VORLAUF), t = heute();
  const fristen = mitarbeiterListe(true).flatMap(m => personalFristen(m).filter(f => f.datum <= bis).map(f => ({ art: 'mitarbeiter', datum: f.datum, titel: `${f.label} · ${m.name}`, zusatz: ROLLE[m.rolle] || '', m })));
  const geburtstage = mitarbeiterListe(true).filter(m => m.geburtstag).map(m => {
    let d = t.slice(0, 4) + m.geburtstag.slice(4); if (d < t) d = String(Number(t.slice(0, 4)) + 1) + m.geburtstag.slice(4);
    return { art: 'mitarbeiter', datum: d, titel: `🎂 Geburtstag · ${m.name}`, zusatz: `${Number(d.slice(0, 4)) - Number(m.geburtstag.slice(0, 4))} Jahre`, m };
  }).filter(x => x.datum <= plusTage(t, 7));
  return [...fristen, ...geburtstage];
}

/** Touren, an denen der Mitarbeiter beteiligt ist (als Fahrer oder Beifahrer). */
const einsaetzeVon = (id, von = '0000-00-00', bis = '9999-99-99') => alle('touren').filter(t => t.datum >= von && t.datum <= bis && teamVon(t).includes(id))
  .sort((a, b) => String(b.datum).localeCompare(String(a.datum)));
/** Schadensfälle, an denen der Mitarbeiter beteiligt war (Tour, Kennung oder Name im Fall). */
function schaedenVon(m) {
  const n = nameSchluessel(m.name);
  return faelle().filter(f => f.fahrerId === m.id || (f.tourId && S.touren[f.tourId] && teamVon(S.touren[f.tourId]).includes(m.id))
    || [f.fahrer, f.beifahrer1, f.beifahrer2].some(x => x && nameSchluessel(x) === n)).sort((a, b) => String(b.schadensdatum || '').localeCompare(String(a.schadensdatum || '')));
}
/** Fahrzeuge, bei denen der Mitarbeiter als fester Fahrer eingetragen ist. */
const festeFahrzeugeVon = m => alle('fahrzeuge').filter(z => z.fahrer && nameSchluessel(z.fahrer) === nameSchluessel(m.name));

/** Auswertung eines Mitarbeiters im Zeitraum. */
function maAuswertung(m, von, bis) {
  const touren = einsaetzeVon(m.id, von, bis);
  const tage = new Set(touren.map(t => t.datum)), fahrtage = new Set(touren.filter(t => t.fahrerId === m.id).map(t => t.datum));
  const zaehle = f => { const o = {}; for (const t of touren) { const k = f(t); if (k) o[k] = (o[k] || 0) + 1; } return Object.entries(o).sort((a, b) => b[1] - a[1]); };
  const abw = {};
  for (const a of abwesenheitenVon(m.id)) {
    const n = arbeitstage(a.von > von ? a.von : von, (a.bis || a.von) < bis ? (a.bis || a.von) : bis);
    if (n > 0) abw[grundArt(a.grund)] = (abw[grundArt(a.grund)] || 0) + n;
  }
  const lohn = personalakteVon(m.id).filter(x => x.art === 'LOHN' && x.datum >= von.slice(0, 7) + '-01' && x.datum <= bis);
  const summe = f => lohn.reduce((n, x) => n + (f(x) || 0), 0);
  const kosten = summe(x => x.kostenCent ?? x.bruttoCent);
  return { touren: touren.length, tage: tage.size, fahrtage: fahrtage.size, beifahrertage: [...tage].filter(t => !fahrtage.has(t)).length,
    arten: zaehle(t => t.einsatzart), auftraggeber: zaehle(t => tourAuftraggeberName(t)), fahrzeuge: zaehle(t => t.kennzeichen), abw,
    urlaub: abw.Urlaub || 0, krank: abw.Krank || 0, sonst: Object.entries(abw).filter(([k]) => k !== 'Urlaub' && k !== 'Krank').reduce((n, [, v]) => n + v, 0),
    bruttoCent: summe(x => x.bruttoCent), nettoCent: summe(x => x.nettoCent), kostenCent: kosten, stunden: summe(x => x.stunden) / 100, lohnMonate: lohn.length,
    kostenProTag: tage.size && kosten ? Math.round(kosten / tage.size) : null,
    schaeden: schaedenVon(m).filter(f => (f.schadensdatum || f.meldedatum || '') >= von && (f.schadensdatum || f.meldedatum || '') <= bis) };
}
/** Urlaubskonto eines Jahres: Anspruch (inkl. Rest aus dem Vorjahr), genommen, geplant, Rest. */
function urlaubskonto(m, jahr = heute().slice(0, 4)) {
  const von = jahr + '-01-01', bis = jahr + '-12-31', t = heute();
  let genommen = 0, geplant = 0;
  for (const a of abwesenheitenVon(m.id).filter(a => grundArt(a.grund) === 'Urlaub')) {
    const a1 = a.von > von ? a.von : von, b1 = (a.bis || a.von) < bis ? (a.bis || a.von) : bis;
    if (b1 < a1) continue;
    if (b1 <= t) genommen += arbeitstage(a1, b1); else if (a1 > t) geplant += arbeitstage(a1, b1);
    else { genommen += arbeitstage(a1, t); geplant += arbeitstage(plusTage(t, 1), b1); }
  }
  const anspruch = (m.urlaubstage || 0) + (jahr === t.slice(0, 4) ? (m.resturlaub || 0) : 0);
  return { anspruch, genommen, geplant, rest: anspruch - genommen - geplant };
}
/** Zeiträume für Auswertungen. */
function zeitraum(art, bezug = heute()) {
  const j = Number(bezug.slice(0, 4)), mo = Number(bezug.slice(5, 7)) - 1;
  if (art === 'LETZTER_MONAT') return { von: isoTag(new Date(j, mo - 1, 1)), bis: isoTag(new Date(j, mo, 0)), text: new Date(j, mo - 1, 15).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }) };
  if (art === 'JAHR') return { von: `${j}-01-01`, bis: `${j}-12-31`, text: String(j) };
  if (art === 'LETZTES_JAHR') return { von: `${j - 1}-01-01`, bis: `${j - 1}-12-31`, text: String(j - 1) };
  return { von: isoTag(new Date(j, mo, 1)), bis: isoTag(new Date(j, mo + 1, 0)), text: new Date(j, mo, 15).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }) };
}
const ZEITRAEUME = { MONAT: 'Dieser Monat', LETZTER_MONAT: 'Letzter Monat', JAHR: 'Dieses Jahr', LETZTES_JAHR: 'Letztes Jahr' };

const PersonalAktionen = {
  /** @return Kennung */
  speichern(m) {
    const x = merke('mitarbeiter', { aktiv: true, rolle: 'FAHRER', ...m, id: m.id || uuid(), firmaId: '', name: String(m.name || '').trim(), geaendertAm: jetztIso() });
    nachAenderung(); return x.id;
  },
  /** Neuer Mitarbeiter nur mit Namen (z. B. beim Eintippen in der Tourenplanung). */
  schnellAnlegen(name, rolle = 'BEIDES') {
    const vorhanden = maZumNamen(name); if (vorhanden) return vorhanden.id;
    return merke('mitarbeiter', { id: uuid(), firmaId: '', name: String(name).trim(), rolle, aktiv: true, notiz: 'Aus der Tourenplanung angelegt – bitte ergänzen', geaendertAm: jetztIso() }).id;
  },
  loeschen(m) {
    const jetzt = jetztIso();
    for (const a of abwesenheitenVon(m.id)) entferne('abwesenheiten', a, { firmaId: '', geaendertAm: jetzt });
    for (const x of personalakteVon(m.id)) entferne('personaleintraege', x, { firmaId: '', geaendertAm: jetzt });
    for (const a of anlagenVon(m.id)) { entferne('anlagen', a, { fallId: a.fallId }); Dateien.loesche(a.id); }
    entferne('mitarbeiter', m, { firmaId: '', geaendertAm: jetzt }); nachAenderung();
  },
  abwesenheit(a) { merke('abwesenheiten', { ...a, id: a.id || uuid(), firmaId: '', bis: a.bis || a.von, geaendertAm: jetztIso() }); nachAenderung(); },
  abwesenheitLoeschen(a) { entferne('abwesenheiten', a, { firmaId: '', geaendertAm: jetztIso() }); nachAenderung(); },
  /** Eintrag in der Personalakte; Unterweisung und Führerscheinkontrolle mit „gültig bis“ setzen die Frist beim Mitarbeiter. */
  eintrag(x) {
    merke('personaleintraege', { ...x, id: x.id || uuid(), firmaId: '', geaendertAm: jetztIso() });
    const m = maVon(x.mitarbeiterId), feld = { UNTERWEISUNG: 'unterweisungBis', FUEHRERSCHEIN: 'fuehrerscheinKontrolle' }[x.art];
    if (m && feld && x.bis && (!m[feld] || x.bis > m[feld])) merke('mitarbeiter', { ...m, [feld]: x.bis, geaendertAm: jetztIso() });
    nachAenderung();
  },
  eintragLoeschen(x) { entferne('personaleintraege', x, { firmaId: '', geaendertAm: jetztIso() }); nachAenderung(); },
  async dokument(id, art, datei) { if (await legeAnlage(id, datei, `${art} – `)) nachAenderung(); },
};

const PERSONAL_FILTER = { AKTIV: 'Aktiv', FREI: 'Heute frei', EINSATZ: 'Heute im Einsatz', ABWESEND: 'Heute abwesend', FRIST: 'Fristen', INAKTIV: 'Inaktiv', ALLE: 'Alle' };

  const einsatz = new Set(einsaetzeVon(m.id, monat + '-01', monat + '-31').map(t => t.datum));

    const tag = `${monat}-${pad(d)}`, a = abwesendAm(m.id, tag), w = alsTag(tag).getDay();

 * Gleiche Personalnummer bzw. gleicher Name = gleiche Person: leere Felder werden ergänzt, vorhandene bleiben. Je Person und Monat gibt es eine Lohnabrechnung.
 */
async function personalImportieren(text) {
  const d = JSON.parse(text);
  if (!d || !(Array.isArray(d.mitarbeiter) || Array.isArray(d.lohn))) throw new Error('Das ist keine Personal-Datei.');
  const felder = new Set(MITARBEITER_FELDER.flatMap(([, f]) => f.map(([k]) => k)).concat(['stundenlohnCent']));
  felder.delete('stundenlohn');
  const finde = x => (x.personalnummer && alle('mitarbeiter').find(m => String(m.personalnummer || '') === String(x.personalnummer))) || maZumNamen(x.name || '');
  let neu = 0, ergaenzt = 0, lohn = 0, abw = 0, doks = 0;
  for (const roh of d.mitarbeiter || []) {
    if (!roh.name && !roh.personalnummer) continue;
    const sauber = Object.fromEntries(Object.entries(roh).filter(([k, v]) => felder.has(k) && v != null && v !== ''));
    if (typeof sauber.aktiv === 'string') sauber.aktiv = !/^(nein|false|0)$/i.test(sauber.aktiv);
    if (typeof sauber.monteur === 'string') sauber.monteur = /^(ja|true|1)$/i.test(sauber.monteur);
    const alt = finde(roh);
    if (!alt) { merke('mitarbeiter', { aktiv: true, rolle: 'BEIDES', anstellung: 'VOLLZEIT', ...sauber, name: String(roh.name || roh.personalnummer).trim(), id: uuid(), firmaId: '', geaendertAm: jetztIso() }); neu++; continue; }
    const dazu = Object.fromEntries(Object.entries(sauber).filter(([k]) => alt[k] == null || alt[k] === ''));
    if (Object.keys(dazu).length) { merke('mitarbeiter', { ...alt, ...dazu, geaendertAm: jetztIso() }); ergaenzt++; }
  }
  for (const x of d.lohn || []) {
    const m = finde(x); if (!m || !/^\d{4}-\d{2}/.test(x.monat || '')) continue;
    const datum = x.monat.slice(0, 7) + '-01', alt = personalakteVon(m.id).find(e => e.art === 'LOHN' && e.datum === datum);
    const ganz = v => (v == null || v === '' ? null : Math.round(Number(v)));
    merke('personaleintraege', { ...(alt || {}), id: alt ? alt.id : uuid(), firmaId: '', mitarbeiterId: m.id, art: 'LOHN', datum, bis: null, text: x.text || '',
      bruttoCent: ganz(x.bruttoCent), nettoCent: ganz(x.nettoCent), kostenCent: ganz(x.kostenCent), stunden: x.stunden != null ? Math.round(Number(x.stunden) * 100) : null, geaendertAm: jetztIso() });
    lohn++;
  }
  for (const x of d.abwesenheiten || []) {
    const m = finde(x); if (!m || !x.von) continue;
    if (abwesenheitenVon(m.id).some(a => a.von === x.von && (a.bis || a.von) === (x.bis || x.von))) continue;
    merke('abwesenheiten', { id: uuid(), firmaId: '', mitarbeiterId: m.id, von: x.von, bis: x.bis || x.von, grund: x.grund || '', notiz: x.notiz || '', geaendertAm: jetztIso() }); abw++;
  }
  for (const dok of d.dokumente || []) {
    const m = finde(dok); if (!m || !dok.base64) continue;
    const name = `${dok.art || 'Sonstiges'} – ${dok.name}`;
    if (anlagenVon(m.id).some(a => a.anzeigename === name)) continue;
    const blob = blobAusBase64(dok.base64, dok.mimeType || 'application/pdf');
    const a = merke('anlagen', { id: uuid(), fallId: m.id, anzeigename: name, mimeType: blob.type, groesseBytes: blob.size, hinzugefuegtAm: jetztIso(), vorhanden: false });
    await Dateien.lege(a.id, blob); doks++;
  }
  nachAenderung();
  return { neu, ergaenzt, lohn, abw, doks };
}
