<style>
:root{
  --bg:#F8F9FF;--flaeche:#F2F3FA;--flaeche2:#ECEEF4;--hoch:#E1E2E8;--text:#191C20;--leise:#43474E;--rand:#C3C7CF;--linie:#DFE2EB;
  --primaer:#36618E;--auf-primaer:#fff;--primaer-hell:#D1E4FF;--auf-primaer-hell:#194975;--fehler:#BA1A1A;
  --blau-f:#D1E4FF;--blau-t:#0B3A63;--violett-f:#E3DFFF;--violett-t:#2F2A7A;--gelb-f:#FFDF9E;--gelb-t:#4F3A00;--lila-f:#F2DAFF;--lila-t:#4A3657;
  --tuerkis-f:#BFE9EC;--tuerkis-t:#00363A;--orange-f:#FFDBC8;--orange-t:#6A2D00;--gruen-f:#BDEFC2;--gruen-t:#0C3A18;--grau-f:#E1E2E8;--grau-t:#43474E;--rot-f:#FFDAD6;--rot-t:#93000A;
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418;--flaeche:#191C20;--flaeche2:#1D2024;--hoch:#32353A;--text:#E1E2E8;--leise:#C3C7CF;--rand:#43474E;--linie:#32353A;
  --primaer:#A0CAFD;--auf-primaer:#003258;--primaer-hell:#194975;--auf-primaer-hell:#D1E4FF;--fehler:#FFB4AB;
  --blau-f:#194975;--blau-t:#D1E4FF;--violett-f:#454093;--violett-t:#E3DFFF;--gelb-f:#5B4300;--gelb-t:#FFDF9E;--lila-f:#523F5F;--lila-t:#F2DAFF;
  --tuerkis-f:#1E4D52;--tuerkis-t:#BFE9EC;--orange-f:#75390D;--orange-t:#FFDBC8;--gruen-f:#1F4F2A;--gruen-t:#BDEFC2;--grau-f:#43474E;--grau-t:#E1E2E8;--rot-f:#93000A;--rot-t:#FFDAD6;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{min-height:100vh}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
/* ===== Rahmen: Kopfleiste, Navigation (PC links, Handy unten), Inhalt ===== */
:root{--nav-breite:212px;--kopf-hoehe:58px}
header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;min-height:var(--kopf-hoehe);padding:calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--linie)}
#app-titel{border:0;background:transparent;cursor:pointer;font-size:19px;font-weight:600;color:var(--primaer);padding:4px 6px;white-space:nowrap}
#suche-global{position:relative;flex:1;max-width:560px;margin:0 auto}
#globale-suche{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--rand);border-radius:999px;background:var(--flaeche);font-size:15px}
#suche-global::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}
#suchtreffer{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--flaeche);border:1px solid var(--rand);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:70vh;overflow:auto;z-index:20;padding:6px 0}
.treffer-gruppe{font-size:12px;font-weight:600;color:var(--primaer);padding:8px 12px 2px}
.treffer{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 12px;cursor:pointer;color:inherit}
.treffer:hover,.treffer:focus{background:var(--flaeche2);outline:0}
#suche-knopf{display:none}
#neu-knopf{padding:8px 16px}
main{display:grid;grid-template-columns:minmax(0,1fr);margin:0 auto}
main>section{padding:14px calc(16px + env(safe-area-inset-right)) 32px calc(16px + env(safe-area-inset-left));min-width:0}
#navi{z-index:7}
.nav-knopf{position:relative;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--leise);cursor:pointer;border-radius:12px;font-weight:500;text-align:left}
.nav-knopf:hover{background:var(--flaeche2)}
.nav-knopf[aria-current=page]{background:var(--primaer-hell);color:var(--auf-primaer-hell);font-weight:600}
.nav-symbol{font-size:19px;width:24px;text-align:center;flex:none}
.nav-knopf .zahl{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--rot-f);color:var(--rot-t);font-size:11px;line-height:18px;text-align:center}
@media (min-width:900px){
  #navi{position:fixed;left:0;top:var(--kopf-hoehe);bottom:0;width:var(--nav-breite);padding:12px 10px 16px;background:var(--flaeche);border-right:1px solid var(--linie);overflow:auto}
  .nav-klein{display:none}.nav-gross{display:flex;flex-direction:column;gap:2px}
  .nav-knopf{padding:10px 12px;width:100%}
  header{position:fixed;left:0;right:0}
  header #app-titel{width:calc(var(--nav-breite) - 16px);text-align:left}
  main{margin-left:var(--nav-breite);padding-top:var(--kopf-hoehe);grid-template-columns:minmax(340px,420px) minmax(0,1fr);align-items:start;max-width:calc(1500px + var(--nav-breite))}
  #liste{position:sticky;top:var(--kopf-hoehe);max-height:calc(100vh - var(--kopf-hoehe));overflow:auto;border-right:1px solid var(--linie)}
  body.breit main{grid-template-columns:minmax(0,1fr)}
  body.breit #liste{position:static;max-height:none;overflow:visible;border:0}
  body.breit #detail,body.breit-detail #liste{display:none}
  body.breit-detail main{grid-template-columns:minmax(0,1fr)}
  body:not(.zeigt-detail):not(.breit) #zurueck,body:not(.breit-detail) #zurueck{display:none}
}
@media (min-width:900px) and (max-width:1180px){
  :root{--nav-breite:84px}
  .nav-knopf{flex-direction:column;gap:2px;padding:8px 2px;text-align:center;font-size:11.5px}
  .nav-knopf .zahl{position:absolute;top:2px;right:6px;margin:0}
  header #app-titel{font-size:15px}
}
@media (max-width:899px){
  #navi{position:fixed;left:0;right:0;bottom:0;background:var(--flaeche);border-top:1px solid var(--linie);padding:4px calc(4px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left))}
  .nav-gross{display:none}.nav-klein{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
  .nav-knopf{flex-direction:column;gap:1px;padding:6px 2px;font-size:11px;text-align:center;min-width:0}
  .nav-knopf .nav-text{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-knopf .zahl{position:absolute;top:1px;right:calc(50% - 26px);margin:0}
  main>section{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  body.zeigt-detail #liste,body:not(.zeigt-detail) #detail{display:none}
  header{gap:6px}
  #app-titel{font-size:17px;padding:4px 2px}
  #suche-global{display:none}
  #suche-knopf{display:inline-flex}
  body.sucht #suche-global{display:block;position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));max-width:none;z-index:21}
  #neu-knopf{padding:8px 12px}
  #neu-knopf .lang{display:none}
  .werkzeuge{gap:5px}.werkzeuge .knopf{padding:6px 10px;font-size:13px}
  .seitenkopf h1{font-size:20px}
  .fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));z-index:4;box-shadow:0 3px 10px rgba(0,0,0,.25);padding:14px 20px;border-radius:16px}
}
/* Kopf eines Bereichs */
.seitenkopf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.seitenkopf h1{font-size:22px;font-weight:600;flex:1;min-width:0}
.sk-haupt{display:flex;gap:8px;flex-wrap:wrap}
.werkzeuge{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.werkzeuge .knopf{padding:7px 12px;font-size:14px}
.dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
.dashboard .karte{margin:0}
.dashboard .kennzahlen.vier{grid-template-columns:1fr 1fr}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.kachel{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border:1px solid var(--rand);border-radius:14px;background:var(--flaeche2);cursor:pointer;font-weight:500;text-align:center}
.kachel span{font-size:24px}.kachel:hover{border-color:var(--primaer)}
.kachel .zahl{background:var(--rot-f);color:var(--rot-t);border-radius:9px;padding:0 6px;font-size:12px}
/* Tourenplanung */
.tp-datum{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tp-datum input{padding:8px 10px;border:1px solid var(--rand);border-radius:10px;background:var(--flaeche);font-size:15px}
.tp-datum .knopf{padding:7px 12px}
.tp-wochentag{font-size:17px;margin:0 6px}
#tourplan{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.tour{display:grid;grid-template-columns:28px 130px 80px minmax(130px,1fr) minmax(130px,1.2fr) 74px 130px minmax(130px,1fr) minmax(170px,1.6fr) auto;gap:6px;align-items:start;
  background:var(--flaeche);border:1px solid var(--linie);border-radius:12px;padding:8px}
.tour.leer{opacity:.85;border-style:dashed}
.tour-nr{font-weight:600;color:var(--leise);padding-top:22px;text-align:center}
.tf{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:11px;color:var(--leise)}
.tf input,.tf select{width:100%;padding:7px 8px;border:1px solid var(--rand);border-radius:8px;background:var(--bg);font-size:14px;color:var(--text);min-width:0}
.tf.kz input{font-weight:600}
.bf{display:flex;flex-wrap:wrap;gap:4px}.bf input{flex:1 1 110px}
.tour-hinweise{grid-column:2/-2;display:flex;flex-wrap:wrap;gap:4px}
.tour-hinweise:empty{display:none}
.tour-hinweise button.marke{border:0;cursor:pointer}
.tour-knoepfe{grid-row:1;grid-column:-2;display:flex;gap:0;padding-top:16px}
.tour-knoepfe .symbol{padding:6px;font-size:15px}
.tour-knoepfe .symbol:disabled{opacity:.25;cursor:default}
.tp-frei{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tp-frei h3{font-size:14px;color:var(--primaer);margin:0 0 6px}.tp-frei p{margin:3px 0}
@media (max-width:1560px){
  .tour{grid-template-columns:28px repeat(4,minmax(0,1fr)) auto}
  .tour .tf.kz{grid-column:2/4}.tour .tf.nr{grid-column:4/5}.tour .tf.zeit{grid-column:5/6}
  .tour .tf.ag{grid-column:2/4}.tour .tf.name{grid-column:4/6}
  .tour .tf.art{grid-column:2/4}.tour .tf.fahrer{grid-column:4/6}
  .tour .tf.team{grid-column:2/6}
  .tour-knoepfe{grid-column:6;grid-row:1/span 2;flex-direction:column;padding-top:0}
  .tour-hinweise{grid-column:2/6}
}
@media (max-width:600px){
  .tour{grid-template-columns:22px repeat(2,minmax(0,1fr)) auto;padding:8px 6px}
  .tour .tf.kz,.tour .tf.ag,.tour .tf.art{grid-column:2/3}.tour .tf.nr,.tour .tf.name,.tour .tf.fahrer{grid-column:3/4}
  .tour .tf.zeit{grid-column:2/3}.tour .tf.team,.tour-hinweise{grid-column:2/4}
  .tour-knoepfe{grid-column:4;grid-row:1/span 4}
  .tp-frei{grid-template-columns:1fr}
  .tp-datum .tp-wochentag{width:100%;margin:2px 0 0}
}
/* Personal */
.kennzahlen.vier{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.kennzahlen.vier{grid-template-columns:1fr 1fr}}
.kennzahl.gelb{background:var(--gelb-f);color:var(--gelb-t)}.kennzahl.blau{background:var(--blau-f);color:var(--blau-t)}
.kalender{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:420px}
.kalender .wt{font-size:11px;text-align:center;color:var(--leise)}
.kal-tag{padding:7px 0;border:1px solid var(--linie);border-radius:6px;background:var(--bg);cursor:pointer;font-size:13px}
.kal-tag.we{color:var(--leise)}.kal-tag.heute{outline:2px solid var(--primaer)}
.tabelle-rahmen{overflow-x:auto;background:var(--flaeche);border-radius:12px;margin-bottom:12px}
.tabelle{width:100%;border-collapse:collapse;font-size:14px}
.tabelle th{text-align:left;font-size:12px;color:var(--leise);padding:8px;border-bottom:1px solid var(--rand);white-space:nowrap}
.tabelle td{padding:7px 8px;border-bottom:1px solid var(--linie)}
.tabelle .r{text-align:right;white-space:nowrap}
.tabelle tr.klickbar{cursor:pointer}.tabelle tr.klickbar:hover td{background:var(--flaeche2)}
.tabelle tr.summe td{font-weight:600;border-top:2px solid var(--rand)}
pre.vorschau{white-space:pre-wrap;font:inherit;background:var(--flaeche2);padding:10px;border-radius:10px;margin:8px 0}
.liste-knoepfe .vorlage{border-bottom:1px solid var(--linie);border-radius:0}
.mail-karte.ungelesen .titel{font-weight:700}.mail-karte.ungelesen{border-left:4px solid var(--primaer)}
.karte{background:var(--flaeche);border-radius:14px;padding:16px;margin-bottom:12px}
.karte.klickbar{cursor:pointer;display:block;width:100%;text-align:left;border:0}
.karte.klickbar:hover,.karte.gewaehlt{background:var(--flaeche2)}
.karte.gewaehlt{outline:2px solid var(--primaer)}
.zeile{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zeile.eng{flex-wrap:nowrap}
.fuell{flex:1;min-width:0}
.titel{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leise{color:var(--leise);font-size:13px}
.gross{font-size:22px;font-weight:500}
.zwei-zeilen{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.marke{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap}
.blau{background:var(--blau-f);color:var(--blau-t)}.violett{background:var(--violett-f);color:var(--violett-t)}.gelb{background:var(--gelb-f);color:var(--gelb-t)}
.lila{background:var(--lila-f);color:var(--lila-t)}.tuerkis{background:var(--tuerkis-f);color:var(--tuerkis-t)}.orange{background:var(--orange-f);color:var(--orange-t)}
.gruen{background:var(--gruen-f);color:var(--gruen-t)}.grau{background:var(--grau-f);color:var(--grau-t)}.rot{background:var(--rot-f);color:var(--rot-t)}
.kennzahlen{display:grid;grid-template-columns:1fr 1fr 1.8fr;gap:8px;margin-bottom:12px}
.kennzahl{border:0;border-radius:12px;padding:10px 12px;text-align:left;background:var(--flaeche2);cursor:pointer}
.kennzahl b{display:block;font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kennzahl span{font-size:12px}
.kennzahl.rot{background:var(--rot-f);color:var(--rot-t)}
.suche{width:100%;padding:11px 16px;border:1px solid var(--rand);border-radius:999px;background:transparent;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 14px;border:1px solid var(--rand);border-radius:8px;background:transparent;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--primaer-hell);color:var(--auf-primaer-hell);border-color:transparent}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:999px;border:1px solid var(--rand);background:transparent;cursor:pointer;white-space:nowrap}
.knopf.voll{background:var(--primaer);color:var(--auf-primaer);border-color:transparent}
.knopf.tonal{background:var(--primaer-hell);color:var(--auf-primaer-hell);border-color:transparent}
.knopf.text{border-color:transparent;color:var(--primaer);padding:9px 10px}
.knopf.gefahr{color:var(--fehler)}
.knopf:disabled{opacity:.45;cursor:default}
.symbol{border:0;background:transparent;cursor:pointer;padding:8px;border-radius:999px;font-size:18px;line-height:1}
.symbol:hover{background:var(--flaeche2)}
:focus-visible{outline:2px solid var(--primaer);outline-offset:2px}
.wv{border-radius:14px;padding:16px;margin-bottom:12px;background:var(--flaeche2)}
.wv.rot{background:var(--rot-f);color:var(--rot-t)}.wv.gelb{background:var(--gelb-f);color:var(--gelb-t)}
.wv .knopf:not(.voll){border-color:currentColor;color:inherit}
.kontakt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.block h3{font-size:14px;color:var(--primaer);margin:14px 0 6px}
.block h3:first-child{margin-top:0}
dl{margin:0;display:grid;grid-template-columns:128px minmax(0,1fr);gap:6px 8px}
dt{color:var(--leise)}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.anlagen{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.anlage{width:104px;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;position:relative}
.anlage .bild{width:104px;height:104px;border-radius:12px;background:var(--hoch);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.anlage img{width:100%;height:100%;object-fit:cover}
.anlage span{display:block;font-size:11px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anlage .weg{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:3px 7px}
.verlauf{list-style:none;margin:0;padding:0}
.verlauf li{display:flex;gap:12px;padding:8px 0;align-items:flex-start}
.verlauf .rund{flex:none;width:34px;height:34px;border-radius:50%;background:var(--primaer-hell);color:var(--auf-primaer-hell);display:flex;align-items:center;justify-content:center;font-size:15px}
.verlauf .inhalt{white-space:pre-wrap;overflow-wrap:anywhere}
label.feld{display:block;margin-bottom:10px;font-size:12px;color:var(--leise)}
label.feld input,label.feld select,label.feld textarea{display:block;width:100%;margin-top:3px;padding:10px 12px;border:1px solid var(--rand);border-radius:8px;background:transparent;font-size:15px;color:var(--text)}
label.feld textarea{min-height:84px;resize:vertical}
.fehlertext{color:var(--fehler);font-size:13px}
dialog{border:0;border-radius:24px;padding:24px;background:var(--flaeche);color:var(--text);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-size:22px;font-weight:500;margin-bottom:12px}
dialog h3{font-size:13px;color:var(--primaer);margin:14px 0 8px}
.dialog-knoepfe{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.auswahl{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;border-radius:8px}
.auswahl:hover{background:var(--flaeche2)}
.vorlage{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:8px;cursor:pointer}
.vorlage:hover{background:var(--flaeche2)}
.leer{text-align:center;padding:40px 16px;color:var(--leise)}
.leer b{display:block;color:var(--text);font-size:16px;margin:10px 0 4px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;background:#2E3135;color:#EFF0F7;padding:12px 18px;border-radius:8px;max-width:calc(100vw - 32px);box-shadow:0 3px 10px rgba(0,0,0,.3)}
#sync{font-size:12px;padding:4px 10px;border-radius:999px;border:0;cursor:pointer}
.abschnitt{font-size:14px;color:var(--primaer);margin:16px 0 6px}
.termin{display:flex;align-items:center;gap:6px}
.termin input{width:20px;height:20px;flex:none}
.termin-symbol{width:20px;text-align:center;flex:none}
.positionen{width:100%;border-collapse:collapse;margin:6px 0}.positionen th{text-align:left;font-size:12px;color:var(--leise);padding:2px 4px}
.positionen td{padding:2px 4px}.positionen input{width:100%;padding:6px;border:1px solid var(--rand);border-radius:6px;background:transparent;color:inherit}
.positionen td:nth-child(3){width:70px}.positionen td:nth-child(4){width:110px}.positionen td:nth-child(5){width:36px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <button class="symbol" id="zurueck" aria-label="Zurück" hidden>←</button>
  <button id="app-titel" title="Zur Übersicht">Ayse CRM</button>
  <div id="suche-global" role="search"><input id="globale-suche" type="search" placeholder="Suchen: Firma, Fall, Tour, Mitarbeiter, Fahrzeug … (Strg+K)" aria-label="Alles durchsuchen" autocomplete="off"><div id="suchtreffer" hidden></div></div>
  <button class="symbol" id="suche-knopf" aria-label="Suchen">🔍</button>
  <button class="knopf voll" id="neu-knopf" aria-label="Neu anlegen">＋<span class="lang">&nbsp;Neu</span></button>
  <button id="sync" class="grau" title="Jetzt abgleichen"></button>
  <button class="symbol" id="einstellungen-knopf" aria-label="Einstellungen">⚙</button>
</header>
<nav id="navi" aria-label="Bereiche"></nav>
<main>
  <section id="liste" aria-label="Liste"></section>
  <section id="detail" aria-label="Ansicht"></section>
</main>
<dialog id="dialog"></dialog>
<div id="toast" role="status" hidden></div>

<script>
'use strict';
// ============================== Grundlagen ==============================
const $ = (auswahl, wurzel = document) => wurzel.querySelector(auswahl);
const esc = t => String(t ?? '').replace(/[&<>"']/g, z => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[z]));
const pad = n => String(n).padStart(2, '0');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));

const STATUS = {
  NEU: { label: 'Neu', offen: true, farbe: 'blau' },
  IN_PRUEFUNG: { label: 'In Prüfung', offen: true, farbe: 'violett' },
  WARTET_AUF_RUECKMELDUNG: { label: 'Wartet auf Rückmeldung', offen: true, farbe: 'gelb' },
  BEI_VERSICHERUNG: { label: 'Bei Versicherung', offen: true, farbe: 'lila' },
  VERGLEICH_ANGEBOTEN: { label: 'Vergleich angeboten', offen: true, farbe: 'tuerkis' },
  ZAHLUNG_OFFEN: { label: 'Zahlung offen', offen: true, farbe: 'orange' },
  ERLEDIGT: { label: 'Erledigt', offen: false, farbe: 'gruen' },
  ABGELEHNT: { label: 'Abgelehnt', offen: false, farbe: 'grau' },
};
const SCHADENSART = { WARE: 'Beschädigung der Ware', GEBAEUDE: 'Schaden an Gebäude / Einrichtung', VERLUST: 'Verlust / Fehlmenge',
  VERZUG: 'Lieferverzug', FAHRZEUG: 'Fahrzeug- / Verkehrsschaden', SONSTIGES: 'Sonstiges' };
const PARTNER = { ANSPRUCHSTELLER: 'Geschädigter', AUFTRAGGEBER: 'Auftraggeber', VERSICHERUNG: 'Versicherung', FAHRER: 'Fahrer',
  GUTACHTER: 'Gutachter / Werkstatt', INTERN: 'Intern' };
const VERLAUF = { ANGELEGT: ['Fall angelegt', '🚚'], NOTIZ: ['Notiz', '✎'], ANRUF: ['Telefonat', '☎'], EMAIL: ['E-Mail', '✉'], EMAIL_EINGANG: ['E-Mail erhalten', '📨'], EMAIL_AUSGANG: ['E-Mail gesendet', '📤'], NACHRICHT: ['Nachricht', '💬'],
  BRIEF: ['Schreiben', '📄'], STATUS: ['Statusänderung', '⚑'], WIEDERVORLAGE: ['Wiedervorlage', '⏱'], ANLAGE: ['Anlage', '📎'] };
const status = f => STATUS[f.status] || STATUS.NEU;

// ---------- Datum ----------
const isoTag = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const heute = () => isoTag(new Date());
const alsTag = iso => { const [j, m, t] = iso.split('-').map(Number); return new Date(j, m - 1, t); };
const plusTage = (iso, n) => { const d = alsTag(iso); d.setDate(d.getDate() + n); return isoTag(d); };
const tageBis = iso => Math.round((alsTag(iso) - alsTag(heute())) / 86400000);
const datumText = iso => (iso ? iso.split('-').reverse().join('.') : '');
const datumMitTag = iso => ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'][alsTag(iso).getDay()] + ', ' + datumText(iso);
const zeitText = iso => { const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const jetztIso = () => new Date().toISOString();

// ---------- Fachlogik (entspricht der Android-App) ----------
function faelligkeit(f) {
  if (!status(f).offen || !f.wiedervorlageAm) return { art: 'keine', faellig: false, farbe: 'grau', text: 'Keine Wiedervorlage' };
  const t = tageBis(f.wiedervorlageAm);
  if (t < 0) return { art: 'ueber', faellig: true, farbe: 'rot', text: t === -1 ? 'seit gestern überfällig' : `seit ${-t} Tagen überfällig` };
  if (t === 0) return { art: 'heute', faellig: true, farbe: 'gelb', text: 'heute fällig' };
  return { art: 'kommend', faellig: false, farbe: 'grau', tage: t, text: t === 1 ? 'morgen fällig' : `in ${t} Tagen fällig` };
}
const geld = cent => (cent / 100).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const geldOhneSymbol = cent => (cent / 100).toFixed(2).replace('.', ',');
/** Liest „1.234,56“, „1,234.56“ oder „450 €“; gibt Cent zurück oder null bei ungültiger Eingabe. */
function geldLesen(eingabe) {
  const roh = String(eingabe).replace(/€|EUR/gi, '').replace(/[\s ]/g, '');
  if (!roh || !/^[\d.,]+$/.test(roh)) return null;
  const punkt = roh.lastIndexOf('.'), komma = roh.lastIndexOf(',');
  let zahl;
  if (punkt >= 0 && komma >= 0) zahl = komma > punkt ? roh.replace(/\./g, '').replace(',', '.') : roh.replace(/,/g, '');
  else if (komma >= 0) { if (roh.split(',').length > 2) return null; zahl = roh.replace(',', '.'); }
  else if (punkt >= 0) {
    const gruppen = roh.split('.');
    const tausender = gruppen.slice(1).every(g => g.length === 3) && gruppen[0].length >= 1 && gruppen[0].length <= 3;
    if (tausender) zahl = roh.replace(/\./g, ''); else if (gruppen.length === 2) zahl = roh; else return null;
  } else zahl = roh;
  if (!/^\d*(\.\d{0,2})?$/.test(zahl) || zahl === '' || zahl === '.') return null;
  const [ganz, bruch = ''] = zahl.split('.');
  const cent = Number(ganz || '0') * 100 + Number((bruch + '00').slice(0, 2));
  return Number.isSafeInteger(cent) ? cent : null;
}
function naechsteFallnummer(faelle, jahr = new Date().getFullYear()) {
  const praefix = jahr + '-';
  const hoechste = Math.max(0, ...faelle.filter(f => !f.geloescht && String(f.fallnummer).startsWith(praefix))
    .map(f => Number(f.fallnummer.slice(praefix.length))).filter(Number.isInteger));
  return praefix + String(hoechste + 1).padStart(3, '0');
}
/** „Ali Kaya, Ben Ott“ – oder leer, wenn kein Beifahrer eingetragen ist. */
const beifahrer = f => [f.beifahrer1, f.beifahrer2].map(b => (b || '').trim()).filter(Boolean).join(', ');
const anzeigeName = f => (f.kundeName && f.kundeFirma ? `${f.kundeName} · ${f.kundeFirma}` : f.kundeName || f.kundeFirma || `Fall ${f.fallnummer}`);

const FILTER = { FAELLIG: 'Fällig', OFFEN: 'Offen', ABGESCHLOSSEN: 'Abgeschlossen', ALLE: 'Alle' };
function filtereUndSortiere(faelle, filter, suchtext) {
  const begriffe = suchtext.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const passt = f => {
    const heu = [f.fallnummer, f.kundeName, f.kundeFirma, f.kundeTelefon, f.kundeEmail, f.kundenAktenzeichen, f.auftraggeber, f.auftraggeberKontakt, f.auftraggeberTelefon, f.auftraggeberEmail, f.auftraggeberZeichen, f.auftragsReferenz,
      f.tour, f.fahrzeug, f.fahrer, f.beifahrer1, f.beifahrer2, f.schadensort, f.beschreibung, f.versicherungsNummer, status(f).label].join('\n').toLowerCase();
    return begriffe.every(b => heu.includes(b));
  };
  const rang = f => [status(f).offen ? 0 : 1, status(f).offen && f.wiedervorlageAm ? 0 : 1, status(f).offen ? f.wiedervorlageAm || '' : ''];
  return faelle
    .filter(f => ({ FAELLIG: faelligkeit(f).faellig, OFFEN: status(f).offen, ABGESCHLOSSEN: !status(f).offen, ALLE: true }[filter]))
    .filter(passt)
    .sort((a, b) => {
      const ra = rang(a), rb = rang(b);
      return ra[0] - rb[0] || ra[1] - rb[1] || ra[2].localeCompare(rb[2]) || String(b.geaendertAm).localeCompare(String(a.geaendertAm));
    });
}
function kennzahlen(faelle) {
  const offene = faelle.filter(f => status(f).offen);
  return { faellig: offene.filter(f => faelligkeit(f).faellig).length, offen: offene.length, forderung: offene.reduce((s, f) => s + (f.forderungCent || 0), 0) };
}

/** An wen sich eine Nachricht richtet; jeder bekommt nur die Angaben, die ihn betreffen. */
const EMPFAENGER = {
  GESCHAEDIGTER: { label: 'Geschädigter', ueberschrift: 'An den Geschädigten', email: f => (f.kundeEmail || '').trim(), telefon: f => (f.kundeTelefon || '').trim(), name: f => f.kundeName },
  AUFTRAGGEBER: { label: 'Auftraggeber', ueberschrift: 'An den Auftraggeber', email: f => (f.auftraggeberEmail || '').trim(), telefon: f => (f.auftraggeberTelefon || '').trim(), name: f => f.auftraggeberKontakt },
  DRITTE: { label: 'Versicherung / Dritte', ueberschrift: 'An Versicherung oder Dritte', email: () => '', telefon: () => '', name: () => '' },
};
const VORLAGEN = {
  EINGANGSBESTAETIGUNG: ['Eingangsbestätigung', 'Bestätigt nur den Eingang der Meldung', 'GESCHAEDIGTER'],
  UNTERLAGEN_ANFORDERN: ['Unterlagen anfordern', 'Fotos, Kaufbeleg und Lieferschein nachfordern', 'GESCHAEDIGTER'],
  ERINNERUNG: ['Erinnerung', 'Nachhaken, wenn eine Rückmeldung aussteht', 'GESCHAEDIGTER'],
  ZWISCHENBESCHEID: ['Zwischenbescheid', 'Mitteilen, dass die Prüfung noch läuft', 'GESCHAEDIGTER'],
  SCHADENSMITTEILUNG: ['Schadensmitteilung', 'Auftraggeber über den gemeldeten Schaden informieren', 'AUFTRAGGEBER'],
  AUFTRAGSUNTERLAGEN: ['Auftragsunterlagen anfordern', 'Lieferschein und Angaben zur Ware erbitten', 'AUFTRAGGEBER'],
  SACHSTAND_AUFTRAGGEBER: ['Sachstand mitteilen', 'Auftraggeber über den Stand informieren', 'AUFTRAGGEBER'],
  ABSCHLUSS_AUFTRAGGEBER: ['Abschluss mitteilen', 'Auftraggeber über den Abschluss informieren', 'AUFTRAGGEBER'],
  SACHSTANDSANFRAGE: ['Sachstandsanfrage', 'Stand bei der Versicherung erfragen', 'DRITTE'],
};
/**
 * Kurze, haftungsneutrale Nachrichten – Wortlaut identisch zur Android-App. Der Auftraggeber erfährt
 * Name des Geschädigten und Art des Schadens, aber keine Kontaktdaten und keine Forderung.
 */
function vorlageText(art, f, absender) {
  const [titel, , empfaenger] = VORLAGEN[art];
  const vorfall = f.schadensdatum ? `zum Vorfall vom ${datumText(f.schadensdatum)}` : 'zu dem gemeldeten Vorfall';
  const frist = datumText(plusTage(heute(), 14));
  const auftragsBezug = [f.auftragsReferenz && 'Auftrag: ' + f.auftragsReferenz.trim(), f.schadensdatum && 'Lieferung vom: ' + datumText(f.schadensdatum),
    (f.kundeName || f.kundeFirma) && 'Empfänger der Lieferung: ' + [f.kundeName, f.kundeFirma].filter(Boolean).join(', '),
    'Schadensart: ' + (SCHADENSART[f.schadensart] || SCHADENSART.SONSTIGES), f.beschreibung && f.beschreibung.trim() && 'Gemeldeter Schaden: ' + f.beschreibung.trim()].filter(Boolean).join('\n');
  const absaetze = {
    EINGANGSBESTAETIGUNG: [`wir bestätigen den Eingang Ihrer Schadensmeldung ${vorfall}.`,
      'Wir prüfen den Sachverhalt und melden uns unaufgefordert bei Ihnen, sobald die Prüfung abgeschlossen ist.',
      'Diese Nachricht bestätigt ausschließlich den Eingang Ihrer Meldung. Eine Aussage zur Haftung ist damit nicht verbunden.'],
    UNTERLAGEN_ANFORDERN: [`für die weitere Prüfung Ihrer Schadensmeldung ${vorfall} benötigen wir noch folgende Unterlagen:`,
      '– Fotos des Schadens (Gesamtansicht und Detailaufnahmen)\n– Kaufbeleg oder Rechnung\n– Lieferschein, gegebenenfalls mit Schadensvermerk',
      `Bitte senden Sie uns die Unterlagen bis zum ${frist} zu. Sobald sie vorliegen, setzen wir die Prüfung fort.`],
    ERINNERUNG: [`wir kommen zurück auf unsere Nachricht ${vorfall}. Bislang liegt uns dazu keine Rückmeldung vor.`,
      `Bitte melden Sie sich bis zum ${frist} bei uns, damit wir den Vorgang weiter bearbeiten können.`],
    ZWISCHENBESCHEID: [`die Prüfung Ihrer Schadensmeldung ${vorfall} dauert noch an.`,
      `Wir melden uns voraussichtlich bis zum ${frist} wieder bei Ihnen. Sollten sich in der Zwischenzeit neue Informationen ergeben, teilen Sie uns diese gern mit.`],
    SCHADENSMITTEILUNG: ['wir möchten Sie darüber informieren, dass uns zu einer Lieferung aus Ihrem Auftrag eine Schadensmeldung vorliegt:', auftragsBezug,
      'Wir prüfen den Sachverhalt und halten Sie über den weiteren Verlauf auf dem Laufenden. Eine Aussage zur Haftung ist mit dieser Mitteilung nicht verbunden.'],
    AUFTRAGSUNTERLAGEN: ['für die Prüfung des folgenden Schadensfalls aus Ihrem Auftrag bitten wir um Unterstützung:', auftragsBezug,
      'Bitte senden Sie uns, soweit vorhanden:\n– Lieferschein bzw. Auftragsbestätigung\n– Angaben zur gelieferten Ware (Artikel, Zustand bei Übergabe an uns)\n– Hinweise, die Ihnen der Kunde zu dem Schaden gegeben hat',
      `Für eine Rückmeldung bis zum ${frist} wären wir dankbar.`],
    SACHSTAND_AUFTRAGGEBER: ['zum folgenden Schadensfall aus Ihrem Auftrag möchten wir Sie über den aktuellen Stand informieren:', auftragsBezug,
      `Stand der Bearbeitung: ${status(f).label}.`, 'Wir melden uns, sobald es Neuigkeiten gibt.'],
    ABSCHLUSS_AUFTRAGGEBER: ['der folgende Schadensfall aus Ihrem Auftrag ist abgeschlossen:', auftragsBezug,
      `Stand: ${status(f).label}. Von unserer Seite sind keine weiteren Schritte erforderlich.`, 'Vielen Dank für Ihre Unterstützung.'],
    SACHSTANDSANFRAGE: ['wir bitten um Mitteilung des aktuellen Bearbeitungsstands zu folgendem Schadensfall:',
      [(f.kundeName || f.kundeFirma) && 'Geschädigter: ' + [f.kundeName, f.kundeFirma].filter(Boolean).join(', '),
        f.schadensdatum && 'Schadensdatum: ' + datumText(f.schadensdatum), f.versicherungsNummer && 'Schadennummer: ' + f.versicherungsNummer.trim(),
        f.auftragsReferenz && 'Auftrag: ' + f.auftragsReferenz.trim(), f.tour && 'Tour: ' + f.tour.trim()].filter(Boolean).join('\n') || 'Vorgang ' + f.fallnummer,
      `Für eine Rückmeldung bis zum ${frist} wären wir dankbar.`],
  }[art];
  const ansprechpartner = (EMPFAENGER[empfaenger].name(f) || '').trim();
  const anrede = ansprechpartner ? `Guten Tag ${ansprechpartner},` : 'Sehr geehrte Damen und Herren,';
  let gruss = 'Mit freundlichen Grüßen';
  if (absender.bearbeiter) gruss += '\n\ni.A. ' + absender.bearbeiter.trim();
  if (absender.funktion) gruss += '\n' + absender.funktion.trim();
  if (absender.firma) gruss += '\n' + absender.firma.trim();

  const vom = d => (d ? ' vom ' + datumText(d) : '');
  const was = { GESCHAEDIGTER: 'Ihre Schadensmeldung' + vom(f.meldedatum || f.schadensdatum), AUFTRAGGEBER: 'Schadensfall' + vom(f.schadensdatum),
    DRITTE: 'Sachstandsanfrage Schadensfall' + vom(f.schadensdatum) }[empfaenger];
  const zeichen = { GESCHAEDIGTER: f.kundenAktenzeichen && 'Ihr Zeichen ' + f.kundenAktenzeichen.trim(), AUFTRAGGEBER: f.auftragsReferenz && 'Ihr Auftrag ' + f.auftragsReferenz.trim(),
    DRITTE: (f.versicherungsNummer || f.kundenAktenzeichen) && 'Ihr Zeichen ' + (f.versicherungsNummer || f.kundenAktenzeichen).trim() }[empfaenger];
  const betreff = [was, art === 'SACHSTANDSANFRAGE' ? '' : titel, zeichenDesAuftraggebers(empfaenger, f), zeichen, f.fallnummer && 'unser Vorgang ' + f.fallnummer].filter(Boolean).join(' – ');
  return { betreff, text: anrede + '\n\n' + absaetze.join('\n\n') + '\n\n' + gruss, empfaenger };
}
/** Das Zeichen des Auftraggebers steht in jedem Betreff: für ihn als „Ihr Zeichen“, für alle anderen als „Bezug“. */
function zeichenDesAuftraggebers(empfaenger, f) {
  const z = (f.auftraggeberZeichen || '').trim();
  return z ? (empfaenger === 'AUFTRAGGEBER' ? 'Ihr Zeichen ' : 'Bezug ') + z : '';
}
/** Ergänzt das Zeichen (etwa in einer Antwort), falls es fehlt – vor der Fallnummer. */
function mitZeichen(betreff, empfaenger, f) {
  const zusatz = zeichenDesAuftraggebers(empfaenger, f);
  if (!zusatz || betreff.includes(f.auftraggeberZeichen.trim())) return betreff;
  const i = betreff.indexOf(' [Fall ');
  return i < 0 ? `${betreff.trimEnd()} – ${zusatz}` : `${betreff.slice(0, i)} – ${zusatz}${betreff.slice(i)}`;
}

/**
 * Bearbeitungsschritte für den Auftraggeber („E-Mail an den Geschädigten gesendet“, „Telefonat: …“) –
 * gleiche Regeln wie in der Android-App: keine Adressen, keine Wiedervorlagen.
 */
const SCHRITT_ARTEN = ['ANRUF', 'EMAIL_AUSGANG', 'EMAIL_EINGANG', 'EMAIL', 'NACHRICHT', 'BRIEF', 'STATUS', 'NOTIZ', 'ANLAGE'];
const SCHRITTE_VORAUSGEWAEHLT = SCHRITT_ARTEN.filter(t => t !== 'NOTIZ' && t !== 'ANLAGE');
const SCHRITTE_SCHLUSS = 'Wir melden uns, sobald es Neuigkeiten gibt.';
const schritteWaehlbar = verlauf => verlauf.filter(v => SCHRITT_ARTEN.includes(v.typ)).sort((a, b) => String(b.zeitpunkt).localeCompare(String(a.zeitpunkt)));
function mailKopf(text, name) {
  for (const z of String(text).split('\n')) { if (!z.trim()) break; if (z.startsWith(name + ':')) return z.slice(name.length + 1).trim(); }
  return '';
}
function schritteVorauswahl(f, verlauf) {
  const ag = (f.auftraggeberEmail || '').trim().toLowerCase();
  const anAg = ag ? verlauf.filter(v => v.typ === 'EMAIL_AUSGANG' && (mailKopf(v.text, 'An') + ' ' + mailKopf(v.text, 'Bcc')).toLowerCase().includes(ag)).map(v => v.zeitpunkt).sort() : [];
  const letzte = anAg[anAg.length - 1];
  return new Set(verlauf.filter(v => SCHRITTE_VORAUSGEWAEHLT.includes(v.typ) && (!letzte || String(v.zeitpunkt) > letzte)).map(v => v.id));
}
function schrittText(v, f) {
  const enthaelt = (adressen, mail) => !!(mail && mail.trim()) && adressen.toLowerCase().includes(mail.trim().toLowerCase());
  const mitAnlagen = String(v.text).split('\n').some(z => z.startsWith('Anhänge')) ? ' (mit Anlagen)' : '';
  if (v.typ === 'EMAIL_AUSGANG') {
    const an = mailKopf(v.text, 'An');
    return `E-Mail ${enthaelt(an, f.auftraggeberEmail) ? 'an Sie' : enthaelt(an, f.kundeEmail) ? 'an den Geschädigten' : 'an Dritte'} gesendet${mitAnlagen}`;
  }
  if (v.typ === 'EMAIL_EINGANG') {
    const von = mailKopf(v.text, 'Von');
    return `${enthaelt(von, f.auftraggeberEmail) ? 'Ihre E-Mail' : enthaelt(von, f.kundeEmail) ? 'E-Mail des Geschädigten' : 'E-Mail von Dritten'} erhalten${mitAnlagen}`;
  }
  if (v.typ === 'STATUS') return String(v.text).split('\n')[0].trim();
  let inhalt = String(v.text).split('\n').map(z => z.trim()).filter(z => z && !z.startsWith('Wiedervorlage am') && z !== 'Keine Wiedervorlage geplant').join(' ');
  if (inhalt.length > 300) inhalt = inhalt.slice(0, 299).trimEnd() + '…';
  if (v.typ === 'ANRUF' && (!inhalt || inhalt === 'Nachgehakt')) return 'Telefonat geführt';
  if (v.typ === 'ANLAGE') return inhalt || 'Anlage hinzugefügt';
  const label = (VERLAUF[v.typ] || VERLAUF.NOTIZ)[0];
  return !inhalt || inhalt === 'Nachgehakt' ? `${label}: nachgehakt` : `${label}: ${inhalt}`;
}
const schritteAlsText = (eintraege, f) => 'Bisherige Bearbeitung:\n' + [...eintraege].sort((a, b) => String(a.zeitpunkt).localeCompare(String(b.zeitpunkt)))
  .map(v => `– ${datumText(isoTag(new Date(v.zeitpunkt)))}: ${schrittText(v, f)}`).join('\n');
function schritteEinfuegen(text, absatz) {
  let i = text.indexOf(SCHRITTE_SCHLUSS);
  if (i < 0) i = text.lastIndexOf('Mit freundlichen Grüßen');
  return i < 0 ? text.trimEnd() + '\n\n' + absatz : text.slice(0, i).trimEnd() + '\n\n' + absatz + '\n\n' + text.slice(i);
}

function zusammenfassung(f, anlagenAnzahl) {
  const oder = t => (t && String(t).trim()) || 'unbekannt';
  const besatzung = [f.fahrer && 'Fahrer: ' + f.fahrer.trim(), beifahrer(f) && 'Beifahrer: ' + beifahrer(f)].filter(Boolean).join(', ');
  const tour = [f.tour, f.fahrzeug].filter(Boolean).join(' / ') + (besatzung ? (f.tour || f.fahrzeug ? ' ' : '') + `(${besatzung})` : '');
  const auftrag = [f.auftraggeber, f.auftragsReferenz].filter(Boolean).join(' · ');
  const z = [`Schadensfall ${f.fallnummer}`, `Status: ${status(f).label}`, `Geschädigter: ${oder([f.kundeName, f.kundeFirma].filter(Boolean).join(', '))}`,
    `Kontakt Geschädigter: ${oder([f.kundeTelefon, f.kundeEmail].filter(Boolean).join(' · '))}`];
  if (f.kundenAktenzeichen) z.push(`Zeichen des Geschädigten: ${f.kundenAktenzeichen.trim()}`);
  z.push(`Schadensdatum: ${f.schadensdatum ? datumText(f.schadensdatum) : 'unbekannt'}`, `Tour/Fahrzeug: ${oder(tour)}`);
  if (auftrag) z.push(`Auftraggeber/Auftrag: ${auftrag}`);
  const agKontakt = [f.auftraggeberKontakt, f.auftraggeberTelefon, f.auftraggeberEmail].filter(Boolean).join(' · ');
  if (agKontakt) z.push(`Kontakt Auftraggeber: ${agKontakt}`);
  if (f.auftraggeberZeichen) z.push(`Zeichen des Auftraggebers: ${f.auftraggeberZeichen.trim()}`);
  if (f.schadensort) z.push(`Schadensort: ${f.schadensort.trim()}`);
  z.push(`Schaden: ${SCHADENSART[f.schadensart] || SCHADENSART.SONSTIGES} – ${oder(f.beschreibung)}`, `Schadenshöhe: ${f.forderungCent != null ? geld(f.forderungCent) : 'unbekannt'}`);
  if (f.vergleichCent != null) z.push(`Vergleich/Regulierung: ${geld(f.vergleichCent)}`);
  if (f.zahlungsfrist) z.push(`Zahlungsfrist: ${datumText(f.zahlungsfrist)}`);
  if (f.versicherungsNummer) z.push(`Schadennummer Versicherung: ${f.versicherungsNummer.trim()}`);
  z.push(`Anlagen: ${anlagenAnzahl}`);
  if (status(f).offen && f.wiedervorlageAm) z.push(`Wiedervorlage: ${datumText(f.wiedervorlageAm)}` + (f.wartetAuf ? ` (wartet auf ${PARTNER[f.wartetAuf]})` : '') + (f.wiedervorlageNotiz ? ` – ${f.wiedervorlageNotiz.trim()}` : ''));
  return z.join('\n');
}
const CSV_KOPF = ['Fall-Nr.', 'Status', 'Tour', 'Fahrzeug', 'Fahrer', 'Beifahrer 1', 'Beifahrer 2', 'Schadensdatum', 'Gemeldet am', 'Geschädigter', 'Firma Geschädigter', 'Telefon Geschädigter', 'E-Mail Geschädigter', 'Anschrift Geschädigter', 'Zeichen des Geschädigten',
  'Auftraggeber', 'Ansprechpartner Auftraggeber', 'Telefon Auftraggeber', 'E-Mail Auftraggeber', 'Zeichen Auftraggeber', 'Auftrags-Nr.', 'Schadensart', 'Schadensbeschreibung', 'Schadensort', 'Forderung (EUR)', 'Vergleich (EUR)', 'Zahlungsfrist', 'Schadennr. Versicherung',
  'Wartet auf', 'Wiedervorlage', 'Nächster Schritt', 'Anlagen', 'Angelegt am', 'Geändert am'];
function csvZelle(wert) {
  wert = String(wert ?? '');
  const formel = /^[=@\t\r]/.test(wert) || (/^[+-]/.test(wert) && /[^\d /().,-]/.test(wert.slice(1)));
  if (formel) wert = "'" + wert;
  return /[;"\n\r]/.test(wert) ? '"' + wert.replace(/"/g, '""') + '"' : wert;
}
function csvErstellen(faelle, anlagenJeFall) {
  const tagVon = iso => (iso ? datumText(isoTag(new Date(iso))) : '');
  const zeilen = [...faelle].sort((a, b) => String(a.fallnummer).localeCompare(String(b.fallnummer))).map(f => [f.fallnummer, status(f).label, f.tour, f.fahrzeug, f.fahrer, f.beifahrer1, f.beifahrer2,
    datumText(f.schadensdatum), datumText(f.meldedatum), f.kundeName, f.kundeFirma, f.kundeTelefon, f.kundeEmail, f.kundeAnschrift, f.kundenAktenzeichen, f.auftraggeber,
    f.auftraggeberKontakt, f.auftraggeberTelefon, f.auftraggeberEmail, f.auftraggeberZeichen, f.auftragsReferenz, SCHADENSART[f.schadensart] || '', f.beschreibung, f.schadensort, f.forderungCent != null ? geldOhneSymbol(f.forderungCent) : '',
    f.vergleichCent != null ? geldOhneSymbol(f.vergleichCent) : '', datumText(f.zahlungsfrist), f.versicherungsNummer, f.wartetAuf ? PARTNER[f.wartetAuf] : '',
    datumText(f.wiedervorlageAm), f.wiedervorlageNotiz, anlagenJeFall[f.id] || 0, tagVon(f.erstelltAm), tagVon(f.geaendertAm)]);
  return '﻿' + [CSV_KOPF, ...zeilen].map(z => z.map(csvZelle).join(';')).join('\r\n') + '\r\n';
}

// ============================== Daten im Browser ==============================
const SPEICHER = 'schadensfaelle-v1', PIN_SPEICHER = 'schadensfaelle-pin';
const CRM_TABELLEN = ['adressen', 'ansprechpartner', 'preise', 'aktivitaeten', 'aufgaben', 'dokumente', 'chancen', 'belege', 'fahrzeuge', 'fahrzeugeintraege',
  'mitarbeiter', 'personaleintraege', 'abwesenheiten', 'einsatzarten', 'touren'];
const LEER = () => ({ faelle: {}, verlauf: {}, anlagen: {}, auftraggeber: {}, ...Object.fromEntries(CRM_TABELLEN.map(t => [t, {}])), seit: 0, kennung: '', apiUrl: '', nurLokal: false,
  einstellungen: { firma: '', bearbeiter: '', funktion: '', wiedervorlageTage: 7 } });
let S = LEER();
try { S = Object.assign(LEER(), JSON.parse(localStorage.getItem(SPEICHER) || '{}')); } catch { /* beschädigter Stand: neu beginnen, die Cloud liefert nach */ }
let PIN = ''; try { PIN = localStorage.getItem(PIN_SPEICHER) || ''; } catch {}
const apiUrl = () => S.apiUrl || window.API_URL; // eine auf dem Gerät eingetragene Adresse geht vor
const mitCloud = () => !!apiUrl() && !S.nurLokal;

function speichere() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(S)); }
  catch { toast('Speichern im Browser fehlgeschlagen – bitte Speicherplatz prüfen.'); }
}
const alle = tabelle => Object.values(S[tabelle]).filter(d => !d.geloescht);
const faelle = () => alle('faelle');
const verlaufVon = id => alle('verlauf').filter(v => v.fallId === id).sort((a, b) => String(b.zeitpunkt).localeCompare(String(a.zeitpunkt)));
const anlagenVon = id => alle('anlagen').filter(a => a.fallId === id).sort((a, b) => String(b.hinzugefuegtAm).localeCompare(String(a.hinzugefuegtAm)));

/** Merkt einen geänderten Datensatz zum Hochladen vor. */
function merke(tabelle, d) { d._dirty = true; d._n = (d._n || 0) + 1; S[tabelle][d.id] = d; return d; }
/** Löscht lokal; mit Cloud bleibt ein Löschvermerk, bis der Server ihn bestätigt hat. */
function entferne(tabelle, d, extra = {}) {
  if (mitCloud()) merke(tabelle, { id: d.id, geloescht: true, _n: d._n, ...extra }); else delete S[tabelle][d.id];
}
const vermerke = (fallId, typ, text) => merke('verlauf', { id: uuid(), fallId, zeitpunkt: jetztIso(), typ, text });
const wvText = (datum, wartetAuf, schritt) => (!datum ? 'Keine Wiedervorlage geplant'
  : `Wiedervorlage am ${datumText(datum)}` + (wartetAuf ? ` · wartet auf ${PARTNER[wartetAuf]}` : '') + (schritt && schritt.trim() ? ` · ${schritt.trim()}` : ''));
function fallMerken(f) {
  if (!status(f).offen) Object.assign(f, { wiedervorlageAm: null, wartetAuf: null, wiedervorlageNotiz: '' }); // abgeschlossen: keine Wiedervorlage mehr
  f.geaendertAm = jetztIso();
  return merke('faelle', f);
}
function nachAenderung() { speichere(); zeichne(); planeAbgleich(); }

/**
 * Mail-Texte in Kontakthistorie und Fallverlauf werden gekürzt: Alles wandert bei jedem Abgleich durch
 * die eine Cloud-Datei – volle Mails (mit zitiertem Verlauf) machen den Abgleich sehr langsam.
 * Die vollständige Mail bleibt im Postfach.
 */
const MAIL_TEXT_FIRMA = 2000, MAIL_TEXT_FALL = 6000;
const GEKUERZT = '\n… (gekürzt – vollständig im Postfach)';
const kuerze = (text, max) => (text.length <= max ? text : text.slice(0, max - GEKUERZT.length) + GEKUERZT);
/** Einmalig: bereits gespeicherte, sehr lange Mail-Einträge kürzen (verkleinert die Cloud-Datei). */
function langeMailsKuerzen() {
  let geaendert = 0;
  for (const a of Object.values(S.aktivitaeten || {})) {
    if (a.geloescht || a.art !== 'EMAIL' || !a.text || a.text.length <= MAIL_TEXT_FIRMA) continue;
    merke('aktivitaeten', { ...a, text: kuerze(a.text, MAIL_TEXT_FIRMA), geaendertAm: jetztIso() }); geaendert++;
  }
  for (const v of Object.values(S.verlauf || {})) {
    if (v.geloescht || !/^EMAIL_/.test(v.typ || '') || !v.text || v.text.length <= MAIL_TEXT_FALL) continue;
    merke('verlauf', { ...v, text: kuerze(v.text, MAIL_TEXT_FALL) }); geaendert++;
  }
  return geaendert;
}

const normal = t => String(t || '').trim().toLowerCase().replace(/\s+/g, ' ');
const auftraggeberListe = () => alle('auftraggeber').sort((a, b) => a.name.localeCompare(b.name, 'de', { sensitivity: 'base' }));
const kontakteVon = firmaId => alle('ansprechpartner').filter(k => k.firmaId === firmaId).sort((a, b) => a.name.localeCompare(b.name, 'de', { sensitivity: 'base' }));
/** Bevorzugt der Ansprechpartner für Schäden, sonst der erste. */
const schadenKontakt = firmaId => { const k = kontakteVon(firmaId); return k.find(x => /sch(a|ä)d/i.test(x.thema || '')) || k[0]; };
/** Firma zum Namen (gleiche Regeln wie in der Android-App: ohne Groß-/Kleinschreibung, kleinste Kennung gewinnt). */
const firmaZumNamen = name => alle('auftraggeber').filter(e => normal(e.name) === normal(name)).sort((a, b) => (a.id < b.id ? -1 : 1))[0];
/** Gehört der Fall zur Firma – über den Verweis oder, noch unverknüpft, über den Namen? */
const gehoertZu = (f, firma) => (f.auftraggeberUuid ? f.auftraggeberUuid === firma.id : !!(f.auftraggeber || '').trim() && normal(f.auftraggeber) === normal(firma.name));

/** Ansprechpartner anlegen oder fehlende Telefonnummer/E-Mail ergänzen. */
function kontaktUebernehmen(firmaId, name, telefon, email, thema = 'Schäden') {
  name = (name || '').trim(); telefon = (telefon || '').trim(); email = (email || '').trim();
  if (!name && !telefon && !email) return;
  const liste = kontakteVon(firmaId);
  const k = name ? liste.find(x => normal(x.name) === normal(name)) : email ? liste.find(x => (x.email || '').toLowerCase() === email.toLowerCase())
    : liste.find(x => (x.telefon || '').replace(/\D/g, '') === telefon.replace(/\D/g, ''));
  if (!k) merke('ansprechpartner', { id: uuid(), firmaId, name: name || email || telefon, thema, telefon, email, notiz: '', geaendertAm: jetztIso() });
  else if ((!k.telefon && telefon) || (!k.email && email)) merke('ansprechpartner', { ...k, telefon: k.telefon || telefon, email: k.email || email, geaendertAm: jetztIso() });
}
/** Verbindet einen Fall mit seiner Firma; fehlt sie, wird sie angelegt. */
function firmaVerknuepfen(f) {
  const name = (f.auftraggeber || '').trim();
  if (!name) { f.auftraggeberUuid = ''; return f; }
  let firma = f.auftraggeberUuid && S.auftraggeber[f.auftraggeberUuid] && !S.auftraggeber[f.auftraggeberUuid].geloescht && normal(S.auftraggeber[f.auftraggeberUuid].name) === normal(name)
    ? S.auftraggeber[f.auftraggeberUuid] : firmaZumNamen(name);
  if (!firma) firma = merke('auftraggeber', { id: uuid(), name, rechtsform: '', status: 'AKTIV', telefon: '', email: '', website: '', notizen: '', geaendertAm: jetztIso() });
  kontaktUebernehmen(firma.id, f.auftraggeberKontakt, f.auftraggeberTelefon, f.auftraggeberEmail);
  f.auftraggeberUuid = firma.id;
  return f;
}
function auftraggeberAuswahl() {
  const liste = auftraggeberListe();
  if (!liste.length) return '<p class="leise" style="margin-bottom:8px">Noch keine Firmen im CRM – neue Auftraggeber kommen beim Speichern automatisch dazu.</p>';
  return `<label class="feld">Aus Liste wählen<select id="ag-auswahl"><option value="">– Auftraggeber wählen –</option>${liste.map(e => {
    const k = schadenKontakt(e.id);
    return `<option value="${e.id}">${esc(e.name)}${k ? ' · ' + esc(k.name) : ''}</option>`;
  }).join('')}</select></label>`;
}

const Aktionen = {
  anlegen(entwurf) {
    const jetzt = jetztIso();
    firmaVerknuepfen(entwurf);
    const f = fallMerken({ ...entwurf, id: uuid(), fallnummer: naechsteFallnummer(faelle()), erstelltAm: jetzt });
    vermerke(f.id, 'ANGELEGT', `Fall ${f.fallnummer} angelegt`);
    nachAenderung(); return f.id;
  },
  speichern(id, neu) {
    const alt = S.faelle[id]; if (!alt) return;
    const f = fallMerken(firmaVerknuepfen({ ...alt, ...neu, id, fallnummer: alt.fallnummer, erstelltAm: alt.erstelltAm }));
    if (alt.status !== f.status) vermerke(id, 'STATUS', `Status: ${status(alt).label} → ${status(f).label}`);
    if (status(f).offen && alt.wiedervorlageAm !== f.wiedervorlageAm) vermerke(id, 'WIEDERVORLAGE', wvText(f.wiedervorlageAm, f.wartetAuf, f.wiedervorlageNotiz));
    nachAenderung();
  },
  status(id, neu, notiz) {
    const alt = S.faelle[id]; if (!alt || (alt.status === neu && !notiz.trim())) return;
    const vorher = status(alt).label;
    fallMerken({ ...alt, status: neu });
    vermerke(id, 'STATUS', `Status: ${vorher} → ${STATUS[neu].label}` + (notiz.trim() ? '\n' + notiz.trim() : ''));
    nachAenderung();
  },
  nachhaken(id, kanal, ergebnis, datum, wartetAuf, schritt) {
    const alt = S.faelle[id]; if (!alt) return;
    fallMerken({ ...alt, wiedervorlageAm: datum, wartetAuf, wiedervorlageNotiz: schritt.trim() });
    vermerke(id, kanal, (ergebnis.trim() || 'Nachgehakt') + '\n' + wvText(datum, wartetAuf, schritt));
    nachAenderung(); toast('Im Verlauf vermerkt');
  },
  wiedervorlage(id, datum, wartetAuf, schritt) {
    const alt = S.faelle[id]; if (!alt) return;
    if (alt.wiedervorlageAm === datum && alt.wartetAuf === wartetAuf && alt.wiedervorlageNotiz === schritt.trim()) return;
    const f = fallMerken({ ...alt, wiedervorlageAm: datum, wartetAuf, wiedervorlageNotiz: schritt.trim() });
    vermerke(id, 'WIEDERVORLAGE', wvText(f.wiedervorlageAm, f.wartetAuf, f.wiedervorlageNotiz));
    nachAenderung();
  },
  notiz(id, typ, text) {
    if (!text.trim() || !S.faelle[id]) return;
    vermerke(id, typ, text.trim()); fallMerken({ ...S.faelle[id] }); nachAenderung();
  },
  verlaufLoeschen(v) { entferne('verlauf', v, { fallId: v.fallId }); nachAenderung(); },
  async anlageHinzufuegen(fallId, datei) {
    const a = await legeAnlage(fallId, datei);
    if (!a) return null;
    vermerke(fallId, 'ANLAGE', `Anlage hinzugefügt: ${a.anzeigename}`);
    nachAenderung();
    return a;
  },
  anlageLoeschen(a) {
    entferne('anlagen', a, { fallId: a.fallId }); Dateien.loesche(a.id);
    vermerke(a.fallId, 'ANLAGE', `Anlage entfernt: ${a.anzeigename}`); nachAenderung();
  },
  /** Firma speichern; eine neue Firma mit vorhandenem Namen wird nicht doppelt angelegt. @return Kennung */
  firmaSpeichern(e) {
    const vorhanden = !e.id && firmaZumNamen(e.name);
    if (vorhanden) { nachAenderung(); return vorhanden.id; }
    const alt = e.id && S.auftraggeber[e.id];
    const f = merke('auftraggeber', { ...(alt || {}), ...e, id: e.id || uuid(), name: e.name.trim(), geaendertAm: jetztIso() });
    // Fälle tragen den Namen als Text – bei einer Umbenennung mitziehen.
    if (alt && alt.name !== f.name) for (const fall of faelle().filter(x => x.auftraggeberUuid === f.id)) fallMerken({ ...fall, auftraggeber: f.name });
    nachAenderung(); return f.id;
  },
  /** Löscht die Firma mit allem, was an ihr hängt (die Cloud löscht mit). Fälle bleiben erhalten. */
  firmaLoeschen(e) {
    for (const t of CRM_TABELLEN) for (const x of Object.values(S[t])) if (x.firmaId === e.id) delete S[t][x.id];
    for (const fall of faelle().filter(x => x.auftraggeberUuid === e.id)) S.faelle[fall.id] = { ...fall, auftraggeberUuid: '' };
    entferne('auftraggeber', e, { geaendertAm: jetztIso() }); nachAenderung();
  },
  /** Doppelt angelegte Firma [weg] in [ziel] überführen. */
  firmenZusammenfuehren(weg, ziel) {
    const jetzt = jetztIso();
    for (const t of CRM_TABELLEN) for (const x of alle(t).filter(x => x.firmaId === weg.id)) merke(t, { ...x, firmaId: ziel.id, geaendertAm: jetzt });
    for (const f of faelle().filter(f => gehoertZu(f, weg))) fallMerken({ ...f, auftraggeberUuid: ziel.id, auftraggeber: ziel.name });
    for (const m of Object.values(mails())) if (m.firmaId === weg.id) m.firmaId = ziel.id;
    const w = [...new Map([...schlagwortListe(ziel), ...schlagwortListe(weg)].map(x => [x.toLowerCase(), x])).values()].join(', ');
    merke('auftraggeber', { ...ziel, rechtsform: ziel.rechtsform || weg.rechtsform || '', telefon: ziel.telefon || weg.telefon || '', email: ziel.email || weg.email || '',
      website: ziel.website || weg.website || '', notizen: [ziel.notizen, weg.notizen].filter(Boolean).join('\n\n'), schlagworte: w, geaendertAm: jetzt });
    entferne('auftraggeber', weg, { geaendertAm: jetzt });
    nachAenderung();
  },
  crmSpeichern(tabelle, e) { merke(tabelle, { ...e, id: e.id || uuid(), geaendertAm: jetztIso() }); nachAenderung(); },
  crmLoeschen(tabelle, e) { entferne(tabelle, e, { firmaId: e.firmaId, geaendertAm: jetztIso() }); nachAenderung(); },
  fallLoeschen(id) {
    const f = S.faelle[id]; if (!f) return;
    // Verlauf und Anlagen entfernt der Server zusammen mit dem Fall; lokal verschwinden sie sofort.
    for (const v of Object.values(S.verlauf)) if (v.fallId === id) delete S.verlauf[v.id];
    for (const a of Object.values(S.anlagen)) if (a.fallId === id) { delete S.anlagen[a.id]; Dateien.loesche(a.id); }
    entferne('faelle', f, { geaendertAm: jetztIso() });
    nachAenderung();
  },
};

// ---------- Dateien der Anlagen (IndexedDB) ----------
const Dateien = {
  adressen: new Map(),
  db() {
    return this._db || (this._db = new Promise((ok, fehler) => {
      const r = indexedDB.open('schadensfaelle', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('dateien');
      r.onsuccess = () => ok(r.result); r.onerror = () => fehler(r.error);
    }));
  },
  async tx(modus, fn) {
    const db = await this.db();
    return new Promise((ok, fehler) => { const t = db.transaction('dateien', modus), q = fn(t.objectStore('dateien')); t.oncomplete = () => ok(q && q.result); t.onerror = () => fehler(t.error); });
  },
  lege(id, blob) { return this.tx('readwrite', s => s.put(blob, id)); },
  hole(id) { return this.tx('readonly', s => s.get(id)).catch(() => null); },
  loesche(id) { const u = this.adressen.get(id); if (u) URL.revokeObjectURL(u); this.adressen.delete(id); return this.tx('readwrite', s => s.delete(id)).catch(() => {}); },
  /** Liefert eine anzeigbare Adresse; lädt die Datei bei Bedarf aus der Cloud nach. */
  async adresse(a) {
    if (this.adressen.has(a.id)) return this.adressen.get(a.id);
    let blob = await this.hole(a.id);
    if (!blob && a.vorhanden && mitCloud() && PIN) {
      const r = await api('anlageLaden', PIN, a.id);
      blob = new Blob([Uint8Array.from(atob(r.base64), z => z.charCodeAt(0))], { type: r.mimeType });
      await this.lege(a.id, blob);
    }
    if (!blob) return null;
    const u = URL.createObjectURL(blob); this.adressen.set(a.id, u); return u;
  },
};
/** Große Fotos auf höchstens 2560 Pixel Kantenlänge verkleinern – spart Übertragung und Speicher. */
async function verkleinere(datei) {
  if (!/^image\/(jpeg|png|webp)$/.test(datei.type) || datei.size < 1.5 * 1024 * 1024) return datei;
  try {
    const bild = await createImageBitmap(datei);
    const faktor = Math.min(1, 2560 / Math.max(bild.width, bild.height));
    const c = Object.assign(document.createElement('canvas'), { width: Math.round(bild.width * faktor), height: Math.round(bild.height * faktor) });
    c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
    const klein = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
    return klein && klein.size < datei.size ? klein : datei;
  } catch { return datei; }
}

// Wie bei Tagesdispo: POST als Text (keine CORS-Vorabfrage), Antwort {ok} oder {error}.
async function api(fn, ...args) {
  const r = await fetch(apiUrl(), { method: 'POST', body: JSON.stringify({ fn, args }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j.ok;
}
const TABELLEN = ['faelle', 'verlauf', 'anlagen', 'auftraggeber', ...CRM_TABELLEN];
const CLOUD_API = 7;
const VERALTET = 'Das Cloud-Skript ist veraltet – bitte die neue Code.gs bereitstellen.';
const offeneAnzahl = () => TABELLEN.reduce((n, t) => n + offene(t).length, 0);
const SYNC = { laeuft: false, nochmal: false, fehler: '', zuletzt: 0, timer: 0 };
const ohneLokales = d => Object.fromEntries(Object.entries(d).filter(([k]) => !k.startsWith('_')));
/** Vergleich unabhängig von der Reihenfolge der Felder (die Cloud liefert sie in ihrer eigenen Reihenfolge). */
const gleicherStand = (a, b) => JSON.stringify(Object.keys(a).sort().map(k => [k, a[k]])) === JSON.stringify(Object.keys(b).sort().map(k => [k, b[k]]));
const offene = tabelle => Object.values(S[tabelle]).filter(d => d._dirty);

function planeAbgleich(ms = 1200) { if (!mitCloud()) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(abgleich, ms); zeichneSync(); }

async function abgleich() {
  if (!mitCloud()) return;
  if (!PIN) { anmeldung(); return; }
  if (SYNC.laeuft) { SYNC.nochmal = true; return; }
  SYNC.laeuft = true; SYNC.nochmal = false; zeichneSync();
  try {
    // Ein veraltetes Cloud-Skript würde unbekannte Felder verwerfen – dann lieber gar nicht abgleichen.
    // Jeder Aufruf beim Cloud-Skript kostet Sekunden – die Version genügt einmal pro Stunde.
    if (!(SYNC.versionOk && SYNC.versionOk.url === apiUrl() && Date.now() - SYNC.versionOk.zeit < 3600000)) {
      const st = await api('status');
      if (!(st.api >= CLOUD_API)) { SYNC.versionOk = null; throw new Error(VERALTET); }
      SYNC.versionOk = { url: apiUrl(), zeit: Date.now() };
    }
    const gesendet = Object.fromEntries(TABELLEN.map(t => [t, offene(t)]));
    const marken = new Map(Object.values(gesendet).flat().map(d => [d.id, d._n]));
    const r = await api('sync', PIN, { seit: S.seit, kennung: S.kennung, ...Object.fromEntries(TABELLEN.map(t => [t, gesendet[t].map(ohneLokales)])) });

    let neuesVomServer = false;
    for (const tabelle of TABELLEN) {
      // Gesendetes gilt als angekommen, sofern es seit dem Absenden nicht erneut geändert wurde.
      for (const d of gesendet[tabelle]) {
        const lokal = S[tabelle][d.id];
        if (!lokal || lokal._n !== marken.get(d.id)) continue;
        if (lokal.geloescht) delete S[tabelle][d.id]; else lokal._dirty = false;
      }
      for (const fern of r[tabelle] || []) {
        const lokal = S[tabelle][fern.id];
        if (lokal && lokal._dirty) continue; // inzwischen lokal geändert – geht beim nächsten Abgleich hoch
        if (fern.geloescht) {
          if (lokal) { neuesVomServer = true; delete S[tabelle][fern.id]; if (tabelle === 'anlagen') Dateien.loesche(fern.id); }
          if (tabelle === 'auftraggeber') for (const t of CRM_TABELLEN) for (const x of Object.values(S[t])) if (x.firmaId === fern.id && !x._dirty) delete S[t][x.id];
          continue;
        }
        if (!lokal || !gleicherStand(ohneLokales(lokal), fern)) neuesVomServer = true;
        S[tabelle][fern.id] = { ...fern, _n: lokal ? lokal._n : 0 };
      }
    }
    if (S.kennung && r.kennung !== S.kennung) {
      // Der Bestand in der Cloud wurde neu angelegt: alles von diesem Gerät erneut hochladen –
      // aber nicht endlos, falls die Cloud bei jedem Aufruf einen neuen Bestand meldet.
      SYNC.neuAngelegt = (SYNC.neuAngelegt || 0) + 1;
      if (SYNC.neuAngelegt > 2) throw new Error('Die Cloud legt ihren Bestand ständig neu an – bitte den Ordner „Schadensfaelle“ in Google Drive und die Code.gs prüfen.');
      for (const tabelle of TABELLEN) for (const d of Object.values(S[tabelle])) { d._dirty = true; if (tabelle === 'anlagen') d.vorhanden = false; }
      S.seit = 0; SYNC.nochmal = true;
    } else { S.seit = r.rev; SYNC.neuAngelegt = 0; }
    S.kennung = r.kennung;
    speichere();

    for (const a of alle('anlagen').filter(a => !a.vorhanden && !a._dirty)) {
      const blob = await Dateien.hole(a.id);
      if (!blob) continue; // liegt auf einem anderen Gerät und wird von dort hochgeladen
      await api('anlageHochladen', PIN, a.id, await alsBase64(blob));
      a.vorhanden = true; speichere();
    }
    SYNC.fehler = ''; SYNC.zuletzt = Date.now();
    if (neuesVomServer) zeichne();
  } catch (e) {
    const m = String(e.message || e);
    if (m.includes('GESPERRT')) SYNC.fehler = m.replace(/^.*GESPERRT: /, '');
    else if (m.includes('PIN')) { PIN = ''; try { localStorage.removeItem(PIN_SPEICHER); } catch {} SYNC.fehler = 'PIN erforderlich'; anmeldung(m.includes('falsch')); }
    else SYNC.fehler = navigator.onLine === false || e instanceof TypeError ? 'offline' : m;
  } finally {
    SYNC.laeuft = false; zeichneSync();
    if (SYNC.nochmal) planeAbgleich(300);
  }
}
/** Fragt gelegentlich nach, ob ein anderes Gerät etwas geändert hat. */
async function pruefeStand() {
  if (!mitCloud() || !PIN || SYNC.laeuft || document.hidden) return;
  try { const r = await api('stand', PIN); if (r.rev !== S.seit || r.kennung !== S.kennung) abgleich(); else if (SYNC.fehler === 'offline') { SYNC.fehler = ''; zeichneSync(); } }
  catch { if (offeneAnzahl()) { SYNC.fehler = 'offline'; zeichneSync(); } }
}
function zeichneSync() {
  const el = $('#sync');
  const wartend = offeneAnzahl();
  let text, farbe = 'grau';
  if (!mitCloud()) text = 'Nur auf diesem Gerät';
  else if (!PIN) { text = 'Anmeldung nötig'; farbe = 'gelb'; }
  // Reine Nachfrage im Hintergrund ohne eigene Änderungen: weiter „Cloud aktuell“ zeigen.
  else if (SYNC.laeuft && (wartend || !SYNC.zuletzt)) text = 'Gleiche ab …';
  else if (SYNC.fehler === 'offline') { text = wartend ? `Offline · ${wartend} Änderung${wartend === 1 ? '' : 'en'} wartet` : 'Offline'; farbe = 'gelb'; }
  else if (SYNC.fehler) { text = SYNC.fehler; farbe = 'rot'; }
  else if (wartend || !SYNC.zuletzt) text = 'Speichere …';
  else { text = 'Cloud aktuell'; farbe = 'gruen'; }
  el.textContent = text; el.className = farbe; el.dataset.zustand = !mitCloud() ? 'lokal' : !PIN ? 'anmelden' : SYNC.laeuft || wartend || !SYNC.zuletzt ? 'beschaeftigt' : SYNC.fehler ? 'fehler' : 'aktuell';
}
