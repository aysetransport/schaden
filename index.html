:root[data-thema=hell]{  --bg:#F8F9FF;--flaeche:#F2F3FA;--flaeche2:#ECEEF4;--hoch:#E1E2E8;--text:#191C20;--leise:#43474E;--rand:#C3C7CF;--linie:#DFE2EB;

  --tuerkis-f:#BFE9EC;--tuerkis-t:#00363A;--orange-f:#FFDBC8;--orange-t:#6A2D00;--gruen-f:#BDEFC2;--gruen-t:#0C3A18;--grau-f:#E1E2E8;--grau-t:#43474E;--rot-f:#FFDAD6;--rot-t:#93000A;

  --blau-f:#194975;--blau-t:#D1E4FF;--violett-f:#454093;--violett-t:#E3DFFF;--gelb-f:#5B4300;--gelb-t:#FFDF9E;--lila-f:#523F5F;--lila-t:#F2DAFF;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;max-width:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{overscroll-behavior-x:none}
img,video,canvas,svg,table{max-width:100%}
main,main>section,.karte,.dashboard>*{min-width:0}
.karte,.vorlage,dd,.titel,.leise{overflow-wrap:anywhere}
body{min-height:100vh}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
/* ===== Rahmen: Kopfleiste, Navigation (PC links, Handy unten), Inhalt ===== */
:root{--nav-breite:212px;--kopf-hoehe:58px}
header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;min-height:var(--kopf-hoehe);padding:calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--linie)}
#app-titel{border:0;background:transparent;cursor:pointer;font-size:19px;font-weight:600;color:var(--primaer);padding:4px 6px;white-space:nowrap}
#suche-global{position:relative;flex:1;max-width:560px;margin:0 auto}
#globale-suche{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--rand);border-radius:999px;background:var(--flaeche);font-size:15px}
#suche-global::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}
#suchtreffer{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--flaeche);border:1px solid var(--rand);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:70vh;overflow:auto;z-index:20;padding:6px 0}
.treffer-gruppe{font-size:12px;font-weight:600;color:var(--primaer);padding:8px 12px 2px}
.treffer{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 12px;cursor:pointer;color:inherit}
.treffer:hover,.treffer:focus{background:var(--flaeche2);outline:0}
#suche-knopf{display:none}
#neu-knopf{padding:8px 16px}
main{display:grid;grid-template-columns:minmax(0,1fr);margin:0 auto}
main>section{padding:14px calc(16px + env(safe-area-inset-right)) 32px calc(16px + env(safe-area-inset-left));min-width:0}
#navi{z-index:7}
.nav-gruppe{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--leise);padding:12px 12px 4px;opacity:.8}
.nav-gruppe:empty{border-top:1px solid var(--linie);padding:0;margin:8px 0}
#nav-schleier{display:none}
kbd{font:600 12px ui-monospace,monospace;background:var(--flaeche2);border:1px solid var(--rand);border-radius:6px;padding:2px 6px}
.werkzeug-mehr{display:none}
#sync{white-space:nowrap}
.nav-knopf{position:relative;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--leise);cursor:pointer;border-radius:12px;font-weight:500;text-align:left}
.nav-knopf:hover{background:var(--flaeche2)}
.nav-knopf[aria-current=page]{background:var(--primaer-hell);color:var(--auf-primaer-hell);font-weight:600}
.nav-symbol{font-size:19px;width:24px;text-align:center;flex:none}
.nav-knopf .zahl{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--rot-f);color:var(--rot-t);font-size:11px;line-height:18px;text-align:center}
@media (min-width:900px){
  #navi{position:fixed;left:0;top:var(--kopf-hoehe);bottom:0;width:var(--nav-breite);padding:12px 10px 16px;background:var(--flaeche);border-right:1px solid var(--linie);overflow:auto}
  .nav-klein{display:none}.nav-gross{display:flex;flex-direction:column;gap:2px}
  .nav-knopf{padding:8px 12px;width:100%}
  body.nav-schmal{--nav-breite:76px}
  body.nav-schmal .nav-knopf{flex-direction:column;gap:2px;padding:7px 2px;text-align:center;font-size:11px}
  body.nav-schmal .nav-knopf .zahl{position:absolute;top:2px;right:6px;margin:0}
  body.nav-schmal .nav-gruppe:not(:empty){font-size:0;padding:4px 0;border-top:1px solid var(--linie);margin-top:4px}
  body.nav-schmal header #app-titel{width:auto}
  header{position:fixed;left:0;right:0}
  header #app-titel{width:calc(var(--nav-breite) - 16px);text-align:left}
  main{margin-left:var(--nav-breite);padding-top:var(--kopf-hoehe);grid-template-columns:minmax(340px,420px) minmax(0,1fr);align-items:start;max-width:calc(1500px + var(--nav-breite))}
  #liste{position:sticky;top:var(--kopf-hoehe);max-height:calc(100vh - var(--kopf-hoehe));overflow:auto;border-right:1px solid var(--linie)}
  body.breit main{grid-template-columns:minmax(0,1fr)}
  body.breit #liste{position:static;max-height:none;overflow:visible;border:0}
  body.breit #detail,body.breit-detail #liste{display:none}
  body.breit-detail main{grid-template-columns:minmax(0,1fr)}
  body:not(.zeigt-detail):not(.breit) #zurueck,body:not(.breit-detail) #zurueck{display:none}
}
@media (min-width:900px) and (max-width:1180px){
  :root{--nav-breite:84px}
  .nav-knopf{flex-direction:column;gap:2px;padding:8px 2px;text-align:center;font-size:11.5px}
  .nav-knopf .zahl{position:absolute;top:2px;right:6px;margin:0}
  header #app-titel{font-size:15px}
}
@media (max-width:899px){
  #navi{position:fixed;left:0;right:0;bottom:0;background:var(--flaeche);border-top:1px solid var(--linie);padding:4px calc(4px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left))}
  .nav-gross{display:none}.nav-klein{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
  body.nav-offen .nav-gross{display:flex;flex-direction:column;gap:2px;position:fixed;left:0;top:0;bottom:0;width:min(300px,84vw);background:var(--flaeche);z-index:30;overflow:auto;
    padding:calc(12px + env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom));box-shadow:4px 0 24px rgba(0,0,0,.25)}
  body.nav-offen .nav-gross .nav-knopf{flex-direction:row;gap:12px;padding:10px 12px;font-size:15px;text-align:left}
  body.nav-offen .nav-gross .nav-knopf .zahl{position:static;margin-left:auto}
  body.nav-offen #nav-schleier{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29}
  body.nav-offen #navi{z-index:31}
  .werkzeuge:not(.offen) > :nth-child(n+4):not(.werkzeug-mehr){display:none}
  .werkzeuge .werkzeug-mehr{display:inline-flex}
  .werkzeuge:not(:has(> :nth-child(5))) .werkzeug-mehr{display:none}
  .werkzeuge.offen .werkzeug-mehr{order:99}
  .nav-knopf{flex-direction:column;gap:1px;padding:6px 2px;font-size:11px;text-align:center;min-width:0}
  .nav-knopf .nav-text{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-knopf .zahl{position:absolute;top:1px;right:calc(50% - 26px);margin:0}
  main>section{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  body.zeigt-detail #liste,body:not(.zeigt-detail) #detail{display:none}
  header{gap:6px}
  #app-titel{font-size:17px;padding:4px 2px}
  #suche-global{display:none}
  #suche-knopf{display:inline-flex}
  body.sucht #suche-global{display:block;position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));max-width:none;z-index:21}
  #neu-knopf{padding:8px 12px}
  #neu-knopf .lang{display:none}
  .werkzeuge{gap:5px}.werkzeuge .knopf{padding:6px 10px;font-size:13px}
  .seitenkopf h1{font-size:20px}
  .fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));z-index:4;box-shadow:0 3px 10px rgba(0,0,0,.25);padding:14px 20px;border-radius:16px}
}
/* Kopf eines Bereichs */
.seitenkopf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.seitenkopf h1{font-size:22px;font-weight:600;flex:1;min-width:0}
.sk-haupt{display:flex;gap:8px;flex-wrap:wrap}
.werkzeuge{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.werkzeuge .knopf{padding:7px 12px;font-size:14px}
.dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
.dashboard .karte{margin:0}
.dashboard .kennzahlen.vier{grid-template-columns:1fr 1fr}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.kachel{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border:1px solid var(--rand);border-radius:14px;background:var(--flaeche2);cursor:pointer;font-weight:500;text-align:center}
.kachel span{font-size:24px}.kachel:hover{border-color:var(--primaer)}
.kachel .zahl{background:var(--rot-f);color:var(--rot-t);border-radius:9px;padding:0 6px;font-size:12px}
/* Tourenplanung */
.tp-datum{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tp-datum input{padding:8px 10px;border:1px solid var(--rand);border-radius:10px;background:var(--flaeche);font-size:15px}
.tp-datum .knopf{padding:7px 12px}
.tp-wochentag{font-size:17px;margin:0 6px}
#tourplan{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.tour{display:grid;grid-template-columns:28px 130px 80px minmax(130px,1fr) minmax(130px,1.2fr) 74px 130px minmax(130px,1fr) minmax(170px,1.6fr) auto;gap:6px;align-items:start;
  background:var(--flaeche);border:1px solid var(--linie);border-radius:12px;padding:8px}
.tour.leer{opacity:.85;border-style:dashed}
.tour-nr{font-weight:600;color:var(--leise);padding-top:22px;text-align:center}
.tf{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:11px;color:var(--leise)}
.tf input,.tf select{width:100%;padding:7px 8px;border:1px solid var(--rand);border-radius:8px;background:var(--bg);font-size:14px;color:var(--text);min-width:0}
.tf.kz input{font-weight:600}
.bf{display:flex;flex-wrap:wrap;gap:4px}.bf input{flex:1 1 110px}
.tour-hinweise{grid-column:2/-2;display:flex;flex-wrap:wrap;gap:4px}
.tour-hinweise:empty{display:none}
.tour-hinweise button.marke{border:0;cursor:pointer}
.tour-knoepfe{grid-row:1;grid-column:-2;display:flex;gap:0;padding-top:16px}
.tour-knoepfe .symbol{padding:6px;font-size:15px}
.tour-knoepfe .symbol:disabled{opacity:.25;cursor:default}
.tp-frei{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tp-frei h3{font-size:14px;color:var(--primaer);margin:0 0 6px}.tp-frei p{margin:3px 0}
@media (max-width:1560px){
  .tour{grid-template-columns:28px repeat(4,minmax(0,1fr)) auto;grid-auto-flow:row dense}
  .tour .tf.kz{grid-column:2/4}.tour .tf.nr{grid-column:4/5}.tour .tf.zeit{grid-column:5/6}
  .tour .tf.ag{grid-column:2/4}.tour .tf.name{grid-column:4/6}
  .tour .tf.art{grid-column:2/4}.tour .tf.fahrer{grid-column:4/6}
  .tour .tf.team{grid-column:2/6}
  .tour-knoepfe{grid-column:6;grid-row:1/span 2;flex-direction:column;padding-top:0}
  .tour-hinweise{grid-column:2/6}
}
@media (max-width:600px){
  .tour{grid-template-columns:22px repeat(2,minmax(0,1fr)) auto;padding:8px 6px}
  .tour .tf.kz,.tour .tf.ag,.tour .tf.art{grid-column:2/3}.tour .tf.nr,.tour .tf.name,.tour .tf.fahrer{grid-column:3/4}
  .tour .tf.zeit{grid-column:2/3}.tour .tf.team,.tour-hinweise{grid-column:2/4}
  .tour-knoepfe{grid-column:4;grid-row:1/span 4}
  .tp-frei{grid-template-columns:1fr}
  .tp-datum .tp-wochentag{width:100%;margin:2px 0 0}
}
/* Personal */
.kennzahlen.vier{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.kennzahlen.vier{grid-template-columns:1fr 1fr}}
.kennzahl.gelb{background:var(--gelb-f);color:var(--gelb-t)}.kennzahl.blau{background:var(--blau-f);color:var(--blau-t)}
.kalender{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:420px}
.kalender .wt{font-size:11px;text-align:center;color:var(--leise)}
.kal-tag{padding:7px 0;border:1px solid var(--linie);border-radius:6px;background:var(--bg);cursor:pointer;font-size:13px}
.kal-tag.we{color:var(--leise)}.kal-tag.heute{outline:2px solid var(--primaer)}
.tabelle-rahmen{overflow-x:auto;background:var(--flaeche);border-radius:12px;margin-bottom:12px}
.tabelle{width:100%;border-collapse:collapse;font-size:14px}
.tabelle th{text-align:left;font-size:12px;color:var(--leise);padding:8px;border-bottom:1px solid var(--rand);white-space:nowrap}
.tabelle td{padding:7px 8px;border-bottom:1px solid var(--linie)}
.tabelle .r{text-align:right;white-space:nowrap}
.tabelle tr.klickbar{cursor:pointer}.tabelle tr.klickbar:hover td{background:var(--flaeche2)}
.tabelle tr.summe td{font-weight:600;border-top:2px solid var(--rand)}
pre.vorschau{white-space:pre-wrap;font:inherit;background:var(--flaeche2);padding:10px;border-radius:10px;margin:8px 0}
.liste-knoepfe .vorlage{border-bottom:1px solid var(--linie);border-radius:0}
.baukasten{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px;padding:12px}
.baukasten label.feld{margin-bottom:4px}
.statistik-titel{font-size:18px;font-weight:600;margin:6px 0 10px}
.balken-spalte{width:30%;min-width:80px}
.balken{display:block;height:10px;border-radius:0 4px 4px 0;background:var(--primaer)}
.balken.neg{background:var(--rot-t)}
.tabelle.kreuz td,.tabelle.kreuz th{white-space:nowrap}
.rangliste{margin:0;padding-left:22px}.rangliste li{margin:0}.rangliste .vorlage{padding:6px 4px}
.mail-karte.ungelesen .titel{font-weight:700}
/* Kalender */
.kal-gitter{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.kal-wt{font-size:12px;font-weight:600;color:var(--leise);text-align:center;padding:2px 0}
.kal-zelle{background:var(--flaeche);border:1px solid var(--linie);border-radius:8px;min-height:96px;padding:4px;cursor:pointer;overflow:hidden;min-width:0}
.kal-gitter.woche .kal-zelle{min-height:260px}
.kal-zelle.fremd{opacity:.85}.kal-zelle.fremd .kal-kopf b{color:var(--leise)}.kal-zelle.we{background:var(--flaeche2)}.kal-zelle.heute{outline:2px solid var(--primaer)}
.kal-zelle:hover{border-color:var(--primaer)}
.kal-kopf{font-size:13px;margin-bottom:2px}
.kal-eintrag{font-size:11.5px;line-height:1.3;border-radius:5px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){.kal-zelle{min-height:62px;padding:2px}.kal-eintrag{font-size:0;height:6px;padding:0;margin-top:2px}.kal-gitter.woche{grid-template-columns:1fr}.kal-gitter.woche .kal-wt{display:none}
  .kal-gitter.woche .kal-zelle{min-height:auto}.kal-gitter.woche .kal-eintrag{font-size:12px;height:auto;padding:1px 4px}}
/* Aufgaben, Zeiten, Wochenplan, Fahrer */
.aufgabe.erledigt b{text-decoration:line-through;opacity:.6}
.tabelle tr.gewaehlt td{background:var(--primaer-hell)}
.tabelle tr.entwurf td{background:var(--gelb-f);color:var(--gelb-t)}

<script>
'use strict';
// ============================== Grundlagen ==============================
const $ = (auswahl, wurzel = document) => wurzel.querySelector(auswahl);
const esc = t => String(t ?? '').replace(/[&<>"']/g, z => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[z]));
const pad = n => String(n).padStart(2, '0');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));

const STATUS = {
  NEU: { label: 'Neu', offen: true, farbe: 'blau' },
  IN_PRUEFUNG: { label: 'In Prüfung', offen: true, farbe: 'violett' },
  WARTET_AUF_RUECKMELDUNG: { label: 'Wartet auf Rückmeldung', offen: true, farbe: 'gelb' },
  BEI_VERSICHERUNG: { label: 'Bei Versicherung', offen: true, farbe: 'lila' },
  VERGLEICH_ANGEBOTEN: { label: 'Vergleich angeboten', offen: true, farbe: 'tuerkis' },
  ZAHLUNG_OFFEN: { label: 'Zahlung offen', offen: true, farbe: 'orange' },
  ERLEDIGT: { label: 'Erledigt', offen: false, farbe: 'gruen' },
  ABGELEHNT: { label: 'Abgelehnt', offen: false, farbe: 'grau' },
};
const SCHADENSART = { WARE: 'Beschädigung der Ware', GEBAEUDE: 'Schaden an Gebäude / Einrichtung', VERLUST: 'Verlust / Fehlmenge',
  VERZUG: 'Lieferverzug', FAHRZEUG: 'Fahrzeug- / Verkehrsschaden', SONSTIGES: 'Sonstiges' };
const PARTNER = { ANSPRUCHSTELLER: 'Geschädigter', AUFTRAGGEBER: 'Auftraggeber', VERSICHERUNG: 'Versicherung', FAHRER: 'Fahrer',
  GUTACHTER: 'Gutachter / Werkstatt', INTERN: 'Intern' };
const VERLAUF = { ANGELEGT: ['Fall angelegt', '🚚'], NOTIZ: ['Notiz', '✎'], ANRUF: ['Telefonat', '☎'], EMAIL: ['E-Mail', '✉'], EMAIL_EINGANG: ['E-Mail erhalten', '📨'], EMAIL_AUSGANG: ['E-Mail gesendet', '📤'], NACHRICHT: ['Nachricht', '💬'],
  BRIEF: ['Schreiben', '📄'], STATUS: ['Statusänderung', '⚑'], WIEDERVORLAGE: ['Wiedervorlage', '⏱'], ANLAGE: ['Anlage', '📎'] };
const status = f => STATUS[f.status] || STATUS.NEU;

// ---------- Datum ----------
const isoTag = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const heute = () => isoTag(new Date());
const alsTag = iso => { const [j, m, t] = iso.split('-').map(Number); return new Date(j, m - 1, t); };
const plusTage = (iso, n) => { const d = alsTag(iso); d.setDate(d.getDate() + n); return isoTag(d); };
const tageBis = iso => Math.round((alsTag(iso) - alsTag(heute())) / 86400000);
const datumText = iso => (iso ? iso.split('-').reverse().join('.') : '');
const datumMitTag = iso => ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'][alsTag(iso).getDay()] + ', ' + datumText(iso);
const zeitText = iso => { const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const jetztIso = () => new Date().toISOString();

// ---------- Fachlogik (entspricht der Android-App) ----------
function faelligkeit(f) {
  if (!status(f).offen || !f.wiedervorlageAm) return { art: 'keine', faellig: false, farbe: 'grau', text: 'Keine Wiedervorlage' };
  const t = tageBis(f.wiedervorlageAm);
  if (t < 0) return { art: 'ueber', faellig: true, farbe: 'rot', text: t === -1 ? 'seit gestern überfällig' : `seit ${-t} Tagen überfällig` };
  if (t === 0) return { art: 'heute', faellig: true, farbe: 'gelb', text: 'heute fällig' };
  return { art: 'kommend', faellig: false, farbe: 'grau', tage: t, text: t === 1 ? 'morgen fällig' : `in ${t} Tagen fällig` };
}
const geld = cent => (cent / 100).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const geldOhneSymbol = cent => (cent / 100).toFixed(2).replace('.', ',');
/** Liest „1.234,56“, „1,234.56“ oder „450 €“; gibt Cent zurück oder null bei ungültiger Eingabe. */
function geldLesen(eingabe) {
  const roh = String(eingabe).replace(/€|EUR/gi, '').replace(/[\s ]/g, '');
  if (!roh || !/^[\d.,]+$/.test(roh)) return null;
  const punkt = roh.lastIndexOf('.'), komma = roh.lastIndexOf(',');
  let zahl;
  if (punkt >= 0 && komma >= 0) zahl = komma > punkt ? roh.replace(/\./g, '').replace(',', '.') : roh.replace(/,/g, '');
  else if (komma >= 0) { if (roh.split(',').length > 2) return null; zahl = roh.replace(',', '.'); }
  else if (punkt >= 0) {
    const gruppen = roh.split('.');
    const tausender = gruppen.slice(1).every(g => g.length === 3) && gruppen[0].length >= 1 && gruppen[0].length <= 3;
    if (tausender) zahl = roh.replace(/\./g, ''); else if (gruppen.length === 2) zahl = roh; else return null;
  } else zahl = roh;
  if (!/^\d*(\.\d{0,2})?$/.test(zahl) || zahl === '' || zahl === '.') return null;
  const [ganz, bruch = ''] = zahl.split('.');
  const cent = Number(ganz || '0') * 100 + Number((bruch + '00').slice(0, 2));
  return Number.isSafeInteger(cent) ? cent : null;
}
function naechsteFallnummer(faelle, jahr = new Date().getFullYear()) {
  const praefix = jahr + '-';
  const hoechste = Math.max(0, ...faelle.filter(f => !f.geloescht && String(f.fallnummer).startsWith(praefix))
    .map(f => Number(f.fallnummer.slice(praefix.length))).filter(Number.isInteger));
  return praefix + String(hoechste + 1).padStart(3, '0');
}
/** „Ali Kaya, Ben Ott“ – oder leer, wenn kein Beifahrer eingetragen ist. */
const beifahrer = f => [f.beifahrer1, f.beifahrer2].map(b => (b || '').trim()).filter(Boolean).join(', ');
const anzeigeName = f => (f.kundeName && f.kundeFirma ? `${f.kundeName} · ${f.kundeFirma}` : f.kundeName || f.kundeFirma || `Fall ${f.fallnummer}`);

const FILTER = { FAELLIG: 'Fällig', OFFEN: 'Offen', ABGESCHLOSSEN: 'Abgeschlossen', ALLE: 'Alle' };
function filtereUndSortiere(faelle, filter, suchtext) {
  const begriffe = suchtext.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const passt = f => {
    const heu = [f.fallnummer, f.kundeName, f.kundeFirma, f.kundeTelefon, f.kundeEmail, f.kundenAktenzeichen, f.auftraggeber, f.auftraggeberKontakt, f.auftraggeberTelefon, f.auftraggeberEmail, f.auftraggeberZeichen, f.auftragsReferenz,
      f.tour, f.fahrzeug, f.fahrer, f.beifahrer1, f.beifahrer2, f.schadensort, f.beschreibung, f.versicherungsNummer, status(f).label].join('\n').toLowerCase();
    return begriffe.every(b => heu.includes(b));
  };
  const rang = f => [status(f).offen ? 0 : 1, status(f).offen && f.wiedervorlageAm ? 0 : 1, status(f).offen ? f.wiedervorlageAm || '' : ''];
  return faelle
    .filter(f => ({ FAELLIG: faelligkeit(f).faellig, OFFEN: status(f).offen, ABGESCHLOSSEN: !status(f).offen, ALLE: true }[filter]))
    .filter(passt)
    .sort((a, b) => {
      const ra = rang(a), rb = rang(b);
      return ra[0] - rb[0] || ra[1] - rb[1] || ra[2].localeCompare(rb[2]) || String(b.geaendertAm).localeCompare(String(a.geaendertAm));
    });
}

/**

 * Die vollständige Mail bleibt im Postfach.

const MAIL_TEXT_FIRMA = 2000, MAIL_TEXT_FALL = 6000;

function langeMailsKuerzen() {
  let geaendert = 0;

    if (a.geloescht || a.art !== 'EMAIL' || !a.text || a.text.length <= MAIL_TEXT_FIRMA) continue;

const normal = t => String(t || '').trim().toLowerCase().replace(/\s+/g, ' ');

const kontakteVon = firmaId => alle('ansprechpartner').filter(k => k.firmaId === firmaId).sort((a, b) => a.name.localeCompare(b.name, 'de', { sensitivity: 'base' }));
/** Bevorzugt der Ansprechpartner für Schäden, sonst der erste. */
const schadenKontakt = firmaId => { const k = kontakteVon(firmaId); return k.find(x => /sch(a|ä)d/i.test(x.thema || '')) || k[0]; };
/** Firma zum Namen (gleiche Regeln wie in der Android-App: ohne Groß-/Kleinschreibung, kleinste Kennung gewinnt). */
const firmaZumNamen = name => alle('auftraggeber').filter(e => normal(e.name) === normal(name)).sort((a, b) => (a.id < b.id ? -1 : 1))[0];
/** Gehört der Fall zur Firma – über den Verweis oder, noch unverknüpft, über den Namen? */
const gehoertZu = (f, firma) => (f.auftraggeberUuid ? f.auftraggeberUuid === firma.id : !!(f.auftraggeber || '').trim() && normal(f.auftraggeber) === normal(firma.name));

/** Ansprechpartner anlegen oder fehlende Telefonnummer/E-Mail ergänzen. */
function kontaktUebernehmen(firmaId, name, telefon, email, thema = 'Schäden') {
  name = (name || '').trim(); telefon = (telefon || '').trim(); email = (email || '').trim();
  if (!name && !telefon && !email) return;
  const liste = kontakteVon(firmaId);
  const k = name ? liste.find(x => normal(x.name) === normal(name)) : email ? liste.find(x => (x.email || '').toLowerCase() === email.toLowerCase())
    : liste.find(x => (x.telefon || '').replace(/\D/g, '') === telefon.replace(/\D/g, ''));
  if (!k) merke('ansprechpartner', { id: uuid(), firmaId, name: name || email || telefon, thema, telefon, email, notiz: '', geaendertAm: jetztIso() });
  else if ((!k.telefon && telefon) || (!k.email && email)) merke('ansprechpartner', { ...k, telefon: k.telefon || telefon, email: k.email || email, geaendertAm: jetztIso() });
}
/** Verbindet einen Fall mit seiner Firma; fehlt sie, wird sie angelegt. */
function firmaVerknuepfen(f) {

  if (!name) { f.auftraggeberUuid = ''; return f; }

    ? S.auftraggeber[f.auftraggeberUuid] : firmaZumNamen(name);
  if (!firma) firma = merke('auftraggeber', { id: uuid(), name, rechtsform: '', status: 'AKTIV', telefon: '', email: '', website: '', notizen: '', geaendertAm: jetztIso() });
  kontaktUebernehmen(firma.id, f.auftraggeberKontakt, f.auftraggeberTelefon, f.auftraggeberEmail);
  f.auftraggeberUuid = firma.id;

}
function auftraggeberAuswahl() {
  const liste = auftraggeberListe();

const Aktionen = {
  anlegen(entwurf) {
    const jetzt = jetztIso();

    const f = fallMerken({ ...entwurf, id: uuid(), fallnummer: naechsteFallnummer(faelle()), erstelltAm: jetzt });

  },
  speichern(id, neu) {

    if (alt.status !== f.status) vermerke(id, 'STATUS', `Status: ${status(alt).label} → ${status(f).label}`);
    if (status(f).offen && alt.wiedervorlageAm !== f.wiedervorlageAm) vermerke(id, 'WIEDERVORLAGE', wvText(f.wiedervorlageAm, f.wartetAuf, f.wiedervorlageNotiz));

  status(id, neu, notiz) {

    const f = fallMerken({ ...alt, wiedervorlageAm: datum, wartetAuf, wiedervorlageNotiz: schritt.trim() });

  },
  notiz(id, typ, text) {
    if (!text.trim() || !S.faelle[id]) return;

  },
  verlaufLoeschen(v) { entferne('verlauf', v, { fallId: v.fallId }); nachAenderung(); },
  async anlageHinzufuegen(fallId, datei) {

  anlageLoeschen(a) {

  },
  /** Firma speichern; eine neue Firma mit vorhandenem Namen wird nicht doppelt angelegt. @return Kennung */
  firmaSpeichern(e) {

    const f = merke('auftraggeber', { ...(alt || {}), ...e, id: e.id || uuid(), name: e.name.trim(), geaendertAm: jetztIso() });
    // Fälle tragen den Namen als Text – bei einer Umbenennung mitziehen.
    if (alt && alt.name !== f.name) for (const fall of faelle().filter(x => x.auftraggeberUuid === f.id)) fallMerken({ ...fall, auftraggeber: f.name });

  },
  /** Löscht die Firma mit allem, was an ihr hängt (die Cloud löscht mit). Fälle bleiben erhalten. */
  firmaLoeschen(e) {
    for (const t of CRM_TABELLEN) for (const x of Object.values(S[t])) if (x.firmaId === e.id) delete S[t][x.id];
    for (const fall of faelle().filter(x => x.auftraggeberUuid === e.id)) S.faelle[fall.id] = { ...fall, auftraggeberUuid: '' };

  /** Doppelt angelegte Firma [weg] in [ziel] überführen. */
  firmenZusammenfuehren(weg, ziel) {
    const jetzt = jetztIso();
    for (const t of CRM_TABELLEN) for (const x of alle(t).filter(x => x.firmaId === weg.id)) merke(t, { ...x, firmaId: ziel.id, geaendertAm: jetzt });
    for (const f of faelle().filter(f => gehoertZu(f, weg))) fallMerken({ ...f, auftraggeberUuid: ziel.id, auftraggeber: ziel.name });
    for (const m of Object.values(mails())) if (m.firmaId === weg.id) m.firmaId = ziel.id;
    const w = [...new Map([...schlagwortListe(ziel), ...schlagwortListe(weg)].map(x => [x.toLowerCase(), x])).values()].join(', ');
    merke('auftraggeber', { ...ziel, rechtsform: ziel.rechtsform || weg.rechtsform || '', telefon: ziel.telefon || weg.telefon || '', email: ziel.email || weg.email || '',
      website: ziel.website || weg.website || '', notizen: [ziel.notizen, weg.notizen].filter(Boolean).join('\n\n'), schlagworte: w, geaendertAm: jetzt });
    entferne('auftraggeber', weg, { geaendertAm: jetzt });
    nachAenderung();
  },
  crmSpeichern(tabelle, e) { merke(tabelle, { ...e, id: e.id || uuid(), geaendertAm: jetztIso() }); nachAenderung(); },
  crmLoeschen(tabelle, e) { entferne(tabelle, e, { firmaId: e.firmaId, geaendertAm: jetztIso() }); nachAenderung(); },
  fallLoeschen(id) {
    const f = S.faelle[id]; if (!f) return;
    // Verlauf und Anlagen entfernt der Server zusammen mit dem Fall; lokal verschwinden sie sofort.
    for (const v of Object.values(S.verlauf)) if (v.fallId === id) delete S.verlauf[v.id];
    for (const a of Object.values(S.anlagen)) if (a.fallId === id) { delete S.anlagen[a.id]; Dateien.loesche(a.id); }
    entferne('faelle', f, { geaendertAm: jetztIso() });
    nachAenderung();
  },
};

// ---------- Dateien der Anlagen (IndexedDB) ----------
const Dateien = {
  adressen: new Map(),
  db() {
    return this._db || (this._db = new Promise((ok, fehler) => {
      const r = indexedDB.open('schadensfaelle', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('dateien');
      r.onsuccess = () => ok(r.result); r.onerror = () => fehler(r.error);
    }));
  },
  async tx(modus, fn) {
    const db = await this.db();
    return new Promise((ok, fehler) => { const t = db.transaction('dateien', modus), q = fn(t.objectStore('dateien')); t.oncomplete = () => ok(q && q.result); t.onerror = () => fehler(t.error); });
  },
  lege(id, blob) { return this.tx('readwrite', s => s.put(blob, id)); },
  hole(id) { return this.tx('readonly', s => s.get(id)).catch(() => null); },
  loesche(id) { const u = this.adressen.get(id); if (u) URL.revokeObjectURL(u); this.adressen.delete(id); return this.tx('readwrite', s => s.delete(id)).catch(() => {}); },
  /** Liefert eine anzeigbare Adresse; lädt die Datei bei Bedarf aus der Cloud nach. */
  async adresse(a) {
    if (this.adressen.has(a.id)) return this.adressen.get(a.id);
    let blob = await this.hole(a.id);
    if (!blob && a.vorhanden && mitCloud() && PIN) {
      const r = await api('anlageLaden', PIN, a.id);
      blob = new Blob([Uint8Array.from(atob(r.base64), z => z.charCodeAt(0))], { type: r.mimeType });
      await this.lege(a.id, blob);
    }
    if (!blob) return null;
    const u = URL.createObjectURL(blob); this.adressen.set(a.id, u); return u;
  },
};
/** Große Fotos auf höchstens 2560 Pixel Kantenlänge verkleinern – spart Übertragung und Speicher. */
async function verkleinere(datei) {
  if (!/^image\/(jpeg|png|webp)$/.test(datei.type) || datei.size < 1.5 * 1024 * 1024) return datei;
  try {
    const bild = await createImageBitmap(datei);
    const faktor = Math.min(1, 2560 / Math.max(bild.width, bild.height));
    const c = Object.assign(document.createElement('canvas'), { width: Math.round(bild.width * faktor), height: Math.round(bild.height * faktor) });
    c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
    const klein = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
    return klein && klein.size < datei.size ? klein : datei;
  } catch { return datei; }
}
const alsBase64 = blob => new Promise((ok, fehler) => { const l = new FileReader(); l.onload = () => ok(String(l.result).split(',')[1] || ''); l.onerror = () => fehler(l.error); l.readAsDataURL(blob); });

// ============================== Cloud ==============================
// Wie bei Tagesdispo: POST als Text (keine CORS-Vorabfrage), Antwort {ok} oder {error}.
async function api(fn, ...args) {
  const r = await fetch(apiUrl(), { method: 'POST', body: JSON.stringify({ fn, args }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j.ok;
}
const TABELLEN = ['faelle', 'verlauf', 'anlagen', 'auftraggeber', ...CRM_TABELLEN];
const CLOUD_API = 13;
const VERALTET = 'Das Cloud-Skript ist veraltet – bitte die neue Code.gs bereitstellen.';
const offeneAnzahl = () => TABELLEN.reduce((n, t) => n + offene(t).length, 0);
const SYNC = { laeuft: false, nochmal: false, fehler: '', zuletzt: 0, timer: 0 };
const ohneLokales = d => Object.fromEntries(Object.entries(d).filter(([k]) => !k.startsWith('_')));
/** Vergleich unabhängig von der Reihenfolge der Felder (die Cloud liefert sie in ihrer eigenen Reihenfolge). */
const gleicherStand = (a, b) => JSON.stringify(Object.keys(a).sort().map(k => [k, a[k]])) === JSON.stringify(Object.keys(b).sort().map(k => [k, b[k]]));
const offene = tabelle => Object.values(S[tabelle]).filter(d => d._dirty);

function planeAbgleich(ms = 1200) { if (!mitCloud()) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(abgleich, ms); zeichneSync(); }

async function abgleich() {
  if (!mitCloud()) return;
  if (!PIN) { anmeldung(); return; }
  if (SYNC.laeuft) { SYNC.nochmal = true; return; }
  SYNC.laeuft = true; SYNC.nochmal = false; zeichneSync();
  try {
    // Ein veraltetes Cloud-Skript würde unbekannte Felder verwerfen – dann lieber gar nicht abgleichen.
    // Jeder Aufruf beim Cloud-Skript kostet Sekunden – die Version genügt einmal pro Stunde.
    if (!(SYNC.versionOk && SYNC.versionOk.url === apiUrl() && Date.now() - SYNC.versionOk.zeit < 3600000)) {
      const st = await api('status');
      if (!(st.api >= CLOUD_API)) { SYNC.versionOk = null; throw new Error(VERALTET); }
      SYNC.versionOk = { url: apiUrl(), zeit: Date.now() };
    }
    const gesendet = Object.fromEntries(TABELLEN.map(t => [t, offene(t)]));
    const marken = new Map(Object.values(gesendet).flat().map(d => [d.id, d._n]));
    const r = await api('sync', PIN, { seit: S.seit, kennung: S.kennung, ...Object.fromEntries(TABELLEN.map(t => [t, gesendet[t].map(ohneLokales)])) });

    let neuesVomServer = false;
    for (const tabelle of TABELLEN) {
      // Gesendetes gilt als angekommen, sofern es seit dem Absenden nicht erneut geändert wurde.
      for (const d of gesendet[tabelle]) {
        const lokal = S[tabelle][d.id];
        if (!lokal || lokal._n !== marken.get(d.id)) continue;
        if (lokal.geloescht) delete S[tabelle][d.id]; else lokal._dirty = false;
      }
      for (const fern of r[tabelle] || []) {
        const lokal = S[tabelle][fern.id];
        if (lokal && lokal._dirty) continue; // inzwischen lokal geändert – geht beim nächsten Abgleich hoch
        if (fern.geloescht) {
          if (lokal) { neuesVomServer = true; delete S[tabelle][fern.id]; if (tabelle === 'anlagen') Dateien.loesche(fern.id); }
          if (tabelle === 'auftraggeber') for (const t of CRM_TABELLEN) for (const x of Object.values(S[t])) if (x.firmaId === fern.id && !x._dirty) delete S[t][x.id];
          continue;
        }
        if (!lokal || !gleicherStand(ohneLokales(lokal), fern)) neuesVomServer = true;
        S[tabelle][fern.id] = { ...fern, _n: lokal ? lokal._n : 0 };
      }
    }
    // Fahrer bekommen jedes Mal ihren vollständigen Bestand: was nicht mehr dabei ist, verschwindet vom Gerät.
    if (r.ansicht === 'FAHRER' || r.ansicht === 'DISPO') {
      for (const tabelle of TABELLEN) {
        if (r.ansicht === 'DISPO' && tabelle !== 'personaleintraege') continue;
        const da = new Set((r[tabelle] || []).map(x => x.id));
        for (const x of Object.values(S[tabelle])) if (!x._dirty && !da.has(x.id)) { delete S[tabelle][x.id]; neuesVomServer = true; }
      }
    }
    if (r.rolle && (S.zugang || {}).rolle !== r.rolle) { S.zugang = { ...(S.zugang || {}), rolle: r.rolle }; neuesVomServer = true; }
    if (S.kennung && r.kennung !== S.kennung) {
      // Der Bestand in der Cloud wurde neu angelegt: alles von diesem Gerät erneut hochladen –
      // aber nicht endlos, falls die Cloud bei jedem Aufruf einen neuen Bestand meldet.
      SYNC.neuAngelegt = (SYNC.neuAngelegt || 0) + 1;
      if (SYNC.neuAngelegt > 2) throw new Error('Die Cloud legt ihren Bestand ständig neu an – bitte den Ordner „Schadensfaelle“ in Google Drive und die Code.gs prüfen.');
      for (const tabelle of TABELLEN) for (const d of Object.values(S[tabelle])) { d._dirty = true; if (tabelle === 'anlagen') d.vorhanden = false; }
      S.seit = 0; SYNC.nochmal = true;
    } else if (S.seit && r.rolle && S.sichtRolle !== r.rolle) {
      // Rolle des Geräts hat sich geändert (z. B. Fahrer → Disposition) oder erster Abgleich mit dieser Version:
      // bisher kam nur ein Ausschnitt an – einmal den kompletten Bestand holen, sonst fehlen Mitarbeiter, Touren usw.
      S.seit = 0; SYNC.nochmal = true; SYNC.neuAngelegt = 0;
    } else { S.seit = r.rev; SYNC.neuAngelegt = 0; }
    if (r.rolle) S.sichtRolle = r.rolle;
    S.kennung = r.kennung;
    speichere();

    for (const a of alle('anlagen').filter(a => !a.vorhanden && !a._dirty)) {
      const blob = await Dateien.hole(a.id);
      if (!blob) continue; // liegt auf einem anderen Gerät und wird von dort hochgeladen
      await api('anlageHochladen', PIN, a.id, await alsBase64(blob));
      a.vorhanden = true; speichere();
    }
    SYNC.fehler = ''; SYNC.zuletzt = Date.now();
    if (neuesVomServer) zeichne();
  } catch (e) {
    const m = String(e.message || e);
    if (m.includes('GESPERRT')) SYNC.fehler = m.replace(/^.*GESPERRT: /, '');
    else if (m.includes('PIN')) { PIN = ''; try { localStorage.removeItem(PIN_SPEICHER); } catch {} SYNC.fehler = 'PIN erforderlich'; anmeldung(m.includes('falsch')); }
    else SYNC.fehler = navigator.onLine === false || e instanceof TypeError ? 'offline' : m;
  } finally {
    SYNC.laeuft = false; zeichneSync();
    if (SYNC.nochmal) planeAbgleich(300);
  }
}
/** Fragt gelegentlich nach, ob ein anderes Gerät etwas geändert hat. */
async function pruefeStand() {
  if (!mitCloud() || !PIN || SYNC.laeuft || document.hidden) return;
  try { const r = await api('stand', PIN); if (r.rev !== S.seit || r.kennung !== S.kennung) abgleich(); else if (SYNC.fehler === 'offline') { SYNC.fehler = ''; zeichneSync(); } }
  catch { if (offeneAnzahl()) { SYNC.fehler = 'offline'; zeichneSync(); } }
}
function zeichneSync() {
  const el = $('#sync');
  const wartend = offeneAnzahl();
  let text, farbe = 'grau';
  if (!mitCloud()) text = 'Nur auf diesem Gerät';
  else if (!PIN) { text = 'Anmeldung nötig'; farbe = 'gelb'; }
  // Reine Nachfrage im Hintergrund ohne eigene Änderungen: weiter „Cloud aktuell“ zeigen.
  else if (SYNC.laeuft && (wartend || !SYNC.zuletzt)) text = 'Gleiche ab …';
  else if (SYNC.fehler === 'offline') { text = wartend ? `Offline · ${wartend} Änderung${wartend === 1 ? '' : 'en'} wartet` : 'Offline'; farbe = 'gelb'; }
  else if (SYNC.fehler) { text = SYNC.fehler; farbe = 'rot'; }
  else if (wartend || !SYNC.zuletzt) text = 'Speichere …';
  else { text = 'Cloud aktuell'; farbe = 'gruen'; }
  el.textContent = text; el.className = farbe; el.dataset.zustand = !mitCloud() ? 'lokal' : !PIN ? 'anmelden' : SYNC.laeuft || wartend || !SYNC.zuletzt ? 'beschaeftigt' : SYNC.fehler ? 'fehler' : 'aktuell';
}

// ---------- Anmeldung ----------

  anmeldungOffen = false;
  const neu = !eingerichtet;
  ANSICHT.pinAus = !!stat.pinAus;

  dialog(`<form method="dialog" id="pin-form"><h2>${neu ? 'PIN festlegen' : 'Admin-PIN eingeben'}</h2>
    <p class="leise">${neu ? 'Diese PIN schützt die Daten in der Cloud. Sie wird auf jedem Gerät einmal abgefragt (mindestens 4 Zeichen).' : 'Die PIN der Schadensfälle-Cloud.'}</p>

  if (nu) {
    const l = navUnten().filter(k => k !== nu.dataset.navUnten);
    if (!navUnten().includes(nu.dataset.navUnten)) { if (l.length >= 4) l.shift(); l.push(nu.dataset.navUnten); }
    S.einstellungen.navUnten = l.length ? l : NAV_UNTEN_VORGABE; speichere(); zeichneEinstellungen(); zeichneNavi(); return;
  }
  switch (e.target.id) {
    case 'tp-import-knopf': tpImportDialog(); break;

      else if (entfernen) {
        const art = entfernen.dataset.mailEntfernen;
        bestaetige('E-Mail-Konto entfernen?', 'Konto und Passwort werden von diesem Rechner entfernt. Bereits zugeordnete Mails bleiben im Verlauf.', 'Entfernen',
          async () => { await window.desktop.mail.trennen(art); MAIL.konten[art] = null; aktualisiereKonto(); zeichne(); toast('E-Mail-Konto entfernt'); });
      }
      break;
    }
    case 'jetzt': abgleich(); break;
    case 'pin-schalter': (async () => {
      let st; try { st = await api('status'); } catch (x) { toast('Cloud nicht erreichbar'); return; }
      const aus = !!st.pinAus;
      bestaetige(aus ? 'Cloud-PIN wieder einschalten?' : 'Anmeldung mit der Cloud-PIN abschalten?',
        aus ? 'Danach kann man sich wieder mit der Cloud-PIN als Admin anmelden.' : 'Danach gibt es nur noch persönliche Logins; Geräte, die mit der PIN angemeldet sind, werden abgemeldet. Der Hauptadmin-Login bleibt der oberste Zugang. Notfalls im Apps-Script-Editor „notfallPinAnmeldungEinschalten“ ausführen.',
        aus ? 'Einschalten' : 'Abschalten', async () => {
          try { const r = await api('pinAnmeldung', PIN, aus); ANSICHT.pinAus = r.pinAus; toast(r.pinAus ? 'Anmeldung mit der Cloud-PIN ist abgeschaltet' : 'Anmeldung mit der Cloud-PIN ist eingeschaltet', 6000); }
          catch (x) { toast(String(x.message || x), 8000); }
        });
    })(); break;
    case 'abmelden': if (String(PIN).startsWith('T:')) api('abmelden', PIN).catch(() => {}); PIN = ''; try { localStorage.removeItem(PIN_SPEICHER); } catch {} S.zugang = null; speichere(); SYNC.fehler = ''; zeichne(); toast('Abgemeldet. Zum Anmelden oben auf „Anmeldung nötig“ tippen.'); break;
    case 'verbinden': {
      const url = $('#cloud-url').value.trim();
      if (!/^https?:\/\/.+/.test(url)) { toast('Bitte die vollständige Adresse eintragen (beginnt mit https://).'); break; }
      S.apiUrl = url; S.nurLokal = false; speichere(); zeichne(); abgleich(); break;

        () => { const z = BelegAktionen.alleLoeschen(); toast(`${z} Angebote und Rechnungen gelöscht`); });
      break;
    }
    case 'crm-csv': {
      if (!alle('auftraggeber').length) { toast('Es gibt noch keine Firmen zum Exportieren'); break; }
      for (const [name, inhalt] of Object.entries(crmCsvDateien())) {
        ladeHerunter(`CRM_${name}_${heute()}.csv`, inhalt);
      }
      break;
    }
    case 'csv': {
      if (!faelle().length) { toast('Es gibt noch keine Fälle zum Exportieren'); break; }
      const zahl = {}; for (const a of alle('anlagen')) zahl[a.fallId] = (zahl[a.fallId] || 0) + 1;
      ladeHerunter(`Schadensfaelle_${heute()}.csv`, csvErstellen(faelle(), zahl)); break;
    }
  }
});

// ============================== CRM: Firmen (Auftraggeber) ==============================
// Gleiche Daten und Regeln wie in der Android-App; alles gleicht sich über die Cloud ab.
const FIRMEN_STATUS = { INTERESSENT: ['Interessent', 'violett'], AKTIV: ['Aktiv', 'gruen'], PAUSIERT: ['Pausiert', 'gelb'], EHEMALIG: ['Ehemalig', 'grau'] };
const ADRESS_ART = { HAUPTSITZ: 'Hauptsitz', LAGER: 'Lager', FILIALE: 'Filiale', RECHNUNG: 'Rechnungsadresse', SONSTIGE: 'Sonstige' };
const AKTIVITAET_ART = { ANRUF: 'Anruf', EMAIL: 'E-Mail', TREFFEN: 'Treffen', ANGEBOT: 'Angebot', SONSTIGES: 'Sonstiges' };
const CHANCEN_PHASE = { ANFRAGE: ['Anfrage', true], ANGEBOT: ['Angebot', true], VERHANDLUNG: ['Verhandlung', true], GEWONNEN: ['Gewonnen', false], VERLOREN: ['Verloren', false] };
const KONTAKT_PAUSE_TAGE = 60;
const schlagwortListe = e => [...new Map(String(e.schlagworte || '').split(',').map(x => x.trim()).filter(Boolean).map(x => [x.toLowerCase(), x])).values()];
const letzterKontakt = id => vonFirma('aktivitaeten', id).map(a => a.datum).sort().pop() || null;
const langeKeinKontakt = e => (e.status || 'AKTIV') === 'AKTIV' && (!letzterKontakt(e.id) || letzterKontakt(e.id) < plusTage(heute(), -KONTAKT_PAUSE_TAGE));
function preislisteText(e) {
  return `Preise und Konditionen – ${firmaName(e)}\n` + vonFirma('preise', e.id).sort((a, b) => a.bezeichnung.localeCompare(b.bezeichnung, 'de')).map(p =>
    `• ${p.bezeichnung}${p.betragCent != null ? ': ' + geld(p.betragCent) : ''}${p.einheit ? ' ' + p.einheit : ''}${p.gueltigAb ? ` (gültig ab ${datumText(p.gueltigAb)})` : ''}${p.notiz ? ' – ' + p.notiz : ''}`).join('\n');
}
const firmenStatus = e => FIRMEN_STATUS[e.status] || FIRMEN_STATUS.AKTIV;
const firmaName = e => [e.name, e.rechtsform].filter(Boolean).join(' ');
const vonFirma = (tabelle, id) => alle(tabelle).filter(x => x.firmaId === id);
const adresseText = a => [a.strasse, [a.plz, a.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');

/** Wiedervorlagen: offene CRM-Aufgaben und Wiedervorlagen offener Fälle, nach Fälligkeit eingeteilt. */
function wiedervorlagen() {
  const t = heute();
  const termine = [
    ...alle('aufgaben').filter(a => !a.erledigt && a.faelligAm).map(a => ({ art: 'aufgabe', datum: a.faelligAm, titel: a.text, zusatz: [S.auftraggeber[a.firmaId]?.name, a.kontakt].filter(Boolean).join(' · '), a })),
    ...faelle().filter(f => status(f).offen && f.wiedervorlageAm).map(f => ({ art: 'fall', datum: f.wiedervorlageAm, titel: `Fall ${f.fallnummer} · ${anzeigeName(f)}`,
      zusatz: [f.auftraggeber, f.wartetAuf && 'wartet auf ' + PARTNER[f.wartetAuf], f.wiedervorlageNotiz].filter(Boolean).join(' · '), f })),
    ...fahrzeugTermine(), ...personalTermine(),
    ...alle('aufgabenIntern').filter(a => !a.erledigt && a.faelligAm).map(a => ({ art: 'intern', datum: a.faelligAm, titel: '✅ ' + a.titel, zusatz: [a.zustaendigId && maName(a.zustaendigId), PRIORITAET[a.prioritaet] && a.prioritaet === 'HOCH' && 'wichtig'].filter(Boolean).join(' · '), aufgabe: a })),
    ...Object.entries(mails()).filter(([, m]) => m.erinnerungAm && m.ablage !== 'PAPIERKORB').map(([id, m]) => ({ art: 'mail', datum: m.erinnerungAm, titel: '✉ ' + (m.betreff || '(ohne Betreff)'), zusatz: m.eingehend ? m.von : 'an ' + (m.an || ''), mailId: id })),
  ].sort((a, b) => a.datum.localeCompare(b.datum) || a.titel.localeCompare(b.titel));
  return { ueberfaellig: termine.filter(x => x.datum < t), heute: termine.filter(x => x.datum === t), demnaechst: termine.filter(x => x.datum > t),
    ohneDatum: alle('aufgaben').filter(a => !a.erledigt && !a.faelligAm) };
}
const naechsterTermin = firma => { const w = wiedervorlagen(); return [...w.ueberfaellig, ...w.heute, ...w.demnaechst].find(x => (x.a ? x.a.firmaId === firma.id : x.f ? gehoertZu(x.f, firma) : false)); };

/** Volltextsuche: Fundstelle oder null. */
function firmaTreffer(e, such) {
  const p = t => String(t || '').toLowerCase().includes(such);
  if (p(e.name) || p(e.rechtsform)) return '';
  if (p(e.notizen)) return 'Notizen';
  if (p(e.schlagworte)) return 'Schlagwort';
  if (p(e.email) || p(e.telefon) || p(e.website)) return 'Kontaktdaten';
  let x = vonFirma('ansprechpartner', e.id).find(k => [k.name, k.thema, k.telefon, k.email, k.notiz].some(p)); if (x) return 'Ansprechpartner: ' + x.name;
  x = vonFirma('adressen', e.id).find(a => [a.strasse, a.plz, a.ort, a.notiz].some(p)); if (x) return 'Adresse: ' + adresseText(x);
  x = vonFirma('aktivitaeten', e.id).find(a => p(a.text) || p(a.kontakt)); if (x) return 'Kontakthistorie: ' + datumText(x.datum);
  x = vonFirma('aufgaben', e.id).find(a => !a.erledigt && p(a.text)); if (x) return 'Wiedervorlage: ' + x.text;
  x = vonFirma('dokumente', e.id).find(d => p(d.titel) || p(d.notiz)); if (x) return 'Dokument: ' + x.titel;
  x = faelle().find(f => gehoertZu(f, e) && filtereUndSortiere([f], 'ALLE', such).length); if (x) return 'Fall ' + x.fallnummer;
  return null;
}

function zeichneFirmenliste(r) {
  const such = ANSICHT.firmenSuche.trim().toLowerCase();
  const zeilen = auftraggeberListe()
    .filter(e => (ANSICHT.firmenStatus === 'PAUSE' ? langeKeinKontakt(e) : !ANSICHT.firmenStatus || e.status === ANSICHT.firmenStatus))
    .filter(e => !ANSICHT.schlagwort || schlagwortListe(e).some(w => w.toLowerCase() === ANSICHT.schlagwort.toLowerCase()))
    .map(e => ({ e, treffer: such ? firmaTreffer(e, such) : '' })).filter(z => z.treffer !== null);
  const karten = zeilen.map(({ e, treffer }) => {
    const t = naechsterTermin(e), offen = faelle().filter(f => gehoertZu(f, e) && status(f).offen).length;
    const tText = t && (t.datum < heute() ? `Überfällig seit ${datumText(t.datum)}` : t.datum === heute() ? 'Heute' : datumText(t.datum));
    return `<button class="karte klickbar ${r.art === 'firma' && r.id === e.id ? 'gewaehlt' : ''}" data-firma="${e.id}">
      <div class="zeile eng"><span class="titel fuell">${esc(firmaName(e))}</span><span class="marke ${firmenStatus(e)[1]}">${firmenStatus(e)[0]}</span></div>

      ${t ? `<div class="leise" style="${t.datum <= heute() ? 'color:var(--rot-t)' : ''}">⏱ ${esc(tText)}: ${esc(t.titel)}</div>` : ''}</button>`;

    : `<div class="leer"><b>Keine Treffer</b>${such ? `Zu „${esc(ANSICHT.firmenSuche.trim())}“ wurde nichts gefunden.` : 'In dieser Ansicht gibt es keine Firmen.'}</div>`;
  return seitenkopf('Firmen', '<button class="knopf voll" data-neue-firma>＋ Firma</button>', `<button class="knopf" data-firmen-akt="interessent">🎯 ＋ Interessent</button>
      <button class="knopf" data-firmen-akt="anrufliste">📞 Anrufliste</button><button class="knopf" data-firmen-akt="serienmail">✉ Serienmail</button>
      <label class="knopf">⤓ Liste importieren (CSV)<input type="file" id="firmen-csv-import" accept=".csv,text/csv" hidden></label>`) + `<input class="suche" id="firmen-suche" type="search" placeholder="Firma, Ansprechpartner, Notiz, Fall …" aria-label="Firmen durchsuchen" value="${esc(ANSICHT.firmenSuche)}">

    ${(() => { const w = [...new Map(auftraggeberListe().flatMap(schlagwortListe).map(x => [x.toLowerCase(), x])).values()].sort((a, b) => a.localeCompare(b, 'de'));
      return w.length ? `<div class="chips" role="group" aria-label="Schlagworte">${w.map(x => `<button class="chip" data-schlagwort="${esc(x)}" aria-pressed="${(ANSICHT.schlagwort || '').toLowerCase() === x.toLowerCase()}"># ${esc(x)}</button>`).join('')}</div>` : ''; })()}
    <div id="firmen">${karten || (faelleTreffer.length ? '' : leer)}</div>

}

/** Ein Termin in Listen (Termine, Übersicht): Aufgabe mit Haken, sonst Verweis auf Fall, Fahrzeug, Mitarbeiter oder Mail. */
function terminEintrag(x) {
  const unter = esc([x.datum && x.datum !== heute() && datumText(x.datum), x.zusatz].filter(Boolean).join(' · '));
  if (x.art === 'aufgabe') return `<div class="termin"><input type="checkbox" data-erledigt="${x.a.id}" aria-label="Erledigt"><button class="vorlage fuell" data-firma="${x.a.firmaId}"><b>${esc(x.titel)}</b><br><span class="leise">${unter}</span></button>
      <button class="knopf text" data-verschieben="${x.a.id}" data-tage="1">Morgen</button><button class="knopf text" data-verschieben="${x.a.id}" data-tage="7">+1 Woche</button></div>`;
  if (x.aufgabe) return aufgabeZeile(x.aufgabe);
  const [symbol, attr] = x.z ? ['🚐', `data-fahrzeug="${x.z.id}"`] : x.m ? ['👤', `data-mitarbeiter="${x.m.id}"`] : x.mailId ? ['✉', `data-mail="${esc(encodeURIComponent(x.mailId))}"`] : ['⚠', `data-fall="${x.f.id}"`];
  return `<div class="termin"><span class="termin-symbol">${symbol}</span><button class="vorlage fuell" ${attr}><b>${esc(x.titel)}</b><br><span class="leise">${unter}</span></button></div>`;
}
function zeichneTermine() {
  const w = wiedervorlagen();
  const eintrag = x => (x.art === 'aufgabe' || x.z || x.m || x.mailId || x.aufgabe ? terminEintrag(x) : x.art === 'aufgabe'
    ? `<div class="termin"><input type="checkbox" data-erledigt="${x.a.id}" aria-label="Erledigt"><button class="vorlage fuell" data-firma="${x.a.firmaId}"><b>${esc(x.titel)}</b><br><span class="leise">${esc([x.datum !== heute() && datumText(x.datum), x.zusatz].filter(Boolean).join(' · '))}</span></button>
      <button class="knopf text" data-verschieben="${x.a.id}" data-tage="1">Morgen</button><button class="knopf text" data-verschieben="${x.a.id}" data-tage="7">+1 Woche</button></div>`
    : x.z ? `<div class="termin"><span class="termin-symbol">🚐</span><button class="vorlage fuell" data-fahrzeug="${x.z.id}"><b>${esc(x.titel)}</b><br><span class="leise">${esc([x.datum !== heute() && datumText(x.datum), x.zusatz].filter(Boolean).join(' · '))}</span></button></div>`
    : `<div class="termin"><span class="termin-symbol">⚠</span><button class="vorlage fuell" data-fall="${x.f.id}"><b>${esc(x.titel)}</b><br><span class="leise">${esc([x.datum !== heute() && datumText(x.datum), x.zusatz].filter(Boolean).join(' · '))}</span></button></div>`);
  const gruppe = (titel, liste, farbe) => (liste.length ? `<h3 class="abschnitt" style="${farbe}">${titel} (${liste.length})</h3>${liste.map(eintrag).join('')}` : '');
  const ohne = w.ohneDatum.length ? `<h3 class="abschnitt">Ohne Datum</h3>${w.ohneDatum.map(a => eintrag({ art: 'aufgabe', datum: '', titel: a.text, zusatz: S.auftraggeber[a.firmaId]?.name || '', a })).join('')}` : '';
  const inhalt = gruppe('Überfällig', w.ueberfaellig, 'color:var(--rot-t)') + gruppe('Heute', w.heute, '') + gruppe('Demnächst', w.demnaechst, 'color:var(--leise)') + ohne;
  return seitenkopf('Termine', '', '<button class="knopf" data-ics>📅 Als Kalenderdatei (.ics)</button>') + `<div id="termine">${inhalt || '<div class="leer">⏱<b>Nichts zu tun</b>Hier erscheinen Wiedervorlagen bei Firmen und Schadensfällen, Fristen von Fahrzeugen und Personal, Geburtstage und Mail-Erinnerungen.</div>'}</div>`;
}

/** Kontakthistorie: festgehaltene Kontakte und Mails aus den Fällen der Firma. */
function historieVon(firma) {
  const fallIds = new Set(faelle().filter(f => gehoertZu(f, firma)).map(f => f.id));
  return [
    ...vonFirma('aktivitaeten', firma.id).map(a => ({ sort: a.datum + 'T' + (a.geaendertAm || '').slice(11), a })),
    ...alle('verlauf').filter(v => fallIds.has(v.fallId) && (v.typ === 'EMAIL_EINGANG' || v.typ === 'EMAIL_AUSGANG')).map(v => ({ sort: v.zeitpunkt, v })),
  ].sort((x, y) => y.sort.localeCompare(x.sort));
}

function zeichneFirma(id) {
  const e = S.auftraggeber[id];
  const el = $('#detail');
  if (!e || e.geloescht) { gehe('#/'); return; }
  const bereich = (titel, tabelle, inhalt, neuText = 'Hinzufügen') => `<div class="karte block" data-bereich-firma="${tabelle}"><div class="zeile eng"><h3 class="fuell" style="margin:0">${titel}</h3>
    <button class="knopf text" data-crm-neu="${tabelle}">＋ ${neuText}</button></div>${inhalt || '<p class="leise">Noch nichts eingetragen.</p>'}</div>`;
  const zeile = (tabelle, x, titel, unter) => `<button class="vorlage" data-crm="${tabelle}" data-crm-id="${x.id}"><b>${esc(titel)}</b>${unter ? `<br><span class="leise" style="white-space:pre-wrap">${esc(unter)}</span>` : ''}</button>`;
  const kontakte = kontakteVon(id).map(k => `<div class="zeile eng">${zeile('ansprechpartner', k, k.name, [k.thema, k.telefon, k.email].filter(Boolean).join(' · '))}
      ${k.telefon ? `<button class="symbol" data-oeffne="tel:${esc(k.telefon.replace(/[^\d+]/g, ''))}" aria-label="${esc(k.name)} anrufen">☎</button>` : ''}
      ${k.email ? `<button class="symbol" data-oeffne="mailto:${esc(k.email)}" aria-label="E-Mail an ${esc(k.name)}">✉</button>` : ''}</div>`).join('');
  const adressen = vonFirma('adressen', id).map(a => zeile('adressen', a, ADRESS_ART[a.art] || 'Adresse', [adresseText(a), a.notiz].filter(Boolean).join('\n'))).join('');
  const preise = vonFirma('preise', id).sort((a, b) => a.bezeichnung.localeCompare(b.bezeichnung, 'de')).map(p => zeile('preise', p,
    [p.bezeichnung, [p.betragCent != null && geld(p.betragCent), p.einheit].filter(Boolean).join(' ')].filter(Boolean).join(': '),
    [p.gueltigAb && 'gültig ab ' + datumText(p.gueltigAb), p.notiz].filter(Boolean).join(' · '))).join('');
  const aufgaben = vonFirma('aufgaben', id).sort((a, b) => (a.erledigt - b.erledigt) || String(a.faelligAm || '9').localeCompare(String(b.faelligAm || '9')));
  const offen = aufgaben.filter(a => !a.erledigt), erledigt = aufgaben.filter(a => a.erledigt);
  const aufgabeZeile = a => `<div class="termin"><input type="checkbox" data-erledigt="${a.id}" ${a.erledigt ? 'checked' : ''} aria-label="Erledigt">${zeile('aufgaben', a, a.text,
    [a.faelligAm && (a.faelligAm === heute() ? 'heute' : datumText(a.faelligAm)), a.kontakt].filter(Boolean).join(' · '))}</div>`;
  const historie = historieVon(e).slice(0, 50).map(h => (h.a
    ? zeile('aktivitaeten', h.a, `${datumText(h.a.datum)} · ${AKTIVITAET_ART[h.a.art] || ''}${h.a.kontakt ? ' · ' + h.a.kontakt : ''}`, h.a.text)
    : `<button class="vorlage" data-fall="${h.v.fallId}"><b>${zeitText(h.v.zeitpunkt)} · ${VERLAUF[h.v.typ][0]} · Fall ${esc(S.faelle[h.v.fallId]?.fallnummer || '')}</b><br><span class="leise zwei-zeilen" style="white-space:pre-wrap">${esc(h.v.text.split('\n\n')[0])}</span></button>`)).join('');
  const dokumente = vonFirma('dokumente', id).map(d => `<div class="zeile eng">${zeile('dokumente', d, d.titel, [d.link, d.notiz].filter(Boolean).join('\n'))}
      ${/^https?:\/\//i.test(d.link || '') ? `<a class="symbol" href="${esc(d.link)}" target="_blank" rel="noopener" aria-label="${esc(d.titel)} öffnen">↗</a>` : ''}</div>`).join('');
  const faelleDerFirma = faelle().filter(f => gehoertZu(f, e)).sort((a, b) => String(b.geaendertAm).localeCompare(String(a.geaendertAm)))
    .map(f => `<button class="vorlage" data-fall="${f.id}"><div class="zeile eng"><b class="fuell">${esc(f.fallnummer)} · ${esc(anzeigeName(f))}</b><span class="marke ${status(f).farbe}">${esc(status(f).label)}</span></div></button>`).join('');
  const chancen = vonFirma('chancen', id).sort((a, b) => Object.keys(CHANCEN_PHASE).indexOf(a.phase) - Object.keys(CHANCEN_PHASE).indexOf(b.phase))
    .map(c => zeile('chancen', c, [c.titel, c.wertCent != null && geld(c.wertCent)].filter(Boolean).join(' · '),
      [(CHANCEN_PHASE[c.phase] || CHANCEN_PHASE.ANFRAGE)[0], c.erwartetAm && 'Entscheidung bis ' + datumText(c.erwartetAm), c.notiz].filter(Boolean).join(' · '))).join('');
  const fd = faelle().filter(f => gehoertZu(f, e)), ch = vonFirma('chancen', id);
  const offeneCh = ch.filter(c => (CHANCEN_PHASE[c.phase] || CHANCEN_PHASE.ANFRAGE)[1]), summe = l => l.reduce((n, x) => n + (x || 0), 0);
  const kennzahlen = [['Schadensfälle', `${fd.filter(f => status(f).offen).length} offen / ${fd.length}`],
    summe(fd.filter(f => status(f).offen).map(f => f.forderungCent)) && ['Offene Forderungen', geld(summe(fd.filter(f => status(f).offen).map(f => f.forderungCent)))],
    summe(fd.map(f => f.vergleichCent)) && ['Gezahlt / verglichen', geld(summe(fd.map(f => f.vergleichCent)))],
    offeneCh.length && ['Offene Chancen', `${offeneCh.length} · ${geld(summe(offeneCh.map(c => c.wertCent)))}`],
    summe(ch.filter(c => c.phase === 'GEWONNEN').map(c => c.wertCent)) && ['Gewonnen', geld(summe(ch.filter(c => c.phase === 'GEWONNEN').map(c => c.wertCent)))],
    ['Letzter Kontakt', letzterKontakt(id) ? datumText(letzterKontakt(id)) : 'noch keiner']].filter(Boolean);
  el.dataset.id = 'firma' + id;
  el.innerHTML = `<div class="karte" id="stammdaten">
      <div class="zeile eng"><h2 class="gross fuell">${esc(firmaName(e))}</h2><span class="marke ${firmenStatus(e)[1]}">${firmenStatus(e)[0]}</span>
        <button class="symbol" data-firma-bearbeiten aria-label="Stammdaten bearbeiten">✎</button></div>
      ${e.telefon ? `<p><a href="tel:${esc(e.telefon.replace(/[^\d+]/g, ''))}">☎ ${esc(e.telefon)}</a></p>` : ''}
      ${e.email ? `<p><button class="knopf text" style="padding:0" data-oeffne="mailto:${esc(e.email)}">✉ ${esc(e.email)}</button></p>` : ''}
      ${e.website ? `<p><a href="${esc(/^https?:/i.test(e.website) ? e.website : 'https://' + e.website)}" target="_blank" rel="noopener">🌐 ${esc(e.website)}</a></p>` : ''}
      ${e.notizen ? `<p class="leise" style="white-space:pre-wrap;margin-top:6px">${esc(e.notizen)}</p>` : ''}
      ${schlagwortListe(e).length ? `<p class="leise" style="color:var(--primaer)">${schlagwortListe(e).map(w => '#' + esc(w)).join('  ')}</p>` : ''}
      ${!e.telefon && !e.email && !e.website && !e.notizen ? '<p class="leise">Telefon, E-Mail, Website und Notizen über ✎ eintragen.</p>' : ''}
      ${MAIL.konto ? '<button class="knopf" style="margin-top:8px" data-oeffne="mailto:' + esc(e.email || '') + '">✉ E-Mail schreiben</button>' : ''}</div>
    <div class="karte" id="kennzahlen"><dl>${kennzahlen.map(([l, w]) => `<dt>${esc(l)}</dt><dd>${esc(w)}</dd>`).join('')}</dl></div>
    ${akquiseHtml(e)}
    <div class="karte block"><div class="zeile eng"><h3 class="fuell" style="margin:0">Touren</h3><button class="knopf text" data-rechnung-touren="${id}">🧾 Rechnung aus Touren</button></div><div id="firma-touren">${firmaTourenHtml(e)}</div></div>
    ${bereich('Verkaufschancen', 'chancen', chancen)}
    ${bereich('Ansprechpartner', 'ansprechpartner', kontakte)}
    ${bereich('Adressen', 'adressen', adressen)}
    ${bereich('Preise und Konditionen', 'preise', preise + (preise ? '<button class="knopf text" data-preise-teilen>Preisliste kopieren</button>' : ''))}
    ${bereich('Wiedervorlagen', 'aufgaben', offen.map(aufgabeZeile).join('') + (erledigt.length ? `<details><summary class="leise" style="cursor:pointer;margin:6px 0">${erledigt.length} erledigt</summary>${erledigt.map(aufgabeZeile).join('')}</details>` : ''))}
    ${bereich('Kontakthistorie', 'aktivitaeten', historie, 'Kontakt festhalten')}
    ${bereich('Dokumente', 'dokumente', dokumente)}
    ${bereich('Angebote und Rechnungen', 'belege', vonFirma('belege', id).sort((x, y) => String(y.datum).localeCompare(String(x.datum))).map(x => belegKarte(x)).join(''), 'Rechnung')}
    ${bereich('Schadensfälle', 'faelle', faelleDerFirma, 'Neuer Fall')}`;
}

// ---------- Dialoge für Firmen und Einträge ----------
const CRM_FELDER = {
  auftraggeber: ['Firma', [['name', 'Firma', 'pflicht'], ['rechtsform', 'Rechtsform (z. B. GmbH)'], ['status', 'Status', Object.fromEntries(Object.entries(FIRMEN_STATUS).map(([k, [l]]) => [k, l]))],

    ['kundennummer', 'Kundennummer'], ['ustId', 'USt-IdNr. der Firma'], ['zahlungszielTage', 'Zahlungsziel in Tagen (leer = Standard)'], ['notizen', 'Notizen', 'lang']]],
  ansprechpartner: ['Ansprechpartner', [['name', 'Name', 'pflicht'], ['thema', 'Zuständig für (Disposition, Abrechnung, Schäden, Geschäftsführung …)'], ['telefon', 'Telefon', 'tel'], ['email', 'E-Mail', 'email'], ['notiz', 'Notiz', 'lang']]],

  chancen: ['Verkaufschance', [['titel', 'Worum geht es? (z. B. Montage für neue Filiale)', 'pflicht'], ['phase', 'Phase', Object.fromEntries(Object.entries(CHANCEN_PHASE).map(([k, [l]]) => [k, l]))],

const CRM_VORGABEN = {
  auftraggeber: () => ({ status: 'AKTIV' }), adressen: () => ({ art: 'HAUPTSITZ' }), aktivitaeten: () => ({ datum: heute(), art: 'ANRUF' }),

function crmDialog(tabelle, eintrag, firmaId, danach) {
  const neu = !eintrag;
  const [titel, felder] = CRM_FELDER[tabelle];
  const centFeld = tabelle === 'chancen' ? 'wertCent' : 'betragCent';
  const e = eintrag ? { ...eintrag, betrag: eintrag[centFeld] != null ? geldOhneSymbol(eintrag[centFeld]) : '' } : { ...(CRM_VORGABEN[tabelle] || (() => ({})))() };
  const namen = tabelle === 'aktivitaeten' || tabelle === 'aufgaben' ? kontakteVon(firmaId).map(k => k.name) : [];
  const feld = f => formularFeld(e, f, f[0] === 'kontakt' && namen.length ? 'crm-kontakte' : '');
  dialog(`<form method="dialog" id="crm-form"><h2>${neu ? (tabelle === 'aktivitaeten' ? 'Kontakt festhalten' : (tabelle === 'auftraggeber' ? 'Neue Firma' : 'Neu: ' + titel)) : titel}</h2>
    ${felder.map(feld).join('')}${tabelle === 'aktivitaeten' && neu ? '<label class="feld">Wiedervorlage am (optional)<input name="folgeAm" type="date"></label><label class="feld">Was ist dann zu tun?<input name="folgeText"></label>' : ''}
    ${tabelle === 'auftraggeber' && !neu && auftraggeberListe().length > 1 ? `<details><summary class="knopf text" style="display:inline-flex">Mit anderer Firma zusammenführen …</summary>
      <label class="feld">In diese Firma überführen<select id="zusammen-ziel"><option value="">– Firma wählen –</option>${auftraggeberListe().filter(x => x.id !== eintrag.id).map(x => `<option value="${x.id}">${esc(firmaName(x))}</option>`).join('')}</select></label>
      <button type="button" class="knopf" id="zusammen-los">Zusammenführen</button></details>` : ''}${namen.length ? `<datalist id="crm-kontakte">${namen.map(n => `<option value="${esc(n)}">`).join('')}</datalist>` : ''}
    <div class="dialog-knoepfe">${neu ? '' : '<button type="button" class="knopf text gefahr" id="crm-loeschen">Löschen</button>'}<span class="fuell"></span>
      <button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll">Speichern</button></div></form>`);
  $('#crm-form').onsubmit = ev => {
    ev.preventDefault();
    const w = Object.fromEntries([...new FormData(ev.target)].map(([k, v]) => [k, String(v).trim()]));
    const zeige = (name, text) => { const s = $(`#crm-form [data-fehler="${name}"]`); if (s) { s.textContent = text; s.hidden = !text; } return !text; };
    if ('email' in w && !zeige('email', w.email && !w.email.split(/[,;]/).every(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x.trim())) ? 'Die E-Mail-Adresse sieht unvollständig aus.' : '')) return;
    if ('betrag' in w) {
      if (!zeige('betrag', w.betrag && geldLesen(w.betrag) == null ? 'Bitte einen Betrag wie 89,50 eingeben.' : '')) return;
      w[centFeld] = w.betrag ? geldLesen(w.betrag) : null; delete w.betrag;
      if (tabelle === 'preise') w.gueltigAb = w.gueltigAb || null;
    }
    if ('erwartetAm' in w) w.erwartetAm = w.erwartetAm || null;
    const folge = { am: w.folgeAm, text: w.folgeText }; delete w.folgeAm; delete w.folgeText;
    if ('faelligAm' in w) w.faelligAm = w.faelligAm || null;
    if (tabelle === 'aktivitaeten') w.datum = w.datum || heute();
    $('#dialog').close();
    if (tabelle === 'auftraggeber') { const id = Aktionen.firmaSpeichern({ ...(eintrag || {}), ...w, id: eintrag?.id }); if (danach) danach(id); return; }
    Aktionen.crmSpeichern(tabelle, { ...(eintrag || (tabelle === 'aufgaben' ? { erledigt: false } : {})), ...w, firmaId, id: eintrag?.id });
    if (tabelle === 'aktivitaeten' && folge.am) {
      Aktionen.crmSpeichern('aufgaben', { firmaId, faelligAm: folge.am, kontakt: w.kontakt || '', erledigt: false, text: folge.text || 'Nachfassen: ' + String(w.text).split('\n')[0].slice(0, 80) });
    }
  };
  if ($('#zusammen-los')) $('#zusammen-los').onclick = () => {
    const ziel = S.auftraggeber[$('#zusammen-ziel').value]; if (!ziel) return;
    bestaetige(`In „${ziel.name}“ überführen?`, `Ansprechpartner, Adressen, Preise, Kontakthistorie, Wiedervorlagen, Chancen, Dokumente und Schadensfälle von „${eintrag.name}“ wandern zu „${ziel.name}“. „${eintrag.name}“ wird danach gelöscht.`, 'Zusammenführen',
      () => { Aktionen.firmenZusammenfuehren(eintrag, ziel); gehe('#/firma/' + ziel.id); });
  };
  if (!neu) $('#crm-loeschen').onclick = () => (tabelle === 'auftraggeber'
    ? bestaetige(`„${eintrag.name}“ löschen?`, 'Mit Ansprechpartnern, Adressen, Preisen, Kontakthistorie und Dokumenten – auf allen Geräten. Schadensfälle bleiben erhalten.', 'Löschen', () => { Aktionen.firmaLoeschen(eintrag); gehe('#/'); })
    : bestaetige('Eintrag löschen?', `„${eintrag.name || eintrag.titel || eintrag.bezeichnung || eintrag.text || ADRESS_ART[eintrag.art] || ''}“ wird gelöscht.`, 'Löschen', () => Aktionen.crmLoeschen(tabelle, eintrag)));
}

// ---------- Import der Sicherung des Browser-CRM ----------
function crmImportieren(text) {
  let d; try { d = JSON.parse(String(text).replace(/^﻿/, '')); } catch { d = null; }
  if (!d || !Array.isArray(d.firmen)) throw new Error('Die Datei ist keine Sicherung des Browser-CRM (es fehlt die Liste „firmen“).');
  const t = x => String(x ?? '').trim(), jetzt = jetztIso();
  const tag = x => (/^\d{4}-\d{2}-\d{2}/.test(t(x)) ? t(x).slice(0, 10) : null);
  const status = x => ({ interessent: 'INTERESSENT', lead: 'INTERESSENT', pausiert: 'PAUSIERT', ehemalig: 'EHEMALIG', inaktiv: 'EHEMALIG' }[t(x).toLowerCase()] || (FIRMEN_STATUS[t(x).toUpperCase()] ? t(x).toUpperCase() : 'AKTIV'));
  const adressArt = x => { const v = t(x).toLowerCase(); return v.startsWith('haupt') ? 'HAUPTSITZ' : v.startsWith('lager') ? 'LAGER' : v.startsWith('filial') ? 'FILIALE' : v.startsWith('rechnung') ? 'RECHNUNG' : ADRESS_ART[v.toUpperCase()] ? v.toUpperCase() : 'SONSTIGE'; };
  const aktArt = x => { const v = t(x).toLowerCase(); return v.startsWith('anruf') || v.startsWith('telefon') ? 'ANRUF' : v.includes('mail') ? 'EMAIL' : /^(treffen|termin|besuch)/.test(v) ? 'TREFFEN' : v.startsWith('angebot') ? 'ANGEBOT' : 'SONSTIGES'; };
  const cent = x => (x == null || x === '' ? null : typeof x === 'number' ? Math.round(x * 100) : geldLesen(String(x)));
  let neu = 0, zusammen = 0, eintraege = 0;
  for (const f of d.firmen) {
    const name = t(f && f.name); if (!name) continue;
    let firma = firmaZumNamen(name);
    if (!firma) {
      neu++;
      firma = merke('auftraggeber', { id: uuid(), name, rechtsform: t(f.rechtsform), status: status(f.status), telefon: t(f.telefon), email: t(f.email), website: t(f.website), notizen: t(f.notizen), geaendertAm: jetzt });
    } else {
      zusammen++;
      const notiz = t(f.notizen);
      const erg = { ...firma, rechtsform: firma.rechtsform || t(f.rechtsform), telefon: firma.telefon || t(f.telefon), email: firma.email || t(f.email), website: firma.website || t(f.website),
        notizen: !notiz || (firma.notizen || '').includes(notiz) ? firma.notizen || '' : [firma.notizen, notiz].filter(Boolean).join('\n\n'),
        status: (firma.status || 'AKTIV') === 'AKTIV' && t(f.status) ? status(f.status) : firma.status };
      if (JSON.stringify(ohneLokales(erg)) !== JSON.stringify(ohneLokales(firma))) merke('auftraggeber', { ...erg, geaendertAm: jetzt });
    }
    const id = firma.id, liste = x => (Array.isArray(x) ? x.filter(Boolean) : []);
    const dazu = (tabelle, e, gleich) => { if (vonFirma(tabelle, id).some(gleich)) return; merke(tabelle, { id: uuid(), firmaId: id, ...e, geaendertAm: jetzt }); eintraege++; };
    for (const k of liste(f.kontakte)) { const n = t(k.name) || t(k.email); if (n) dazu('ansprechpartner', { name: n, thema: t(k.thema), telefon: t(k.telefon), email: t(k.email), notiz: t(k.notiz) }, x => normal(x.name) === normal(n)); }
    for (const a of liste(f.adressen)) { if (!t(a.strasse) && !t(a.ort) && !t(a.plz)) continue; dazu('adressen', { art: adressArt(a.art), strasse: t(a.strasse), plz: t(a.plz), ort: t(a.ort), notiz: t(a.notiz) }, x => normal(x.strasse) === normal(a.strasse) && normal(x.ort) === normal(a.ort)); }
    for (const p of liste(f.preise)) { const b = t(p.bez || p.bezeichnung); if (!b) continue; const c = cent(p.betrag), ab = tag(p.ab); dazu('preise', { bezeichnung: b, betragCent: c, einheit: t(p.einheit), gueltigAb: ab, notiz: t(p.notiz) }, x => normal(x.bezeichnung) === normal(b) && x.gueltigAb === ab && x.betragCent === c); }
    for (const a of liste(f.aktivitaeten)) { const text = t(a.text); if (!text) continue; const dt = tag(a.datum) || heute(); dazu('aktivitaeten', { datum: dt, art: aktArt(a.art), text, kontakt: t(a.kontakt) }, x => x.datum === dt && x.text === text); }
    for (const a of liste(f.aufgaben)) { const text = t(a.text); if (!text) continue; const fa = tag(a.faellig); dazu('aufgaben', { faelligAm: fa, text, kontakt: t(a.kontakt), erledigt: a.erledigt === true }, x => x.text === text && (x.faelligAm || null) === fa); }
    for (const x of liste(f.dokumente)) { const ti = t(x.titel) || t(x.link); if (!ti) continue; dazu('dokumente', { titel: ti, link: t(x.link), notiz: t(x.notiz) }, y => y.titel === ti && (y.link || '') === t(x.link)); }
  }
  // Fälle, deren Auftraggeber jetzt als Firma existiert, verbinden.
  for (const f of faelle().filter(f => !f.auftraggeberUuid && (f.auftraggeber || '').trim())) { const firma = firmaZumNamen(f.auftraggeber); if (firma) fallMerken({ ...f, auftraggeberUuid: firma.id }); }
  nachAenderung();
  return { neu, zusammen, eintraege };
}

// ---------- CSV-Export des CRM ----------
function crmCsvDateien() {
  const firmen = auftraggeberListe(), name = id => S.auftraggeber[id]?.name || '';
  const tab = (kopf, zeilen) => '﻿' + [kopf, ...zeilen].map(z => z.map(csvZelle).join(';')).join('\r\n') + '\r\n';
  const nach = (a, b) => name(a.firmaId).localeCompare(name(b.firmaId), 'de');
  const sitz = id => { const l = vonFirma('adressen', id); return l.find(a => a.art === 'HAUPTSITZ') || l[0]; };
  return {
    Firmen: tab(['Firma', 'Rechtsform', 'Status', 'Telefon', 'E-Mail', 'Website', 'Hauptsitz', 'Notizen', 'Schlagworte'],
      firmen.map(f => [f.name, f.rechtsform, firmenStatus(f)[0], f.telefon, f.email, f.website, sitz(f.id) ? adresseText(sitz(f.id)) : '', f.notizen, f.schlagworte || ''])),
    Ansprechpartner: tab(['Firma', 'Name', 'Zuständigkeit', 'Telefon', 'E-Mail', 'Notiz'], alle('ansprechpartner').sort(nach).map(k => [name(k.firmaId), k.name, k.thema, k.telefon, k.email, k.notiz])),
    Preise: tab(['Firma', 'Bezeichnung', 'Betrag (EUR)', 'Einheit', 'Gültig ab', 'Notiz'], alle('preise').sort(nach).map(p => [name(p.firmaId), p.bezeichnung, p.betragCent != null ? geldOhneSymbol(p.betragCent) : '', p.einheit, datumText(p.gueltigAb), p.notiz])),
    Aktivitaeten: tab(['Datum', 'Firma', 'Art', 'Ansprechpartner', 'Text'], alle('aktivitaeten').sort((a, b) => b.datum.localeCompare(a.datum)).map(a => [datumText(a.datum), name(a.firmaId), AKTIVITAET_ART[a.art] || '', a.kontakt, a.text])),
    Verkaufschancen: tab(['Firma', 'Verkaufschance', 'Phase', 'Wert (EUR)', 'Entscheidung bis', 'Notiz'], alle('chancen').sort(nach).map(c => [name(c.firmaId), c.titel,
      (CHANCEN_PHASE[c.phase] || CHANCEN_PHASE.ANFRAGE)[0], c.wertCent != null ? geldOhneSymbol(c.wertCent) : '', datumText(c.erwartetAm), c.notiz])),
    Wiedervorlagen: tab(['Fällig am', 'Firma', 'Aufgabe', 'Ansprechpartner', 'Erledigt'], alle('aufgaben').sort((a, b) => (a.erledigt - b.erledigt) || String(a.faelligAm || '9').localeCompare(String(b.faelligAm || '9')))
      .map(a => [datumText(a.faelligAm), name(a.firmaId), a.text, a.kontakt, a.erledigt ? 'ja' : 'nein'])),
  };
}

// ============================== Angebote, Rechnungen, Zahlstatus ==============================
// Belege (Tabelle „belege“): art ANGEBOT oder RECHNUNG, Positionen als JSON-Text, Beträge in Cent.
const BELEG_ART = { ANGEBOT: ['Angebot', 'A'], RECHNUNG: ['Rechnung', 'R'], GUTSCHRIFT: ['Gutschrift', 'G'] };
const BELEG_STATUS = {
  ENTWURF: ['Entwurf', 'grau'], OFFEN: ['Offen', 'blau'], TEILBEZAHLT: ['Teilbezahlt', 'gelb'], BEZAHLT: ['Bezahlt', 'gruen'], STORNIERT: ['Storniert', 'grau'],
  ANGENOMMEN: ['Angenommen', 'gruen'], ABGELEHNT: ['Abgelehnt', 'rot'],
};
const MAHNSTUFEN = ['Zahlungserinnerung', '1. Mahnung', '2. Mahnung', 'Letzte Mahnung'];
const rechnungsDaten = () => Object.assign({ name: '', strasse: '', plzOrt: '', telefon: '', email: '', steuer: '', ustId: '', iban: '', bic: '', bank: '',
  zahlungsziel: 14, mwst: 19, fuss: '', startRechnung: 1, startAngebot: 1, startGutschrift: 1 }, S.einstellungen.rechnung || {});

const positionen = b => { try { const p = JSON.parse(b.positionen || '[]'); return Array.isArray(p) ? p : []; } catch { return []; } };
function belegSummen(b) {
  const netto = positionen(b).reduce((n, p) => n + Math.round((Number(p.menge) || 0) * (Number(p.einzelCent) || 0)), 0);
  const mwst = Math.round(netto * (Number(b.mwstProzent ?? 19) || 0) / 100);
  return { netto, mwst, brutto: netto + mwst };
}
/** Gutschriften zu einer Rechnung (festgeschrieben, nicht storniert) – mindern ihren offenen Betrag. */
const gutschriftenZu = r => alle('belege').filter(g => g.art === 'GUTSCHRIFT' && g.bezug === r.id && !['ENTWURF', 'STORNIERT'].includes(g.status));
const gutgeschriebenCent = r => gutschriftenZu(r).reduce((n, g) => n + belegSummen(g).brutto, 0);
const offenCent = b => (b.art === 'GUTSCHRIFT' ? 0 : Math.max(0, belegSummen(b).brutto - (b.bezahltCent || 0) - (b.art === 'RECHNUNG' ? gutgeschriebenCent(b) : 0)));
const istRechnungOffen = b => b.art === 'RECHNUNG' && ['OFFEN', 'TEILBEZAHLT'].includes(b.status) && offenCent(b) > 0;
/** Stichtag aus ⚙ → Kosten: Finanzzahlen erst ab diesem Tag (davor unvollständige Daten). */
const finanzAb = () => (/^\d{4}-\d{2}-\d{2}$/.test(S.einstellungen.finanzAb || '') ? S.einstellungen.finanzAb : '');
const abFinanz = zr => (finanzAb() && zr.von < finanzAb() ? { ...zr, von: finanzAb(), gekuerzt: true } : zr);
const finanzHinweis = zr => (zr.gekuerzt ? `<p class="leise">ℹ Finanzzahlen ab ${datumText(finanzAb())} (⚙ → Kosten).</p>` : '');
/** Umsatz netto: Rechnungen minus Gutschriften (ohne Entwürfe und Stornos). */
const zaehltUmsatz = b => (b.art === 'RECHNUNG' || b.art === 'GUTSCHRIFT') && !['ENTWURF', 'STORNIERT'].includes(b.status) && (!finanzAb() || String(b.datum) >= finanzAb());
const umsatzNetto = b => (zaehltUmsatz(b) ? (b.art === 'GUTSCHRIFT' ? -1 : 1) * belegSummen(b).netto : 0);
const istUeberfaellig = b => istRechnungOffen(b) && b.faelligAm && b.faelligAm < heute();
function belegMarke(b) {
  if (b.art === 'RECHNUNG' && ['OFFEN', 'TEILBEZAHLT'].includes(b.status) && offenCent(b) === 0 && gutgeschriebenCent(b)) return ['Gutgeschrieben', 'grau'];
  if (b.art === 'GUTSCHRIFT' && b.status === 'OFFEN') return ['Erstellt', 'blau'];
  if (b.art === 'GUTSCHRIFT' && b.status === 'BEZAHLT') return ['Ausgezahlt / verrechnet', 'gruen'];
  if (istUeberfaellig(b)) return ['Überfällig' + (b.mahnstufe ? ' · ' + MAHNSTUFEN[Math.min(b.mahnstufe, 4) - 1] : ''), 'rot'];
  return BELEG_STATUS[b.status] || BELEG_STATUS.OFFEN;
}
/**
 * Nächste freie Nummer, z. B. R2026-0007 (Rechnung) oder A2026-0003 (Angebot). Die Startnummer aus den
 * Einstellungen gilt als Untergrenze – so lässt sich an einen bisherigen Nummernkreis anschließen.
 */
function naechsteBelegNummer(art, jahr = new Date().getFullYear()) {
  const praefix = `${BELEG_ART[art][1]}${jahr}-`;
  const start = Math.max(1, Math.floor(Number(rechnungsDaten()[{ RECHNUNG: 'startRechnung', ANGEBOT: 'startAngebot' }[art] || 'startGutschrift']) || 1));
  const hoechste = alle('belege').filter(b => b.art === art && String(b.nummer || '').startsWith(praefix))
    .reduce((n, b) => Math.max(n, Number(String(b.nummer).slice(praefix.length)) || 0), start - 1);
  return praefix + String(hoechste + 1).padStart(4, '0');
}
const zahlungsziel = firma => Number((firma && firma.zahlungszielTage) || rechnungsDaten().zahlungsziel) || 14;
function rechnungsAdresse(firmaId) {
  const l = vonFirma('adressen', firmaId);
  return l.find(a => a.art === 'RECHNUNG') || l.find(a => a.art === 'HAUPTSITZ') || l[0] || null;
}

const BelegAktionen = {
  neu(art, firmaId, extra = {}) {
    const firma = S.auftraggeber[firmaId], rd = rechnungsDaten();
    const b = merke('belege', { id: uuid(), firmaId, art, nummer: naechsteBelegNummer(art), datum: heute(),
      faelligAm: art === 'RECHNUNG' ? plusTage(heute(), zahlungsziel(firma)) : plusTage(heute(), 30), status: 'ENTWURF', positionen: '[]',
      mwstProzent: Number(rd.mwst) || 19, bezahltCent: 0, bezahltAm: null, mahnstufe: 0, bezug: '', notiz: '', fallId: '',
      einleitung: art === 'RECHNUNG' ? 'für unsere Leistungen erlauben wir uns, wie folgt zu berechnen:' : 'vielen Dank für Ihre Anfrage. Gern bieten wir Ihnen an:',
      schluss: art === 'RECHNUNG' ? `Bitte überweisen Sie den Betrag bis zum {FAELLIG} ohne Abzug.` : 'Das Angebot gilt 30 Tage. Wir freuen uns auf Ihren Auftrag.',
      geaendertAm: jetztIso(), ...extra });
    nachAenderung(); return b.id;
  },
  speichern(b) { merke('belege', { ...b, geaendertAm: jetztIso() }); nachAenderung(); },
  zahlung(b, cent, am) {
    const bezahlt = (b.bezahltCent || 0) + cent, voll = bezahlt >= belegSummen(b).brutto;
    this.speichern({ ...b, bezahltCent: bezahlt, bezahltAm: am, status: voll ? 'BEZAHLT' : 'TEILBEZAHLT' });
    Aktionen.crmSpeichern('aktivitaeten', { firmaId: b.firmaId, datum: am, art: 'SONSTIGES', kontakt: '', text: `Zahlung ${geld(cent)} zu ${b.nummer} erhalten${voll ? ' – vollständig bezahlt' : ''}` });
  },
  /** Gutschrift zu einer Rechnung: voll = alle Positionen (Storno per Gutschrift), sonst leer zum Ausfüllen. */
  gutschrift(rechnung, voll) {
    return this.neu('GUTSCHRIFT', rechnung.firmaId, { positionen: voll ? rechnung.positionen : '[]', mwstProzent: rechnung.mwstProzent, bezug: rechnung.id, fallId: rechnung.fallId || '', faelligAm: plusTage(heute(), 14),
      einleitung: `zu unserer Rechnung ${rechnung.nummer} vom ${datumText(rechnung.datum)} schreiben wir Ihnen ${voll ? 'den vollen Betrag' : 'folgende Beträge'} gut:`,
      schluss: 'Den Betrag verrechnen wir mit offenen Forderungen bzw. überweisen ihn auf Ihr Konto.' });
  },
  zuRechnung(angebot) {
    const id = this.neu('RECHNUNG', angebot.firmaId, { positionen: angebot.positionen, mwstProzent: angebot.mwstProzent, bezug: angebot.id, fallId: angebot.fallId || '' });
    this.speichern({ ...angebot, status: 'ANGENOMMEN' });
    return id;
  },
  loeschen(b) { entferne('belege', b, { firmaId: b.firmaId, geaendertAm: jetztIso() }); nachAenderung(); },
  /** Alle Angebote und Rechnungen samt der erfassten Zahlungen entfernen (z. B. nach Tests). @return Anzahl */
  alleLoeschen() {

      entferne('aktivitaeten', a, { firmaId: a.firmaId, geaendertAm: jetztIso() });
    }

    return belege.length;
  },
};
