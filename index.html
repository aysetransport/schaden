<script>
'use strict';
// ============================== Grundlagen ==============================
const $ = (auswahl, wurzel = document) => wurzel.querySelector(auswahl);
const esc = t => String(t ?? '').replace(/[&<>"']/g, z => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[z]));
const pad = n => String(n).padStart(2, '0');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));

const STATUS = {
  NEU: { label: 'Neu', offen: true, farbe: 'blau' },
  IN_PRUEFUNG: { label: 'In Prüfung', offen: true, farbe: 'violett' },
  WARTET_AUF_RUECKMELDUNG: { label: 'Wartet auf Rückmeldung', offen: true, farbe: 'gelb' },
  BEI_VERSICHERUNG: { label: 'Bei Versicherung', offen: true, farbe: 'lila' },
  VERGLEICH_ANGEBOTEN: { label: 'Vergleich angeboten', offen: true, farbe: 'tuerkis' },
  ZAHLUNG_OFFEN: { label: 'Zahlung offen', offen: true, farbe: 'orange' },
  ERLEDIGT: { label: 'Erledigt', offen: false, farbe: 'gruen' },
  ABGELEHNT: { label: 'Abgelehnt', offen: false, farbe: 'grau' },
};
const SCHADENSART = { WARE: 'Beschädigung der Ware', GEBAEUDE: 'Schaden an Gebäude / Einrichtung', VERLUST: 'Verlust / Fehlmenge',
  VERZUG: 'Lieferverzug', FAHRZEUG: 'Fahrzeug- / Verkehrsschaden', SONSTIGES: 'Sonstiges' };
const PARTNER = { ANSPRUCHSTELLER: 'Geschädigter', AUFTRAGGEBER: 'Auftraggeber', VERSICHERUNG: 'Versicherung', FAHRER: 'Fahrer',
  GUTACHTER: 'Gutachter / Werkstatt', INTERN: 'Intern' };
const VERLAUF = { ANGELEGT: ['Fall angelegt', '🚚'], NOTIZ: ['Notiz', '✎'], ANRUF: ['Telefonat', '☎'], EMAIL: ['E-Mail', '✉'], EMAIL_EINGANG: ['E-Mail erhalten', '📨'], EMAIL_AUSGANG: ['E-Mail gesendet', '📤'], NACHRICHT: ['Nachricht', '💬'],
  BRIEF: ['Schreiben', '📄'], STATUS: ['Statusänderung', '⚑'], WIEDERVORLAGE: ['Wiedervorlage', '⏱'], ANLAGE: ['Anlage', '📎'] };
const status = f => STATUS[f.status] || STATUS.NEU;

// ---------- Datum ----------
const isoTag = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const heute = () => isoTag(new Date());
const alsTag = iso => { const [j, m, t] = iso.split('-').map(Number); return new Date(j, m - 1, t); };
const plusTage = (iso, n) => { const d = alsTag(iso); d.setDate(d.getDate() + n); return isoTag(d); };
const tageBis = iso => Math.round((alsTag(iso) - alsTag(heute())) / 86400000);
const datumText = iso => (iso ? iso.split('-').reverse().join('.') : '');
const datumMitTag = iso => ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'][alsTag(iso).getDay()] + ', ' + datumText(iso);
const zeitText = iso => { const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const jetztIso = () => new Date().toISOString();

// ---------- Fachlogik (entspricht der Android-App) ----------
function faelligkeit(f) {
  if (!status(f).offen || !f.wiedervorlageAm) return { art: 'keine', faellig: false, farbe: 'grau', text: 'Keine Wiedervorlage' };
  const t = tageBis(f.wiedervorlageAm);
  if (t < 0) return { art: 'ueber', faellig: true, farbe: 'rot', text: t === -1 ? 'seit gestern überfällig' : `seit ${-t} Tagen überfällig` };
  if (t === 0) return { art: 'heute', faellig: true, farbe: 'gelb', text: 'heute fällig' };
  return { art: 'kommend', faellig: false, farbe: 'grau', tage: t, text: t === 1 ? 'morgen fällig' : `in ${t} Tagen fällig` };
}
const geld = cent => (cent / 100).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const geldOhneSymbol = cent => (cent / 100).toFixed(2).replace('.', ',');
/** Liest „1.234,56“, „1,234.56“ oder „450 €“; gibt Cent zurück oder null bei ungültiger Eingabe. */
function geldLesen(eingabe) {
  const roh = String(eingabe).replace(/€|EUR/gi, '').replace(/[\s ]/g, '');
  if (!roh || !/^[\d.,]+$/.test(roh)) return null;
  const punkt = roh.lastIndexOf('.'), komma = roh.lastIndexOf(',');
  let zahl;
  if (punkt >= 0 && komma >= 0) zahl = komma > punkt ? roh.replace(/\./g, '').replace(',', '.') : roh.replace(/,/g, '');
  else if (komma >= 0) { if (roh.split(',').length > 2) return null; zahl = roh.replace(',', '.'); }
  else if (punkt >= 0) {
    const gruppen = roh.split('.');
    const tausender = gruppen.slice(1).every(g => g.length === 3) && gruppen[0].length >= 1 && gruppen[0].length <= 3;
    if (tausender) zahl = roh.replace(/\./g, ''); else if (gruppen.length === 2) zahl = roh; else return null;
  } else zahl = roh;
  if (!/^\d*(\.\d{0,2})?$/.test(zahl) || zahl === '' || zahl === '.') return null;
  const [ganz, bruch = ''] = zahl.split('.');
  const cent = Number(ganz || '0') * 100 + Number((bruch + '00').slice(0, 2));
  return Number.isSafeInteger(cent) ? cent : null;
}
function naechsteFallnummer(faelle, jahr = new Date().getFullYear()) {
  const praefix = jahr + '-';
  const hoechste = Math.max(0, ...faelle.filter(f => !f.geloescht && String(f.fallnummer).startsWith(praefix))
    .map(f => Number(f.fallnummer.slice(praefix.length))).filter(Number.isInteger));
  return praefix + String(hoechste + 1).padStart(3, '0');
}
/** „Ali Kaya, Ben Ott“ – oder leer, wenn kein Beifahrer eingetragen ist. */
const beifahrer = f => [f.beifahrer1, f.beifahrer2].map(b => (b || '').trim()).filter(Boolean).join(', ');
const anzeigeName = f => (f.kundeName && f.kundeFirma ? `${f.kundeName} · ${f.kundeFirma}` : f.kundeName || f.kundeFirma || `Fall ${f.fallnummer}`);

const FILTER = { FAELLIG: 'Fällig', OFFEN: 'Offen', ABGESCHLOSSEN: 'Abgeschlossen', ALLE: 'Alle' };
function filtereUndSortiere(faelle, filter, suchtext) {
  const begriffe = suchtext.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const passt = f => {
    const heu = [f.fallnummer, f.kundeName, f.kundeFirma, f.kundeTelefon, f.kundeEmail, f.kundenAktenzeichen, f.auftraggeber, f.auftraggeberKontakt, f.auftraggeberTelefon, f.auftraggeberEmail, f.auftraggeberZeichen, f.auftragsReferenz,
      f.tour, f.fahrzeug, f.fahrer, f.beifahrer1, f.beifahrer2, f.schadensort, f.beschreibung, f.versicherungsNummer, status(f).label].join('\n').toLowerCase();
    return begriffe.every(b => heu.includes(b));
  };
  const rang = f => [status(f).offen ? 0 : 1, status(f).offen && f.wiedervorlageAm ? 0 : 1, status(f).offen ? f.wiedervorlageAm || '' : ''];
  return faelle
    .filter(f => ({ FAELLIG: faelligkeit(f).faellig, OFFEN: status(f).offen, ABGESCHLOSSEN: !status(f).offen, ALLE: true }[filter]))
    .filter(passt)
    .sort((a, b) => {
      const ra = rang(a), rb = rang(b);
      return ra[0] - rb[0] || ra[1] - rb[1] || ra[2].localeCompare(rb[2]) || String(b.geaendertAm).localeCompare(String(a.geaendertAm));
    });
}
function kennzahlen(faelle) {
  const offene = faelle.filter(f => status(f).offen);
  return { faellig: offene.filter(f => faelligkeit(f).faellig).length, offen: offene.length, forderung: offene.reduce((s, f) => s + (f.forderungCent || 0), 0) };
}

/** An wen sich eine Nachricht richtet; jeder bekommt nur die Angaben, die ihn betreffen. */
const EMPFAENGER = {
  GESCHAEDIGTER: { label: 'Geschädigter', ueberschrift: 'An den Geschädigten', email: f => (f.kundeEmail || '').trim(), telefon: f => (f.kundeTelefon || '').trim(), name: f => f.kundeName },
  AUFTRAGGEBER: { label: 'Auftraggeber', ueberschrift: 'An den Auftraggeber', email: f => (f.auftraggeberEmail || '').trim(), telefon: f => (f.auftraggeberTelefon || '').trim(), name: f => f.auftraggeberKontakt },
  DRITTE: { label: 'Versicherung / Dritte', ueberschrift: 'An Versicherung oder Dritte', email: () => '', telefon: () => '', name: () => '' },
};
const VORLAGEN = {
  EINGANGSBESTAETIGUNG: ['Eingangsbestätigung', 'Bestätigt nur den Eingang der Meldung', 'GESCHAEDIGTER'],
  UNTERLAGEN_ANFORDERN: ['Unterlagen anfordern', 'Fotos, Kaufbeleg und Lieferschein nachfordern', 'GESCHAEDIGTER'],
  ERINNERUNG: ['Erinnerung', 'Nachhaken, wenn eine Rückmeldung aussteht', 'GESCHAEDIGTER'],
  ZWISCHENBESCHEID: ['Zwischenbescheid', 'Mitteilen, dass die Prüfung noch läuft', 'GESCHAEDIGTER'],
  SCHADENSMITTEILUNG: ['Schadensmitteilung', 'Auftraggeber über den gemeldeten Schaden informieren', 'AUFTRAGGEBER'],
  AUFTRAGSUNTERLAGEN: ['Auftragsunterlagen anfordern', 'Lieferschein und Angaben zur Ware erbitten', 'AUFTRAGGEBER'],
  SACHSTAND_AUFTRAGGEBER: ['Sachstand mitteilen', 'Auftraggeber über den Stand informieren', 'AUFTRAGGEBER'],
  ABSCHLUSS_AUFTRAGGEBER: ['Abschluss mitteilen', 'Auftraggeber über den Abschluss informieren', 'AUFTRAGGEBER'],
  SACHSTANDSANFRAGE: ['Sachstandsanfrage', 'Stand bei der Versicherung erfragen', 'DRITTE'],
};
/**
 * Kurze, haftungsneutrale Nachrichten – Wortlaut identisch zur Android-App. Der Auftraggeber erfährt
 * Name des Geschädigten und Art des Schadens, aber keine Kontaktdaten und keine Forderung.
 */
function vorlageText(art, f, absender) {
  const [titel, , empfaenger] = VORLAGEN[art];
  const vorfall = f.schadensdatum ? `zum Vorfall vom ${datumText(f.schadensdatum)}` : 'zu dem gemeldeten Vorfall';
  const frist = datumText(plusTage(heute(), 14));

/**

// ============================== Daten im Browser ==============================
const SPEICHER = 'schadensfaelle-v1', PIN_SPEICHER = 'schadensfaelle-pin';
const LEER = () => ({ faelle: {}, verlauf: {}, anlagen: {}, auftraggeber: {}, seit: 0, kennung: '', apiUrl: '', nurLokal: false,
  einstellungen: { firma: '', bearbeiter: '', funktion: '', wiedervorlageTage: 7 } });
let S = LEER();
try { S = Object.assign(LEER(), JSON.parse(localStorage.getItem(SPEICHER) || '{}')); } catch { /* beschädigter Stand: neu beginnen, die Cloud liefert nach */ }
let PIN = ''; try { PIN = localStorage.getItem(PIN_SPEICHER) || ''; } catch {}
const apiUrl = () => S.apiUrl || window.API_URL; // eine auf dem Gerät eingetragene Adresse geht vor
const mitCloud = () => !!apiUrl() && !S.nurLokal;

function speichere() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(S)); }
  catch { toast('Speichern im Browser fehlgeschlagen – bitte Speicherplatz prüfen.'); }
}
const alle = tabelle => Object.values(S[tabelle]).filter(d => !d.geloescht);

function merke(tabelle, d) { d._dirty = true; d._n = (d._n || 0) + 1; S[tabelle][d.id] = d; return d; }

function entferne(tabelle, d, extra = {}) {

}
const vermerke = (fallId, typ, text) => merke('verlauf', { id: uuid(), fallId, zeitpunkt: jetztIso(), typ, text });

  f.geaendertAm = jetztIso();

}

/** Ein bisher unbekannter Auftraggeber aus einem Fall kommt automatisch in die Liste. */
function merkeAuftraggeber(f) {
  const name = (f.auftraggeber || '').trim();
  if (!name || alle('auftraggeber').some(e => e.name.trim().toLowerCase() === name.toLowerCase())) return;
  merke('auftraggeber', { id: uuid(), name, kontakt: (f.auftraggeberKontakt || '').trim(), telefon: (f.auftraggeberTelefon || '').trim(),
    email: (f.auftraggeberEmail || '').trim(), geaendertAm: jetztIso() });

  return `<label class="feld">Aus Liste wählen<select id="ag-auswahl"><option value="">– Auftraggeber wählen –</option>${liste.map(e =>

const Aktionen = {
  anlegen(entwurf) {
    const jetzt = jetztIso();

    vermerke(f.id, 'ANGELEGT', `Fall ${f.fallnummer} angelegt`);
    nachAenderung(); return f.id;
  },
  speichern(id, neu) {
    const alt = S.faelle[id]; if (!alt) return;

    merkeAuftraggeber(f);
    if (alt.status !== f.status) vermerke(id, 'STATUS', `Status: ${status(alt).label} → ${status(f).label}`);
    if (status(f).offen && alt.wiedervorlageAm !== f.wiedervorlageAm) vermerke(id, 'WIEDERVORLAGE', wvText(f.wiedervorlageAm, f.wartetAuf, f.wiedervorlageNotiz));
    nachAenderung();

    const vorher = status(alt).label;

  nachhaken(id, kanal, ergebnis, datum, wartetAuf, schritt) {

    vermerke(id, kanal, (ergebnis.trim() || 'Nachgehakt') + '\n' + wvText(datum, wartetAuf, schritt));
    nachAenderung(); toast('Im Verlauf vermerkt');
  },

    const f = fallMerken({ ...alt, wiedervorlageAm: datum, wartetAuf, wiedervorlageNotiz: schritt.trim() });

    const name = blob === datei ? datei.name : datei.name.replace(/\.[^.]+$/, '') + '.jpg';
    const a = merke('anlagen', { id: uuid(), fallId, anzeigename: name, mimeType: blob.type || 'application/octet-stream', groesseBytes: blob.size,
      hinzugefuegtAm: jetztIso(), vorhanden: false });

  },
  anlageLoeschen(a) {
    entferne('anlagen', a, { fallId: a.fallId }); Dateien.loesche(a.id);
    vermerke(a.fallId, 'ANLAGE', `Anlage entfernt: ${a.anzeigename}`); nachAenderung();
  },
  auftraggeberSpeichern(e) {
    merke('auftraggeber', { id: e.id || uuid(), name: e.name.trim(), kontakt: e.kontakt.trim(), telefon: e.telefon.trim(), email: e.email.trim(), geaendertAm: jetztIso() });
    nachAenderung();
  },
  auftraggeberLoeschen(e) { entferne('auftraggeber', e, { geaendertAm: jetztIso() }); nachAenderung(); },
  fallLoeschen(id) {
    const f = S.faelle[id]; if (!f) return;
    // Verlauf und Anlagen entfernt der Server zusammen mit dem Fall; lokal verschwinden sie sofort.
    for (const v of Object.values(S.verlauf)) if (v.fallId === id) delete S.verlauf[v.id];
    for (const a of Object.values(S.anlagen)) if (a.fallId === id) { delete S.anlagen[a.id]; Dateien.loesche(a.id); }
    entferne('faelle', f, { geaendertAm: jetztIso() });
    nachAenderung();
  },
};

// ---------- Dateien der Anlagen (IndexedDB) ----------
const Dateien = {
  adressen: new Map(),
  db() {
    return this._db || (this._db = new Promise((ok, fehler) => {
      const r = indexedDB.open('schadensfaelle', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('dateien');
      r.onsuccess = () => ok(r.result); r.onerror = () => fehler(r.error);
    }));
  },
  async tx(modus, fn) {
    const db = await this.db();
    return new Promise((ok, fehler) => { const t = db.transaction('dateien', modus), q = fn(t.objectStore('dateien')); t.oncomplete = () => ok(q && q.result); t.onerror = () => fehler(t.error); });
  },
  lege(id, blob) { return this.tx('readwrite', s => s.put(blob, id)); },
  hole(id) { return this.tx('readonly', s => s.get(id)).catch(() => null); },
  loesche(id) { const u = this.adressen.get(id); if (u) URL.revokeObjectURL(u); this.adressen.delete(id); return this.tx('readwrite', s => s.delete(id)).catch(() => {}); },
  /** Liefert eine anzeigbare Adresse; lädt die Datei bei Bedarf aus der Cloud nach. */
  async adresse(a) {
    if (this.adressen.has(a.id)) return this.adressen.get(a.id);
    let blob = await this.hole(a.id);
    if (!blob && a.vorhanden && mitCloud() && PIN) {
      const r = await api('anlageLaden', PIN, a.id);
      blob = new Blob([Uint8Array.from(atob(r.base64), z => z.charCodeAt(0))], { type: r.mimeType });
      await this.lege(a.id, blob);
    }
    if (!blob) return null;
    const u = URL.createObjectURL(blob); this.adressen.set(a.id, u); return u;
  },
};
/** Große Fotos auf höchstens 2560 Pixel Kantenlänge verkleinern – spart Übertragung und Speicher. */
async function verkleinere(datei) {
  if (!/^image\/(jpeg|png|webp)$/.test(datei.type) || datei.size < 1.5 * 1024 * 1024) return datei;
  try {
    const bild = await createImageBitmap(datei);
    const faktor = Math.min(1, 2560 / Math.max(bild.width, bild.height));
    const c = Object.assign(document.createElement('canvas'), { width: Math.round(bild.width * faktor), height: Math.round(bild.height * faktor) });
    c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
    const klein = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
    return klein && klein.size < datei.size ? klein : datei;
  } catch { return datei; }
}
const alsBase64 = blob => new Promise((ok, fehler) => { const l = new FileReader(); l.onload = () => ok(String(l.result).split(',')[1] || ''); l.onerror = () => fehler(l.error); l.readAsDataURL(blob); });

// ============================== Cloud ==============================
// Wie bei Tagesdispo: POST als Text (keine CORS-Vorabfrage), Antwort {ok} oder {error}.
async function api(fn, ...args) {
  const r = await fetch(apiUrl(), { method: 'POST', body: JSON.stringify({ fn, args }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j.ok;
}
const TABELLEN = ['faelle', 'verlauf', 'anlagen', 'auftraggeber'];
const CLOUD_API = 3;
const VERALTET = 'Das Cloud-Skript ist veraltet – bitte die neue Code.gs bereitstellen.';
const offeneAnzahl = () => TABELLEN.reduce((n, t) => n + offene(t).length, 0);
const SYNC = { laeuft: false, nochmal: false, fehler: '', zuletzt: 0, timer: 0 };
const ohneLokales = d => Object.fromEntries(Object.entries(d).filter(([k]) => !k.startsWith('_')));
const offene = tabelle => Object.values(S[tabelle]).filter(d => d._dirty);

function planeAbgleich(ms = 1200) { if (!mitCloud()) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(abgleich, ms); zeichneSync(); }

async function abgleich() {
  if (!mitCloud()) return;
  if (!PIN) { anmeldung(); return; }
  if (SYNC.laeuft) { SYNC.nochmal = true; return; }
  SYNC.laeuft = true; SYNC.nochmal = false; zeichneSync();
  try {
    // Ein veraltetes Cloud-Skript würde unbekannte Felder verwerfen – dann lieber gar nicht abgleichen.
    const st = await api('status');
    if (!(st.api >= CLOUD_API)) throw new Error(VERALTET);
    const gesendet = { faelle: offene('faelle'), verlauf: offene('verlauf'), anlagen: offene('anlagen'), auftraggeber: offene('auftraggeber') };
    const marken = new Map(Object.values(gesendet).flat().map(d => [d.id, d._n]));
    const r = await api('sync', PIN, { seit: S.seit, kennung: S.kennung,
      faelle: gesendet.faelle.map(ohneLokales), verlauf: gesendet.verlauf.map(ohneLokales), anlagen: gesendet.anlagen.map(ohneLokales),
      auftraggeber: gesendet.auftraggeber.map(ohneLokales) });

    let neuesVomServer = false;
    for (const tabelle of TABELLEN) {
      // Gesendetes gilt als angekommen, sofern es seit dem Absenden nicht erneut geändert wurde.
      for (const d of gesendet[tabelle]) {
        const lokal = S[tabelle][d.id];
        if (!lokal || lokal._n !== marken.get(d.id)) continue;
        if (lokal.geloescht) delete S[tabelle][d.id]; else lokal._dirty = false;
      }
      for (const fern of r[tabelle] || []) {
        const lokal = S[tabelle][fern.id];
        if (lokal && lokal._dirty) continue; // inzwischen lokal geändert – geht beim nächsten Abgleich hoch
        if (fern.geloescht) {
          if (lokal) { neuesVomServer = true; delete S[tabelle][fern.id]; if (tabelle === 'anlagen') Dateien.loesche(fern.id); }
          continue;
        }
        if (!lokal || JSON.stringify(ohneLokales(lokal)) !== JSON.stringify(fern)) neuesVomServer = true;
        S[tabelle][fern.id] = { ...fern, _n: lokal ? lokal._n : 0 };
      }
    }
    if (S.kennung && r.kennung !== S.kennung) {
      // Der Bestand in der Cloud wurde neu angelegt: alles von diesem Gerät erneut hochladen.
      for (const tabelle of TABELLEN) for (const d of Object.values(S[tabelle])) { d._dirty = true; if (tabelle === 'anlagen') d.vorhanden = false; }
      S.seit = 0; SYNC.nochmal = true;
    } else S.seit = r.rev;
    S.kennung = r.kennung;
    speichere();

    for (const a of alle('anlagen').filter(a => !a.vorhanden && !a._dirty)) {
      const blob = await Dateien.hole(a.id);
      if (!blob) continue; // liegt auf einem anderen Gerät und wird von dort hochgeladen
      await api('anlageHochladen', PIN, a.id, await alsBase64(blob));
      a.vorhanden = true; speichere();
    }
    SYNC.fehler = ''; SYNC.zuletzt = Date.now();
    if (neuesVomServer) zeichne();
  } catch (e) {
    const m = String(e.message || e);
    if (m.includes('GESPERRT')) SYNC.fehler = m.replace(/^.*GESPERRT: /, '');
    else if (m.includes('PIN')) { PIN = ''; try { localStorage.removeItem(PIN_SPEICHER); } catch {} SYNC.fehler = 'PIN erforderlich'; anmeldung(m.includes('falsch')); }
    else SYNC.fehler = navigator.onLine === false || e instanceof TypeError ? 'offline' : m;
  } finally {
    SYNC.laeuft = false; zeichneSync();
    if (SYNC.nochmal) planeAbgleich(300);
  }
}
/** Fragt gelegentlich nach, ob ein anderes Gerät etwas geändert hat. */
async function pruefeStand() {
  if (!mitCloud() || !PIN || SYNC.laeuft || document.hidden) return;
  try { const r = await api('stand', PIN); if (r.rev !== S.seit || r.kennung !== S.kennung) abgleich(); else if (SYNC.fehler === 'offline') { SYNC.fehler = ''; zeichneSync(); } }
  catch { if (offeneAnzahl()) { SYNC.fehler = 'offline'; zeichneSync(); } }
}
function zeichneSync() {
  const el = $('#sync');
  const wartend = offeneAnzahl();
  let text, farbe = 'grau';
  if (!mitCloud()) text = 'Nur auf diesem Gerät';
  else if (!PIN) { text = 'Anmeldung nötig'; farbe = 'gelb'; }
  else if (SYNC.laeuft) text = 'Gleiche ab …';
  else if (SYNC.fehler === 'offline') { text = wartend ? `Offline · ${wartend} Änderung${wartend === 1 ? '' : 'en'} wartet` : 'Offline'; farbe = 'gelb'; }
  else if (SYNC.fehler) { text = SYNC.fehler; farbe = 'rot'; }
  else if (wartend || !SYNC.zuletzt) text = 'Speichere …';
  else { text = 'Cloud aktuell'; farbe = 'gruen'; }
  el.textContent = text; el.className = farbe; el.dataset.zustand = !mitCloud() ? 'lokal' : !PIN ? 'anmelden' : SYNC.laeuft || wartend || !SYNC.zuletzt ? 'beschaeftigt' : SYNC.fehler ? 'fehler' : 'aktuell';
}

let anmeldungOffen = false;
async function anmeldung(falsch = false) {
  if (anmeldungOffen) return; anmeldungOffen = true;
  let eingerichtet = true;
  try { eingerichtet = (await api('status')).eingerichtet; }
  catch { anmeldungOffen = false; SYNC.fehler = 'offline'; zeichneSync(); return; }
  const neu = !eingerichtet;
  dialog(`<form method="dialog" id="pin-form"><h2>${neu ? 'PIN festlegen' : 'PIN eingeben'}</h2>
    <p class="leise">${neu ? 'Diese PIN schützt die Daten in der Cloud. Sie wird auf jedem Gerät einmal abgefragt (mindestens 4 Zeichen).' : 'Die PIN der Schadensfälle-Cloud.'}</p>

    ${neu ? '<label class="feld">PIN wiederholen<input id="pin2" type="password" autocomplete="new-password" required></label>' : ''}
    <div class="dialog-knoepfe"><button class="knopf voll" value="ok">${neu ? 'Festlegen' : 'Anmelden'}</button></div></form>`, { schliessbar: false });

    ereignis.preventDefault();
    const pin = $('#pin1').value, fehler = $('#pin-fehler');
    const zeige = t => { fehler.textContent = t; fehler.hidden = false; };
    if (neu && pin !== $('#pin2').value) { zeige('Die beiden Eingaben stimmen nicht überein.'); return; }
    try {
      if (neu) await api('pinFestlegen', pin);
      await api('anmelden', pin);
      PIN = pin; try { localStorage.setItem(PIN_SPEICHER, PIN); } catch {}
      anmeldungOffen = false; $('#dialog').close(); SYNC.fehler = ''; abgleich();
    } catch (e) {
      const m = String(e.message || e);
      zeige(m.includes('GESPERRT') ? m.replace(/^.*GESPERRT: /, '') : m.includes('falsch') ? 'Die PIN war falsch.' : e instanceof TypeError ? 'Keine Verbindung zur Cloud.' : m);
    }
  };
}

$('#detail').addEventListener('click', e => {

      const url = $('#cloud-url').value.trim();
      if (!/^https?:\/\/.+/.test(url)) { toast('Bitte die vollständige Adresse eintragen (beginnt mit https://).'); break; }
      S.apiUrl = url; S.nurLokal = false; speichere(); zeichne(); abgleich(); break;
    }
    case 'csv': {
      if (!faelle().length) { toast('Es gibt noch keine Fälle zum Exportieren'); break; }

// ============================== E-Mail (nur Windows-App) ==============================
// Die Windows-App spricht über ihren Hauptprozess direkt per IMAP/SMTP mit dem Postfach (wie die
// Android-App). Zuordnung zu den Fällen: Fallnummer im Betreff, Antwortbezug oder ein Absender, der
// bei genau einem offenen Fall als Geschädigter oder Auftraggeber hinterlegt ist.
const MAIL = { konto: null, anbieter: {}, laeuft: false, timer: 0 };
const FALLNUMMER = /\[Fall (\d{4}-\d+)]/;
const mitFallnummer = (betreff, nr) => (FALLNUMMER.test(betreff) ? betreff : `${String(betreff).trim()} [Fall ${nr}]`.trim());
const mails = () => (S.mails = S.mails || {});
const mailZuVerlauf = verlaufId => Object.entries(mails()).map(([id, m]) => ({ messageId: id, ...m })).find(m => m.verlaufId === verlaufId);
const blobAusBase64 = (b64, typ) => new Blob([Uint8Array.from(atob(b64), z => z.charCodeAt(0))], { type: typ });

/** Mail im Verlauf ablegen (von dort wandert sie in die Cloud) und für „Antworten“ merken. */
function vermerkeMail(f, mail, text, eingehend) {
  const v = merke('verlauf', { id: uuid(), fallId: f.id, zeitpunkt: mail.zeitpunkt || jetztIso(), typ: eingehend ? 'EMAIL_EINGANG' : 'EMAIL_AUSGANG', text: text.slice(0, 15000) });
  mails()[mail.messageId] = { fallId: f.id, verlaufId: v.id, eingehend, von: mail.von, betreff: mail.betreff, text: (mail.text || '').slice(0, 15000), zeitpunkt: v.zeitpunkt };
  const neu = { ...S.faelle[f.id] };
  // Eine Antwort soll nicht untergehen: Wiedervorlage rückt auf heute.
  if (eingehend && status(neu).offen && (!neu.wiedervorlageAm || neu.wiedervorlageAm > heute())) Object.assign(neu, { wiedervorlageAm: heute(), wiedervorlageNotiz: 'Neue E-Mail beantworten' });
  fallMerken(neu);
}

function ordneZu(m) {
  const nr = (m.betreff.match(FALLNUMMER) || [])[1];
  const perNummer = nr && faelle().find(f => f.fallnummer === nr);
  if (perNummer) return perNummer;
  for (const bezug of m.antwortAuf) { const alt = mails()[bezug]; if (alt && S.faelle[alt.fallId] && !S.faelle[alt.fallId].geloescht) return S.faelle[alt.fallId]; }
  const passend = faelle().filter(f => status(f).offen && [f.kundeEmail, f.auftraggeberEmail].some(a => (a || '').trim().toLowerCase() === m.von));
  return passend.length === 1 ? passend[0] : null;
}

async function postfachAbrufen(sichtbar = false) {
  if (!MAIL.konto || MAIL.laeuft) return [];
  MAIL.laeuft = true;
  if (sichtbar) toast('Postfach wird abgerufen …');
  try {
    const stand = S.mailStand || {};
    const r = await window.desktop.mail.hole({ letzteUid: stand.letzteUid || 0, uidValidity: stand.uidValidity || 0 });
    const neu = [];
    for (const m of r.mails.sort((a, b) => a.zeitpunkt.localeCompare(b.zeitpunkt))) {
      if (m.von === MAIL.konto.adresse.toLowerCase() || mails()[m.messageId]) continue;
      const f = ordneZu(m); if (!f) continue;
      for (const a of m.anhaenge) await Aktionen.anlageHinzufuegen(f.id, new File([blobAusBase64(a.base64, a.mimeType)], a.name, { type: a.mimeType }));
      const absender = m.vonName ? `${m.vonName} <${m.von}>` : m.von;
      const anh = m.anhaenge.length ? '\nAnhänge (zum Fall genommen): ' + m.anhaenge.map(a => a.name).join(', ') : '';
      vermerkeMail(f, m, `Von: ${absender}\nBetreff: ${m.betreff}${anh}\n\n${m.text}`, true);
      neu.push({ f, absender, betreff: m.betreff });
    }
    S.mailStand = { letzteUid: r.letzteUid, uidValidity: r.uidValidity, letzterAbruf: Date.now(), fehler: '' };
    nachAenderung();
    if (neu.length) {
      const titel = neu.length === 1 ? `Neue E-Mail zu Fall ${neu[0].f.fallnummer}` : `${neu.length} neue E-Mails zu Schadensfällen`;
      window.desktop.benachrichtige(titel, neu.map(n => `${n.f.fallnummer} · ${n.absender}: ${n.betreff}`).join('\n'), neu.length === 1 ? '#/fall/' + neu[0].f.id : '#/').catch(() => {});
    }
    if (sichtbar) toast(neu.length ? `${neu.length} neue E-Mail(s) den Fällen zugeordnet` : 'Keine neuen E-Mails zu Fällen');
    return neu;
  } catch (e) {
    S.mailStand = { ...(S.mailStand || {}), fehler: e.message }; speichere();
    if (sichtbar) toast(e.message, 6000);
    if (route().art === 'einstellungen') zeichne();
    return [];
  } finally { MAIL.laeuft = false; }
}

function mailVorlagen(f) {
  const gruppen = Object.entries(EMPFAENGER).map(([e, info]) => {
    const fehlt = e !== 'DRITTE' && !info.email(f) ? ' – keine E-Mail-Adresse hinterlegt' : '';
    return `<h3>${info.ueberschrift}${fehlt}</h3><button class="vorlage" data-leer="${e}"><b>Ohne Vorlage</b><br><span class="leise">Nur Anrede und Grußformel</span></button>` +
      Object.entries(VORLAGEN).filter(([, v]) => v[2] === e).map(([wert, [titel, beschreibung]]) => `<button class="vorlage" data-vorlage="${wert}"><b>${titel}</b><br><span class="leise">${beschreibung}</span></button>`).join('');
  }).join('');
  dialog(`<h2>E-Mail schreiben</h2>${gruppen}<div class="dialog-knoepfe"><button class="knopf text" data-zu>Abbrechen</button></div>`).onclick = e => {
    const v = e.target.closest('[data-vorlage]'), l = e.target.closest('[data-leer]'); if (!v && !l) return;
    $('#dialog').onclick = null;
    mailSchreiben(f, v ? { vorlage: v.dataset.vorlage } : { empfaenger: l.dataset.leer });
  };
}

/** Rahmen ohne Vorlage: Anrede an den Empfänger und Grußformel. */
function ohneVorlage(e, f) {
  const vorlage = vorlageText('SACHSTANDSANFRAGE', f, S.einstellungen).text;
  const gruss = vorlage.slice(vorlage.lastIndexOf('Mit freundlichen Grüßen'));
  const name = (EMPFAENGER[e].name(f) || '').trim();
  const vom = d => (d ? ' vom ' + datumText(d) : '');
  const was = e === 'GESCHAEDIGTER' ? 'Ihre Schadensmeldung' + vom(f.meldedatum || f.schadensdatum) : 'Schadensfall' + vom(f.schadensdatum);
  return { betreff: [was, zeichenDesAuftraggebers(e, f)].filter(Boolean).join(' – '), text: `${name ? `Guten Tag ${name},` : 'Sehr geehrte Damen und Herren,'}\n\n\n\n${gruss}` };
}

function mailSchreiben(f, { vorlage, empfaenger, antwortAufVerlauf } = {}) {
  let an = '', betreff = '', text = '', antwortAuf = '', art = empfaenger || 'GESCHAEDIGTER';
  const verlauf = verlaufVon(f.id), schritte = schritteWaehlbar(verlauf), vorauswahl = schritteVorauswahl(f, verlauf);
  const alt = antwortAufVerlauf && mailZuVerlauf(antwortAufVerlauf);
  if (alt) {
    antwortAuf = alt.messageId; an = alt.von;
    betreff = /^(re|aw):/i.test(alt.betreff) ? alt.betreff : 'Re: ' + alt.betreff;
    const e = ['GESCHAEDIGTER', 'AUFTRAGGEBER'].find(x => EMPFAENGER[x].email(f).toLowerCase() === alt.von) || 'DRITTE';
    art = e;
    text = ohneVorlage(e, f).text + `\n\nAm ${zeitText(alt.zeitpunkt)} schrieb ${alt.von}:\n` + alt.text.split('\n').map(z => '> ' + z).join('\n');
  } else if (vorlage) {
    const n = vorlageText(vorlage, f, S.einstellungen); an = EMPFAENGER[n.empfaenger].email(f); betreff = n.betreff; text = n.text; art = n.empfaenger;
    // Beim Sachstand gleich mitteilen, was seit der letzten Mail an den Auftraggeber passiert ist.
    const neu = schritte.filter(v => vorauswahl.has(v.id));
    if (vorlage === 'SACHSTAND_AUFTRAGGEBER' && neu.length) text = schritteEinfuegen(text, schritteAlsText(neu, f));
  } else {
    const e = empfaenger || 'GESCHAEDIGTER', n = ohneVorlage(e, f); an = EMPFAENGER[e].email(f); betreff = n.betreff; text = n.text;
  }
  // „[Fall …]“ ersetzt beim Versand aus der App den Zusatz „unser Vorgang …“.
  betreff = mitZeichen(mitFallnummer(betreff.replace(` – unser Vorgang ${f.fallnummer}`, ''), f.fallnummer), art, f);
  const anl = anlagenVon(f.id);
  const agMail = (f.auftraggeberEmail || '').trim();
  const bccMoeglich = agMail && !an.toLowerCase().includes(agMail.toLowerCase());
  const anlageZeile = (a, an = false) => `<label class="auswahl"><input type="checkbox" name="anlage" value="${a.id}"${an ? ' checked' : ''}> ${esc(a.anzeigename)}</label>`;
  dialog(`<form method="dialog" id="mail-form"><h2>E-Mail · Fall ${esc(f.fallnummer)}</h2>
    <p class="fehlertext" id="mail-fehler" hidden></p>
    <label class="feld">An<input name="an" value="${esc(an)}"></label>
    <label class="feld">Betreff<input name="betreff" value="${esc(betreff)}"><span class="leise">Die Fallnummer im Betreff ordnet Antworten automatisch diesem Fall zu.</span></label>
    <label class="feld">Nachricht<textarea name="text" style="min-height:260px">${esc(text)}</textarea></label>
    ${schritte.length ? `<details id="mail-schritte"><summary class="knopf" style="display:inline-flex;margin-bottom:8px">Bearbeitungsschritte einfügen</summary>
      <p class="leise">Vorausgewählt ist alles seit der letzten Mail an den Auftraggeber. Adressen und Wiedervorlagen werden nicht übernommen.</p>
      ${schritte.map(v => `<label class="auswahl"><input type="checkbox" name="schritt" value="${v.id}"${vorauswahl.has(v.id) ? ' checked' : ''}> <span><span class="leise">${zeitText(v.zeitpunkt)}</span><br>${esc(schrittText(v, f))}</span></label>`).join('')}
      <button type="button" class="knopf tonal" id="schritte-einfuegen" style="margin:6px 0 10px">Einfügen</button></details>` : ''}
    ${bccMoeglich ? `<label class="auswahl" id="mail-bcc-zeile"><input type="checkbox" name="bcc" id="mail-bcc"> <span>Auftraggeber in BCC<br><span class="leise">${esc(agMail)}</span></span></label>` : ''}
    <h3>Anhänge</h3><div id="mail-anlagen">${anl.map(a => anlageZeile(a)).join('')}</div>
    <label class="knopf" style="margin-top:6px">📎 Datei vom Rechner anhängen<input type="file" id="mail-datei" multiple hidden></label>
    <p class="leise">Neue Dateien werden auch beim Fall abgelegt.</p>
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll" id="mail-senden">Senden</button></div></form>`);
  const knopfSchritte = $('#schritte-einfuegen');
  if (knopfSchritte) knopfSchritte.onclick = () => {
    const gewaehlt = [...document.querySelectorAll('#mail-form [name=schritt]:checked')].map(c => S.verlauf[c.value]).filter(Boolean);
    if (!gewaehlt.length) return;
    const feld = $('#mail-form [name=text]'); feld.value = schritteEinfuegen(feld.value, schritteAlsText(gewaehlt, f));
    $('#mail-schritte').open = false;
  };
  $('#mail-datei').onchange = async ev => {
    for (const datei of [...ev.target.files]) {
      const a = await Aktionen.anlageHinzufuegen(f.id, datei);
      if (a) $('#mail-anlagen').insertAdjacentHTML('beforeend', anlageZeile(a, true));
    }
    ev.target.value = '';
  };
  $('#mail-form').onsubmit = async ev => {
    ev.preventDefault();
    const w = new FormData(ev.target), fehler = $('#mail-fehler');
    const zeige = t => { fehler.textContent = t; fehler.hidden = false; };
    const adressen = String(w.get('an')).split(/[,;]/).map(x => x.trim()).filter(Boolean);
    if (!adressen.length || adressen.some(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x))) { zeige('Bitte eine gültige Empfängeradresse eintragen.'); return; }
    const gewaehlt = w.getAll('anlage').map(id => S.anlagen[id]).filter(Boolean);
    if (gewaehlt.reduce((n, a) => n + (a.groesseBytes || 0), 0) > 20 * 1024 * 1024) { zeige('Die Anhänge sind zusammen größer als 20 MB – das nehmen viele Postfächer nicht an.'); return; }
    const knopf = $('#mail-senden'); knopf.disabled = true; knopf.textContent = 'Sendet …';
    try {
      const anhaenge = [];
      for (const a of gewaehlt) {
        await Dateien.adresse(a); // lädt bei Bedarf aus der Cloud
        const blob = await Dateien.hole(a.id); if (!blob) throw new Error(`„${a.anzeigename}“ liegt nicht auf diesem Rechner.`);
        anhaenge.push({ name: a.anzeigename, mimeType: a.mimeType, base64: await alsBase64(blob) });
      }
      const bcc = w.get('bcc') && !adressen.some(x => x.toLowerCase() === agMail.toLowerCase()) ? agMail : '';
      const entwurf = { an: adressen.join(', '), bcc, betreff: String(w.get('betreff')), text: String(w.get('text')), antwortAuf, anhaenge };
      const messageId = await window.desktop.mail.sende(entwurf);
      const anh = anhaenge.length ? '\nAnhänge: ' + anhaenge.map(a => a.name).join(', ') : '';
      vermerkeMail(S.faelle[f.id], { messageId, von: MAIL.konto.adresse, betreff: entwurf.betreff, text: entwurf.text, zeitpunkt: jetztIso() },
        `An: ${entwurf.an}${bcc ? '\nBcc: ' + bcc : ''}\nBetreff: ${entwurf.betreff}${anh}\n\n${entwurf.text}`, false);
      $('#dialog').close(); nachAenderung(); toast('E-Mail gesendet');
    } catch (e) {
      zeige(e.message || 'Die E-Mail konnte nicht gesendet werden.'); knopf.disabled = false; knopf.textContent = 'Senden';
    }
  };
}

function mailEinstellungen() {
  const k = MAIL.konto, st = S.mailStand || {};
  if (!k) return `<div class="karte block"><h3>E-Mail</h3><p class="leise" style="margin-bottom:8px">Mit deinem Postfach schreibst und empfängst du die Mails zu den Fällen direkt in der App. Antworten werden über die Fallnummer im Betreff automatisch dem Fall zugeordnet.</p>

  return `<div class="karte block"><h3>E-Mail</h3><p>${esc(k.adresse)}</p><p class="${st.fehler ? 'fehlertext' : 'leise'}" style="margin:4px 0 8px">${esc(zustand)}</p>

}

      <div class="chips">${Object.entries(liste).map(([id, x]) => `<button type="button" class="chip" data-anbieter="${id}" aria-pressed="${id === wahl}">${esc(x.label)}</button>`).join('')}</div>
      <label class="feld">E-Mail-Adresse<input name="adresse" type="email" required value="${esc(werte.adresse || '')}"></label>

        <label class="feld">SMTP-Port<input name="smtpPort" inputmode="numeric" value="${esc(werte.smtpPort || k.smtpPort || 465)}"></label>
        <label class="auswahl"><input type="checkbox" name="starttls" ${k.smtpSicherheit === 'STARTTLS' ? 'checked' : ''}> SMTP mit STARTTLS (sonst SSL)</label>`
        : `<p class="leise">Server: ${esc(a.imapHost)} (IMAP) · ${esc(a.smtpHost)} (SMTP)</p>`}
      <p class="leise">Das Passwort wird mit deinem Windows-Konto verschlüsselt und nur auf diesem Rechner gespeichert. Die App liest ausschließlich Mails, die zu einem Fall gehören, und verändert im Postfach nichts.</p>
      <p class="fehlertext" id="konto-fehler" hidden></p>
      <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll" id="konto-verbinden">Verbinden</button></div></form>`);
    $('#konto-form').onclick = e => { const c = e.target.closest('[data-anbieter]'); if (c) { wahl = c.dataset.anbieter; male(); } };
    $('#konto-form').onsubmit = async ev => {
      ev.preventDefault();
      const w = Object.fromEntries(new FormData(ev.target)), fehler = $('#konto-fehler'), knopf = $('#konto-verbinden');
      const server = wahl === 'EIGENER'
        ? { imapHost: w.imapHost.trim(), imapPort: Number(w.imapPort) || 993, imapSicherheit: 'SSL', smtpHost: w.smtpHost.trim(), smtpPort: Number(w.smtpPort) || 465, smtpSicherheit: w.starttls ? 'STARTTLS' : 'SSL' }
        : (({ label, ...rest }) => rest)(MAIL.anbieter[wahl]);
      const konfig = { adresse: w.adresse.trim(), benutzer: w.benutzer.trim() || w.adresse.trim(), name: S.einstellungen.firma || '', ...server };
      knopf.disabled = true; knopf.textContent = 'Prüfe …'; fehler.hidden = true;
      try {
        MAIL.konto = await window.desktop.mail.einrichten(konfig, w.passwort);
        if (MAIL.konto.adresse !== k.adresse) S.mailStand = {};
        $('#dialog').close(); speichere(); zeichne(); toast('E-Mail-Konto verbunden'); postfachAbrufen();
      } catch (e) { fehler.textContent = e.message; fehler.hidden = false; knopf.disabled = false; knopf.textContent = 'Verbinden'; }
    };
  };
  male();
}

async function mailStart() {
  if (!window.desktop) return;
  try { MAIL.anbieter = await window.desktop.mail.anbieter(); MAIL.konto = await window.desktop.mail.konto(); } catch { return; }
  window.desktop.beiZiel(ziel => gehe(ziel));
  zeichne();
  if (MAIL.konto) postfachAbrufen();
  MAIL.timer = setInterval(() => postfachAbrufen(), 15 * 60 * 1000);
}

// ============================== Start ==============================
window.addEventListener('hashchange', zeichne);
window.addEventListener('beforeunload', e => { if ($('#fall-form') && formularWerte() !== formularStand) e.preventDefault(); });
window.addEventListener('online', () => abgleich());
document.addEventListener('visibilitychange', () => { if (!document.hidden) { zeichne(); pruefeStand(); } });
setInterval(pruefeStand, 45000);
zeichne();
if (mitCloud()) abgleich();
mailStart();
window.__appBereit = true;
</script>
</body>
</html>
