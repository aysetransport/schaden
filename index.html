// ============================== Touren (Tourenplanung) ==============================
/**
 * Die Tourenplanung (früher eigene Seite aysetransport.github.io/tourenplanung) läuft unverändert als touren.html
 * mit ihrem eigenen Cloud-Skript (Google-Tabelle) – alle bisherigen Daten bleiben dort. Der Rahmen wird nur einmal
 * geladen und beim Wechsel der Reiter nur versteckt, damit ungespeicherte Eingaben nicht verloren gehen.
 */
function zeigeTouren(an) {
  document.body.classList.toggle('touren', an);
  let rahmen = $('#touren-rahmen');
  if (!an) { if (rahmen) rahmen.hidden = true; return; }
  if (!rahmen) {
    rahmen = Object.assign(document.createElement('div'), { id: 'touren-rahmen' });
    rahmen.innerHTML = '<iframe src="touren.html" title="Tourenplanung" id="touren-frame"></iframe>';
    document.body.appendChild(rahmen);
  }
  rahmen.hidden = false;
  toureHoehe();
}
function toureHoehe() {
  const rahmen = $('#touren-rahmen'); if (!rahmen || rahmen.hidden) return;
  rahmen.style.setProperty('--touren-hoehe', Math.max(320, window.innerHeight - rahmen.getBoundingClientRect().top - 1) + 'px');
}
window.addEventListener('resize', toureHoehe);

// ---------- Querverbindungen zur Tourenplanung ----------
/**
 * Die Tourenplanung hat ihre Stammdaten (Fahrzeuge, Personal, Einsatzarten, Auftraggeber) und die Touren je Tag in
 * ihrer Google-Tabelle. Das CRM liest sie mit derselben PIN (gilt für die Sitzung, wie in der Tourenplanung selbst),
 * gleicht Fahrzeuge und Auftraggeber ab und zeigt Touren bei Fahrzeug, Firma und Schadensfall an.
 */
const TP = { url: 'https://script.google.com/macros/s/AKfycby5KUa5VlCeza6mLZCDt1hajWjMGLXFjD_fW847ERpWn12DC2xZZfOlezVpBUv63WTG2g/exec', tage: {}, berichte: {} };
const tpPin = () => { try { return sessionStorage.getItem('tp-pin') || ''; } catch { return ''; } };
async function tpApi(name, args) {
  const pin = tpPin();
  if (!pin) throw new Error('TP_ANMELDEN');
  const r = await (await fetch(TP.url, { method: 'POST', body: JSON.stringify({ pin, name, args }) })).json();
  if (r.error) {
    if (/PIN/i.test(r.error) && !/GESPERRT/.test(r.error)) { tpTrennen(); throw new Error('TP_ANMELDEN'); }
    throw new Error(String(r.error).replace(/^.*GESPERRT: /, ''));
  }
  return r.ok;
}
/** Ein Tag der Tourenplanung (mit allen Stammdaten); 5 Minuten zwischengespeichert. */
async function tpTag(tag, frisch = false) {
  const c = TP.tage[tag];
  if (!frisch && c && Date.now() - c.zeit < 300000) return c.d;
  const d = await tpApi('getDay', [tag]);
  TP.tage[tag] = { d, zeit: Date.now() };
  // Mitarbeiter für Vorschläge und die Liste merken (nur auf diesem Gerät)
  S.tpPersonal = (d.personal || []).map(p => ({ Name: p.Name, Rolle: p.Rolle, Telefon: p.Telefon ? String(p.Telefon) : '' })).filter(p => p.Name);
  S.tpFahrzeuge = (d.fahrzeuge || []).map(f => String(f.Kennzeichen || '')).filter(Boolean);
  speichere();
  return d;
}
/** Lädt einen Tag; ohne PIN erst anmelden und danach `nochmal` aufrufen. Liefert null, wenn es (noch) nicht geht. */
async function tpLaden(tag, nochmal, frisch = false) {
  try { return await tpTag(tag, frisch); }
  catch (e) { if (e.message === 'TP_ANMELDEN') tpAnmelden(nochmal); else toast('Tourenplanung nicht erreichbar: ' + e.message); return null; }
}
const tpTrennen = () => { try { sessionStorage.removeItem('tp-pin'); } catch {} TP.tage = {}; TP.berichte = {}; };
/** Fragt die PIN der Tourenplanung ab (gilt auch für den Reiter „Touren“) und ruft danach `dann` auf. */
function tpAnmelden(dann) {
  dialog(`<form method="dialog" id="tp-form"><h2>Tourenplanung verbinden</h2>
    <p class="leise">Die PIN der Tourenplanung. Sie gilt, bis die App geschlossen wird – auch im Reiter „Touren“.</p>
    <p class="fehlertext" id="tp-fehler" hidden></p>
    <label class="feld">PIN<input id="tp-pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll">Verbinden</button></div></form>`);
  $('#tp-form').onsubmit = async ev => {
    ev.preventDefault();
    const pin = $('#tp-pin').value.trim(), fehler = $('#tp-fehler');
    try { sessionStorage.setItem('tp-pin', pin); } catch {}
    try { await tpTag(heute(), true); $('#dialog').close(); toast('Mit der Tourenplanung verbunden'); if (dann) dann(); }
    catch (e) { fehler.textContent = e.message === 'TP_ANMELDEN' ? 'Die PIN war falsch.' : 'Keine Verbindung zur Tourenplanung: ' + e.message; fehler.hidden = false; }
  };
}
const tpVerbinden = (text = 'Mit der Tourenplanung verbinden') => `<button class="knopf text" data-tp-verbinden>${esc(text)}</button>`;
const tpPersonen = t => ['Fahrer', 'Beifahrer1', 'Beifahrer2', 'Beifahrer3', 'Beifahrer4', 'Beifahrer5'].map(k => t[k]).filter(Boolean);
const tpTourText = t => [t.TourNr && 'Tour ' + t.TourNr, t.Auftraggeber, t.Name, t.Uhrzeit && 'ab ' + t.Uhrzeit, t.Einsatzart].filter(Boolean).join(' · ');

/** Füllt einen Platzhalter, sobald die Daten der Tourenplanung da sind (ohne Verbindung: Knopf zum Verbinden). */
async function tpFuelle(id, arbeit) {
  const el = () => document.getElementById(id);
  if (!el()) return;
  if (!tpPin()) { el().innerHTML = tpVerbinden(); return; }
  el().innerHTML = '<p class="leise">Lade aus der Tourenplanung …</p>';
  try { const html = await arbeit(); if (el()) el().innerHTML = html; }
  catch (e) { if (el()) el().innerHTML = e.message === 'TP_ANMELDEN' ? tpVerbinden() : `<p class="leise">Tourenplanung nicht erreichbar: ${esc(e.message)}</p>`; }
}

/** Fahrzeug: heutige Tour laut Tourenplanung. */
function tpFahrzeugInfo(z) {
  tpFuelle('fz-touren', async () => {
    const d = await tpTag(heute()), kz = kzNormal(z.kennzeichen);
    const touren = (d.tours || []).filter(t => kzNormal(t.Kennzeichen) === kz);
    const imStamm = (d.fahrzeuge || []).some(f => kzNormal(f.Kennzeichen) === kz);
    return (touren.length ? touren.map(t => `<div class="vorlage"><b>${esc(tpTourText(t))}</b><br><span class="leise">${esc(tpPersonen(t).join(', ') || 'noch ohne Team')}</span></div>`).join('')
      : '<p class="leise">Heute nicht eingeplant.</p>') + (imStamm ? '' : '<p class="leise">Dieses Fahrzeug fehlt in den Stammdaten der Tourenplanung – über ⚙ → Tourenplanung abgleichen.</p>');
  });
}

/** Firma: Touren diesen und letzten Monat laut Tourenplanung (Auftraggeber-Bericht). */
function tpFirmaInfo(firma) {
  tpFuelle('firma-touren', async () => {
    const monat = d => d.toISOString().slice(0, 7), jetzt = new Date(), vor = new Date(jetzt.getFullYear(), jetzt.getMonth() - 1, 15);
    const zeile = async m => {
      const von = m + '-01', bis = isoTag(new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0));
      const k = von + bis, c = TP.berichte[k];
      const p = c && Date.now() - c.zeit < 600000 ? c.p : (TP.berichte[k] = { p: await tpApi('getAuftragsBericht', [von, bis]), zeit: Date.now() }).p;
      const name = Object.keys(p || {}).find(n => normal(n) === normal(firma.name));
      if (!name) return { m, summe: 0, arten: [] };
      const arten = Object.entries(p[name].arten || {}).map(([art, tage]) => [art, Object.values(tage).reduce((a, b) => a + b, 0)]).filter(([, n]) => n);
      return { m, summe: arten.reduce((a, [, n]) => a + n, 0), arten };
    };
    const [dies, letzter] = await Promise.all([zeile(monat(new Date(jetzt.getFullYear(), jetzt.getMonth(), 15))), zeile(monat(vor))]);
    const text = z => `<b>${z.summe}</b> Tour${z.summe === 1 ? '' : 'en'}${z.arten.length ? ' <span class="leise">(' + esc(z.arten.map(([a, n]) => `${n}× ${a}`).join(', ')) + ')</span>' : ''}`;
    if (!dies.summe && !letzter.summe) return '<p class="leise">In der Tourenplanung diesen und letzten Monat keine Touren für diese Firma.</p>';
    return `<dl><dt>Dieser Monat</dt><dd>${text(dies)}</dd><dt>Letzter Monat</dt><dd>${text(letzter)}</dd></dl>`;
  });
}

/** Schadensfall: Tour, Fahrzeug, Fahrer und Beifahrer des Schadenstags aus der Tourenplanung übernehmen. */
async function tpInsFormular() {
  const form = $('#fall-form'), wert = n => form.querySelector(`[name="${n}"]`).value.trim(), setze = (n, w) => { if (w) form.querySelector(`[name="${n}"]`).value = w; };
  const tag = wert('schadensdatum') || heute();
  const d = await tpLaden(tag, tpInsFormular);
  if (!d) return;
  const touren = (d.tours || []).filter(t => t.Kennzeichen || t.Fahrer);
  if (!touren.length) { toast(`Am ${datumText(tag)} gibt es in der Tourenplanung keine Touren.`); return; }
  const kz = kzNormal(wert('fahrzeug')), nr = wert('tour').toLowerCase();
  const passend = touren.filter(t => (kz && kzNormal(t.Kennzeichen) === kz) || (nr && String(t.TourNr || '').toLowerCase() === nr));
  const uebernehmen = t => {
    setze('fahrzeug', t.Kennzeichen); setze('tour', [t.TourNr, t.Name].filter(Boolean).join(' – '));
    setze('fahrer', t.Fahrer); setze('beifahrer1', t.Beifahrer1); setze('beifahrer2', t.Beifahrer2);
    if (t.Auftraggeber && !wert('auftraggeber')) {
      const firma = firmaZumNamen(t.Auftraggeber);
      setze('auftraggeber', firma ? firma.name : t.Auftraggeber);
    }
    toast('Aus der Tourenplanung übernommen');
  };
  const liste = passend.length ? passend : touren;
  if (liste.length === 1) { uebernehmen(liste[0]); return; }
  dialog(`<h2>Welche Tour am ${esc(datumText(tag))}?</h2><div id="tp-wahl">${liste.map((t, i) =>
    `<button class="vorlage" data-tp-tour="${i}"><b>${esc(t.Kennzeichen || 'ohne Fahrzeug')} · ${esc(tpTourText(t))}</b><br><span class="leise">${esc(tpPersonen(t).join(', '))}</span></button>`).join('')}</div>
    <div class="dialog-knoepfe"><button class="knopf text" data-zu>Abbrechen</button></div>`);
  $('#tp-wahl').onclick = e => { const b = e.target.closest('[data-tp-tour]'); if (!b) return; $('#dialog').close(); uebernehmen(liste[Number(b.dataset.tpTour)]); };
}

/** Mitarbeiter der Tourenplanung: wer ist heute wo eingeteilt, wer fehlt. */
async function tpMitarbeiter() {
  const tag = heute(), d = await tpLaden(tag, tpMitarbeiter);
  if (!d) return;
  const einsatz = {};
  for (const t of d.tours || []) for (const n of tpPersonen(t)) einsatz[n] = t;
  const weg = {};
  for (const a of d.abwesenheiten || []) if (a.Von <= tag && tag <= a.Bis) weg[a.Name] = a.Grund || 'abwesend';
  const personen = [...(d.personal || [])].filter(p => p.Name).sort((a, b) => String(a.Name).localeCompare(String(b.Name), 'de'));
  dialog(`<h2>Mitarbeiter heute (${esc(datumText(tag))})</h2>
    <p class="leise">Aus der Tourenplanung. Ändern unter Reiter „Touren“ → Stammdaten bzw. Abwesenheiten.</p>
    <div id="tp-personal">${personen.map(p => {
      const t = einsatz[p.Name], tel = p.Telefon ? String(p.Telefon) : '';
      return `<div class="zeile eng" style="margin:6px 0"><div class="fuell"><b>${esc(p.Name)}</b> <span class="leise">${esc(p.Rolle || '')}</span><br>
        <span class="${weg[p.Name] ? '' : 'leise'}" style="${weg[p.Name] ? 'color:var(--rot-t)' : ''}">${esc(weg[p.Name] ? weg[p.Name] : t ? (t.Kennzeichen || '') + ' · ' + tpTourText(t) : 'nicht eingeteilt')}</span></div>
        ${tel ? `<a class="knopf text" href="tel:${esc(tel.replace(/[^\d+]/g, ''))}">☎ ${esc(tel)}</a>` : ''}</div>`;

}

/**
 * Stammdaten abgleichen: Fahrzeuge und Auftraggeber der Tourenplanung kommen ins CRM; aktive Fahrzeuge des CRM
 * (und auf Wunsch aktive Firmen) kommen in die Tourenplanung. Vorher wird gezeigt, was passiert.
 */
async function tpAbgleich() {
  const d = await tpLaden(heute(), tpAbgleich, true);
  if (!d) return;
  const kzCrm = new Set(alle('fahrzeuge').map(z => kzNormal(z.kennzeichen)));
  const kzTp = new Set((d.fahrzeuge || []).map(f => kzNormal(f.Kennzeichen)).filter(Boolean));
  const fzInsCrm = (d.fahrzeuge || []).filter(f => f.Kennzeichen && !kzCrm.has(kzNormal(f.Kennzeichen)));
  const fzInsTp = fahrzeugListe().filter(z => z.status !== 'STILLGELEGT' && z.kennzeichen && !kzTp.has(kzNormal(z.kennzeichen)));
  const agTp = new Set((d.auftraggeber || []).map(a => normal(a.Auftraggeber)).filter(Boolean));
  const agInsCrm = [...new Map((d.auftraggeber || []).filter(a => a.Auftraggeber && !firmaZumNamen(a.Auftraggeber)).map(a => [normal(a.Auftraggeber), a])).values()];
  const agInsTp = auftraggeberListe().filter(f => f.status === 'AKTIV' && !agTp.has(normal(f.name)));
  const liste = (titel, namen) => `<h3>${titel} (${namen.length})</h3>${namen.length ? `<p>${esc(namen.join(', '))}</p>` : '<p class="leise">Nichts zu tun.</p>'}`;
  dialog(`<form method="dialog" id="tp-abgleich"><h2>Stammdaten mit der Tourenplanung abgleichen</h2>
    ${liste('Fahrzeuge aus der Tourenplanung ins CRM', fzInsCrm.map(f => f.Kennzeichen))}
    ${liste('Fahrzeuge aus dem CRM-Fuhrpark in die Tourenplanung', fzInsTp.map(z => z.kennzeichen))}
    ${liste('Auftraggeber aus der Tourenplanung als Firmen ins CRM', agInsCrm.map(a => a.Auftraggeber))}
    ${agInsTp.length ? `<label class="auswahl"><input type="checkbox" id="tp-ag-hin"> Auch die ${agInsTp.length} aktiven CRM-Firmen als Auftraggeber in die Tourenplanung übernehmen</label>` : ''}
    <p class="leise">Mitarbeiter pflegt die Tourenplanung (Reiter „Touren“ → Stammdaten); das CRM zeigt sie unter Fuhrpark → Mitarbeiter und schlägt sie als Fahrer vor.</p>
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll">Abgleichen</button></div></form>`);
  $('#tp-abgleich').onsubmit = async ev => {
    ev.preventDefault();
    const agHin = $('#tp-ag-hin') && $('#tp-ag-hin').checked;
    $('#dialog').close();
    try {
      for (const f of fzInsCrm) {
        const zgg = Number(String(f.zGG_kg || '').replace(/\D/g, '')) || null;
        const rest = Object.entries(f).filter(([k, v]) => !['Kennzeichen', 'zGG_kg'].includes(k) && v !== '' && v != null).map(([k, v]) => `${k.replace(/_/g, ' ')}: ${v}`);
        FuhrparkAktionen.speichern({ kennzeichen: f.Kennzeichen, art: zgg && zgg > 3500 ? 'LKW' : 'TRANSPORTER', status: 'AKTIV', zgg, notiz: rest.length ? 'Aus der Tourenplanung – ' + rest.join(', ') : 'Aus der Tourenplanung' });
      }
      for (const a of agInsCrm) Aktionen.firmaSpeichern({ name: String(a.Auftraggeber).trim(), status: 'AKTIV', notizen: 'Aus der Tourenplanung übernommen' });
      const neueZeile = (tab, werte) => {
        const z = {};
        for (const c of d.spalten[tab] || []) z[c] = d.auswahl && d.auswahl[c] ? d.auswahl[c][0] : '';
        return Object.assign(z, werte);
      };
      if (fzInsTp.length) {
        const zeilen = fzInsTp.map(z => neueZeile('Fahrzeuge', { Kennzeichen: z.kennzeichen, ...((d.spalten.Fahrzeuge || []).includes('zGG_kg') && z.zgg ? { zGG_kg: String(z.zgg) } : {}) }));
        await tpApi('saveTable', ['Fahrzeuge', [...d.fahrzeuge, ...zeilen], d.fahrzeuge]);
      }
      if (agHin && agInsTp.length) {
        const zeilen = agInsTp.map(f => neueZeile('Auftraggeber', { Auftraggeber: f.name }));
        await tpApi('saveTable', ['Auftraggeber', [...d.auftraggeber, ...zeilen], d.auftraggeber]);
      }
      TP.tage = {};
      toast(`Abgeglichen: ${fzInsCrm.length + agInsCrm.length} ins CRM, ${fzInsTp.length + (agHin ? agInsTp.length : 0)} in die Tourenplanung`, 6000);
      // Die Tourenplanung im Reiter „Touren“ neu laden, damit sie die neuen Stammdaten zeigt
      const frame = $('#touren-frame'); if (frame && frame.contentWindow) try { frame.contentWindow.location.reload(); } catch {}
    } catch (e) { toast('Abgleich nicht vollständig: ' + (e.message === 'TP_ANMELDEN' ? 'PIN der Tourenplanung fehlt' : e.message), 7000); }
  };
}

/** Gültiger Preis je Bezeichnung zum Stichtag (der jüngste mit „gültig ab“ ≤ Stichtag). */
function preiseZum(firmaId, stichtag) {
  const beste = new Map();
  for (const p of vonFirma('preise', firmaId)) {
    if (p.gueltigAb && p.gueltigAb > stichtag) continue;
    const k = normal(p.bezeichnung), alt = beste.get(k);
    if (!alt || String(p.gueltigAb || '') > String(alt.gueltigAb || '')) beste.set(k, p);
  }
  return [...beste.values()].sort((a, b) => a.bezeichnung.localeCompare(b.bezeichnung, 'de'));
}
/** Passender Preis für eine Einsatzart: gleiche Bezeichnung, dann enthalten, sonst eine einzige Tourpauschale. */
function preisFuerArt(preise, art) {
  const a = normal(art);
  if (!a) return null;
  return preise.find(p => normal(p.bezeichnung) === a) || preise.find(p => normal(p.bezeichnung).includes(a) || a.includes(normal(p.bezeichnung)))
    || (l => (l.length === 1 ? l[0] : null))(preise.filter(p => /tour/i.test(p.bezeichnung + ' ' + (p.einheit || ''))));
}
const tageText = tage => Object.keys(tage).filter(t => tage[t]).sort().map(t => `${t.slice(8)}.${t.slice(5, 7)}.` + (tage[t] > 1 ? ` (${tage[t]}×)` : '')).join(', ');

/** Rechnung aus der Tourenplanung: Touren eines Auftraggebers im Zeitraum × Preise der Firma. */
function rechnungAusTouren(firmaId) {
  const firmen = auftraggeberListe();
  if (!firmen.length) { toast('Bitte zuerst eine Firma anlegen (oder ⚙ → Tourenplanung → Stammdaten abgleichen).'); return; }
  const j = new Date(), von = isoTag(new Date(j.getFullYear(), j.getMonth() - 1, 1)), bis = isoTag(new Date(j.getFullYear(), j.getMonth(), 0));
  dialog(`<form method="dialog" id="tpr-form"><h2>Rechnung aus der Tourenplanung</h2>
    <p class="leise">Zählt die gefahrenen Touren des Auftraggebers im Zeitraum und setzt die Preise aus seiner Preisliste ein. Vor dem Anlegen siehst du alles und kannst Preise wählen.</p>
    <label class="feld">Firma<select name="firma">${firmen.map(f => `<option value="${f.id}" ${f.id === firmaId ? 'selected' : ''}>${esc(firmaName(f))}</option>`).join('')}</select></label>
    <div class="zeile"><label class="feld fuell">Von<input name="von" type="date" value="${von}" required></label><label class="feld fuell">Bis<input name="bis" type="date" value="${bis}" required></label></div>
    <label class="feld">Positionen<select name="aufteilung"><option value="ART">je Einsatzart (Anzahl × Preis)</option><option value="TOUR">je Tour (mit Tagen)</option></select></label>
    <p class="fehlertext" id="tpr-fehler" hidden></p>
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll">Touren laden</button></div></form>`);
  $('#tpr-form').onsubmit = async ev => {
    ev.preventDefault();
    const w = Object.fromEntries(new FormData(ev.target)), fehler = $('#tpr-fehler');
    if (w.bis < w.von) { fehler.textContent = '„Bis“ liegt vor „Von“.'; fehler.hidden = false; return; }
    let bericht;
    try { bericht = await tpApi('getAuftragsBericht', [w.von, w.bis]); }

      if (e.message === 'TP_ANMELDEN') { tpAnmelden(() => rechnungAusTouren(w.firma)); return; }
      fehler.textContent = 'Tourenplanung nicht erreichbar: ' + e.message; fehler.hidden = false; return;
    }
    rechnungAusTourenVorschau(S.auftraggeber[w.firma], w.von, w.bis, w.aufteilung, bericht || {});
  };
}

function rechnungAusTourenVorschau(firma, von, bis, aufteilung, bericht, tpName) {
  const namen = Object.keys(bericht).sort((a, b) => a.localeCompare(b, 'de'));
  const name = tpName ?? namen.find(n => normal(n) === normal(firma.name)) ?? '';
  const x = bericht[name] || { arten: {}, touren: {} };
  const preise = preiseZum(firma.id, bis);
  const summe = tage => Object.values(tage || {}).reduce((a, b) => a + b, 0);
  const zeilen = aufteilung === 'TOUR'
    ? Object.values(x.touren || {}).sort((a, b) => String(a.TourNr || '').localeCompare(String(b.TourNr || ''), 'de', { numeric: true }) || String(a.Name).localeCompare(String(b.Name), 'de'))
      .map(t => ({ art: t.Einsatzart || '', text: [t.TourNr && 'Tour ' + t.TourNr, t.Name].filter(Boolean).join(' – ') + (t.Einsatzart ? ` (${t.Einsatzart})` : ''), menge: summe(t.tage), tage: tageText(t.tage) }))
    : Object.keys(x.arten || {}).sort((a, b) => a.localeCompare(b, 'de')).map(art => ({ art, text: art || 'Touren', menge: summe(x.arten[art]), tage: '' }));
  const liste = zeilen.filter(z => z.menge > 0).map(z => ({ ...z, preis: preisFuerArt(preise, z.art) }));
  const zeitraum = `${datumText(von)} – ${datumText(bis)}`, merkmal = `Aus der Tourenplanung: ${zeitraum}`;
  const doppelt = alle('belege').filter(b => b.firmaId === firma.id && b.art === 'RECHNUNG' && String(b.notiz || '').includes(merkmal));
  const preisWahl = (z, i) => `<select data-tpr-preis="${i}" aria-label="Preis für ${esc(z.text)}"><option value="">ohne Preis (später eintragen)</option>${preise.map(p => `<option value="${p.id}" ${z.preis && z.preis.id === p.id ? 'selected' : ''}>${esc(p.bezeichnung)} · ${p.betragCent != null ? geld(p.betragCent) : '–'}${p.einheit ? ' ' + esc(p.einheit) : ''}</option>`).join('')}</select>`;
  dialog(`<form method="dialog" id="tpr-vorschau"><h2>Rechnung an ${esc(firmaName(firma))}</h2><p class="leise">Leistungszeitraum ${esc(zeitraum)}</p>
    <label class="feld">Auftraggeber in der Tourenplanung<select id="tpr-name"><option value="">– wählen –</option>${namen.map(n => `<option ${n === name ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
    ${doppelt.length ? `<p class="fehlertext">Für diesen Zeitraum gibt es schon: ${esc(doppelt.map(b => b.nummer).join(', '))}</p>` : ''}
    ${!name ? '<p class="leise">Für diese Firma gibt es im Zeitraum keinen gleichnamigen Auftraggeber – bitte oben wählen.</p>'
      : !liste.length ? '<p class="leise">Keine gefahrenen Touren im Zeitraum.</p>'
      : `<div id="tpr-zeilen">${liste.map((z, i) => `<div class="karte block" style="padding:10px;margin:8px 0"><div class="zeile eng"><b class="fuell">${esc(z.text)}</b><span>${z.menge}×</span></div>${z.tage ? `<small class="leise">${esc(z.tage)}</small>` : ''}
          <div class="zeile eng" style="margin-top:6px"><label class="feld fuell" style="margin:0">${preisWahl(z, i)}</label><b data-tpr-betrag="${i}" style="min-width:90px;text-align:right"></b></div></div>`).join('')}</div>
        <p><b>Netto: <span id="tpr-summe"></span></b></p>${preise.length ? '' : '<p class="leise">Diese Firma hat noch keine Preise – Preise in der Firma unter „Preise und Konditionen“ anlegen oder in der Rechnung eintragen.</p>'}`}
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll" ${liste.length ? '' : 'disabled'}>Rechnung anlegen</button></div></form>`);
  const gewaehlt = i => S.preise[$(`[data-tpr-preis="${i}"]`).value] || null;
  const rechne = () => {
    let n = 0;
    liste.forEach((z, i) => { const p = gewaehlt(i), c = p && p.betragCent != null ? p.betragCent * z.menge : 0; n += c; $(`[data-tpr-betrag="${i}"]`).textContent = p ? geld(c) : '–'; });
    if ($('#tpr-summe')) $('#tpr-summe').textContent = geld(n);
  };
  if (liste.length) { rechne(); $('#tpr-zeilen').onchange = rechne; }
  $('#tpr-name').onchange = e => rechnungAusTourenVorschau(firma, von, bis, aufteilung, bericht, e.target.value);
  $('#tpr-vorschau').onsubmit = ev => {
    ev.preventDefault();
    const pos = liste.map((z, i) => {
      const p = gewaehlt(i);
      const bez = aufteilung === 'TOUR' || !p ? z.text : p.bezeichnung + (normal(p.bezeichnung) === normal(z.art) || !z.art ? '' : ` – ${z.art}`);
      return { bez, einheit: [p && p.einheit, z.tage].filter(Boolean).join(' · '), menge: z.menge, einzelCent: p && p.betragCent != null ? p.betragCent : 0 };
    });
    const id = BelegAktionen.neu('RECHNUNG', firma.id, { positionen: JSON.stringify(pos), notiz: merkmal,
      einleitung: `für unsere Leistungen im Zeitraum ${zeitraum} erlauben wir uns, wie folgt zu berechnen:` });
    $('#dialog').close();
    gehe('#/beleg/' + id);
    toast(pos.some(p => !p.einzelCent) ? 'Rechnung angelegt – bei einigen Positionen fehlt noch der Preis' : 'Rechnung angelegt');
  };
}


// ============================== Fuhrpark ==============================
const FAHRZEUG_ART = { TRANSPORTER: 'Transporter', LKW: 'LKW', PKW: 'PKW', ANHAENGER: 'Anhänger', SONSTIGES: 'Sonstiges' };
const FAHRZEUG_STATUS = { AKTIV: ['Im Einsatz', 'gruen'], WERKSTATT: ['In der Werkstatt', 'gelb'], RESERVE: ['Reserve', 'grau'], STILLGELEGT: ['Abgemeldet / verkauft', 'grau'] };
const FRISTEN = [['huBis', 'HU (TÜV)'], ['spBis', 'SP (Sicherheitsprüfung)'], ['uvvBis', 'UVV-Prüfung'], ['tachoBis', 'Tachograph-Prüfung'], ['ladeBis', 'Ladebordwand-Prüfung'],
  ['wartungBis', 'Wartung / Inspektion'], ['versicherungBis', 'Versicherung läuft ab'], ['leasingBis', 'Leasing / Finanzierung endet']];
const FAHRZEUG_EINTRAG = { WARTUNG: ['Wartung / Inspektion', '🔧'], REPARATUR: ['Reparatur', '🛠'], REIFEN: ['Reifen', '⭕'], TANKEN: ['Tanken', '⛽'], PRUEFUNG: ['Prüfung (HU, SP, UVV …)', '✅'],
  SCHADEN: ['Schaden', '⚠'], KM: ['Kilometerstand', '📍'], FAHRER: ['Fahrerwechsel / Übergabe', '👤'], KOSTEN: ['Sonstige Kosten (Steuer, Maut …)', '€'] };
const FAHRZEUG_DOKUMENTE = ['Fahrzeugschein (Teil I)', 'Fahrzeugbrief (Teil II)', 'Versicherung', 'HU-/SP-Bericht', 'UVV-Prüfung', 'Leasing-/Kaufvertrag', 'Rechnung', 'Foto', 'Sonstiges'];
/** Ab so vielen Tagen vorher erscheint eine Frist unter „Termine“. */
const FRIST_VORLAUF = 30;
const FAHRZEUG_FELDER = [
  ['Fahrzeug', [['kennzeichen', 'Kennzeichen', 'pflicht'], ['bezeichnung', 'Interne Bezeichnung (z. B. Sprinter 3)'], ['art', 'Art', FAHRZEUG_ART],
    ['status', 'Status', Object.fromEntries(Object.entries(FAHRZEUG_STATUS).map(([k, [l]]) => [k, l]))], ['fahrer', 'Fester Fahrer'], ['kmStand', 'Kilometerstand', 'zahl'], ['wartungKm', 'Nächste Wartung bei km', 'zahl']]],
  ['Fristen', FRISTEN.map(([k, l]) => [k, l, 'date'])],
  ['Fahrzeugschein (Zulassungsbescheinigung Teil I)', [['halter', 'Halter (C.1)'], ['marke', 'Marke (D.1)'], ['modell', 'Typ / Handelsbezeichnung (D.2/D.3)'], ['fin', 'Fahrzeug-Ident.-Nr. FIN (E)'],
    ['erstzulassung', 'Erstzulassung (B)', 'date'], ['zgg', 'Zul. Gesamtmasse in kg (F.2)', 'zahl'], ['leergewicht', 'Leergewicht in kg (G)', 'zahl'], ['hsn', 'Herstellerschlüssel HSN (2.1)'], ['tsn', 'Typschlüssel TSN (2.2)'],
    ['leistungKw', 'Leistung in kW (P.2)', 'zahl'], ['kraftstoff', 'Kraftstoff (P.3)'], ['schadstoffklasse', 'Schadstoff-/Emissionsklasse (14 / V.9)'], ['achsen', 'Achsen (L)', 'zahl'],
    ['farbe', 'Farbe (R)'], ['teil2Nr', 'Nummer Zulassungsbescheinigung Teil II']]],
  ['Versicherung und Finanzierung', [['versicherung', 'Versicherung'], ['versicherungsNr', 'Versicherungsschein-Nr.'], ['leasinggeber', 'Leasinggeber / Bank'], ['leasingRate', 'Monatliche Rate in Euro', 'geld'], ['notiz', 'Notizen', 'lang']]],
];
const ZAHL_FELDER = ['kmStand', 'wartungKm', 'zgg', 'leergewicht', 'leistungKw', 'achsen'];

const fahrzeugListe = () => alle('fahrzeuge').sort((a, b) => (a.status === 'STILLGELEGT') - (b.status === 'STILLGELEGT') || String(a.kennzeichen).localeCompare(String(b.kennzeichen), 'de'));
const markeTyp = z => [z.marke, z.modell].filter(Boolean).join(' ');
const fahrzeugStatus = z => FAHRZEUG_STATUS[z.status] || FAHRZEUG_STATUS.AKTIV;
const eintraegeVon = id => alle('fahrzeugeintraege').filter(x => x.fahrzeugId === id).sort((a, b) => String(b.datum).localeCompare(String(a.datum)) || (b.kmStand || 0) - (a.kmStand || 0));
const kzNormal = t => String(t || '').toUpperCase().replace(/[^A-Z0-9ÄÖÜ]/g, '');
/** Schadensfälle, in deren Feld „Fahrzeug / Kennzeichen“ dieses Kennzeichen steht. */
const faelleVonFahrzeug = z => { const kz = kzNormal(z.kennzeichen); return kz ? faelle().filter(f => kzNormal(f.fahrzeug).includes(kz)) : []; };
const zahlText = (n, einheit = '') => (n == null || n === '' ? '' : Number(n).toLocaleString('de-DE') + (einheit ? ' ' + einheit : ''));

/** Alle Fristen eines Fahrzeugs (ohne abgemeldete Fahrzeuge), sortiert nach Datum. */
function fristenVon(z) {
  if (z.status === 'STILLGELEGT') return [];
  return FRISTEN.filter(([k]) => z[k]).map(([k, l]) => ({ feld: k, label: l, datum: z[k], tage: Math.round((new Date(z[k]) - new Date(heute())) / 86400000) }))
    .sort((a, b) => a.datum.localeCompare(b.datum));
}
const fristFarbe = f => (f.tage < 0 ? 'rot' : f.tage <= FRIST_VORLAUF ? 'gelb' : 'grau');
const fristText = f => (f.tage < 0 ? `seit ${datumText(f.datum)} überfällig` : f.tage === 0 ? 'heute fällig' : f.tage <= FRIST_VORLAUF ? `in ${f.tage} Tag${f.tage === 1 ? '' : 'en'} (${datumText(f.datum)})` : datumText(f.datum));
const wartungKmFaellig = z => z.status !== 'STILLGELEGT' && z.wartungKm != null && z.kmStand != null && z.kmStand >= z.wartungKm - 1000;
/** Fristen, die in den nächsten FRIST_VORLAUF Tagen fällig sind (oder überfällig) – für Termine und Übersicht. */
function fahrzeugTermine() {
  const bis = plusTage(heute(), FRIST_VORLAUF);
  return fahrzeugListe().flatMap(z => fristenVon(z).filter(f => f.datum <= bis).map(f => ({ art: 'fahrzeug', datum: f.datum, titel: `${f.label} · ${z.kennzeichen}`,
    zusatz: [z.bezeichnung, z.fahrer].filter(Boolean).join(' · '), z })));
}

function fahrzeugKosten(z) {
  const e = eintraegeVon(z.id), jahr = String(new Date().getFullYear());
  const summe = l => l.reduce((n, x) => n + (x.betragCent || 0), 0);
  const tanken = e.filter(x => x.art === 'TANKEN' && x.menge && x.kmStand).sort((a, b) => a.kmStand - b.kmStand);
  // Durchschnittsverbrauch: getankte Liter nach der ersten Tankung ÷ gefahrene km dazwischen
  let verbrauch = null;
  if (tanken.length >= 2) {
    const km = tanken[tanken.length - 1].kmStand - tanken[0].kmStand, liter = tanken.slice(1).reduce((n, x) => n + x.menge, 0) / 100;
    if (km > 0) verbrauch = liter / km * 100;
  }
  const kmWerte = e.filter(x => x.kmStand).map(x => x.kmStand);
  return { jahr: summe(e.filter(x => String(x.datum).startsWith(jahr))), gesamt: summe(e), tankenJahr: summe(e.filter(x => x.art === 'TANKEN' && String(x.datum).startsWith(jahr))),
    werkstattJahr: summe(e.filter(x => ['WARTUNG', 'REPARATUR', 'REIFEN', 'PRUEFUNG'].includes(x.art) && String(x.datum).startsWith(jahr))), verbrauch,
    proKm: kmWerte.length >= 2 && Math.max(...kmWerte) > Math.min(...kmWerte) ? summe(e) / (Math.max(...kmWerte) - Math.min(...kmWerte)) : null };
}

const FuhrparkAktionen = {
  speichern(z) { const x = merke('fahrzeuge', { ...z, id: z.id || uuid(), firmaId: '', kennzeichen: String(z.kennzeichen || '').trim().toUpperCase(), geaendertAm: jetztIso() }); nachAenderung(); return x.id; },
  loeschen(z) {
    const jetzt = jetztIso();
    for (const x of eintraegeVon(z.id)) entferne('fahrzeugeintraege', x, { firmaId: '', fahrzeugId: z.id, geaendertAm: jetzt });
    for (const a of anlagenVon(z.id)) { entferne('anlagen', a, { fallId: a.fallId }); Dateien.loesche(a.id); }
    entferne('fahrzeuge', z, { firmaId: '', geaendertAm: jetzt }); nachAenderung();
  },
  eintragSpeichern(x) {
    merke('fahrzeugeintraege', { ...x, id: x.id || uuid(), firmaId: '', geaendertAm: jetztIso() });
    // Ein höherer Kilometerstand im Eintrag wird ins Fahrzeug übernommen, ein Fahrerwechsel ebenso.
    const z = S.fahrzeuge[x.fahrzeugId];
    if (z && !z.geloescht) {
      const neu = { ...z };
      if (x.kmStand != null && (z.kmStand == null || x.kmStand > z.kmStand)) neu.kmStand = x.kmStand;
      if (x.art === 'FAHRER' && x.werkstatt) neu.fahrer = x.werkstatt;
      if (neu.kmStand !== z.kmStand || neu.fahrer !== z.fahrer) merke('fahrzeuge', { ...neu, geaendertAm: jetztIso() });
    }
    nachAenderung();
  },
  eintragLoeschen(x) { entferne('fahrzeugeintraege', x, { firmaId: '', fahrzeugId: x.fahrzeugId, geaendertAm: jetztIso() }); nachAenderung(); },
  async dokument(fahrzeugId, art, datei) { if (await legeAnlage(fahrzeugId, datei, `${art} – `)) nachAenderung(); },
};

/**
 * Fuhrpark-Import (z. B. aus eingelesenen Fahrzeugscheinen): { fahrzeuge: [{ kennzeichen, … }], dokumente: [{ kennzeichen, art, name, mimeType, base64 }] }.
 * Gleiches Kennzeichen = gleiches Fahrzeug: leere Felder werden ergänzt, vorhandene Angaben bleiben. Dokumente mit gleichem Namen kommen nicht doppelt.
 */
async function fuhrparkImportieren(text) {
  const d = JSON.parse(text);
  if (!d || !Array.isArray(d.fahrzeuge)) throw new Error('Das ist keine Fuhrpark-Datei.');
  const felder = new Set(FAHRZEUG_FELDER.flatMap(([, f]) => f.map(([k]) => k)).concat(['leasingRateCent']));
  const nachKz = new Map(alle('fahrzeuge').map(z => [kzNormal(z.kennzeichen), z]));
  let neu = 0, ergaenzt = 0, doks = 0;
  for (const roh of d.fahrzeuge) {
    const kz = kzNormal(roh.kennzeichen); if (!kz) continue;
    const sauber = Object.fromEntries(Object.entries(roh).filter(([k, v]) => felder.has(k) && v != null && v !== ''));
    const alt = nachKz.get(kz);
    if (!alt) { const id = FuhrparkAktionen.speichern({ art: 'TRANSPORTER', status: 'AKTIV', ...sauber }); nachKz.set(kz, S.fahrzeuge[id]); neu++; continue; }
    const dazu = Object.fromEntries(Object.entries(sauber).filter(([k]) => alt[k] == null || alt[k] === ''));
    if (Object.keys(dazu).length) { FuhrparkAktionen.speichern({ ...alt, ...dazu }); nachKz.set(kz, S.fahrzeuge[alt.id]); ergaenzt++; }
  }
  for (const dok of d.dokumente || []) {
    const z = nachKz.get(kzNormal(dok.kennzeichen)); if (!z || !dok.base64) continue;
    const name = `${dok.art || 'Sonstiges'} – ${dok.name}`;
    if (anlagenVon(z.id).some(a => a.anzeigename === name)) continue;
    const blob = blobAusBase64(dok.base64, dok.mimeType || 'application/pdf');
    const a = merke('anlagen', { id: uuid(), fallId: z.id, anzeigename: name, mimeType: blob.type, groesseBytes: blob.size, hinzugefuegtAm: jetztIso(), vorhanden: false });
    await Dateien.lege(a.id, blob); doks++;
  }
  nachAenderung();
  return { neu, ergaenzt, doks };
}

  return {

// ============================== E-Mail (Windows- und Android-App) ==============================
// Die Windows-App spricht über ihren Hauptprozess direkt per IMAP/SMTP mit den Postfächern – mit
// denselben Regeln wie die Android-App: zwei Postfächer (SCHADEN für Schadensfälle, ALLGEMEIN für
// alles andere). Zuordnung eingehender Mails:
//   1. Fallnummer im Betreff → Fall   2. Antwort auf eine bekannte Mail → wie diese
//   3. nur Schadens-Postfach: Absender bei genau einem offenen Fall eingetragen → Fall
//   4. Absender passt zur E-Mail der Firma, eines Ansprechpartners oder zur Domain der Firma → Firma
//   5. sonst → „Nicht zugeordnet“ (im Postfach von Hand zuordnen)
const MAIL = { konten: { SCHADEN: null, ALLGEMEIN: null }, konto: null, anbieter: {}, laeuft: false, timer: 0 };
const MAIL_KONTEN = { SCHADEN: 'Schäden', ALLGEMEIN: 'Allgemein' };
const FALLNUMMER = /\[Fall (\d{4}-\d+)]/;
const mitFallnummer = (betreff, nr) => (FALLNUMMER.test(betreff) ? betreff : `${String(betreff).trim()} [Fall ${nr}]`.trim());
const mails = () => (S.mails = S.mails || {});
const mailZuVerlauf = verlaufId => Object.entries(mails()).map(([id, m]) => ({ messageId: id, ...m })).find(m => m.verlaufId === verlaufId);
const blobAusBase64 = (b64, typ) => new Blob([Uint8Array.from(atob(b64), z => z.charCodeAt(0))], { type: typ });
/** Das Postfach, über das gesendet wird: das gewünschte, sonst das andere. */
const kontoFuer = gewuenscht => (MAIL.konten[gewuenscht] ? gewuenscht : Object.keys(MAIL.konten).find(a => MAIL.konten[a]) || null);
const eigeneAdressen = () => Object.values(MAIL.konten).filter(Boolean).map(k => k.adresse.toLowerCase());
const mailStand = art => (art === 'ALLGEMEIN' ? S.mailStandAllgemein : S.mailStand) || {};
function setzeMailStand(art, wert) { if (art === 'ALLGEMEIN') S.mailStandAllgemein = wert; else S.mailStand = wert; }
const istZugeordnet = m => !!(m.fallId || m.firmaId || String(m.kundeRef || '').trim());
function aktualisiereKonto() { MAIL.konto = MAIL.konten.SCHADEN || MAIL.konten.ALLGEMEIN || null; }

const FREEMAIL = new Set(['gmail.com', 'googlemail.com', 'gmx.de', 'gmx.net', 'gmx.at', 'gmx.ch', 'web.de', 't-online.de', 'outlook.com', 'outlook.de', 'hotmail.com', 'hotmail.de',
  'live.com', 'live.de', 'msn.com', 'yahoo.com', 'yahoo.de', 'icloud.com', 'me.com', 'mac.com', 'aol.com', 'aol.de', 'freenet.de', 'posteo.de', 'mail.de', 'online.de',
  'arcor.de', 'vodafone.de', 'email.de', 'mailbox.org', 'ionos.de', 'proton.me', 'protonmail.com']);
const domainVon = a => { const d = String(a || '').trim().toLowerCase().replace(/^.*</, '').replace(/>.*$/, '').split('@')[1] || ''; return d.includes('.') ? d : null; };
const websiteDomain = w => { const d = String(w || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').split(/[/?]/)[0]; return d.includes('.') && !d.includes(' ') ? d : null; };
/** Firma zur Absenderadresse: zuerst exakt (Firma oder Ansprechpartner), dann über die Domain. Bei mehreren Treffern wird nicht geraten. */
function firmaZuAdresse(adresse) {
  const a = String(adresse || '').trim().toLowerCase();
  if (!a.includes('@')) return null;
  const firmen = alle('auftraggeber'), kontakte = alle('ansprechpartner');
  const genau = [...new Set([...firmen.filter(f => (f.email || '').trim().toLowerCase() === a).map(f => f.id),
    ...kontakte.filter(k => (k.email || '').trim().toLowerCase() === a).map(k => k.firmaId)])];
  if (genau.length === 1) return S.auftraggeber[genau[0]] || null;
  if (genau.length > 1) return null;
  const d = domainVon(a);
  if (!d || FREEMAIL.has(d)) return null;
  const passend = firmen.filter(f => domainVon(f.email) === d || websiteDomain(f.website) === d || kontakte.some(k => k.firmaId === f.id && domainVon(k.email) === d));
  return passend.length === 1 ? passend[0] : null;
}

function ordneZu(m, art) {
  const nr = (m.betreff.match(FALLNUMMER) || [])[1];
  const perNummer = nr && faelle().find(f => f.fallnummer === nr);
  if (perNummer) return { fallId: perNummer.id };
  for (const bezug of m.antwortAuf) {
    const alt = mails()[bezug];
    if (alt && alt.fallId && S.faelle[alt.fallId] && !S.faelle[alt.fallId].geloescht) return { fallId: alt.fallId };
    if (alt && alt.firmaId && S.auftraggeber[alt.firmaId]) return { firmaId: alt.firmaId };
  }
  if (art !== 'ALLGEMEIN') {
    const passend = faelle().filter(f => status(f).offen && [f.kundeEmail, f.auftraggeberEmail].some(a => (a || '').trim().toLowerCase() === m.von));
    if (passend.length === 1) return { fallId: passend[0].id };
  }
  const firma = firmaZuAdresse(m.von);
  return firma ? { firmaId: firma.id } : {};
}

const kontaktZuAdressen = (firmaId, adressen) => {
  const liste = String(adressen || '').split(/[,;]/).map(x => x.trim().replace(/^.*</, '').replace(/>.*$/, '').toLowerCase());
  const k = kontakteVon(firmaId).find(x => x.email && liste.includes(x.email.trim().toLowerCase()));
  return k ? k.name : '';
};

/**
 * Legt die Mail ab: im Verlauf des Falls, in der Kontakthistorie der Firma (beide wandern in die Cloud)
 * oder nur hier im Postfach. Eine eingehende Fall-Mail rückt die Wiedervorlage auf heute.
 */
function ablegen(messageId, m, text) {
  const eintrag = { ...m, verlaufId: '', aktivitaetId: '', fallId: m.fallId || '', firmaId: m.fallId ? '' : m.firmaId || '' };
  const f = eintrag.fallId && S.faelle[eintrag.fallId];
  if (f && !f.geloescht) {
    const v = merke('verlauf', { id: uuid(), fallId: f.id, zeitpunkt: m.zeitpunkt || jetztIso(), typ: m.eingehend ? 'EMAIL_EINGANG' : 'EMAIL_AUSGANG', text: kuerze(text, MAIL_TEXT_FALL) });
    eintrag.verlaufId = v.id;
    const neu = { ...f };
    // Eine Antwort soll nicht untergehen: Wiedervorlage rückt auf heute.
    if (m.eingehend && status(neu).offen && (!neu.wiedervorlageAm || neu.wiedervorlageAm > heute())) Object.assign(neu, { wiedervorlageAm: heute(), wiedervorlageNotiz: 'Neue E-Mail beantworten' });
    fallMerken(neu);
  } else if (eintrag.firmaId && S.auftraggeber[eintrag.firmaId]) {
    const a = merke('aktivitaeten', { id: uuid(), firmaId: eintrag.firmaId, datum: isoTag(new Date(m.zeitpunkt || Date.now())), art: 'EMAIL',
      text: kuerze((m.eingehend ? 'E-Mail erhalten' : 'E-Mail gesendet') + '\n' + text, MAIL_TEXT_FIRMA),
      kontakt: kontaktZuAdressen(eintrag.firmaId, m.eingehend ? m.von : m.an), geaendertAm: jetztIso() });
    eintrag.aktivitaetId = a.id;
  }
  eintrag.text = String(m.text || '').slice(0, 15000);
  mails()[messageId] = eintrag;
}
/** Für die bisherigen Aufrufe aus dem Schreibfenster eines Falls. */
const vermerkeMail = (f, mail, text, eingehend) => ablegen(mail.messageId, { ...mail, fallId: f.id, eingehend }, text);

const mailText = m => (m.eingehend ? `Von: ${m.von}` : `An: ${m.an}`) + `\nBetreff: ${m.betreff}` + (m.anhaenge && m.anhaenge.length ? '\nAnhänge: ' + m.anhaenge.join(', ') : '') + `\n\n${m.text}`;

/** Mail von Hand zuordnen bzw. umhängen: Fall, Firma und/oder Kunde. Gespeicherte Anhänge werden Anlagen des Falls. */
async function mailZuordnen(messageId, ziel) {
  const alt = mails()[messageId]; if (!alt) return;
  const fallId = ziel.fallId || '', firmaId = fallId ? '' : ziel.firmaId || '', kundeRef = String(ziel.kundeRef || '').trim();
  if (alt.verlaufId && alt.fallId !== fallId) { const v = S.verlauf[alt.verlaufId]; if (v) entferne('verlauf', v, { fallId: v.fallId }); }
  if (alt.aktivitaetId && (fallId || alt.firmaId !== firmaId)) { const a = S.aktivitaeten[alt.aktivitaetId]; if (a) entferne('aktivitaeten', a, { firmaId: a.firmaId, geaendertAm: jetztIso() }); }
  const bleibt = (fallId && alt.fallId === fallId && alt.verlaufId) || (!fallId && firmaId && alt.firmaId === firmaId && alt.aktivitaetId);
  if (bleibt) mails()[messageId] = { ...alt, kundeRef };
  else ablegen(messageId, { ...alt, fallId, firmaId, kundeRef }, mailText(alt));
  if (fallId) {
    for (const [i, name] of (alt.anhaenge || []).entries()) {
      const blob = await Dateien.hole(`mail:${messageId}:${i}`);
      if (!blob) continue;
      await Aktionen.anlageHinzufuegen(fallId, new File([blob], name, { type: blob.type }));
      await Dateien.loesche(`mail:${messageId}:${i}`);
    }
  }
  nachAenderung();
}

async function postfachAbrufen(sichtbar = false) {
  if (!MAIL.konto || MAIL.laeuft) return [];
  MAIL.laeuft = true;
  if (sichtbar) toast('Postfach wird abgerufen …');
  const neu = [], fehler = [];
  try {
    for (const art of Object.keys(MAIL.konten)) {
      if (!MAIL.konten[art]) continue;
      try {
        const stand = mailStand(art);
        const r = await window.desktop.mail.hole({ letzteUid: stand.letzteUid || 0, uidValidity: stand.uidValidity || 0 }, art);
        for (const m of r.mails.sort((a, b) => a.zeitpunkt.localeCompare(b.zeitpunkt))) {
          if (eigeneAdressen().includes(m.von) || mails()[m.messageId]) continue;
          const ziel = ordneZu(m, art);
          const absender = m.vonName ? `${m.vonName} <${m.von}>` : m.von;
          if (ziel.fallId) for (const a of m.anhaenge) await Aktionen.anlageHinzufuegen(ziel.fallId, new File([blobAusBase64(a.base64, a.mimeType)], a.name, { type: a.mimeType }));
          else for (const [i, a] of m.anhaenge.entries()) await Dateien.lege(`mail:${m.messageId}:${i}`, blobAusBase64(a.base64, a.mimeType));
          const anh = m.anhaenge.length ? `\nAnhänge${ziel.fallId ? ' (zum Fall genommen)' : ''}: ` + m.anhaenge.map(a => a.name).join(', ') : '';
          ablegen(m.messageId, { ...ziel, konto: art, eingehend: true, von: m.von, an: m.an, betreff: m.betreff, text: m.text, zeitpunkt: m.zeitpunkt,
            anhaenge: m.anhaenge.map(a => a.name) }, `Von: ${absender}\nBetreff: ${m.betreff}${anh}\n\n${m.text}`);
          neu.push({ id: m.messageId, ziel, absender, betreff: m.betreff });
        }
        setzeMailStand(art, { letzteUid: r.letzteUid, uidValidity: r.uidValidity, letzterAbruf: Date.now(), fehler: '' });
      } catch (e) {
        setzeMailStand(art, { ...mailStand(art), fehler: e.message }); fehler.push(e.message);
      }
    }
    if (neu.length) nachAenderung(); else { speichere(); zeichneSync(); }
    const wohin = n => (n.ziel.fallId ? 'Fall ' + (S.faelle[n.ziel.fallId] || {}).fallnummer : n.ziel.firmaId ? (S.auftraggeber[n.ziel.firmaId] || {}).name : 'Nicht zugeordnet');
    if (neu.length) {
      const titel = neu.length === 1 ? `Neue E-Mail · ${wohin(neu[0])}` : `${neu.length} neue E-Mails`;
      const ziel = neu.length === 1 ? (neu[0].ziel.fallId ? '#/fall/' + neu[0].ziel.fallId : neu[0].ziel.firmaId ? '#/firma/' + neu[0].ziel.firmaId : '#/mail/' + encodeURIComponent(neu[0].id)) : '#/';
      window.desktop.benachrichtige(titel, neu.map(n => `${wohin(n)} · ${n.absender}: ${n.betreff}`).join('\n'), ziel).catch(() => {});
    }
    const offen = neu.filter(n => !n.ziel.fallId && !n.ziel.firmaId).length;
    if (sichtbar) toast(fehler.length && !neu.length ? fehler[0] : !neu.length ? 'Keine neuen E-Mails'
      : offen ? `${neu.length} neue E-Mail(s), davon ${offen} im Postfach unter „Nicht zugeordnet“` : `${neu.length} neue E-Mail(s) zugeordnet`, 6000);
    if (route().art === 'einstellungen') zeichne();
    return neu;
  } finally { MAIL.laeuft = false; }
}

// ---------- Postfach (Liste und einzelne Mail) ----------

const mailListe = () => Object.entries(mails()).map(([id, m]) => ({ id, ...m })).sort((a, b) => String(b.zeitpunkt).localeCompare(String(a.zeitpunkt)));

      <div class="zeile eng"><span class="titel fuell">${esc(m.eingehend ? m.von : 'An: ' + (m.an || ''))}</span><span class="leise">${m.zeitpunkt ? zeitText(m.zeitpunkt) : ''}</span></div>
      <div class="zwei-zeilen">${esc(m.betreff || '(ohne Betreff)')}</div>

function zeichneMail(id) {

      <p class="leise">${m.zeitpunkt ? zeitText(m.zeitpunkt) : ''} · Postfach ${esc(MAIL_KONTEN[m.konto || 'SCHADEN'])}</p></div>
    <div class="karte ${istZugeordnet(m) ? '' : 'rot'}" id="mail-zuordnung"><b>Zugeordnet: ${esc(zuordnungText(m))}</b>
      <div class="zeile" style="margin-top:8px"><button class="knopf voll" data-mail-zuordnen>${istZugeordnet(m) ? 'Umhängen' : 'Zuordnen'}</button>
      ${m.fallId ? `<a class="knopf" href="#/fall/${m.fallId}">Zum Fall</a>` : ''}${m.firmaId ? `<a class="knopf" href="#/firma/${m.firmaId}">Zur Firma</a>` : ''}
      <button class="knopf" data-mail-antworten>Antworten</button></div></div>

    <div class="karte"><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.text || '')}</p></div>`;
}

    <label class="feld">Schadensfall<select name="fallId"><option value="">– kein Fall –</option>${faelleListe.map(f =>
      `<option value="${f.id}" ${m.fallId === f.id ? 'selected' : ''}>${esc(f.fallnummer)} · ${esc(anzeigeName(f))}${f.auftraggeber ? ' · ' + esc(f.auftraggeber) : ''}</option>`).join('')}</select></label>
    <label class="feld">Firma (ohne Fall)<select name="firmaId"><option value="">– keine Firma –</option>${auftraggeberListe().map(e =>
      `<option value="${e.id}" ${m.firmaId === e.id ? 'selected' : ''}>${esc(firmaName(e))}</option>`).join('')}</select><span class="leise">Bei einem Fall gehört die Mail automatisch auch zu dessen Firma.</span></label>
    <label class="feld">Kunde (Name oder E-Mail des Endkunden)<input name="kundeRef" value="${esc(m.kundeRef || '')}"></label>
    ${m.eingehend ? `<button type="button" class="knopf text" id="kunde-absender">Absender übernehmen</button>` : ''}

const FIRMEN_VORLAGEN = {
  ANGEBOT: ['Angebot', 'Angebot Auslieferung und Montage', 'vielen Dank für Ihre Anfrage. Gern bieten wir Ihnen Auslieferung und Montage zu folgenden Konditionen an:\n\n{PREISE}\n\nAlle Preise zzgl. MwSt. Das Angebot gilt 30 Tage. Für Rückfragen stehen wir Ihnen gern zur Verfügung.'],
  TERMIN: ['Terminbestätigung', 'Terminbestätigung', 'hiermit bestätigen wir den Termin am [Datum] um [Uhrzeit] Uhr.\n\nBitte geben Sie uns kurz Bescheid, falls sich etwas ändert.'],
  NACHFASSEN: ['Nachfassen', 'Nachfrage zu unserem Angebot', 'vor einiger Zeit haben wir Ihnen ein Angebot geschickt. Konnten Sie es schon prüfen?\n\nGern besprechen wir offene Punkte auch telefonisch.'],
  ABRECHNUNG: ['Rückfrage Abrechnung', 'Rückfrage zur Abrechnung', 'zu unserer Abrechnung [Rechnungsnummer / Zeitraum] haben wir eine Rückfrage:\n\n[Rückfrage]\n\nVielen Dank für eine kurze Rückmeldung.'],
};

/** Schreibfenster ohne Fall: an eine Firma, einen Ansprechpartner oder als Antwort auf eine Mail aus dem Postfach. */
function mailAnFirma({ firmaId = '', an = '', antwortAuf = '', betreff: betreffVorgabe = '', inhalt = '', anhaenge: feste = [], nachSenden = null } = {}) {
  const alt = antwortAuf && mails()[antwortAuf];
  const firma = S.auftraggeber[firmaId || (alt && alt.firmaId) || ''];
  const art = kontoFuer(alt ? alt.konto || 'SCHADEN' : 'ALLGEMEIN');
  if (!art) { toast('Kein E-Mail-Konto eingerichtet'); return; }
  const gruss = (() => { const t = vorlageText('SACHSTANDSANFRAGE', {}, S.einstellungen).text; return t.slice(t.lastIndexOf('Mit freundlichen Grüßen')); })();
  const empfaenger = alt ? (alt.eingehend ? alt.von : alt.an) : an || (firma && firma.email) || '';
  const name = firma ? kontaktZuAdressen(firma.id, empfaenger) : '';
  let text = `${name ? `Guten Tag ${name},` : 'Sehr geehrte Damen und Herren,'}\n\n${inhalt ? inhalt + '\n\n' : '\n\n'}${gruss}`;
  if (alt) text += `\n\nAm ${zeitText(alt.zeitpunkt)} schrieb ${alt.von}:\n` + String(alt.text || '').split('\n').map(z => '> ' + z).join('\n');
  const betreff = alt ? (/^(re|aw):/i.test(alt.betreff) ? alt.betreff : 'Re: ' + alt.betreff) : betreffVorgabe;
  const konten = Object.keys(MAIL.konten).filter(a => MAIL.konten[a]);
  dialog(`<form method="dialog" id="mail-form"><h2>E-Mail${firma ? ' · ' + esc(firma.name) : ''}</h2>
    <p class="fehlertext" id="mail-fehler" hidden></p>
    ${konten.length > 1 ? `<label class="feld">Von<select name="konto">${konten.map(a => `<option value="${a}" ${a === art ? 'selected' : ''}>${esc(MAIL.konten[a].adresse)} (${MAIL_KONTEN[a]})</option>`).join('')}</select></label>`
      : `<p class="leise">Von: ${esc(MAIL.konten[art].adresse)}</p><input type="hidden" name="konto" value="${art}">`}
    ${alt ? '' : `<div class="chips">${Object.entries(FIRMEN_VORLAGEN).map(([k, [l]]) => `<button type="button" class="chip" data-firmenvorlage="${k}">${l}</button>`).join('')}</div>`}
    <label class="feld">An<input name="an" value="${esc(empfaenger)}"></label>
    <label class="feld">Betreff<input name="betreff" value="${esc(betreff)}"></label>
    <label class="feld">Nachricht<textarea name="text" style="min-height:260px">${esc(text)}</textarea></label>
    ${feste.length ? `<p class="leise">Anhang: ${feste.map(a => esc(a.name)).join(', ')}</p>` : ''}
    <label class="knopf" style="margin-top:6px">📎 Datei vom Rechner anhängen<input type="file" id="mail-datei" multiple hidden></label><div id="mail-dateien" class="leise"></div>
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll" id="mail-senden">Senden</button></div></form>`);
  $('#mail-form').addEventListener('click', ev => {
    const v = ev.target.closest('[data-firmenvorlage]'); if (!v) return;
    const [, betr, inhalt] = FIRMEN_VORLAGEN[v.dataset.firmenvorlage];
    const liste = firma && vonFirma('preise', firma.id).length ? preislisteText(firma).split('\n').slice(1).join('\n') : '[Leistungen und Preise]';
    const n = kontaktZuAdressen(firma ? firma.id : '', $('#mail-form [name=an]').value);
    $('#mail-form [name=betreff]').value = betr;
    $('#mail-form [name=text]').value = `${n ? `Guten Tag ${n},` : 'Sehr geehrte Damen und Herren,'}\n\n${inhalt.replace('{PREISE}', liste)}\n\n${gruss}`;
  });
  let dateien = [];
  $('#mail-datei').onchange = ev => { dateien = dateien.concat([...ev.target.files]); $('#mail-dateien').textContent = dateien.map(d => d.name).join(', '); ev.target.value = ''; };
  $('#mail-form').onsubmit = async ev => {
    ev.preventDefault();
    const w = new FormData(ev.target), fehler = $('#mail-fehler');
    const zeige = t => { fehler.textContent = t; fehler.hidden = false; };
    const adressen = String(w.get('an')).split(/[,;]/).map(x => x.trim()).filter(Boolean);
    if (!adressen.length || adressen.some(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x))) { zeige('Bitte eine gültige Empfängeradresse eintragen.'); return; }
    if (dateien.reduce((n, d) => n + d.size, 0) > 20 * 1024 * 1024) { zeige('Die Anhänge sind zusammen größer als 20 MB.'); return; }
    const konto = String(w.get('konto') || art), knopf = $('#mail-senden'); knopf.disabled = true; knopf.textContent = 'Sendet …';
    try {
      const anhaenge = [...feste];
      for (const d of dateien) anhaenge.push({ name: d.name, mimeType: d.type || 'application/octet-stream', base64: await alsBase64(d) });
      const entwurf = { an: adressen.join(', '), bcc: '', betreff: String(w.get('betreff')), text: String(w.get('text')), antwortAuf: antwortAuf || '', anhaenge };
      const messageId = await window.desktop.mail.sende(entwurf, konto);
      const m = { firmaId: firma ? firma.id : '', kundeRef: alt ? alt.kundeRef || '' : '', konto, eingehend: false, von: MAIL.konten[konto].adresse, an: entwurf.an,
        betreff: entwurf.betreff, text: entwurf.text, zeitpunkt: jetztIso(), anhaenge: anhaenge.map(a => a.name) };
      ablegen(messageId, m, mailText(m));
      $('#dialog').close(); if (nachSenden) nachSenden(); nachAenderung(); toast('E-Mail gesendet');
    } catch (e) { zeige(e.message || 'Die E-Mail konnte nicht gesendet werden.'); knopf.disabled = false; knopf.textContent = 'Senden'; }
  };
}

$('#liste').addEventListener('click', e => {

$('#detail').addEventListener('click', async e => {

  const id = decodeURIComponent(r.id), m = mails()[id]; if (!m) return;

  }
});

function mailVorlagen(f) {
  const gruppen = Object.entries(EMPFAENGER).map(([e, info]) => {
    const fehlt = e !== 'DRITTE' && !info.email(f) ? ' – keine E-Mail-Adresse hinterlegt' : '';
    return `<h3>${info.ueberschrift}${fehlt}</h3><button class="vorlage" data-leer="${e}"><b>Ohne Vorlage</b><br><span class="leise">Nur Anrede und Grußformel</span></button>` +
      Object.entries(VORLAGEN).filter(([, v]) => v[2] === e).map(([wert, [titel, beschreibung]]) => `<button class="vorlage" data-vorlage="${wert}"><b>${titel}</b><br><span class="leise">${beschreibung}</span></button>`).join('');
  }).join('');
  dialog(`<h2>E-Mail schreiben</h2>${gruppen}<div class="dialog-knoepfe"><button class="knopf text" data-zu>Abbrechen</button></div>`).onclick = e => {
    const v = e.target.closest('[data-vorlage]'), l = e.target.closest('[data-leer]'); if (!v && !l) return;
    $('#dialog').onclick = null;
    mailSchreiben(f, v ? { vorlage: v.dataset.vorlage } : { empfaenger: l.dataset.leer });
  };
}

/** Rahmen ohne Vorlage: Anrede an den Empfänger und Grußformel. */
function ohneVorlage(e, f) {
  const vorlage = vorlageText('SACHSTANDSANFRAGE', f, S.einstellungen).text;
  const gruss = vorlage.slice(vorlage.lastIndexOf('Mit freundlichen Grüßen'));
  const name = (EMPFAENGER[e].name(f) || '').trim();
  const vom = d => (d ? ' vom ' + datumText(d) : '');
  const was = e === 'GESCHAEDIGTER' ? 'Ihre Schadensmeldung' + vom(f.meldedatum || f.schadensdatum) : 'Schadensfall' + vom(f.schadensdatum);
  return { betreff: [was, zeichenDesAuftraggebers(e, f)].filter(Boolean).join(' – '), text: `${name ? `Guten Tag ${name},` : 'Sehr geehrte Damen und Herren,'}\n\n\n\n${gruss}` };
}

function mailSchreiben(f, { vorlage, empfaenger, antwortAufVerlauf } = {}) {
  let an = '', betreff = '', text = '', antwortAuf = '', art = empfaenger || 'GESCHAEDIGTER';
  const verlauf = verlaufVon(f.id), schritte = schritteWaehlbar(verlauf), vorauswahl = schritteVorauswahl(f, verlauf);
  const alt = antwortAufVerlauf && mailZuVerlauf(antwortAufVerlauf);
  if (alt) {
    antwortAuf = alt.messageId; an = alt.von;
    betreff = /^(re|aw):/i.test(alt.betreff) ? alt.betreff : 'Re: ' + alt.betreff;
    const e = ['GESCHAEDIGTER', 'AUFTRAGGEBER'].find(x => EMPFAENGER[x].email(f).toLowerCase() === alt.von) || 'DRITTE';
    art = e;
    text = ohneVorlage(e, f).text + `\n\nAm ${zeitText(alt.zeitpunkt)} schrieb ${alt.von}:\n` + alt.text.split('\n').map(z => '> ' + z).join('\n');
  } else if (vorlage) {
    const n = vorlageText(vorlage, f, S.einstellungen); an = EMPFAENGER[n.empfaenger].email(f); betreff = n.betreff; text = n.text; art = n.empfaenger;
    // Beim Sachstand gleich mitteilen, was seit der letzten Mail an den Auftraggeber passiert ist.
    const neu = schritte.filter(v => vorauswahl.has(v.id));
    if (vorlage === 'SACHSTAND_AUFTRAGGEBER' && neu.length) text = schritteEinfuegen(text, schritteAlsText(neu, f));
  } else {
    const e = empfaenger || 'GESCHAEDIGTER', n = ohneVorlage(e, f); an = EMPFAENGER[e].email(f); betreff = n.betreff; text = n.text;
  }
  // „[Fall …]“ ersetzt beim Versand aus der App den Zusatz „unser Vorgang …“.
  betreff = mitZeichen(mitFallnummer(betreff.replace(` – unser Vorgang ${f.fallnummer}`, ''), f.fallnummer), art, f);
  const anl = anlagenVon(f.id);
  const agMail = (f.auftraggeberEmail || '').trim();
  const bccMoeglich = agMail && !an.toLowerCase().includes(agMail.toLowerCase());
  const anlageZeile = (a, an = false) => `<label class="auswahl"><input type="checkbox" name="anlage" value="${a.id}"${an ? ' checked' : ''}> ${esc(a.anzeigename)}</label>`;
  const konten = Object.keys(MAIL.konten).filter(x => MAIL.konten[x]), kontoVorgabe = kontoFuer((alt && alt.konto) || 'SCHADEN');
  dialog(`<form method="dialog" id="mail-form"><h2>E-Mail · Fall ${esc(f.fallnummer)}</h2>
    <p class="fehlertext" id="mail-fehler" hidden></p>
    ${konten.length > 1 ? `<label class="feld">Von<select name="konto">${konten.map(x => `<option value="${x}" ${x === kontoVorgabe ? 'selected' : ''}>${esc(MAIL.konten[x].adresse)} (${MAIL_KONTEN[x]})</option>`).join('')}</select></label>`
      : `<input type="hidden" name="konto" value="${kontoVorgabe || 'SCHADEN'}">`}
    <label class="feld">An<input name="an" value="${esc(an)}"></label>
    <label class="feld">Betreff<input name="betreff" value="${esc(betreff)}"><span class="leise">Die Fallnummer im Betreff ordnet Antworten automatisch diesem Fall zu.</span></label>
    <label class="feld">Nachricht<textarea name="text" style="min-height:260px">${esc(text)}</textarea></label>
    ${schritte.length ? `<details id="mail-schritte"><summary class="knopf" style="display:inline-flex;margin-bottom:8px">Bearbeitungsschritte einfügen</summary>
      <p class="leise">Vorausgewählt ist alles seit der letzten Mail an den Auftraggeber. Adressen und Wiedervorlagen werden nicht übernommen.</p>
      ${schritte.map(v => `<label class="auswahl"><input type="checkbox" name="schritt" value="${v.id}"${vorauswahl.has(v.id) ? ' checked' : ''}> <span><span class="leise">${zeitText(v.zeitpunkt)}</span><br>${esc(schrittText(v, f))}</span></label>`).join('')}
      <button type="button" class="knopf tonal" id="schritte-einfuegen" style="margin:6px 0 10px">Einfügen</button></details>` : ''}
    ${bccMoeglich ? `<label class="auswahl" id="mail-bcc-zeile"><input type="checkbox" name="bcc" id="mail-bcc"> <span>Auftraggeber in BCC<br><span class="leise">${esc(agMail)}</span></span></label>` : ''}
    <h3>Anhänge</h3><div id="mail-anlagen">${anl.map(a => anlageZeile(a)).join('')}</div>
    <label class="knopf" style="margin-top:6px">📎 Datei vom Rechner anhängen<input type="file" id="mail-datei" multiple hidden></label>
    <p class="leise">Neue Dateien werden auch beim Fall abgelegt.</p>
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll" id="mail-senden">Senden</button></div></form>`);
  const knopfSchritte = $('#schritte-einfuegen');
  if (knopfSchritte) knopfSchritte.onclick = () => {
    const gewaehlt = [...document.querySelectorAll('#mail-form [name=schritt]:checked')].map(c => S.verlauf[c.value]).filter(Boolean);
    if (!gewaehlt.length) return;
    const feld = $('#mail-form [name=text]'); feld.value = schritteEinfuegen(feld.value, schritteAlsText(gewaehlt, f));
    $('#mail-schritte').open = false;
  };
  $('#mail-datei').onchange = async ev => {
    for (const datei of [...ev.target.files]) {
      const a = await Aktionen.anlageHinzufuegen(f.id, datei);
      if (a) $('#mail-anlagen').insertAdjacentHTML('beforeend', anlageZeile(a, true));
    }
    ev.target.value = '';
  };
  $('#mail-form').onsubmit = async ev => {
    ev.preventDefault();
    const w = new FormData(ev.target), fehler = $('#mail-fehler');
    const zeige = t => { fehler.textContent = t; fehler.hidden = false; };
    const adressen = String(w.get('an')).split(/[,;]/).map(x => x.trim()).filter(Boolean);
    if (!adressen.length || adressen.some(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x))) { zeige('Bitte eine gültige Empfängeradresse eintragen.'); return; }
    const gewaehlt = w.getAll('anlage').map(id => S.anlagen[id]).filter(Boolean);
    if (gewaehlt.reduce((n, a) => n + (a.groesseBytes || 0), 0) > 20 * 1024 * 1024) { zeige('Die Anhänge sind zusammen größer als 20 MB – das nehmen viele Postfächer nicht an.'); return; }
    const knopf = $('#mail-senden'); knopf.disabled = true; knopf.textContent = 'Sendet …';
    try {
      const anhaenge = [];
      for (const a of gewaehlt) {
        await Dateien.adresse(a); // lädt bei Bedarf aus der Cloud
        const blob = await Dateien.hole(a.id); if (!blob) throw new Error(`„${a.anzeigename}“ liegt nicht auf diesem Rechner.`);
        anhaenge.push({ name: a.anzeigename, mimeType: a.mimeType, base64: await alsBase64(blob) });
      }
      const bcc = w.get('bcc') && !adressen.some(x => x.toLowerCase() === agMail.toLowerCase()) ? agMail : '';
      const entwurf = { an: adressen.join(', '), bcc, betreff: String(w.get('betreff')), text: String(w.get('text')), antwortAuf, anhaenge };
      const konto = String(w.get('konto') || kontoVorgabe || 'SCHADEN');
      const messageId = await window.desktop.mail.sende(entwurf, konto);
      const anh = anhaenge.length ? '\nAnhänge: ' + anhaenge.map(a => a.name).join(', ') : '';
      vermerkeMail(S.faelle[f.id], { messageId, konto, von: MAIL.konten[konto].adresse, an: entwurf.an, betreff: entwurf.betreff, text: entwurf.text, zeitpunkt: jetztIso(), anhaenge: anhaenge.map(a => a.name) },
        `An: ${entwurf.an}${bcc ? '\nBcc: ' + bcc : ''}\nBetreff: ${entwurf.betreff}${anh}\n\n${entwurf.text}`, false);
      $('#dialog').close(); nachAenderung(); toast('E-Mail gesendet');
    } catch (e) {
      zeige(e.message || 'Die E-Mail konnte nicht gesendet werden.'); knopf.disabled = false; knopf.textContent = 'Senden';
    }
  };
}

function mailEinstellungen() {
  return Object.keys(MAIL_KONTEN).map(art => {
    const k = MAIL.konten[art], st = mailStand(art), schaden = art === 'SCHADEN';
    const titel = schaden ? 'E-Mail für Schadensfälle' : 'E-Mail für alles andere';
    if (!k) return `<div class="karte block"><h3>${titel}</h3><p class="leise" style="margin-bottom:8px">${schaden
      ? 'Postfach für die Schadensbearbeitung (z. B. schaden@…). Mails aus einem Fall gehen darüber; Antworten werden über die Fallnummer im Betreff dem Fall zugeordnet.'
      : 'Postfach für Disposition, Angebote und Abrechnung (z. B. info@…). Mails an Firmen und Ansprechpartner gehen darüber. Ohne eigenes Konto wird das andere Postfach verwendet.'}</p>
      <button class="knopf voll" data-mail-einrichten="${art}" id="mail-einrichten-${art}">E-Mail-Konto einrichten</button></div>`;
    const zustand = MAIL.laeuft ? 'Wird abgerufen …' : st.fehler ? `Letzter Abruf fehlgeschlagen: ${st.fehler}` : st.letzterAbruf ? `Zuletzt abgerufen ${zeitText(new Date(st.letzterAbruf).toISOString())}` : 'Noch nicht abgerufen';
    return `<div class="karte block"><h3>${titel}</h3><p>${esc(k.adresse)}</p><p class="${st.fehler ? 'fehlertext' : 'leise'}" style="margin:4px 0 8px">${esc(zustand)}</p>
      <div class="zeile"><button class="knopf" data-mail-abrufen id="mail-abrufen-${art}">Jetzt abrufen</button><button class="knopf" data-mail-einrichten="${art}">Ändern</button><button class="knopf" data-mail-entfernen="${art}">Entfernen</button></div></div>`;
  }).join('');
}

function mailKontoDialog(art = 'SCHADEN') {
  const k = MAIL.konten[art] || {}, liste = { ...MAIL.anbieter, EIGENER: { label: 'Eigener Server' } };
  let wahl = Object.keys(MAIL.anbieter).find(a => MAIL.anbieter[a].imapHost === k.imapHost) || (k.imapHost ? 'EIGENER' : 'IONOS');
  const male = () => {
    const eigen = wahl === 'EIGENER', a = MAIL.anbieter[wahl] || {};
    const werte = $('#konto-form') ? Object.fromEntries(new FormData($('#konto-form'))) : { adresse: k.adresse || '', benutzer: k.benutzer && k.benutzer !== k.adresse ? k.benutzer : '' };
    dialog(`<form method="dialog" id="konto-form"><h2>${art === 'SCHADEN' ? 'E-Mail für Schadensfälle' : 'E-Mail für alles andere'}</h2>
      <div class="chips">${Object.entries(liste).map(([id, x]) => `<button type="button" class="chip" data-anbieter="${id}" aria-pressed="${id === wahl}">${esc(x.label)}</button>`).join('')}</div>
      <label class="feld">E-Mail-Adresse<input name="adresse" type="email" required value="${esc(werte.adresse || '')}"></label>
      <label class="feld">Passwort<input name="passwort" type="password" required autocomplete="current-password"></label>
      <label class="feld">Benutzername (falls abweichend)<input name="benutzer" placeholder="meist die E-Mail-Adresse" value="${esc(werte.benutzer || '')}"></label>
      ${eigen ? `<label class="feld">IMAP-Server<input name="imapHost" required value="${esc(werte.imapHost || k.imapHost || '')}"></label>
        <label class="feld">IMAP-Port (SSL)<input name="imapPort" inputmode="numeric" value="${esc(werte.imapPort || k.imapPort || 993)}"></label>
        <label class="feld">SMTP-Server<input name="smtpHost" required value="${esc(werte.smtpHost || k.smtpHost || '')}"></label>
        <label class="feld">SMTP-Port<input name="smtpPort" inputmode="numeric" value="${esc(werte.smtpPort || k.smtpPort || 465)}"></label>
        <label class="auswahl"><input type="checkbox" name="starttls" ${k.smtpSicherheit === 'STARTTLS' ? 'checked' : ''}> SMTP mit STARTTLS (sonst SSL)</label>`
        : `<p class="leise">Server: ${esc(a.imapHost)} (IMAP) · ${esc(a.smtpHost)} (SMTP)</p>`}
      <p class="leise">Das Passwort wird verschlüsselt und nur auf diesem ${window.desktop && window.desktop.plattform === 'android' ? 'Gerät' : 'Rechner (mit deinem Windows-Konto)'} gespeichert. Die App liest den Posteingang und verändert im Postfach nichts.</p>
      <p class="fehlertext" id="konto-fehler" hidden></p>
      <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll" id="konto-verbinden">Verbinden</button></div></form>`);
    $('#konto-form').onclick = e => { const c = e.target.closest('[data-anbieter]'); if (c) { wahl = c.dataset.anbieter; male(); } };
    $('#konto-form').onsubmit = async ev => {
      ev.preventDefault();
      const w = Object.fromEntries(new FormData(ev.target)), fehler = $('#konto-fehler'), knopf = $('#konto-verbinden');
      const server = wahl === 'EIGENER'
        ? { imapHost: w.imapHost.trim(), imapPort: Number(w.imapPort) || 993, imapSicherheit: 'SSL', smtpHost: w.smtpHost.trim(), smtpPort: Number(w.smtpPort) || 465, smtpSicherheit: w.starttls ? 'STARTTLS' : 'SSL' }
        : (({ label, ...rest }) => rest)(MAIL.anbieter[wahl]);
      const konfig = { adresse: w.adresse.trim(), benutzer: w.benutzer.trim() || w.adresse.trim(), name: S.einstellungen.firma || '', ...server };
      knopf.disabled = true; knopf.textContent = 'Prüfe …'; fehler.hidden = true;
      try {
        MAIL.konten[art] = await window.desktop.mail.einrichten(konfig, w.passwort, art); aktualisiereKonto();
        if (MAIL.konten[art].adresse !== k.adresse) setzeMailStand(art, {});
        $('#dialog').close(); speichere(); zeichne(); toast('E-Mail-Konto verbunden'); postfachAbrufen();
      } catch (e) { fehler.textContent = e.message; fehler.hidden = false; knopf.disabled = false; knopf.textContent = 'Verbinden'; }
    };
  };
  male();
}

/** Konto setzen (z. B. nach dem Einrichten) und die Oberfläche auffrischen. */
function mailKontoGesetzt(art, konfig) { MAIL.konten[art] = konfig; aktualisiereKonto(); zeichne(); }

async function mailStart() {
  if (!window.desktop) return;
  try {
    MAIL.anbieter = await window.desktop.mail.anbieter();
    for (const art of Object.keys(MAIL.konten)) MAIL.konten[art] = await window.desktop.mail.konto(art);
    aktualisiereKonto();
  } catch { return; }
  window.desktop.beiZiel(ziel => gehe(ziel));
  zeichne();
  if (MAIL.konto) postfachAbrufen();
  MAIL.timer = setInterval(() => postfachAbrufen(), 15 * 60 * 1000);
}

// ============================== Start ==============================
window.addEventListener('hashchange', zeichne);
window.addEventListener('beforeunload', e => { if ($('#fall-form') && formularWerte() !== formularStand) e.preventDefault(); });
window.addEventListener('online', () => abgleich());
document.addEventListener('visibilitychange', () => { if (!document.hidden) { zeichne(); pruefeStand(); } });
setInterval(pruefeStand, 45000);
if (langeMailsKuerzen()) speichere();
zeichne();
if (mitCloud()) abgleich();
mailStart();
window.__appBereit = true;
</script>
