// ============================== Tourenplanung ==============================
/**
 * Touren je Tag: Fahrzeug (Kennzeichen aus dem Fuhrpark), Auftraggeber (Firma), Einsatzart, Fahrer und Beifahrer (Mitarbeiter).
 * Jede Änderung wird sofort gespeichert und abgeglichen. Hinweise (doppelt eingeplant, abwesend, Führerschein, Fahrzeug in
 * der Werkstatt …) entstehen aus Personal und Fuhrpark. „Teams auffüllen“ schlägt passende Leute vor.
 */
const BEIFAHRER_MAX = 5;
const beifahrerVon = t => String(t.beifahrerIds || '').split(',').filter(Boolean);
const teamVon = t => [t.fahrerId, ...beifahrerVon(t)].filter(Boolean);
const tourenAm = tag => alle('touren').filter(t => t.datum === tag).sort((a, b) => (a.reihenfolge ?? 0) - (b.reihenfolge ?? 0) || String(a.id).localeCompare(String(b.id)));
const tourAuftraggeberName = t => (t.auftraggeberId && S.auftraggeber[t.auftraggeberId] && !S.auftraggeber[t.auftraggeberId].geloescht ? S.auftraggeber[t.auftraggeberId].name : t.auftraggeber || '');
const tourText = t => [t.tourNr && 'Tour ' + t.tourNr, tourAuftraggeberName(t), t.name, t.uhrzeit && 'ab ' + t.uhrzeit, t.einsatzart].filter(Boolean).join(' · ');
const tourGefahren = t => !!(t.kennzeichen && t.fahrerId);
const einsatzartListe = () => alle('einsatzarten').sort((a, b) => String(a.name).localeCompare(String(b.name), 'de'));
const einsatzartZu = name => alle('einsatzarten').find(e => normal(e.name) === normal(name)) || null;
const fahrzeugZumKz = kz => { const k = kzNormal(kz); return k ? alle('fahrzeuge').find(z => kzNormal(z.kennzeichen) === k) || null : null; };
/** Touren einer Firma (über Kennung oder gleichen Namen). */
const tourenVonFirma = (firma, von = '0000', bis = '9999') => alle('touren').filter(t => t.datum >= von && t.datum <= bis
  && (t.auftraggeberId === firma.id || (!t.auftraggeberId && normal(t.auftraggeber) === normal(firma.name))));
const tourenVonFahrzeug = (z, von = '0000', bis = '9999') => { const k = kzNormal(z.kennzeichen); return alle('touren').filter(t => t.datum >= von && t.datum <= bis && kzNormal(t.kennzeichen) === k); };
const schaedenVonTour = t => faelle().filter(f => f.tourId === t.id);

const TourAktionen = {
  undo: [],
  /** Stand eines Tages für „Rückgängig“ merken. */
  merken(tag) { this.undo.push({ tag, touren: tourenAm(tag).map(t => ({ ...t })) }); if (this.undo.length > 50) this.undo.shift(); },
  speichern(t, ohneUndo) {
    if (!ohneUndo) this.merken(t.datum);
    const x = merke('touren', { ...t, id: t.id || uuid(), firmaId: '', geaendertAm: jetztIso() });
    tourGeaendert(); return x.id;
  },
  neu(tag, vorgabe = {}) {
    this.merken(tag);
    const n = tourenAm(tag).reduce((m, t) => Math.max(m, t.reihenfolge ?? 0), 0) + 1;
    return this.speichern({ datum: tag, reihenfolge: n, ...vorgabe }, true);
  },
  loeschen(t) { this.merken(t.datum); entferne('touren', t, { firmaId: '', geaendertAm: jetztIso() }); tourGeaendert(); },
  verschieben(t, richtung) {
    const liste = tourenAm(t.datum), i = liste.findIndex(x => x.id === t.id), j = i + richtung;
    if (j < 0 || j >= liste.length) return;
    this.merken(t.datum);
    [liste[i], liste[j]] = [liste[j], liste[i]];
    liste.forEach((x, k) => { if ((x.reihenfolge ?? 0) !== k + 1) merke('touren', { ...x, reihenfolge: k + 1, geaendertAm: jetztIso() }); });
    tourGeaendert();
  },
  rueckgaengig() {
    const s = this.undo.pop(); if (!s) return false;
    const vorher = new Map(s.touren.map(t => [t.id, t]));
    for (const t of tourenAm(s.tag)) if (!vorher.has(t.id)) entferne('touren', t, { firmaId: '', geaendertAm: jetztIso() });
    for (const t of s.touren) merke('touren', { ...t, geloescht: undefined, geaendertAm: jetztIso() });
    ANSICHT.tourTag = s.tag; tourGeaendert(); return true;
  },
  /** Touren eines anderen Tages übernehmen (ersetzt den Tag); auf Wunsch mit Team (Abwesende bleiben draußen). */
  uebernehmen(von, nach, mitTeam) {
    this.merken(nach);
    for (const t of tourenAm(nach)) entferne('touren', t, { firmaId: '', geaendertAm: jetztIso() });
    const frei = id => id && !abwesendAm(id, nach) && maAktiv(maVon(id));
    tourenAm(von).forEach((t, i) => merke('touren', { id: uuid(), firmaId: '', datum: nach, reihenfolge: i + 1, kennzeichen: t.kennzeichen, tourNr: t.tourNr, auftraggeberId: t.auftraggeberId,
      auftraggeber: t.auftraggeber, name: t.name, uhrzeit: t.uhrzeit, einsatzart: t.einsatzart, notiz: t.notiz,
      fahrerId: mitTeam && frei(t.fahrerId) ? t.fahrerId : '', beifahrerIds: mitTeam ? beifahrerVon(t).filter(frei).join(',') : '', geaendertAm: jetztIso() }));
    tourGeaendert();
  },
};
/** Nach Änderungen an Touren: speichern, abgleichen und neu zeichnen, ohne den Eingabefokus zu verlieren. */
function tourGeaendert() {
  speichere(); planeAbgleich();
  clearTimeout(tourGeaendert.t);
  tourGeaendert.t = setTimeout(() => {
    const a = document.activeElement, schluessel = a && a.closest && a.closest('[data-tour-zeile]') && [a.closest('[data-tour-zeile]').dataset.tourZeile, a.dataset.feld, a.dataset.index];
    zeichne();
    if (schluessel) {
      const el = document.querySelector(`[data-tour-zeile="${schluessel[0]}"] [data-feld="${schluessel[1]}"]${schluessel[2] != null ? `[data-index="${schluessel[2]}"]` : ''}`);
      if (el) { el.focus(); if (el.select && el.tagName === 'INPUT') try { el.setSelectionRange(el.value.length, el.value.length); } catch {} }
    }

}

// ---------- Prüfung ----------
/** Was an einem Tag belegt ist (für Doppelt-Prüfung und „frei“). */
function tagesLage(tag) {
  const touren = tourenAm(tag), personen = {}, fahrzeuge = {};
  for (const t of touren) { for (const id of teamVon(t)) personen[id] = (personen[id] || 0) + 1; const k = kzNormal(t.kennzeichen); if (k) fahrzeuge[k] = (fahrzeuge[k] || 0) + 1; }
  return { touren, personen, fahrzeuge };
}
const nichtBeiListe = m => String(m.nichtBei || '').split(',').map(normal).filter(Boolean);
/** Führerschein reicht für das Fahrzeug? (ohne Angabe: keine Prüfung) */
function fuehrerscheinOk(m, z) {
  if (!m.fuehrerschein || !z || !z.zgg) return true;
  const k = String(m.fuehrerschein).toUpperCase().split(/[\s,;/]+/);
  if (z.zgg > 7500) return k.some(x => /^C(E)?$/.test(x));
  if (z.zgg > 3500) return k.some(x => /^C1?(E)?$/.test(x));
  return true;
}
/** Hinweise zu einer Tour. */
function tourHinweise(t, lage = tagesLage(t.datum)) {
  const h = [], z = fahrzeugZumKz(t.kennzeichen), art = einsatzartZu(t.einsatzart), ag = normal(tourAuftraggeberName(t));
  if (t.kennzeichen) {
    if (lage.fahrzeuge[kzNormal(t.kennzeichen)] > 1) h.push(['rot', 'Fahrzeug mehrfach eingeplant']);
    if (z && z.status === 'WERKSTATT') h.push(['rot', 'Fahrzeug in der Werkstatt']);
    if (z && z.status === 'STILLGELEGT') h.push(['rot', 'Fahrzeug abgemeldet']);
    if (z) for (const f of fristenVon(z).filter(f => f.datum < t.datum && ['huBis', 'spBis', 'uvvBis', 'tachoBis', 'versicherungBis'].includes(f.feld))) h.push(['rot', `${f.label} abgelaufen`]);
    if (!z) h.push(['grau', 'nicht im Fuhrpark']);
  }
  if (t.kennzeichen && !t.fahrerId) h.push(['gelb', 'Fahrer fehlt']);
  for (const id of teamVon(t)) {
    const m = maVon(id); if (!m) { h.push(['rot', 'Mitarbeiter gelöscht']); continue; }
    const vorn = m.name.split(' ')[0];
    if (lage.personen[id] > 1) h.push(['rot', `${vorn} doppelt eingeplant`]);
    const a = abwesendAm(id, t.datum); if (a) h.push(['rot', `${vorn}: ${a.grund || 'abwesend'}`]);
    if (!maAktiv(m)) h.push(['rot', `${vorn} ist inaktiv`]);
    if (ag && nichtBeiListe(m).includes(ag)) h.push(['rot', `${vorn} nicht bei ${tourAuftraggeberName(t)}`]);
  }
  const f = maVon(t.fahrerId);
  if (f) {
    if (!kannFahren(f)) h.push(['gelb', `${f.name.split(' ')[0]} ist nur Beifahrer`]);
    if (!fuehrerscheinOk(f, z)) h.push(['rot', `Führerschein von ${f.name.split(' ')[0]} reicht nicht (${zahlText(z.zgg, 'kg')})`]);
    for (const [k, l] of [['fuehrerscheinBis', 'Führerschein'], ['fahrerkarteBis', 'Fahrerkarte'], ['modul95Bis', 'Modul 95']]) if (f[k] && f[k] < t.datum) h.push(['rot', `${l} von ${f.name.split(' ')[0]} abgelaufen`]);
  }
  if (art && t.kennzeichen) {
    const soll = art.beifahrer || 0, ist = beifahrerVon(t).length;
    if (ist < soll) h.push(['gelb', `${soll - ist} Beifahrer fehlt${soll - ist > 1 ? 'en' : ''}`]);
    if (art.monteurNoetig && !teamVon(t).some(id => maVon(id) && maVon(id).monteur)) h.push(['gelb', 'Monteur fehlt']);
  }
  return h;
}

// ---------- Teams auffüllen ----------
/**
 * Füllt Fahrer und Beifahrer der gewählten Touren auf: nur aktive, anwesende, an diesem Tag freie Leute, die beim Auftraggeber
 * eingesetzt werden dürfen und (für Fahrer) die Rolle und den Führerschein haben. Bevorzugt: fester Fahrer des Fahrzeugs,
 * wer dieses Fahrzeug bzw. diesen Auftraggeber kennt, Monteure wo nötig – und wer in den letzten 14 Tagen weniger gearbeitet hat.
 */
function teamsAuffuellen(tag, ids) {
  const lage = tagesLage(tag), belegt = new Set(Object.keys(lage.personen));
  const verlauf = alle('touren').filter(t => t.datum < tag && t.datum >= plusTage(tag, -60)), kurz = plusTage(tag, -14);
  const kennt = {}, arbeit = {};
  for (const t of verlauf) for (const id of teamVon(t)) {
    kennt[id + '|' + kzNormal(t.kennzeichen)] = (kennt[id + '|' + kzNormal(t.kennzeichen)] || 0) + 1;
    kennt[id + '|' + normal(tourAuftraggeberName(t))] = (kennt[id + '|' + normal(tourAuftraggeberName(t))] || 0) + 1;
    if (t.datum >= kurz) arbeit[id] = (arbeit[id] || 0) + 1;
  }
  const verfuegbar = mitarbeiterListe(true).filter(m => !abwesendAm(m.id, tag));
  let gesetzt = 0;
  const geaendert = [];
  for (const t of lage.touren.filter(t => ids.includes(t.id) && t.kennzeichen)) {
    const z = fahrzeugZumKz(t.kennzeichen), ag = normal(tourAuftraggeberName(t)), art = einsatzartZu(t.einsatzart);
    const darf = m => !belegt.has(m.id) && !(ag && nichtBeiListe(m).includes(ag));
    const punkte = (m, alsFahrer) => (alsFahrer && z && z.fahrer && nameSchluessel(z.fahrer) === nameSchluessel(m.name) ? 50 : 0)
      + 3 * Math.min(10, kennt[m.id + '|' + kzNormal(t.kennzeichen)] || 0) + 2 * Math.min(10, kennt[m.id + '|' + ag] || 0) - 2 * (arbeit[m.id] || 0)
      + (!alsFahrer && m.rolle !== 'FAHRER' ? 8 : 0) + (alsFahrer && m.rolle === 'FAHRER' ? 4 : 0);
    const bester = (kandidaten, alsFahrer) => kandidaten.sort((a, b) => punkte(b, alsFahrer) - punkte(a, alsFahrer) || a.name.localeCompare(b.name, 'de'))[0];
    let fahrerId = t.fahrerId, bf = beifahrerVon(t);
    if (!fahrerId) {
      const m = bester(verfuegbar.filter(m => darf(m) && kannFahren(m) && fuehrerscheinOk(m, z)), true);
      if (m) { fahrerId = m.id; belegt.add(m.id); gesetzt++; }
    }
    const soll = Math.min(BEIFAHRER_MAX, art ? art.beifahrer || 0 : bf.length);
    while (bf.length < soll) {
      const brauchtMonteur = art && art.monteurNoetig && ![fahrerId, ...bf].some(id => maVon(id) && maVon(id).monteur);
      const kandidaten = verfuegbar.filter(m => darf(m) && (!brauchtMonteur || m.monteur));
      const m = bester(kandidaten.length ? kandidaten : verfuegbar.filter(darf), false);
      if (!m) break;
      bf.push(m.id); belegt.add(m.id); gesetzt++;
    }
    if (fahrerId !== t.fahrerId || bf.join(',') !== beifahrerVon(t).join(',')) geaendert.push({ ...t, fahrerId: fahrerId || '', beifahrerIds: bf.join(',') });
  }
  if (geaendert.length) { TourAktionen.merken(tag); for (const t of geaendert) merke('touren', { ...t, geaendertAm: jetztIso() }); tourGeaendert(); }
  return gesetzt;
}

function freiAm(tag) {
  const lage = tagesLage(tag), belegt = new Set(Object.keys(lage.personen));
  const aktive = mitarbeiterListe(true), weg = aktive.filter(m => abwesendAm(m.id, tag));
  const frei = aktive.filter(m => !belegt.has(m.id) && !abwesendAm(m.id, tag));

  const fzFrei = fz.filter(z => z.status !== 'WERKSTATT' && !lage.fahrzeuge[kzNormal(z.kennzeichen)]);
  const klasse = (von, bis) => fzFrei.filter(z => (von === 0 ? !z.zgg : z.zgg > von && z.zgg <= bis));
  return { frei, weg, werkstatt: fz.filter(z => z.status === 'WERKSTATT'), fahrzeuge: fzFrei,

}

/** Wird in der Tourenplanung gerade etwas getippt, das noch nicht gespeichert ist? */
function tourEingabeOffen() {
  const el = document.activeElement, z = el && el.closest && el.closest('[data-tour-zeile]');
  if (!z || !el.dataset.feld) return false;
  const t = S.touren[z.dataset.tourZeile]; if (!t) return false;
  const f = el.dataset.feld;
  const gespeichert = f === 'fahrer' ? maName(t.fahrerId) : f === 'beifahrer' ? maName(beifahrerVon(t)[Number(el.dataset.index)]) : f === 'auftraggeber' ? tourAuftraggeberName(t) : t[f] || '';
  return el.value.trim() !== String(gespeichert || '').trim();
}
/** Eingabe in einer Tourzeile übernehmen (Namen → Mitarbeiter, Kennzeichen → Fuhrpark, Auftraggeber → Firma). */
function tourEingabe(t, el) {
  const feld = el.dataset.feld, wert = el.value.trim(), neu = { ...t };
  const person = (name, rolle) => {
    if (!name) return '';
    const m = maZumNamen(name); if (m) return m.id;
    toast(`„${name}“ neu im Personal angelegt – bitte unter Personal ergänzen`, 5000);
    return PersonalAktionen.schnellAnlegen(name, rolle);
  };
  if (feld === 'kennzeichen') { const z = fahrzeugZumKz(wert); neu.kennzeichen = z ? z.kennzeichen : wert.toUpperCase(); }
  else if (feld === 'auftraggeber') {
    const f = wert ? firmaZumNamen(wert) : null;
    if (f || !wert) { neu.auftraggeberId = f ? f.id : ''; neu.auftraggeber = f ? f.name : ''; }
    else {
      neu.auftraggeberId = Aktionen.firmaSpeichern({ name: wert, status: 'AKTIV', notizen: 'Aus der Tourenplanung angelegt' }); neu.auftraggeber = wert;
      toast(`Firma „${wert}“ im CRM angelegt`, 4000);
    }
  } else if (feld === 'fahrer') neu.fahrerId = person(wert, 'FAHRER');
  else if (feld === 'beifahrer') {
    const bf = beifahrerVon(t), i = Number(el.dataset.index), id = person(wert, 'BEIFAHRER');
    if (id) bf[i] = id; else bf.splice(i, 1);
    neu.beifahrerIds = bf.filter(Boolean).join(',');
  } else neu[feld] = wert;
  if (JSON.stringify(neu) !== JSON.stringify(t)) TourAktionen.speichern(neu);
}

/** Auftraggeber-Bericht: je Auftraggeber und Einsatzart die Anzahl je Tag, dazu die einzelnen Touren. */
function auftraggeberBericht(von, bis, firmaId) {
  const tage = []; for (let d = von; d <= bis; d = plusTage(d, 1)) tage.push(d);
  const touren = alle('touren').filter(t => t.datum >= von && t.datum <= bis && tourGefahren(t) && (!firmaId || t.auftraggeberId === firmaId || (S.auftraggeber[firmaId] && normal(t.auftraggeber) === normal(S.auftraggeber[firmaId].name))));
  const nachAg = {};
  for (const t of touren) (nachAg[tourAuftraggeberName(t) || '(ohne Auftraggeber)'] = nachAg[tourAuftraggeberName(t) || '(ohne Auftraggeber)'] || []).push(t);
  const we = t => [0, 6].includes(alsTag(t).getDay());
  const kopf = titel => `<tr><th class="nm">${titel}</th>${tage.map(t => `<th class="${we(t) ? 'we' : ''}">${Number(t.slice(8))}</th>`).join('')}<th class="s">Σ</th></tr>`;
  const zeile = (label, l, fett) => { let s = 0; return `<tr${fett ? ' style="font-weight:700"' : ''}><td class="nm">${esc(label)}</td>${tage.map(t => { const n = l.filter(x => x.datum === t).length; s += n; return `<td class="${we(t) ? 'we' : ''}">${n || ''}</td>`; }).join('')}<td class="s">${s}</td></tr>`; };
  const bloecke = Object.keys(nachAg).sort((a, b) => a.localeCompare(b, 'de')).map(ag => {
    const l = nachAg[ag], arten = [...new Set(l.map(t => t.einsatzart || '–'))].sort();
    const tourGruppen = Object.values(l.reduce((o, t) => { const k = [t.tourNr, t.name, t.einsatzart].join('|'); (o[k] = o[k] || []).push(t); return o; }, {}));
    return `<div class="blk"><h2>${esc(ag)} · ${l.length} Touren · ${esc(datumText(von))} – ${esc(datumText(bis))}</h2><table>${kopf('Einsatzart')}${arten.map(a => zeile(a, l.filter(t => (t.einsatzart || '–') === a), true)).join('')}${zeile('Summe', l, true)}</table>

/** Gültiger Preis je Bezeichnung zum Stichtag (der jüngste mit „gültig ab“ ≤ Stichtag). */
function preiseZum(firmaId, stichtag) {
  const beste = new Map();
  for (const p of vonFirma('preise', firmaId)) {
    if (p.gueltigAb && p.gueltigAb > stichtag) continue;
    const k = normal(p.bezeichnung), alt = beste.get(k);
    if (!alt || String(p.gueltigAb || '') > String(alt.gueltigAb || '')) beste.set(k, p);
  }
  return [...beste.values()].sort((a, b) => a.bezeichnung.localeCompare(b.bezeichnung, 'de'));
}
/** Passender Preis für eine Einsatzart: gleiche Bezeichnung, dann enthalten, sonst die einzige Tourpauschale. */
function preisFuerArt(preise, art) {
  const a = normal(art);
  return (a && (preise.find(p => normal(p.bezeichnung) === a) || preise.find(p => normal(p.bezeichnung).includes(a) || a.includes(normal(p.bezeichnung)))))
    || (l => (l.length === 1 ? l[0] : null))(preise.filter(p => /tour/i.test(p.bezeichnung + ' ' + (p.einheit || ''))));
}
const tageText = daten => daten.sort().map(t => `${t.slice(8)}.${t.slice(5, 7)}.`).join(', ');
/** Rechnung aus der Tourenplanung: noch nicht abgerechnete, gefahrene Touren × Preise der Firma; die Touren werden als abgerechnet markiert. */
function rechnungAusTouren(firmaId, von, bis) {
  const firmen = auftraggeberListe();
  if (!firmen.length) { toast('Bitte zuerst eine Firma anlegen.'); return; }
  const zr = zeitraum('LETZTER_MONAT');

    <label class="feld">Firma<select name="firma">${firmen.map(f => `<option value="${f.id}" ${f.id === firmaId ? 'selected' : ''}>${esc(firmaName(f))} (${tourenVonFirma(f).filter(t => tourGefahren(t) && !t.belegId).length} offen)</option>`).join('')}</select></label>
    <div class="zeile"><label class="feld fuell">Von<input name="von" type="date" value="${von || zr.von}" required></label><label class="feld fuell">Bis<input name="bis" type="date" value="${bis || zr.bis}" required></label></div>

function rechnungAusTourenVorschau(firma, von, bis, aufteilung) {
  const abgerechnet = t => t.belegId && S.belege[t.belegId] && !S.belege[t.belegId].geloescht;
  const alleT = tourenVonFirma(firma, von, bis).filter(tourGefahren), touren = alleT.filter(t => !abgerechnet(t));
  const preise = preiseZum(firma.id, bis);
  const gruppen = {};
  for (const t of touren) {
    const k = aufteilung === 'TOUR' ? [t.tourNr, t.name, t.einsatzart].join('|') : t.einsatzart || '';
    (gruppen[k] = gruppen[k] || { art: t.einsatzart || '', text: aufteilung === 'TOUR' ? [t.tourNr && 'Tour ' + t.tourNr, t.name].filter(Boolean).join(' – ') + (t.einsatzart ? ` (${t.einsatzart})` : '') : t.einsatzart || 'Touren', touren: [] }).touren.push(t);

  dialog(`<form method="dialog" id="tpr-vorschau"><h2>Rechnung an ${esc(firmaName(firma))}</h2><p class="leise">Leistungszeitraum ${esc(zeitraumText)} · ${touren.length} Touren${alleT.length > touren.length ? ` (${alleT.length - touren.length} schon abgerechnet)` : ''}</p>
    ${!liste.length ? '<p class="leise">Keine gefahrenen, offenen Touren im Zeitraum.</p>'
      : `<div id="tpr-zeilen">${liste.map((z, i) => `<div class="karte block" style="padding:10px;margin:8px 0"><div class="zeile eng"><b class="fuell">${esc(z.text)}</b><span>${z.menge}×</span></div>${z.tage ? `<small class="leise">${esc(z.tage)}</small>` : ''}
          <div class="zeile eng" style="margin-top:6px"><label class="feld fuell" style="margin:0">${preisWahl(z, i)}</label><b data-tpr-betrag="${i}" style="min-width:90px;text-align:right"></b></div></div>`).join('')}</div>
        <p><b>Netto: <span id="tpr-summe"></span></b></p>${preise.length ? '' : '<p class="leise">Diese Firma hat noch keine Preise – unter „Preise und Konditionen“ anlegen (Name = Einsatzart) oder in der Rechnung eintragen.</p>'}`}
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll" ${liste.length ? '' : 'disabled'}>Rechnung anlegen</button></div></form>`);
  const gewaehlt = i => S.preise[$(`[data-tpr-preis="${i}"]`).value] || null;
  const rechne = () => {
    let n = 0;
    liste.forEach((z, i) => { const p = gewaehlt(i), c = p && p.betragCent != null ? p.betragCent * z.menge : 0; n += c; $(`[data-tpr-betrag="${i}"]`).textContent = p ? geld(c) : '–'; });
    $('#tpr-summe').textContent = geld(n);

  if (liste.length) { rechne(); $('#tpr-zeilen').onchange = rechne; }
  $('#tpr-vorschau').onsubmit = ev => {
    ev.preventDefault();
    const pos = liste.map((z, i) => {

      return { bez, einheit: [p && p.einheit, z.tage].filter(Boolean).join(' · '), menge: z.menge, einzelCent: p && p.betragCent != null ? p.betragCent : 0 };
    });
    const id = BelegAktionen.neu('RECHNUNG', firma.id, { positionen: JSON.stringify(pos), notiz: `Aus der Tourenplanung: ${zeitraumText} (${touren.length} Touren)`,
      einleitung: `für unsere Leistungen im Zeitraum ${zeitraumText} erlauben wir uns, wie folgt zu berechnen:` });
    for (const t of liste.flatMap(z => z.touren)) merke('touren', { ...t, belegId: id, geaendertAm: jetztIso() });

  };
}

/**
 * Die bisherige Tourenplanung (eigene Seite mit Google-Tabelle) wird einmalig – oder wiederholt bis zum Umstieg – übernommen:
 * Fahrzeuge → Fuhrpark, Personal → Mitarbeiter, Einsatzarten, Auftraggeber → Firmen, Abwesenheiten und alle Touren im Zeitraum.
 * Wiederholen ist gefahrlos: gleiche Kennzeichen, Namen und Tage werden zusammengeführt, nichts doppelt angelegt.
 */
const TP = { url: 'https://script.google.com/macros/s/AKfycby5KUa5VlCeza6mLZCDt1hajWjMGLXFjD_fW847ERpWn12DC2xZZfOlezVpBUv63WTG2g/exec' };
async function tpApi(pin, name, args) {
  const r = await (await fetch(TP.url, { method: 'POST', body: JSON.stringify({ pin, name, args }) })).json();
  if (r.error) throw new Error(/PIN/i.test(r.error) && !/GESPERRT/.test(r.error) ? 'Die PIN der Tourenplanung war falsch.' : String(r.error).replace(/^.*GESPERRT: /, ''));
  return r.ok;
}
/** Feste Kennung aus einem Text (gleiche Tour bei erneutem Import = gleiche Kennung). */
function kennungAus(text) {
  let h1 = 0x811c9dc5, h2 = 0x01000193, h3 = 0x12345678, h4 = 0x9e3779b9;
  for (let i = 0; i < text.length; i++) { const c = text.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); h3 = Math.imul(h3 ^ c, 3266489917); h4 = Math.imul(h4 ^ c, 668265263); }
  const x = [h1, h2, h3, h4].map(h => (h >>> 0).toString(16).padStart(8, '0')).join('');
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20, 32)}`;
}

          const n = tpTagUebernehmen(tag, liste || []); touren += n; if (n) mitTouren++;

}
function tpStammdatenUebernehmen(d) {
  const r = { fahrzeuge: 0, personal: 0, einsatzarten: 0, firmen: 0, abwesenheiten: 0 }, jetzt = jetztIso();
  const rest = (o, ohne) => Object.entries(o).filter(([k, v]) => !ohne.includes(k) && v !== '' && v != null).map(([k, v]) => `${k.replace(/_/g, ' ')}: ${v}`).join(', ');
  for (const f of d.fahrzeuge || []) {
    const kz = String(f.Kennzeichen || '').trim(); if (!kz) continue;
    const zgg = Number(String(f.zGG_kg || '').replace(/\D/g, '')) || null, leih = jaNein(f.Leihfahrzeug), alt = fahrzeugZumKz(kz);
    if (!alt) { merke('fahrzeuge', { id: uuid(), firmaId: '', kennzeichen: kz.toUpperCase(), art: zgg && zgg > 3500 ? 'LKW' : 'TRANSPORTER', status: 'AKTIV', zgg, leihfahrzeug: leih, notiz: rest(f, ['Kennzeichen', 'zGG_kg', 'Leihfahrzeug']) ? 'Aus der Tourenplanung – ' + rest(f, ['Kennzeichen', 'zGG_kg', 'Leihfahrzeug']) : '', geaendertAm: jetzt }); r.fahrzeuge++; }
    else if ((!alt.zgg && zgg) || (leih && !alt.leihfahrzeug)) { merke('fahrzeuge', { ...alt, zgg: alt.zgg || zgg, leihfahrzeug: alt.leihfahrzeug || leih, geaendertAm: jetzt }); r.fahrzeuge++; }
  }
  for (const a of d.einsatzarten || []) {
    const name = String(a.Einsatzart || '').trim(); if (!name) continue;
    const alt = einsatzartZu(name), neu = { beifahrer: Math.min(BEIFAHRER_MAX, Number(a.Beifahrer) || 0), monteurNoetig: jaNein(a.Monteur_noetig) };
    if (!alt) { merke('einsatzarten', { id: kennungAus('ea|' + normal(name)), firmaId: '', name, ...neu, notiz: '', geaendertAm: jetzt }); r.einsatzarten++; }
  }
  for (const a of d.auftraggeber || []) {
    const name = String(a.Auftraggeber || '').trim(); if (!name) continue;
    let f = firmaZumNamen(name);
    if (!f) { f = merke('auftraggeber', { id: uuid(), name, status: 'AKTIV', notizen: 'Aus der Tourenplanung übernommen', geaendertAm: jetzt }); r.firmen++; }
    if (a.Adresse && !vonFirma('adressen', f.id).length) {
      const m = String(a.Adresse).match(/^(.*?),?\s*(\d{5})\s+(.+)$/);
      merke('adressen', { id: uuid(), firmaId: f.id, art: 'HAUPTSITZ', strasse: m ? m[1].trim() : String(a.Adresse), plz: m ? m[2] : '', ort: m ? m[3].trim() : '', notiz: '', geaendertAm: jetzt });
    }
  }
  for (const p of d.personal || []) {
    const name = String(p.Name || '').trim(); if (!name) continue;
    const rolle = /beides/i.test(p.Rolle) ? 'BEIDES' : /beifahrer/i.test(p.Rolle) ? 'BEIFAHRER' : 'FAHRER', alt = maZumNamen(name);
    const daten = { rolle, telefon: p.Telefon ? String(p.Telefon) : '', monteur: jaNein(p.Monteur), nichtBei: String(p.Nicht_bei || '').trim(), aktiv: !/^nein$/i.test(String(p.Aktiv || '').trim()) };
    if (!alt) { merke('mitarbeiter', { id: kennungAus('ma|' + nameSchluessel(name)), firmaId: '', name, ...daten, notiz: rest(p, ['Name', 'Rolle', 'Telefon', 'Monteur', 'Nicht_bei', 'Aktiv']), geaendertAm: jetzt }); r.personal++; }
    else {
      const dazu = Object.fromEntries(Object.entries(daten).filter(([k, v]) => (alt[k] == null || alt[k] === '') && v !== ''));
      if (Object.keys(dazu).length) { merke('mitarbeiter', { ...alt, ...dazu, geaendertAm: jetzt }); r.personal++; }
    }
  }
  for (const a of d.abwesenheiten || []) {
    const m = maZumNamen(a.Name); if (!m || !a.Von) continue;
    const id = kennungAus(`abw|${m.id}|${a.Von}|${a.Bis || a.Von}`);
    if (S.abwesenheiten[id] || abwesenheitenVon(m.id).some(x => x.von === a.Von && (x.bis || x.von) === (a.Bis || a.Von))) continue;
    merke('abwesenheiten', { id, firmaId: '', mitarbeiterId: m.id, von: a.Von, bis: a.Bis || a.Von, grund: a.Grund || '', notiz: '', geaendertAm: jetzt }); r.abwesenheiten++;
  }
  return r;
}
/** Touren eines Tages übernehmen; feste Kennungen je Tag und Zeile, Überzähliges vom letzten Import wird entfernt. */
function tpTagUebernehmen(tag, liste) {
  const person = n => { n = String(n || '').trim(); if (!n) return ''; const m = maZumNamen(n); return m ? m.id : PersonalAktionen.schnellAnlegen(n); };
  const ids = new Set(), jetzt = jetztIso();
  liste.filter(t => ['Kennzeichen', 'Fahrer', 'TourNr', 'Name', 'Auftraggeber', 'Beifahrer1'].some(k => String(t[k] || '').trim())).forEach((t, i) => {
    const id = kennungAus(`tour|${tag}|${i}`); ids.add(id);
    const agName = String(t.Auftraggeber || '').trim(), f = agName ? firmaZumNamen(agName) : null, z = fahrzeugZumKz(t.Kennzeichen);
    const neu = { id, firmaId: '', datum: tag, reihenfolge: i + 1, kennzeichen: z ? z.kennzeichen : String(t.Kennzeichen || '').trim().toUpperCase(), tourNr: String(t.TourNr || '').trim(),
      auftraggeberId: f ? f.id : '', auftraggeber: f ? f.name : agName, name: String(t.Name || '').trim(), uhrzeit: String(t.Uhrzeit || '').trim(), einsatzart: String(t.Einsatzart || '').trim(),
      fahrerId: person(t.Fahrer), beifahrerIds: [1, 2, 3, 4, 5].map(k => person(t['Beifahrer' + k])).filter(Boolean).join(','), notiz: '' };
    const alt = S.touren[id];
    if (alt && ['kennzeichen', 'tourNr', 'auftraggeber', 'name', 'uhrzeit', 'einsatzart', 'fahrerId', 'beifahrerIds'].every(k => (alt[k] || '') === (neu[k] || ''))) return;
    merke('touren', { ...(alt || {}), ...neu, belegId: alt ? alt.belegId || '' : '', notiz: alt ? alt.notiz || '' : '', geaendertAm: jetzt });
  });
  // Touren aus einem früheren Import, die es in der Tourenplanung nicht mehr gibt (selbst angelegte Touren bleiben)
  const importiert = new Set(Array.from({ length: 200 }, (_, k) => kennungAus(`tour|${tag}|${k}`)));
  for (const t of tourenAm(tag)) if (importiert.has(t.id) && !ids.has(t.id)) entferne('touren', t, { firmaId: '', geaendertAm: jetzt });
  return ids.size;
}

// ============================== Fuhrpark ==============================
const FAHRZEUG_ART = { TRANSPORTER: 'Transporter', LKW: 'LKW', PKW: 'PKW', ANHAENGER: 'Anhänger', SONSTIGES: 'Sonstiges' };
const FAHRZEUG_STATUS = { AKTIV: ['Im Einsatz', 'gruen'], WERKSTATT: ['In der Werkstatt', 'gelb'], RESERVE: ['Reserve', 'grau'], STILLGELEGT: ['Abgemeldet / verkauft', 'grau'] };
const FRISTEN = [['huBis', 'HU (TÜV)'], ['spBis', 'SP (Sicherheitsprüfung)'], ['uvvBis', 'UVV-Prüfung'], ['tachoBis', 'Tachograph-Prüfung'], ['ladeBis', 'Ladebordwand-Prüfung'],
  ['wartungBis', 'Wartung / Inspektion'], ['versicherungBis', 'Versicherung läuft ab'], ['leasingBis', 'Leasing / Finanzierung endet']];
const FAHRZEUG_EINTRAG = { WARTUNG: ['Wartung / Inspektion', '🔧'], REPARATUR: ['Reparatur', '🛠'], REIFEN: ['Reifen', '⭕'], TANKEN: ['Tanken', '⛽'], PRUEFUNG: ['Prüfung (HU, SP, UVV …)', '✅'],
  SCHADEN: ['Schaden', '⚠'], KM: ['Kilometerstand', '📍'], FAHRER: ['Fahrerwechsel / Übergabe', '👤'], KOSTEN: ['Sonstige Kosten (Steuer, Maut …)', '€'] };
const FAHRZEUG_DOKUMENTE = ['Fahrzeugschein (Teil I)', 'Fahrzeugbrief (Teil II)', 'Versicherung', 'HU-/SP-Bericht', 'UVV-Prüfung', 'Leasing-/Kaufvertrag', 'Rechnung', 'Foto', 'Sonstiges'];
/** Ab so vielen Tagen vorher erscheint eine Frist unter „Termine“. */
const FRIST_VORLAUF = 30;
const FAHRZEUG_FELDER = [
  ['Fahrzeug', [['kennzeichen', 'Kennzeichen', 'pflicht'], ['bezeichnung', 'Interne Bezeichnung (z. B. Sprinter 3)'], ['art', 'Art', FAHRZEUG_ART],
    ['status', 'Status', Object.fromEntries(Object.entries(FAHRZEUG_STATUS).map(([k, [l]]) => [k, l]))], ['leihfahrzeug', 'Leihfahrzeug (zählt nicht als frei)', { nein: 'Nein', ja: 'Ja' }], ['fahrer', 'Fester Fahrer'], ['kmStand', 'Kilometerstand', 'zahl'], ['wartungKm', 'Nächste Wartung bei km', 'zahl']]],
  ['Fristen', FRISTEN.map(([k, l]) => [k, l, 'date'])],
  ['Fahrzeugschein (Zulassungsbescheinigung Teil I)', [['halter', 'Halter (C.1)'], ['marke', 'Marke (D.1)'], ['modell', 'Typ / Handelsbezeichnung (D.2/D.3)'], ['fin', 'Fahrzeug-Ident.-Nr. FIN (E)'],
    ['erstzulassung', 'Erstzulassung (B)', 'date'], ['zgg', 'Zul. Gesamtmasse in kg (F.2)', 'zahl'], ['leergewicht', 'Leergewicht in kg (G)', 'zahl'], ['hsn', 'Herstellerschlüssel HSN (2.1)'], ['tsn', 'Typschlüssel TSN (2.2)'],
    ['leistungKw', 'Leistung in kW (P.2)', 'zahl'], ['kraftstoff', 'Kraftstoff (P.3)'], ['schadstoffklasse', 'Schadstoff-/Emissionsklasse (14 / V.9)'], ['achsen', 'Achsen (L)', 'zahl'],
    ['farbe', 'Farbe (R)'], ['teil2Nr', 'Nummer Zulassungsbescheinigung Teil II']]],
  ['Versicherung und Finanzierung', [['versicherung', 'Versicherung'], ['versicherungsNr', 'Versicherungsschein-Nr.'], ['leasinggeber', 'Leasinggeber / Bank'], ['leasingRate', 'Monatliche Rate in Euro', 'geld'], ['notiz', 'Notizen', 'lang']]],
];
const ZAHL_FELDER = ['kmStand', 'wartungKm', 'zgg', 'leergewicht', 'leistungKw', 'achsen'];

const fahrzeugListe = () => alle('fahrzeuge').sort((a, b) => (a.status === 'STILLGELEGT') - (b.status === 'STILLGELEGT') || String(a.kennzeichen).localeCompare(String(b.kennzeichen), 'de'));
const markeTyp = z => [z.marke, z.modell].filter(Boolean).join(' ');
const fahrzeugStatus = z => FAHRZEUG_STATUS[z.status] || FAHRZEUG_STATUS.AKTIV;
const eintraegeVon = id => alle('fahrzeugeintraege').filter(x => x.fahrzeugId === id).sort((a, b) => String(b.datum).localeCompare(String(a.datum)) || (b.kmStand || 0) - (a.kmStand || 0));
const kzNormal = t => String(t || '').toUpperCase().replace(/[^A-Z0-9ÄÖÜ]/g, '');
/** Schadensfälle, in deren Feld „Fahrzeug / Kennzeichen“ dieses Kennzeichen steht. */
const faelleVonFahrzeug = z => { const kz = kzNormal(z.kennzeichen); return kz ? faelle().filter(f => kzNormal(f.fahrzeug).includes(kz)) : []; };
const zahlText = (n, einheit = '') => (n == null || n === '' ? '' : Number(n).toLocaleString('de-DE') + (einheit ? ' ' + einheit : ''));

/** Alle Fristen eines Fahrzeugs (ohne abgemeldete Fahrzeuge), sortiert nach Datum. */
function fristenVon(z) {
  if (z.status === 'STILLGELEGT') return [];
  return FRISTEN.filter(([k]) => z[k]).map(([k, l]) => ({ feld: k, label: l, datum: z[k], tage: Math.round((new Date(z[k]) - new Date(heute())) / 86400000) }))
    .sort((a, b) => a.datum.localeCompare(b.datum));
}
const fristFarbe = f => (f.tage < 0 ? 'rot' : f.tage <= FRIST_VORLAUF ? 'gelb' : 'grau');
const fristText = f => (f.tage < 0 ? `seit ${datumText(f.datum)} überfällig` : f.tage === 0 ? 'heute fällig' : f.tage <= FRIST_VORLAUF ? `in ${f.tage} Tag${f.tage === 1 ? '' : 'en'} (${datumText(f.datum)})` : datumText(f.datum));
const wartungKmFaellig = z => z.status !== 'STILLGELEGT' && z.wartungKm != null && z.kmStand != null && z.kmStand >= z.wartungKm - 1000;
/** Fristen, die in den nächsten FRIST_VORLAUF Tagen fällig sind (oder überfällig) – für Termine und Übersicht. */
function fahrzeugTermine() {
  const bis = plusTage(heute(), FRIST_VORLAUF);
  return fahrzeugListe().flatMap(z => fristenVon(z).filter(f => f.datum <= bis).map(f => ({ art: 'fahrzeug', datum: f.datum, titel: `${f.label} · ${z.kennzeichen}`,
    zusatz: [z.bezeichnung, z.fahrer].filter(Boolean).join(' · '), z })));
}

function fahrzeugKosten(z) {
  const e = eintraegeVon(z.id), jahr = String(new Date().getFullYear());
  const summe = l => l.reduce((n, x) => n + (x.betragCent || 0), 0);
  const tanken = e.filter(x => x.art === 'TANKEN' && x.menge && x.kmStand).sort((a, b) => a.kmStand - b.kmStand);
  // Durchschnittsverbrauch: getankte Liter nach der ersten Tankung ÷ gefahrene km dazwischen
  let verbrauch = null;
  if (tanken.length >= 2) {
    const km = tanken[tanken.length - 1].kmStand - tanken[0].kmStand, liter = tanken.slice(1).reduce((n, x) => n + x.menge, 0) / 100;
    if (km > 0) verbrauch = liter / km * 100;
  }
  const kmWerte = e.filter(x => x.kmStand).map(x => x.kmStand);
  return { jahr: summe(e.filter(x => String(x.datum).startsWith(jahr))), gesamt: summe(e), tankenJahr: summe(e.filter(x => x.art === 'TANKEN' && String(x.datum).startsWith(jahr))),
    werkstattJahr: summe(e.filter(x => ['WARTUNG', 'REPARATUR', 'REIFEN', 'PRUEFUNG'].includes(x.art) && String(x.datum).startsWith(jahr))), verbrauch,
    proKm: kmWerte.length >= 2 && Math.max(...kmWerte) > Math.min(...kmWerte) ? summe(e) / (Math.max(...kmWerte) - Math.min(...kmWerte)) : null };
}

const FuhrparkAktionen = {
  speichern(z) { const x = merke('fahrzeuge', { ...z, id: z.id || uuid(), firmaId: '', kennzeichen: String(z.kennzeichen || '').trim().toUpperCase(), geaendertAm: jetztIso() }); nachAenderung(); return x.id; },
  loeschen(z) {
    const jetzt = jetztIso();
    for (const x of eintraegeVon(z.id)) entferne('fahrzeugeintraege', x, { firmaId: '', fahrzeugId: z.id, geaendertAm: jetzt });
    for (const a of anlagenVon(z.id)) { entferne('anlagen', a, { fallId: a.fallId }); Dateien.loesche(a.id); }
    entferne('fahrzeuge', z, { firmaId: '', geaendertAm: jetzt }); nachAenderung();
  },
  eintragSpeichern(x) {
    merke('fahrzeugeintraege', { ...x, id: x.id || uuid(), firmaId: '', geaendertAm: jetztIso() });
    // Ein höherer Kilometerstand im Eintrag wird ins Fahrzeug übernommen, ein Fahrerwechsel ebenso.
    const z = S.fahrzeuge[x.fahrzeugId];
    if (z && !z.geloescht) {
      const neu = { ...z };
      if (x.kmStand != null && (z.kmStand == null || x.kmStand > z.kmStand)) neu.kmStand = x.kmStand;
      if (x.art === 'FAHRER' && x.werkstatt) neu.fahrer = x.werkstatt;
      if (neu.kmStand !== z.kmStand || neu.fahrer !== z.fahrer) merke('fahrzeuge', { ...neu, geaendertAm: jetztIso() });
    }
    nachAenderung();
  },
  eintragLoeschen(x) { entferne('fahrzeugeintraege', x, { firmaId: '', fahrzeugId: x.fahrzeugId, geaendertAm: jetztIso() }); nachAenderung(); },
  async dokument(fahrzeugId, art, datei) { if (await legeAnlage(fahrzeugId, datei, `${art} – `)) nachAenderung(); },
};

/**
 * Fuhrpark-Import (z. B. aus eingelesenen Fahrzeugscheinen): { fahrzeuge: [{ kennzeichen, … }], dokumente: [{ kennzeichen, art, name, mimeType, base64 }] }.
 * Gleiches Kennzeichen = gleiches Fahrzeug: leere Felder werden ergänzt, vorhandene Angaben bleiben. Dokumente mit gleichem Namen kommen nicht doppelt.
 */
async function fuhrparkImportieren(text) {
  const d = JSON.parse(text);
  if (!d || !Array.isArray(d.fahrzeuge)) throw new Error('Das ist keine Fuhrpark-Datei.');
  const felder = new Set(FAHRZEUG_FELDER.flatMap(([, f]) => f.map(([k]) => k)).concat(['leasingRateCent']));
  felder.delete('leihfahrzeug');
  const nachKz = new Map(alle('fahrzeuge').map(z => [kzNormal(z.kennzeichen), z]));
  let neu = 0, ergaenzt = 0, doks = 0;
  for (const roh of d.fahrzeuge) {
    const kz = kzNormal(roh.kennzeichen); if (!kz) continue;
    const sauber = Object.fromEntries(Object.entries(roh).filter(([k, v]) => felder.has(k) && v != null && v !== ''));
    const alt = nachKz.get(kz);
    if (!alt) { const id = FuhrparkAktionen.speichern({ art: 'TRANSPORTER', status: 'AKTIV', ...sauber }); nachKz.set(kz, S.fahrzeuge[id]); neu++; continue; }
    const dazu = Object.fromEntries(Object.entries(sauber).filter(([k]) => alt[k] == null || alt[k] === ''));
    if (Object.keys(dazu).length) { FuhrparkAktionen.speichern({ ...alt, ...dazu }); nachKz.set(kz, S.fahrzeuge[alt.id]); ergaenzt++; }
  }
  for (const dok of d.dokumente || []) {
    const z = nachKz.get(kzNormal(dok.kennzeichen)); if (!z || !dok.base64) continue;
    const name = `${dok.art || 'Sonstiges'} – ${dok.name}`;
    if (anlagenVon(z.id).some(a => a.anzeigename === name)) continue;
    const blob = blobAusBase64(dok.base64, dok.mimeType || 'application/pdf');
    const a = merke('anlagen', { id: uuid(), fallId: z.id, anzeigename: name, mimeType: blob.type, groesseBytes: blob.size, hinzugefuegtAm: jetztIso(), vorhanden: false });
    await Dateien.lege(a.id, blob); doks++;
  }
  nachAenderung();
  return { neu, ergaenzt, doks };
}

  return {

}

  });
  return '﻿' + [['Nummer', 'Art', 'Firma', 'Datum', 'Fällig/gültig bis', 'Status', 'Netto', 'MwSt', 'Brutto', 'Bezahlt', 'Bezahlt am', 'Mahnstufe'], ...z]

/** Alle offenen Termine (CRM und Fälle) als Kalenderdatei (ganztägig). */
function termineIcs() {
  const w = wiedervorlagen(), stempel = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const t = s => String(s || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ereignisse = [...w.ueberfaellig, ...w.heute, ...w.demnaechst].map((x, i) => {
    const tag = x.datum.replace(/-/g, ''), folgetag = plusTage(x.datum, 1).replace(/-/g, '');
    return ['BEGIN:VEVENT', `UID:${x.a ? x.a.id : x.z ? 'fahrzeug-' + x.z.id + '-' + x.datum : 'fall-' + x.f.id}@ayse-crm`, `DTSTAMP:${stempel}`, `DTSTART;VALUE=DATE:${tag}`, `DTEND;VALUE=DATE:${folgetag}`,
      `SUMMARY:${t(x.titel)}`, `DESCRIPTION:${t(x.zusatz)}`, 'END:VEVENT'].join('\r\n');
  });
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ayse Transport//CRM//DE', 'CALSCALE:GREGORIAN', ...ereignisse, 'END:VCALENDAR'].join('\r\n') + '\r\n';
}

// Die Windows-App spricht über ihren Hauptprozess direkt per IMAP/SMTP mit den Postfächern – mit
// denselben Regeln wie die Android-App: zwei Postfächer (SCHADEN für Schadensfälle, ALLGEMEIN für
// alles andere). Zuordnung eingehender Mails:
//   1. Fallnummer im Betreff → Fall   2. Antwort auf eine bekannte Mail → wie diese
//   3. nur Schadens-Postfach: Absender bei genau einem offenen Fall eingetragen → Fall
//   4. Absender passt zur E-Mail der Firma, eines Ansprechpartners oder zur Domain der Firma → Firma
//   5. sonst → „Nicht zugeordnet“ (im Postfach von Hand zuordnen)
const MAIL = { konten: { SCHADEN: null, ALLGEMEIN: null }, konto: null, anbieter: {}, laeuft: false, timer: 0 };
const MAIL_KONTEN = { SCHADEN: 'Schäden', ALLGEMEIN: 'Allgemein' };
const FALLNUMMER = /\[Fall (\d{4}-\d+)]/;
const mitFallnummer = (betreff, nr) => (FALLNUMMER.test(betreff) ? betreff : `${String(betreff).trim()} [Fall ${nr}]`.trim());
const mails = () => (S.mails = S.mails || {});
const mailZuVerlauf = verlaufId => Object.entries(mails()).map(([id, m]) => ({ messageId: id, ...m })).find(m => m.verlaufId === verlaufId);
const blobAusBase64 = (b64, typ) => new Blob([Uint8Array.from(atob(b64), z => z.charCodeAt(0))], { type: typ });
/** Das Postfach, über das gesendet wird: das gewünschte, sonst das andere. */
const kontoFuer = gewuenscht => (MAIL.konten[gewuenscht] ? gewuenscht : Object.keys(MAIL.konten).find(a => MAIL.konten[a]) || null);
const eigeneAdressen = () => Object.values(MAIL.konten).filter(Boolean).map(k => k.adresse.toLowerCase());
const mailStand = art => (art === 'ALLGEMEIN' ? S.mailStandAllgemein : S.mailStand) || {};
function setzeMailStand(art, wert) { if (art === 'ALLGEMEIN') S.mailStandAllgemein = wert; else S.mailStand = wert; }
const istZugeordnet = m => !!(m.fallId || m.firmaId || String(m.kundeRef || '').trim());
function aktualisiereKonto() { MAIL.konto = MAIL.konten.SCHADEN || MAIL.konten.ALLGEMEIN || null; }

const FREEMAIL = new Set(['gmail.com', 'googlemail.com', 'gmx.de', 'gmx.net', 'gmx.at', 'gmx.ch', 'web.de', 't-online.de', 'outlook.com', 'outlook.de', 'hotmail.com', 'hotmail.de',
  'live.com', 'live.de', 'msn.com', 'yahoo.com', 'yahoo.de', 'icloud.com', 'me.com', 'mac.com', 'aol.com', 'aol.de', 'freenet.de', 'posteo.de', 'mail.de', 'online.de',
  'arcor.de', 'vodafone.de', 'email.de', 'mailbox.org', 'ionos.de', 'proton.me', 'protonmail.com']);
const domainVon = a => { const d = String(a || '').trim().toLowerCase().replace(/^.*</, '').replace(/>.*$/, '').split('@')[1] || ''; return d.includes('.') ? d : null; };
const websiteDomain = w => { const d = String(w || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').split(/[/?]/)[0]; return d.includes('.') && !d.includes(' ') ? d : null; };
/** Firma zur Absenderadresse: zuerst exakt (Firma oder Ansprechpartner), dann über die Domain. Bei mehreren Treffern wird nicht geraten. */
function firmaZuAdresse(adresse) {
  const a = String(adresse || '').trim().toLowerCase();
  if (!a.includes('@')) return null;
  const firmen = alle('auftraggeber'), kontakte = alle('ansprechpartner');
  const genau = [...new Set([...firmen.filter(f => (f.email || '').trim().toLowerCase() === a).map(f => f.id),
    ...kontakte.filter(k => (k.email || '').trim().toLowerCase() === a).map(k => k.firmaId)])];
  if (genau.length === 1) return S.auftraggeber[genau[0]] || null;
  if (genau.length > 1) return null;
  const d = domainVon(a);
  if (!d || FREEMAIL.has(d)) return null;
  const passend = firmen.filter(f => domainVon(f.email) === d || websiteDomain(f.website) === d || kontakte.some(k => k.firmaId === f.id && domainVon(k.email) === d));
  return passend.length === 1 ? passend[0] : null;
}

function ordneZu(m, art) {
  const nr = (m.betreff.match(FALLNUMMER) || [])[1];
  const perNummer = nr && faelle().find(f => f.fallnummer === nr);
  if (perNummer) return { fallId: perNummer.id };
  for (const bezug of m.antwortAuf) {
    const alt = mails()[bezug];
    if (alt && alt.fallId && S.faelle[alt.fallId] && !S.faelle[alt.fallId].geloescht) return { fallId: alt.fallId };
    if (alt && alt.firmaId && S.auftraggeber[alt.firmaId]) return { firmaId: alt.firmaId };
  }
  if (art !== 'ALLGEMEIN') {
    const passend = faelle().filter(f => status(f).offen && [f.kundeEmail, f.auftraggeberEmail].some(a => (a || '').trim().toLowerCase() === m.von));
    if (passend.length === 1) return { fallId: passend[0].id };
  }
  const firma = firmaZuAdresse(m.von);
  return firma ? { firmaId: firma.id } : {};
}

const kontaktZuAdressen = (firmaId, adressen) => {
  const liste = String(adressen || '').split(/[,;]/).map(x => x.trim().replace(/^.*</, '').replace(/>.*$/, '').toLowerCase());
  const k = kontakteVon(firmaId).find(x => x.email && liste.includes(x.email.trim().toLowerCase()));
  return k ? k.name : '';
};

/**
 * Legt die Mail ab: im Verlauf des Falls, in der Kontakthistorie der Firma (beide wandern in die Cloud)
 * oder nur hier im Postfach. Eine eingehende Fall-Mail rückt die Wiedervorlage auf heute.
 */
function ablegen(messageId, m, text) {
  const eintrag = { ...m, verlaufId: '', aktivitaetId: '', fallId: m.fallId || '', firmaId: m.fallId ? '' : m.firmaId || '' };
  const f = eintrag.fallId && S.faelle[eintrag.fallId];
  if (f && !f.geloescht) {
    const v = merke('verlauf', { id: uuid(), fallId: f.id, zeitpunkt: m.zeitpunkt || jetztIso(), typ: m.eingehend ? 'EMAIL_EINGANG' : 'EMAIL_AUSGANG', text: kuerze(text, MAIL_TEXT_FALL) });
    eintrag.verlaufId = v.id;
    const neu = { ...f };
    // Eine Antwort soll nicht untergehen: Wiedervorlage rückt auf heute.
    if (m.eingehend && status(neu).offen && (!neu.wiedervorlageAm || neu.wiedervorlageAm > heute())) Object.assign(neu, { wiedervorlageAm: heute(), wiedervorlageNotiz: 'Neue E-Mail beantworten' });
    fallMerken(neu);
  } else if (eintrag.firmaId && S.auftraggeber[eintrag.firmaId]) {
    const a = merke('aktivitaeten', { id: uuid(), firmaId: eintrag.firmaId, datum: isoTag(new Date(m.zeitpunkt || Date.now())), art: 'EMAIL',
      text: kuerze((m.eingehend ? 'E-Mail erhalten' : 'E-Mail gesendet') + '\n' + text, MAIL_TEXT_FIRMA),
      kontakt: kontaktZuAdressen(eintrag.firmaId, m.eingehend ? m.von : m.an), geaendertAm: jetztIso() });
    eintrag.aktivitaetId = a.id;
  }
  eintrag.text = String(m.text || '').slice(0, 15000);
  mails()[messageId] = eintrag;
}
/** Für die bisherigen Aufrufe aus dem Schreibfenster eines Falls. */
const vermerkeMail = (f, mail, text, eingehend) => ablegen(mail.messageId, { ...mail, fallId: f.id, eingehend }, text);

const mailText = m => (m.eingehend ? `Von: ${m.von}` : `An: ${m.an}`) + `\nBetreff: ${m.betreff}` + (m.anhaenge && m.anhaenge.length ? '\nAnhänge: ' + m.anhaenge.join(', ') : '') + `\n\n${m.text}`;

/** Mail von Hand zuordnen bzw. umhängen: Fall, Firma und/oder Kunde. Gespeicherte Anhänge werden Anlagen des Falls. */
async function mailZuordnen(messageId, ziel) {
  const alt = mails()[messageId]; if (!alt) return;
  const fallId = ziel.fallId || '', firmaId = fallId ? '' : ziel.firmaId || '', kundeRef = String(ziel.kundeRef || '').trim();
  if (alt.verlaufId && alt.fallId !== fallId) { const v = S.verlauf[alt.verlaufId]; if (v) entferne('verlauf', v, { fallId: v.fallId }); }
  if (alt.aktivitaetId && (fallId || alt.firmaId !== firmaId)) { const a = S.aktivitaeten[alt.aktivitaetId]; if (a) entferne('aktivitaeten', a, { firmaId: a.firmaId, geaendertAm: jetztIso() }); }
  const bleibt = (fallId && alt.fallId === fallId && alt.verlaufId) || (!fallId && firmaId && alt.firmaId === firmaId && alt.aktivitaetId);
  if (bleibt) mails()[messageId] = { ...alt, kundeRef };
  else ablegen(messageId, { ...alt, fallId, firmaId, kundeRef }, mailText(alt));
  if (fallId) {
    for (const [i, name] of (alt.anhaenge || []).entries()) {
      const blob = await Dateien.hole(`mail:${messageId}:${i}`);
      if (!blob) continue;
      await Aktionen.anlageHinzufuegen(fallId, new File([blob], name, { type: blob.type }));
      await Dateien.loesche(`mail:${messageId}:${i}`);
    }
  }
  nachAenderung();
}

async function postfachAbrufen(sichtbar = false) {
  if (!MAIL.konto || MAIL.laeuft) return [];
  MAIL.laeuft = true;
  if (sichtbar) toast('Postfach wird abgerufen …');
  const neu = [], fehler = [];
  try {
    for (const art of Object.keys(MAIL.konten)) {
      if (!MAIL.konten[art]) continue;
      try {
        const stand = mailStand(art);
        const r = await window.desktop.mail.hole({ letzteUid: stand.letzteUid || 0, uidValidity: stand.uidValidity || 0 }, art);
        for (const m of r.mails.sort((a, b) => a.zeitpunkt.localeCompare(b.zeitpunkt))) {
          if (eigeneAdressen().includes(m.von) || mails()[m.messageId]) continue;
          const ziel = ordneZu(m, art);
          const absender = m.vonName ? `${m.vonName} <${m.von}>` : m.von;
          if (ziel.fallId) for (const a of m.anhaenge) await Aktionen.anlageHinzufuegen(ziel.fallId, new File([blobAusBase64(a.base64, a.mimeType)], a.name, { type: a.mimeType }));
          else for (const [i, a] of m.anhaenge.entries()) await Dateien.lege(`mail:${m.messageId}:${i}`, blobAusBase64(a.base64, a.mimeType));
          const anh = m.anhaenge.length ? `\nAnhänge${ziel.fallId ? ' (zum Fall genommen)' : ''}: ` + m.anhaenge.map(a => a.name).join(', ') : '';
          ablegen(m.messageId, { ...ziel, konto: art, eingehend: true, von: m.von, vonName: m.vonName || '', an: m.an, betreff: m.betreff, text: m.text, zeitpunkt: m.zeitpunkt,
            anhaenge: m.anhaenge.map(a => a.name) }, `Von: ${absender}\nBetreff: ${m.betreff}${anh}\n\n${m.text}`);
          neu.push({ id: m.messageId, ziel, absender, betreff: m.betreff });
        }
        setzeMailStand(art, { letzteUid: r.letzteUid, uidValidity: r.uidValidity, letzterAbruf: Date.now(), fehler: '' });
      } catch (e) {
        setzeMailStand(art, { ...mailStand(art), fehler: e.message }); fehler.push(e.message);
      }
    }
    if (neu.length) nachAenderung(); else { speichere(); zeichneSync(); }
    const wohin = n => (n.ziel.fallId ? 'Fall ' + (S.faelle[n.ziel.fallId] || {}).fallnummer : n.ziel.firmaId ? (S.auftraggeber[n.ziel.firmaId] || {}).name : 'Nicht zugeordnet');
    if (neu.length) {
      const titel = neu.length === 1 ? `Neue E-Mail · ${wohin(neu[0])}` : `${neu.length} neue E-Mails`;
      const ziel = neu.length === 1 ? (neu[0].ziel.fallId ? '#/fall/' + neu[0].ziel.fallId : neu[0].ziel.firmaId ? '#/firma/' + neu[0].ziel.firmaId : '#/mail/' + encodeURIComponent(neu[0].id)) : '#/';
      window.desktop.benachrichtige(titel, neu.map(n => `${wohin(n)} · ${n.absender}: ${n.betreff}`).join('\n'), ziel).catch(() => {});
    }
    const offen = neu.filter(n => !n.ziel.fallId && !n.ziel.firmaId).length;
    if (sichtbar) toast(fehler.length && !neu.length ? fehler[0] : !neu.length ? 'Keine neuen E-Mails'
      : offen ? `${neu.length} neue E-Mail(s), davon ${offen} im Postfach unter „Nicht zugeordnet“` : `${neu.length} neue E-Mail(s) zugeordnet`, 6000);
    if (route().art === 'einstellungen') zeichne();
    return neu;
  } finally { MAIL.laeuft = false; }
}

  if ($('#kunde-absender')) $('#kunde-absender').onclick = () => { $('#zuordnen-form [name=kundeRef]').value = m.von; };

// ---------- Postfach (Liste und einzelne Mail) ----------
/**
 * Mails liegen auf diesem Gerät. Zusätzlich zur Zuordnung (Fall, Firma, Kunde) gibt es: gelesen/ungelesen, Stern,
 * Archiv, Papierkorb, Erinnerung (erscheint unter „Termine“), Unterhaltungen, Entwürfe und geplantes Senden.
 */
const POSTFACH_FILTER = { EINGANG: 'Posteingang', UNGELESEN: 'Ungelesen', OFFEN: 'Nicht zugeordnet', STERN: '★ Markiert', ERINNERUNG: '⏰ Erinnerung', GESENDET: 'Gesendet',
  ENTWUERFE: 'Entwürfe', GEPLANT: 'Geplant', ARCHIV: 'Archiv', PAPIERKORB: 'Papierkorb', ALLE: 'Alle' };
const mailListe = () => Object.entries(mails()).map(([id, m]) => ({ id, ...m })).sort((a, b) => String(b.zeitpunkt).localeCompare(String(a.zeitpunkt)));
const entwuerfe = () => (S.mailEntwuerfe = S.mailEntwuerfe || {});
const geplanteMails = () => (S.mailGeplant = S.mailGeplant || {});
const ungelesen = m => m.eingehend && !m.gelesen && !m.ablage;
/** Gesprächsfaden: Betreff ohne Re:/AW:/WG:/Fwd: und ohne [Fall …]. */
const fadenVon = m => normal(String(m.betreff || '').replace(FALLNUMMER, '').replace(/^\s*((re|aw|wg|fw|fwd|antw)\s*:\s*)+/i, ''));
const mailAdresse = a => String(a || '').trim().replace(/^.*</, '').replace(/>.*$/, '').toLowerCase();
function zuordnungText(m) {
  return [m.fallId && 'Fall ' + ((S.faelle[m.fallId] || {}).fallnummer || ''), m.firmaId && (S.auftraggeber[m.firmaId] || {}).name, m.kundeRef && 'Kunde: ' + m.kundeRef]
    .filter(Boolean).join(' · ') || 'Nicht zugeordnet';
}
function mailMerken(id, aenderung) { const m = mails()[id]; if (!m) return; mails()[id] = { ...m, ...aenderung }; speichere(); zeichne(); }
/** Adressbuch für Vorschläge beim Schreiben: Firmen, Ansprechpartner, Personal, Fälle und bekannte Absender. */
function adressbuch() {
  const l = new Map(), dazu = (a, name) => { a = mailAdresse(a); if (a && a.includes('@') && !l.has(a)) l.set(a, name || ''); };
  for (const k of alle('ansprechpartner')) dazu(k.email, `${k.name} (${(S.auftraggeber[k.firmaId] || {}).name || ''})`);
  for (const f of alle('auftraggeber')) dazu(f.email, f.name);
  for (const m of alle('mitarbeiter')) dazu(m.email, m.name + ' (Personal)');
  for (const f of faelle()) { dazu(f.kundeEmail, f.kundeName); dazu(f.auftraggeberEmail, f.auftraggeber); }
  for (const m of Object.values(mails())) if (m.eingehend) dazu(m.von, '');
  return [...l.entries()];
}

function zeichnePostfach(r) {
  const filter = ANSICHT.postfachFilter || 'EINGANG';
  const alleMails = mailListe(), offen = alleMails.filter(m => !istZugeordnet(m) && !m.ablage).length, neu = alleMails.filter(ungelesen).length;
  const such = String(ANSICHT.postfachSuche || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const kopf = seitenkopf('Postfach', '<button class="knopf voll" data-neue-mail>＋ Neue E-Mail</button>', '<button class="knopf" data-postfach-abrufen>⟳ Abrufen</button><button class="knopf" data-serienmail>Serienmail</button>');
  const chips = `<div class="chips" role="group" aria-label="Postfach">${Object.entries(POSTFACH_FILTER).map(([k, l]) => {
    const n = k === 'UNGELESEN' ? neu : k === 'OFFEN' ? offen : k === 'ENTWUERFE' ? Object.keys(entwuerfe()).length : k === 'GEPLANT' ? Object.keys(geplanteMails()).length : 0;
    return `<button class="chip" data-postfach-filter="${k}" aria-pressed="${filter === k && !such.length}">${l}${n ? ` (${n})` : ''}</button>`; }).join('')}</div>`;
  const suche = `<input class="suche" id="postfach-suche" type="search" placeholder="Mails durchsuchen (Absender, Betreff, Text, Firma …)" value="${esc(ANSICHT.postfachSuche || '')}">`;
  if (!such.length && (filter === 'ENTWUERFE' || filter === 'GEPLANT')) {
    const liste = Object.entries(filter === 'ENTWUERFE' ? entwuerfe() : geplanteMails()).sort((a, b) => String(b[1].gespeichert || b[1].sendeAm).localeCompare(String(a[1].gespeichert || a[1].sendeAm)));
    return kopf + suche + chips + `<div id="postfach">${liste.map(([id, x]) => `<div class="karte"><div class="zeile eng"><button class="vorlage fuell" data-${filter === 'ENTWUERFE' ? 'entwurf' : 'geplant'}="${id}" style="padding:0">
      <b>${esc(x.betreff || '(ohne Betreff)')}</b><br><span class="leise">An: ${esc(x.an || '–')} · ${filter === 'GEPLANT' ? 'wird gesendet ' + esc(zeitText(x.sendeAm)) : 'gespeichert ' + esc(zeitText(x.gespeichert))}</span></button>
      <button class="symbol" data-${filter === 'ENTWUERFE' ? 'entwurf' : 'geplant'}-weg="${id}" aria-label="Verwerfen">🗑</button></div></div>`).join('')
      || `<div class="leer"><b>${filter === 'ENTWUERFE' ? 'Keine Entwürfe' : 'Nichts geplant'}</b>${filter === 'ENTWUERFE' ? 'Beim Schreiben „Als Entwurf speichern“ wählen.' : 'Beim Schreiben „Später senden“ wählen – die App muss dann laufen.'}</div>`}</div>`;
  }
  const passt = m => (such.length
    ? such.every(b => [m.von, m.an, m.betreff, m.text, m.kundeRef, (m.anhaenge || []).join(' '), (S.auftraggeber[m.firmaId] || {}).name].join('\n').toLowerCase().includes(b))
    : filter === 'PAPIERKORB' ? m.ablage === 'PAPIERKORB' : filter === 'ARCHIV' ? m.ablage === 'ARCHIV' : filter === 'ALLE' ? m.ablage !== 'PAPIERKORB' : m.ablage ? false
      : filter === 'EINGANG' ? m.eingehend : filter === 'UNGELESEN' ? ungelesen(m) : filter === 'OFFEN' ? !istZugeordnet(m) : filter === 'STERN' ? !!m.stern
        : filter === 'ERINNERUNG' ? !!m.erinnerungAm : filter === 'GESENDET' ? !m.eingehend : true);
  let liste = alleMails.filter(passt);
  if (filter === 'ERINNERUNG' && !such.length) liste = liste.sort((a, b) => String(a.erinnerungAm).localeCompare(String(b.erinnerungAm)));
  // Unterhaltungen: im Posteingang je Faden nur die neueste Mail, mit Anzahl
  const faeden = {}; for (const m of alleMails) { const f = fadenVon(m); faeden[f] = (faeden[f] || 0) + 1; }
  if (filter === 'EINGANG' && !such.length) { const gesehen = new Set(); liste = liste.filter(m => { const f = fadenVon(m); if (!f) return true; if (gesehen.has(f)) return false; gesehen.add(f); return true; }); }
  return kopf + suche + chips + `<div id="postfach">${liste.map(m => `<button class="karte klickbar mail-karte ${ungelesen(m) ? 'ungelesen' : ''} ${r.art === 'mail' && decodeURIComponent(r.id) === m.id ? 'gewaehlt' : ''}" data-mail="${esc(encodeURIComponent(m.id))}">
      <div class="zeile eng"><span class="titel fuell">${m.stern ? '<span style="color:#E3A400">★</span> ' : ''}${esc(m.eingehend ? m.vonName || m.von : 'An: ' + (m.an || ''))}</span>
        ${faeden[fadenVon(m)] > 1 ? `<span class="marke grau">${faeden[fadenVon(m)]}</span>` : ''}<span class="leise">${m.zeitpunkt ? zeitText(m.zeitpunkt) : ''}</span></div>
      <div class="zwei-zeilen">${m.anhaenge && m.anhaenge.length ? '📎 ' : ''}${esc(m.betreff || '(ohne Betreff)')}</div>

    if (!adressen.length || [...adressen, ...bccL].some(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mailAdresse(x)))) { zeige('Bitte gültige Empfängeradressen eintragen.'); return; }
    if (dateien.reduce((n, d) => n + d.size, 0) > 20 * 1024 * 1024) { zeige('Die Anhänge sind zusammen größer als 20 MB.'); return; }
    if (sendeAm) {
      if (dateien.length || feste.length || weiterleiten) { zeige('Mails mit Anhängen bitte sofort senden.'); return; }
      const id = entwurfId || uuid(); delete entwuerfe()[id];
      geplanteMails()[id] = { ...w, an: adressen.join(', '), bcc: bccL.join(', '), sendeAm }; speichere();

    }
    const knopf = $('#mail-senden'); knopf.disabled = true; knopf.textContent = 'Sendet …';
    try {
      const anhaenge = [...feste];
      if (weiterleiten && alt) for (const [i, n] of (alt.anhaenge || []).entries()) { const blob = await Dateien.hole(`mail:${weiterleiten}:${i}`); if (blob) anhaenge.push({ name: n, mimeType: blob.type || 'application/octet-stream', base64: await alsBase64(blob) }); }
      for (const d of dateien) anhaenge.push({ name: d.name, mimeType: d.type || 'application/octet-stream', base64: await alsBase64(d) });
      await mailSendenUndAblegen({ ...w, an: adressen.join(', '), bcc: bccL.join(', '), kundeRef: alt ? alt.kundeRef || '' : '' }, anhaenge);
      if (entwurfId) { delete entwuerfe()[entwurfId]; delete geplanteMails()[entwurfId]; }
      $('#dialog').close(); if (nachSenden) nachSenden(); nachAenderung(); toast('E-Mail gesendet');
    } catch (e) { zeige(e.message || 'Die E-Mail konnte nicht gesendet werden.'); knopf.disabled = false; knopf.textContent = 'Senden'; }
  };
}
/** Sendet über das Konto und legt die Mail ab (Firma → Kontakthistorie). */
async function mailSendenUndAblegen(w, anhaenge = []) {
  const entwurf = { an: w.an, bcc: w.bcc || '', betreff: w.betreff, text: w.text, antwortAuf: w.antwortAuf || '', anhaenge };
  const messageId = await window.desktop.mail.sende(entwurf, w.konto);
  const m = { firmaId: w.firmaId || '', kundeRef: w.kundeRef || '', konto: w.konto, eingehend: false, von: MAIL.konten[w.konto].adresse, an: entwurf.an,
    betreff: entwurf.betreff, text: entwurf.text, zeitpunkt: jetztIso(), anhaenge: anhaenge.map(a => a.name), gelesen: true };
  ablegen(messageId, m, mailText(m));
  return messageId;
}
/** Geplante Mails senden, sobald ihr Zeitpunkt erreicht ist (läuft jede Minute, solange die App offen ist). */
async function geplanteSenden() {
  if (!MAIL.konto) return;
  for (const [id, x] of Object.entries(geplanteMails())) {
    if (x.sendeAm > jetztIso() || x.laeuft) continue;
    x.laeuft = true;
    try { await mailSendenUndAblegen({ ...x, konto: kontoFuer(x.konto) }); delete geplanteMails()[id]; nachAenderung(); toast(`Geplante E-Mail gesendet: ${x.betreff}`); }
    catch (e) { x.laeuft = false; x.fehler = e.message; speichere(); }
  }
}

      archiv: () => { mailMerken(id, { ablage: 'ARCHIV' }); toast('Archiviert'); gehe('#/'); }, papierkorb: () => { mailMerken(id, { ablage: 'PAPIERKORB' }); toast('In den Papierkorb gelegt'); gehe('#/'); },
      eingang: () => mailMerken(id, { ablage: '' }), erinnern: () => erinnernDialog(id), drucken: () => mailDrucken(m),
      fall: () => fallAusMail(id), firma: () => firmaAusMail(id), kontakt: () => kontaktAusMail(id),
      aufgabe: () => { const f = (m.firmaId && S.auftraggeber[m.firmaId]) || firmaZuAdresse(m.von) || (m.fallId && S.faelle[m.fallId] && S.auftraggeber[S.faelle[m.fallId].auftraggeberUuid]);
        if (!f) { toast('Die Mail gehört zu keiner Firma – erst zuordnen oder „Erinnern“ nutzen.'); return; }
        crmDialog('aufgaben', null, f.id); setTimeout(() => { const x = $('#crm-form'); if (x) { x.querySelector('[name=text]').value = 'Mail beantworten: ' + (m.betreff || ''); x.querySelector('[name=faelligAm]').value = plusTage(heute(), 1); } }, 0); } })[akt.dataset.mailAkt]();
    return;
  }
  const anh = e.target.closest('[data-mail-anhang]');
  if (anh) {
    const blob = await Dateien.hole(`mail:${id}:${anh.dataset.mailAnhang}`);
    if (!blob) { toast('Der Anhang liegt beim Fall bzw. nicht auf diesem Rechner.'); return; }
    await window.desktop.oeffneDatei(m.anhaenge[Number(anh.dataset.mailAnhang)], new Uint8Array(await blob.arrayBuffer()));
  }
});

function mailVorlagen(f) {
  const gruppen = Object.entries(EMPFAENGER).map(([e, info]) => {
    const fehlt = e !== 'DRITTE' && !info.email(f) ? ' – keine E-Mail-Adresse hinterlegt' : '';
    return `<h3>${info.ueberschrift}${fehlt}</h3><button class="vorlage" data-leer="${e}"><b>Ohne Vorlage</b><br><span class="leise">Nur Anrede und Grußformel</span></button>` +
      Object.entries(VORLAGEN).filter(([, v]) => v[2] === e).map(([wert, [titel, beschreibung]]) => `<button class="vorlage" data-vorlage="${wert}"><b>${titel}</b><br><span class="leise">${beschreibung}</span></button>`).join('');
  }).join('');
  dialog(`<h2>E-Mail schreiben</h2>${gruppen}<div class="dialog-knoepfe"><button class="knopf text" data-zu>Abbrechen</button></div>`).onclick = e => {
    const v = e.target.closest('[data-vorlage]'), l = e.target.closest('[data-leer]'); if (!v && !l) return;
    $('#dialog').onclick = null;
    mailSchreiben(f, v ? { vorlage: v.dataset.vorlage } : { empfaenger: l.dataset.leer });
  };
}

/** Rahmen ohne Vorlage: Anrede an den Empfänger und Grußformel. */
function ohneVorlage(e, f) {
  const vorlage = vorlageText('SACHSTANDSANFRAGE', f, S.einstellungen).text;
  const gruss = vorlage.slice(vorlage.lastIndexOf('Mit freundlichen Grüßen'));
  const name = (EMPFAENGER[e].name(f) || '').trim();
  const vom = d => (d ? ' vom ' + datumText(d) : '');
  const was = e === 'GESCHAEDIGTER' ? 'Ihre Schadensmeldung' + vom(f.meldedatum || f.schadensdatum) : 'Schadensfall' + vom(f.schadensdatum);
  return { betreff: [was, zeichenDesAuftraggebers(e, f)].filter(Boolean).join(' – '), text: `${name ? `Guten Tag ${name},` : 'Sehr geehrte Damen und Herren,'}\n\n\n\n${gruss}` };
}

function mailSchreiben(f, { vorlage, empfaenger, antwortAufVerlauf } = {}) {
  let an = '', betreff = '', text = '', antwortAuf = '', art = empfaenger || 'GESCHAEDIGTER';
  const verlauf = verlaufVon(f.id), schritte = schritteWaehlbar(verlauf), vorauswahl = schritteVorauswahl(f, verlauf);
  const alt = antwortAufVerlauf && mailZuVerlauf(antwortAufVerlauf);
  if (alt) {
    antwortAuf = alt.messageId; an = alt.von;
    betreff = /^(re|aw):/i.test(alt.betreff) ? alt.betreff : 'Re: ' + alt.betreff;
    const e = ['GESCHAEDIGTER', 'AUFTRAGGEBER'].find(x => EMPFAENGER[x].email(f).toLowerCase() === alt.von) || 'DRITTE';
    art = e;
    text = ohneVorlage(e, f).text + `\n\nAm ${zeitText(alt.zeitpunkt)} schrieb ${alt.von}:\n` + alt.text.split('\n').map(z => '> ' + z).join('\n');
  } else if (vorlage) {
    const n = vorlageText(vorlage, f, S.einstellungen); an = EMPFAENGER[n.empfaenger].email(f); betreff = n.betreff; text = n.text; art = n.empfaenger;
    // Beim Sachstand gleich mitteilen, was seit der letzten Mail an den Auftraggeber passiert ist.
    const neu = schritte.filter(v => vorauswahl.has(v.id));
    if (vorlage === 'SACHSTAND_AUFTRAGGEBER' && neu.length) text = schritteEinfuegen(text, schritteAlsText(neu, f));
  } else {
    const e = empfaenger || 'GESCHAEDIGTER', n = ohneVorlage(e, f); an = EMPFAENGER[e].email(f); betreff = n.betreff; text = n.text;
  }
  // „[Fall …]“ ersetzt beim Versand aus der App den Zusatz „unser Vorgang …“.
  betreff = mitZeichen(mitFallnummer(betreff.replace(` – unser Vorgang ${f.fallnummer}`, ''), f.fallnummer), art, f);
  const anl = anlagenVon(f.id);
  const agMail = (f.auftraggeberEmail || '').trim();
  const bccMoeglich = agMail && !an.toLowerCase().includes(agMail.toLowerCase());
  const anlageZeile = (a, an = false) => `<label class="auswahl"><input type="checkbox" name="anlage" value="${a.id}"${an ? ' checked' : ''}> ${esc(a.anzeigename)}</label>`;
  const konten = Object.keys(MAIL.konten).filter(x => MAIL.konten[x]), kontoVorgabe = kontoFuer((alt && alt.konto) || 'SCHADEN');
  dialog(`<form method="dialog" id="mail-form"><h2>E-Mail · Fall ${esc(f.fallnummer)}</h2>
    <p class="fehlertext" id="mail-fehler" hidden></p>
    ${konten.length > 1 ? `<label class="feld">Von<select name="konto">${konten.map(x => `<option value="${x}" ${x === kontoVorgabe ? 'selected' : ''}>${esc(MAIL.konten[x].adresse)} (${MAIL_KONTEN[x]})</option>`).join('')}</select></label>`
      : `<input type="hidden" name="konto" value="${kontoVorgabe || 'SCHADEN'}">`}
    <label class="feld">An<input name="an" value="${esc(an)}"></label>
    <label class="feld">Betreff<input name="betreff" value="${esc(betreff)}"><span class="leise">Die Fallnummer im Betreff ordnet Antworten automatisch diesem Fall zu.</span></label>
    <label class="feld">Nachricht<textarea name="text" style="min-height:260px">${esc(text)}</textarea></label>
    ${schritte.length ? `<details id="mail-schritte"><summary class="knopf" style="display:inline-flex;margin-bottom:8px">Bearbeitungsschritte einfügen</summary>
      <p class="leise">Vorausgewählt ist alles seit der letzten Mail an den Auftraggeber. Adressen und Wiedervorlagen werden nicht übernommen.</p>
      ${schritte.map(v => `<label class="auswahl"><input type="checkbox" name="schritt" value="${v.id}"${vorauswahl.has(v.id) ? ' checked' : ''}> <span><span class="leise">${zeitText(v.zeitpunkt)}</span><br>${esc(schrittText(v, f))}</span></label>`).join('')}
      <button type="button" class="knopf tonal" id="schritte-einfuegen" style="margin:6px 0 10px">Einfügen</button></details>` : ''}
    ${bccMoeglich ? `<label class="auswahl" id="mail-bcc-zeile"><input type="checkbox" name="bcc" id="mail-bcc"> <span>Auftraggeber in BCC<br><span class="leise">${esc(agMail)}</span></span></label>` : ''}
    <h3>Anhänge</h3><div id="mail-anlagen">${anl.map(a => anlageZeile(a)).join('')}</div>
    <label class="knopf" style="margin-top:6px">📎 Datei vom Rechner anhängen<input type="file" id="mail-datei" multiple hidden></label>
    <p class="leise">Neue Dateien werden auch beim Fall abgelegt.</p>
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll" id="mail-senden">Senden</button></div></form>`);
  const knopfSchritte = $('#schritte-einfuegen');
  if (knopfSchritte) knopfSchritte.onclick = () => {
    const gewaehlt = [...document.querySelectorAll('#mail-form [name=schritt]:checked')].map(c => S.verlauf[c.value]).filter(Boolean);
    if (!gewaehlt.length) return;
    const feld = $('#mail-form [name=text]'); feld.value = schritteEinfuegen(feld.value, schritteAlsText(gewaehlt, f));
    $('#mail-schritte').open = false;
  };
  $('#mail-datei').onchange = async ev => {
    for (const datei of [...ev.target.files]) {
      const a = await Aktionen.anlageHinzufuegen(f.id, datei);
      if (a) $('#mail-anlagen').insertAdjacentHTML('beforeend', anlageZeile(a, true));
    }
    ev.target.value = '';
  };
  $('#mail-form').onsubmit = async ev => {
    ev.preventDefault();
    const w = new FormData(ev.target), fehler = $('#mail-fehler');
    const zeige = t => { fehler.textContent = t; fehler.hidden = false; };
    const adressen = String(w.get('an')).split(/[,;]/).map(x => x.trim()).filter(Boolean);
    if (!adressen.length || adressen.some(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x))) { zeige('Bitte eine gültige Empfängeradresse eintragen.'); return; }
    const gewaehlt = w.getAll('anlage').map(id => S.anlagen[id]).filter(Boolean);
    if (gewaehlt.reduce((n, a) => n + (a.groesseBytes || 0), 0) > 20 * 1024 * 1024) { zeige('Die Anhänge sind zusammen größer als 20 MB – das nehmen viele Postfächer nicht an.'); return; }
    const knopf = $('#mail-senden'); knopf.disabled = true; knopf.textContent = 'Sendet …';
    try {
      const anhaenge = [];
      for (const a of gewaehlt) {
        await Dateien.adresse(a); // lädt bei Bedarf aus der Cloud
        const blob = await Dateien.hole(a.id); if (!blob) throw new Error(`„${a.anzeigename}“ liegt nicht auf diesem Rechner.`);
        anhaenge.push({ name: a.anzeigename, mimeType: a.mimeType, base64: await alsBase64(blob) });
      }
      const bcc = w.get('bcc') && !adressen.some(x => x.toLowerCase() === agMail.toLowerCase()) ? agMail : '';
      const entwurf = { an: adressen.join(', '), bcc, betreff: String(w.get('betreff')), text: String(w.get('text')), antwortAuf, anhaenge };
      const konto = String(w.get('konto') || kontoVorgabe || 'SCHADEN');
      const messageId = await window.desktop.mail.sende(entwurf, konto);
      const anh = anhaenge.length ? '\nAnhänge: ' + anhaenge.map(a => a.name).join(', ') : '';
      vermerkeMail(S.faelle[f.id], { messageId, konto, von: MAIL.konten[konto].adresse, an: entwurf.an, betreff: entwurf.betreff, text: entwurf.text, zeitpunkt: jetztIso(), anhaenge: anhaenge.map(a => a.name) },
        `An: ${entwurf.an}${bcc ? '\nBcc: ' + bcc : ''}\nBetreff: ${entwurf.betreff}${anh}\n\n${entwurf.text}`, false);
      $('#dialog').close(); nachAenderung(); toast('E-Mail gesendet');
    } catch (e) {
      zeige(e.message || 'Die E-Mail konnte nicht gesendet werden.'); knopf.disabled = false; knopf.textContent = 'Senden';
    }
  };
}

function mailEinstellungen() {
  return Object.keys(MAIL_KONTEN).map(art => {
    const k = MAIL.konten[art], st = mailStand(art), schaden = art === 'SCHADEN';
    const titel = schaden ? 'E-Mail für Schadensfälle' : 'E-Mail für alles andere';
    if (!k) return `<div class="karte block"><h3>${titel}</h3><p class="leise" style="margin-bottom:8px">${schaden
      ? 'Postfach für die Schadensbearbeitung (z. B. schaden@…). Mails aus einem Fall gehen darüber; Antworten werden über die Fallnummer im Betreff dem Fall zugeordnet.'
      : 'Postfach für Disposition, Angebote und Abrechnung (z. B. info@…). Mails an Firmen und Ansprechpartner gehen darüber. Ohne eigenes Konto wird das andere Postfach verwendet.'}</p>
      <button class="knopf voll" data-mail-einrichten="${art}" id="mail-einrichten-${art}">E-Mail-Konto einrichten</button></div>`;
    const zustand = MAIL.laeuft ? 'Wird abgerufen …' : st.fehler ? `Letzter Abruf fehlgeschlagen: ${st.fehler}` : st.letzterAbruf ? `Zuletzt abgerufen ${zeitText(new Date(st.letzterAbruf).toISOString())}` : 'Noch nicht abgerufen';
    return `<div class="karte block"><h3>${titel}</h3><p>${esc(k.adresse)}</p><p class="${st.fehler ? 'fehlertext' : 'leise'}" style="margin:4px 0 8px">${esc(zustand)}</p>
      <div class="zeile"><button class="knopf" data-mail-abrufen id="mail-abrufen-${art}">Jetzt abrufen</button><button class="knopf" data-mail-einrichten="${art}">Ändern</button><button class="knopf" data-mail-entfernen="${art}">Entfernen</button></div></div>`;
  }).join('');
}

function mailKontoDialog(art = 'SCHADEN') {
  const k = MAIL.konten[art] || {}, liste = { ...MAIL.anbieter, EIGENER: { label: 'Eigener Server' } };
  let wahl = Object.keys(MAIL.anbieter).find(a => MAIL.anbieter[a].imapHost === k.imapHost) || (k.imapHost ? 'EIGENER' : 'IONOS');
  const male = () => {
    const eigen = wahl === 'EIGENER', a = MAIL.anbieter[wahl] || {};
    const werte = $('#konto-form') ? Object.fromEntries(new FormData($('#konto-form'))) : { adresse: k.adresse || '', benutzer: k.benutzer && k.benutzer !== k.adresse ? k.benutzer : '' };
    dialog(`<form method="dialog" id="konto-form"><h2>${art === 'SCHADEN' ? 'E-Mail für Schadensfälle' : 'E-Mail für alles andere'}</h2>
      <div class="chips">${Object.entries(liste).map(([id, x]) => `<button type="button" class="chip" data-anbieter="${id}" aria-pressed="${id === wahl}">${esc(x.label)}</button>`).join('')}</div>
      <label class="feld">E-Mail-Adresse<input name="adresse" type="email" required value="${esc(werte.adresse || '')}"></label>
      <label class="feld">Passwort<input name="passwort" type="password" required autocomplete="current-password"></label>
      <label class="feld">Benutzername (falls abweichend)<input name="benutzer" placeholder="meist die E-Mail-Adresse" value="${esc(werte.benutzer || '')}"></label>
      ${eigen ? `<label class="feld">IMAP-Server<input name="imapHost" required value="${esc(werte.imapHost || k.imapHost || '')}"></label>
        <label class="feld">IMAP-Port (SSL)<input name="imapPort" inputmode="numeric" value="${esc(werte.imapPort || k.imapPort || 993)}"></label>
        <label class="feld">SMTP-Server<input name="smtpHost" required value="${esc(werte.smtpHost || k.smtpHost || '')}"></label>
        <label class="feld">SMTP-Port<input name="smtpPort" inputmode="numeric" value="${esc(werte.smtpPort || k.smtpPort || 465)}"></label>
        <label class="auswahl"><input type="checkbox" name="starttls" ${k.smtpSicherheit === 'STARTTLS' ? 'checked' : ''}> SMTP mit STARTTLS (sonst SSL)</label>`
        : `<p class="leise">Server: ${esc(a.imapHost)} (IMAP) · ${esc(a.smtpHost)} (SMTP)</p>`}
      <p class="leise">Das Passwort wird verschlüsselt und nur auf diesem ${window.desktop && window.desktop.plattform === 'android' ? 'Gerät' : 'Rechner (mit deinem Windows-Konto)'} gespeichert. Die App liest den Posteingang und verändert im Postfach nichts.</p>
      <p class="fehlertext" id="konto-fehler" hidden></p>
      <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll" id="konto-verbinden">Verbinden</button></div></form>`);
    $('#konto-form').onclick = e => { const c = e.target.closest('[data-anbieter]'); if (c) { wahl = c.dataset.anbieter; male(); } };
    $('#konto-form').onsubmit = async ev => {
      ev.preventDefault();
      const w = Object.fromEntries(new FormData(ev.target)), fehler = $('#konto-fehler'), knopf = $('#konto-verbinden');
      const server = wahl === 'EIGENER'
        ? { imapHost: w.imapHost.trim(), imapPort: Number(w.imapPort) || 993, imapSicherheit: 'SSL', smtpHost: w.smtpHost.trim(), smtpPort: Number(w.smtpPort) || 465, smtpSicherheit: w.starttls ? 'STARTTLS' : 'SSL' }
        : (({ label, ...rest }) => rest)(MAIL.anbieter[wahl]);
      const konfig = { adresse: w.adresse.trim(), benutzer: w.benutzer.trim() || w.adresse.trim(), name: S.einstellungen.firma || '', ...server };
      knopf.disabled = true; knopf.textContent = 'Prüfe …'; fehler.hidden = true;
      try {
        MAIL.konten[art] = await window.desktop.mail.einrichten(konfig, w.passwort, art); aktualisiereKonto();
        if (MAIL.konten[art].adresse !== k.adresse) setzeMailStand(art, {});
        $('#dialog').close(); speichere(); zeichne(); toast('E-Mail-Konto verbunden'); postfachAbrufen();
      } catch (e) { fehler.textContent = e.message; fehler.hidden = false; knopf.disabled = false; knopf.textContent = 'Verbinden'; }
    };
  };
  male();
}

/** Konto setzen (z. B. nach dem Einrichten) und die Oberfläche auffrischen. */
function mailKontoGesetzt(art, konfig) { MAIL.konten[art] = konfig; aktualisiereKonto(); zeichne(); }

async function mailStart() {
  if (!window.desktop) return;
  try {
    MAIL.anbieter = await window.desktop.mail.anbieter();
    for (const art of Object.keys(MAIL.konten)) MAIL.konten[art] = await window.desktop.mail.konto(art);
    aktualisiereKonto();
  } catch { return; }
  window.desktop.beiZiel(ziel => gehe(ziel));
  zeichne();
  if (MAIL.konto) postfachAbrufen();
  MAIL.timer = setInterval(() => postfachAbrufen(), 15 * 60 * 1000);
}

// ---------- Querverbindungen: Klicks, die überall gelten ----------
document.addEventListener('click', e => {
  const fall = e.target.closest('[data-fall-oeffnen]'), fz = e.target.closest('#detail [data-fahrzeug]'), fa = e.target.closest('[data-firmen-akt]');
  if (fall) { if ($('#dialog').open) $('#dialog').close(); gehe('#/fall/' + fall.dataset.fallOeffnen); return; }
  if (fz) { gehe('#/fahrzeug/' + fz.dataset.fahrzeug); return; }
  if (fa) { ({ interessent: interessentDialog, anrufliste: anruflisteStarten, serienmail: () => serienmailDialog() })[fa.dataset.firmenAkt](); return; }
  if (e.target.closest('[data-schaden-csv]')) {
    if (!faelle().length) { toast('Es gibt noch keine Fälle zum Exportieren'); return; }
    const zahl = {}; for (const a of alle('anlagen')) zahl[a.fallId] = (zahl[a.fallId] || 0) + 1;
    ladeHerunter(`Schadensfaelle_${heute()}.csv`, csvErstellen(faelle(), zahl));
  }
});

// ============================== Start ==============================
window.addEventListener('hashchange', zeichne);
window.addEventListener('beforeunload', e => { if ($('#fall-form') && formularWerte() !== formularStand) e.preventDefault(); });
window.addEventListener('online', () => abgleich());
document.addEventListener('visibilitychange', () => { if (!document.hidden) { zeichne(); pruefeStand(); } });
setInterval(pruefeStand, 45000);
if (langeMailsKuerzen()) speichere();
zeichne();
if (mitCloud()) abgleich();
mailStart();
window.__appBereit = true;
</script>
