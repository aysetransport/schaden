const ROLLE = { FAHRER: 'Fahrer', BEIFAHRER: 'Beifahrer', BEIDES: 'Fahrer und Beifahrer' };
const ANSTELLUNG = { VOLLZEIT: 'Vollzeit', TEILZEIT: 'Teilzeit', MINIJOB: 'Minijob', AUSHILFE: 'Aushilfe', AZUBI: 'Auszubildende/r', EXTERN: 'Subunternehmer / extern' };

const maAktiv = m => !!m && m.aktiv !== false && !(m.austritt && m.austritt < heute());
const mitarbeiterListe = (nurAktive = false) => alle('mitarbeiter').filter(m => !nurAktive || maAktiv(m)).sort((a, b) => String(a.name).localeCompare(String(b.name), 'de'));
const maVon = id => (id && S.mitarbeiter[id] && !S.mitarbeiter[id].geloescht ? S.mitarbeiter[id] : null);
const maName = id => (maVon(id) ? maVon(id).name : '');
/** Namen vergleichen ohne Groß-/Kleinschreibung und Reihenfolge („Demir, Ali“ = „Ali Demir“). */
const nameSchluessel = n => normal(n).replace(/[,.]/g, ' ').split(/\s+/).filter(Boolean).sort().join(' ');
const maZumNamen = name => { const n = nameSchluessel(name); return n ? alle('mitarbeiter').find(m => nameSchluessel(m.name) === n) || alle('mitarbeiter').find(m => String(m.aliase || '').split(';').some(a => a.trim() && nameSchluessel(a) === n)) || null : null; };
const mitarbeiterNamen = () => mitarbeiterListe(true).map(m => m.name);
const abwesenheitenVon = id => alle('abwesenheiten').filter(a => a.mitarbeiterId === id).sort((a, b) => String(b.von).localeCompare(String(a.von)));
const abwesendAm = (id, tag) => alle('abwesenheiten').find(a => a.mitarbeiterId === id && a.von <= tag && tag <= (a.bis || a.von)) || null;
const personalakteVon = id => alle('personaleintraege').filter(x => x.mitarbeiterId === id).sort((a, b) => String(b.datum).localeCompare(String(a.datum)));
const grundArt = g => (/urlaub/i.test(g || '') ? 'Urlaub' : /krank/i.test(g || '') ? 'Krank' : String(g || '').trim() || 'Sonstiges');
const kannFahren = m => m.rolle !== 'BEIFAHRER';
/** Internationale Nummer für WhatsApp/SMS (0171… → +49171…). */
const intNummer = n => { const s = String(n || '').replace(/[^0-9+]/g, ''); return s.startsWith('+') ? s : s.startsWith('00') ? '+' + s.slice(2) : s.startsWith('0') ? '+49' + s.slice(1) : s; };
/** Öffnet eine Webadresse (WhatsApp, Karten …) im Browser bzw. im passenden Programm. */
function oeffneLink(url) {

}
const whatsapp = (tel, text) => oeffneLink(`https://wa.me/${intNummer(tel).replace('+', '')}?text=${encodeURIComponent(text || '')}`);

/** Arbeitstage zwischen zwei Daten (einschließlich), Mo–Fr bzw. Mo–Sa laut Einstellungen. */
function arbeitstage(von, bis) {
  if (!von || !bis || bis < von) return 0;
  const sechs = Number(S.einstellungen.arbeitstageWoche) === 6;
  let n = 0;
  for (let d = alsTag(von), ende = alsTag(bis); d <= ende; d.setDate(d.getDate() + 1)) { const w = d.getDay(); if (w !== 0 && (sechs || w !== 6) && !feiertagAm(isoTag(d))) n++; }
  return n;
}

/** Fristen eines Mitarbeiters (nur aktive), sortiert nach Datum. */
function personalFristen(m) {
  if (!maAktiv(m)) return [];
  const l = PERSONAL_FRISTEN.filter(([k]) => m[k]).map(([k, l]) => ({ feld: k, label: l, datum: m[k], tage: tageBis(m[k]) }));
  if (m.fahrerkarteNr) { const d = letzteAuslesung(m) ? plusTage(letzteAuslesung(m), 28) : heute(); l.push({ feld: 'auslesen', label: 'Fahrerkarte auslesen (alle 28 Tage)', datum: d, tage: tageBis(d) }); }
  return l.sort((a, b) => a.datum.localeCompare(b.datum));
}
/** Fristen und Geburtstage der nächsten Tage für „Termine“ und die Übersicht. */
function personalTermine() {
  const bis = plusTage(heute(), FRIST_VORLAUF), t = heute();
  const fristen = mitarbeiterListe(true).flatMap(m => personalFristen(m).filter(f => f.datum <= bis).map(f => ({ art: 'mitarbeiter', datum: f.datum, titel: `${f.label} · ${m.name}`, zusatz: ROLLE[m.rolle] || '', m })));
  const geburtstage = mitarbeiterListe(true).filter(m => m.geburtstag).map(m => {
    let d = t.slice(0, 4) + m.geburtstag.slice(4); if (d < t) d = String(Number(t.slice(0, 4)) + 1) + m.geburtstag.slice(4);
    return { art: 'mitarbeiter', datum: d, titel: `🎂 Geburtstag · ${m.name}`, zusatz: `${Number(d.slice(0, 4)) - Number(m.geburtstag.slice(0, 4))} Jahre`, m };
  }).filter(x => x.datum <= plusTage(t, 7));
  return [...fristen, ...geburtstage];
}

/** Touren, an denen der Mitarbeiter beteiligt ist (als Fahrer oder Beifahrer). */
const einsaetzeVon = (id, von = '0000-00-00', bis = '9999-99-99') => alle('touren').filter(t => t.datum >= von && t.datum <= bis && teamVon(t).includes(id))
  .sort((a, b) => String(b.datum).localeCompare(String(a.datum)));
/** Schadensfälle, an denen der Mitarbeiter beteiligt war (Tour, Kennung oder Name im Fall). */
function schaedenVon(m) {
  const n = nameSchluessel(m.name);
  return faelle().filter(f => f.fahrerId === m.id || (f.tourId && S.touren[f.tourId] && teamVon(S.touren[f.tourId]).includes(m.id))
    || [f.fahrer, f.beifahrer1, f.beifahrer2].some(x => x && nameSchluessel(x) === n)).sort((a, b) => String(b.schadensdatum || '').localeCompare(String(a.schadensdatum || '')));
}
/** Fahrzeuge, bei denen der Mitarbeiter als fester Fahrer eingetragen ist. */
const festeFahrzeugeVon = m => alle('fahrzeuge').filter(z => z.fahrer && nameSchluessel(z.fahrer) === nameSchluessel(m.name));

/** Auswertung eines Mitarbeiters im Zeitraum. */
function maAuswertung(m, von, bis) {
  const touren = einsaetzeVon(m.id, von, bis);
  const tage = new Set(touren.map(t => t.datum)), fahrtage = new Set(touren.filter(t => t.fahrerId === m.id).map(t => t.datum));
  const zaehle = f => { const o = {}; for (const t of touren) { const k = f(t); if (k) o[k] = (o[k] || 0) + 1; } return Object.entries(o).sort((a, b) => b[1] - a[1]); };
  const abw = {};
  for (const a of abwesenheitenVon(m.id)) {
    const n = arbeitstage(a.von > von ? a.von : von, (a.bis || a.von) < bis ? (a.bis || a.von) : bis);
    if (n > 0) abw[grundArt(a.grund)] = (abw[grundArt(a.grund)] || 0) + n;
  }
  const lohn = personalakteVon(m.id).filter(x => x.art === 'LOHN' && x.datum >= von.slice(0, 7) + '-01' && x.datum <= bis);
  const summe = f => lohn.reduce((n, x) => n + (f(x) || 0), 0);
  const kosten = summe(x => x.kostenCent ?? x.bruttoCent);
  return { touren: touren.length, tage: tage.size, fahrtage: fahrtage.size, beifahrertage: [...tage].filter(t => !fahrtage.has(t)).length,
    arten: zaehle(t => t.einsatzart), auftraggeber: zaehle(t => tourAuftraggeberName(t)), fahrzeuge: zaehle(t => t.kennzeichen), abw,
    urlaub: abw.Urlaub || 0, krank: abw.Krank || 0, sonst: Object.entries(abw).filter(([k]) => k !== 'Urlaub' && k !== 'Krank').reduce((n, [, v]) => n + v, 0),
    bruttoCent: summe(x => x.bruttoCent), nettoCent: summe(x => x.nettoCent), kostenCent: kosten, stunden: summe(x => x.stunden) / 100, lohnMonate: lohn.length,
    kostenProTag: tage.size && kosten ? Math.round(kosten / tage.size) : null,
    schaeden: schaedenVon(m).filter(f => (f.schadensdatum || f.meldedatum || '') >= von && (f.schadensdatum || f.meldedatum || '') <= bis) };
}
/** Urlaubskonto eines Jahres: Anspruch (inkl. Rest aus dem Vorjahr), genommen, geplant, Rest. */
function urlaubskonto(m, jahr = heute().slice(0, 4)) {
  const von = jahr + '-01-01', bis = jahr + '-12-31', t = heute();
  let genommen = 0, geplant = 0;
  for (const a of abwesenheitenVon(m.id).filter(a => grundArt(a.grund) === 'Urlaub')) {
    const a1 = a.von > von ? a.von : von, b1 = (a.bis || a.von) < bis ? (a.bis || a.von) : bis;
    if (b1 < a1) continue;
    if (b1 <= t) genommen += arbeitstage(a1, b1); else if (a1 > t) geplant += arbeitstage(a1, b1);
    else { genommen += arbeitstage(a1, t); geplant += arbeitstage(plusTage(t, 1), b1); }
  }
  const anspruch = (m.urlaubstage || 0) + (jahr === t.slice(0, 4) ? (m.resturlaub || 0) : 0);
  return { anspruch, genommen, geplant, rest: anspruch - genommen - geplant };
}
/** Zeiträume für Auswertungen. */
function zeitraum(art, bezug = heute()) {
  const j = Number(bezug.slice(0, 4)), mo = Number(bezug.slice(5, 7)) - 1;
  if (art === 'LETZTER_MONAT') return { von: isoTag(new Date(j, mo - 1, 1)), bis: isoTag(new Date(j, mo, 0)), text: new Date(j, mo - 1, 15).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }) };
  if (art === 'JAHR') return { von: `${j}-01-01`, bis: `${j}-12-31`, text: String(j) };
  if (art === 'LETZTES_JAHR') return { von: `${j - 1}-01-01`, bis: `${j - 1}-12-31`, text: String(j - 1) };
  return { von: isoTag(new Date(j, mo, 1)), bis: isoTag(new Date(j, mo + 1, 0)), text: new Date(j, mo, 15).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }) };
}
const ZEITRAEUME = { MONAT: 'Dieser Monat', LETZTER_MONAT: 'Letzter Monat', JAHR: 'Dieses Jahr', LETZTES_JAHR: 'Letztes Jahr' };

const PersonalAktionen = {
  /** @return Kennung */
  speichern(m) {
    const x = merke('mitarbeiter', { aktiv: true, rolle: 'FAHRER', ...m, id: m.id || uuid(), firmaId: '', name: String(m.name || '').trim(), geaendertAm: jetztIso() });
    nachAenderung(); return x.id;
  },
  /** Neuer Mitarbeiter nur mit Namen (z. B. beim Eintippen in der Tourenplanung). */
  schnellAnlegen(name, rolle = 'BEIDES') {
    const vorhanden = maZumNamen(name); if (vorhanden) return vorhanden.id;
    return merke('mitarbeiter', { id: uuid(), firmaId: '', name: String(name).trim(), rolle, aktiv: true, notiz: 'Aus der Tourenplanung angelegt – bitte ergänzen', geaendertAm: jetztIso() }).id;
  },
  loeschen(m) {
    const jetzt = jetztIso();
    for (const a of abwesenheitenVon(m.id)) entferne('abwesenheiten', a, { firmaId: '', geaendertAm: jetzt });
    for (const x of personalakteVon(m.id)) entferne('personaleintraege', x, { firmaId: '', geaendertAm: jetzt });
    for (const a of anlagenVon(m.id)) { entferne('anlagen', a, { fallId: a.fallId }); Dateien.loesche(a.id); }
    entferne('mitarbeiter', m, { firmaId: '', geaendertAm: jetzt }); nachAenderung();
  },
  abwesenheit(a) { merke('abwesenheiten', { ...a, id: a.id || uuid(), firmaId: '', bis: a.bis || a.von, geaendertAm: jetztIso() }); nachAenderung(); },
  abwesenheitLoeschen(a) { entferne('abwesenheiten', a, { firmaId: '', geaendertAm: jetztIso() }); nachAenderung(); },
  /** Eintrag in der Personalakte; Unterweisung und Führerscheinkontrolle mit „gültig bis“ setzen die Frist beim Mitarbeiter. */
  eintrag(x) {
    merke('personaleintraege', { ...x, id: x.id || uuid(), firmaId: '', geaendertAm: jetztIso() });
    const m = maVon(x.mitarbeiterId), feld = { UNTERWEISUNG: 'unterweisungBis', FUEHRERSCHEIN: 'fuehrerscheinKontrolle' }[x.art];
    if (m && feld && x.bis && (!m[feld] || x.bis > m[feld])) merke('mitarbeiter', { ...m, [feld]: x.bis, geaendertAm: jetztIso() });
    nachAenderung();
  },
  eintragLoeschen(x) { entferne('personaleintraege', x, { firmaId: '', geaendertAm: jetztIso() }); nachAenderung(); },
  async dokument(id, art, datei) { if (await legeAnlage(id, datei, `${art} – `)) nachAenderung(); },
};

// ---------- Liste ----------
const PERSONAL_FILTER = { AKTIV: 'Aktiv', FREI: 'Heute frei', EINSATZ: 'Heute im Einsatz', ABWESEND: 'Heute abwesend', FRIST: 'Fristen', INAKTIV: 'Inaktiv', ALLE: 'Alle' };
function heuteStatus(m, tag = heute()) {
  const a = abwesendAm(m.id, tag); if (a) return { art: 'abwesend', text: a.grund || 'abwesend', farbe: 'gelb' };
  const t = alle('touren').find(x => x.datum === tag && teamVon(x).includes(m.id));
  if (t) return { art: 'einsatz', text: [t.kennzeichen, tourText(t)].filter(Boolean).join(' · '), farbe: 'blau', t };

function kalenderMonat(m, monat) {
  const [j, mo] = monat.split('-').map(Number), erster = new Date(j, mo - 1, 1), anzahl = new Date(j, mo, 0).getDate();
  const einsatz = new Set(einsaetzeVon(m.id, monat + '-01', monat + '-31').map(t => t.datum));
  let html = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(w => `<div class="wt">${w}</div>`).join('') + '<div></div>'.repeat((erster.getDay() + 6) % 7);
  for (let d = 1; d <= anzahl; d++) {
    const tag = `${monat}-${pad(d)}`, a = abwesendAm(m.id, tag), w = alsTag(tag).getDay();
    const klasse = a ? (grundArt(a.grund) === 'Krank' ? 'rot' : grundArt(a.grund) === 'Urlaub' ? 'gelb' : 'lila') : einsatz.has(tag) ? 'blau' : '';
    html += `<button class="kal-tag ${klasse} ${w === 0 || w === 6 ? 'we' : ''} ${tag === heute() ? 'heute' : ''}" data-kal-tag="${tag}" title="${esc(a ? a.grund || 'abwesend' : einsatz.has(tag) ? 'im Einsatz' : '')}">${d}</button>`;

  return `<div class="kalender">${html}</div><p class="leise" style="margin-top:6px"><span class="marke blau">Einsatz</span> <span class="marke gelb">Urlaub</span> <span class="marke rot">Krank</span> <span class="marke lila">sonst. abwesend</span> · Tag antippen = Abwesenheit eintragen</p>`;
}

  for (const x of d.abwesenheiten || []) {

    merke('abwesenheiten', { id: uuid(), firmaId: '', mitarbeiterId: m.id, von: x.von, bis: x.bis || x.von, grund: x.grund || '', notiz: x.notiz || '', geaendertAm: jetztIso() }); abw++;
  }

    const m = finde(dok); if (!m || !dok.base64) continue;
    const name = `${dok.art || 'Sonstiges'} – ${dok.name}`;
    if (anlagenVon(m.id).some(a => a.anzeigename === name)) continue;

  }
  nachAenderung();

}

/** Mögliche Doppelte: alle Namensteile des einen stecken im anderen („Fatih“ ↔ „Fatih Akyüz“, „Mike Engelhardt“ ↔ „Mike Davis Engelhardt“). */
function maDoppelte() {

    const [a, b] = l[i].t.length <= l[j].t.length ? [l[i], l[j]] : [l[j], l[i]];
    if (a.m.personalnummer && b.m.personalnummer && String(a.m.personalnummer) !== String(b.m.personalnummer)) continue;

const maTourenAnzahl = id => alle('touren').filter(t => teamVon(t).includes(id)).length;
/** Alles von `weg` auf `ziel` umhängen, `weg` danach löschen. */
async function maZusammenfuehren(weg, ziel, name) {
  const jetzt = jetztIso(), ersetze = id => (id === weg.id ? ziel.id : id);
  for (const t of alle('touren').filter(t => teamVon(t).includes(weg.id))) {
    const fahrer = ersetze(t.fahrerId || ''), bf = [...new Set(beifahrerVon(t).map(ersetze))].filter(id => id !== fahrer);
    merke('touren', { ...t, fahrerId: fahrer, beifahrerIds: bf.join(','), geaendertAm: jetzt });
  }
  const lohnMonate = new Set(personalakteVon(ziel.id).filter(e => e.art === 'LOHN').map(e => e.datum));
  for (const tab of ['zeiten', 'abwesenheiten', 'personaleintraege', 'tachotage'])
    for (const x of alle(tab).filter(x => x.mitarbeiterId === weg.id)) {
      if (tab === 'personaleintraege' && x.art === 'LOHN' && lohnMonate.has(x.datum)) { entferne(tab, x, { firmaId: '', geaendertAm: jetzt }); continue; }
      merke(tab, { ...x, mitarbeiterId: ziel.id, geaendertAm: jetzt });
    }
  for (const a of alle('aufgabenIntern').filter(a => a.zustaendigId === weg.id || (a.bezugArt === 'mitarbeiter' && a.bezugId === weg.id)))
    merke('aufgabenIntern', { ...a, zustaendigId: ersetze(a.zustaendigId || ''), bezugId: a.bezugArt === 'mitarbeiter' ? ersetze(a.bezugId) : a.bezugId, geaendertAm: jetzt });
  for (const f of faelle().filter(f => f.fahrerId === weg.id)) fallMerken({ ...f, fahrerId: ziel.id });
  // Dokumente: in der Cloud lassen sich Anlagen nicht umhängen – Kopie beim Ziel, Original weg
  let fehlt = 0;
  for (const a of anlagenVon(weg.id)) {
    try { await Dateien.adresse(a); } catch { /* unten geprüft */ }
    const blob = await Dateien.hole(a.id);
    if (!blob) { fehlt++; continue; }
    const neu = merke('anlagen', { id: uuid(), fallId: ziel.id, anzeigename: a.anzeigename, mimeType: a.mimeType, groesseBytes: blob.size, hinzugefuegtAm: a.hinzugefuegtAm || jetzt, vorhanden: false });
    await Dateien.lege(neu.id, blob);
    entferne('anlagen', a, { fallId: a.fallId }); Dateien.loesche(a.id);
  }
  const aliase = [...new Set([ziel.aliase, weg.aliase, weg.name, ziel.name].flatMap(x => String(x || '').split(';')).map(x => x.trim()).filter(x => x && nameSchluessel(x) !== nameSchluessel(name)))].join('; ');
  const dazu = Object.fromEntries(Object.entries(weg).filter(([k, v]) => !['id', 'name', 'aliase', 'notiz', 'geaendertAm', '_n', 'rev'].includes(k) && v != null && v !== '' && (ziel[k] == null || ziel[k] === '')));
  merke('mitarbeiter', { ...ziel, ...dazu, name: name || ziel.name, aliase, notiz: [ziel.notiz, weg.notiz].filter(Boolean).filter((x, i, l) => l.indexOf(x) === i).join('\n'), geaendertAm: jetzt });
  if (S.einstellungen.ichId === weg.id) S.einstellungen.ichId = ziel.id;
  if (fehlt) for (const a of anlagenVon(weg.id)) entferne('anlagen', a, { fallId: a.fallId });
  entferne('mitarbeiter', weg, { firmaId: '', geaendertAm: jetzt });
  nachAenderung();
  return { fehlt };
}

// ============================== Tourenplanung ==============================
/**
 * Touren je Tag: Fahrzeug (Kennzeichen aus dem Fuhrpark), Auftraggeber (Firma), Einsatzart, Fahrer und Beifahrer (Mitarbeiter).
 * Jede Änderung wird sofort gespeichert und abgeglichen. Hinweise (doppelt eingeplant, abwesend, Führerschein, Fahrzeug in
 * der Werkstatt …) entstehen aus Personal und Fuhrpark. „Teams auffüllen“ schlägt passende Leute vor.
 */
const BEIFAHRER_MAX = 5;
const beifahrerVon = t => String(t.beifahrerIds || '').split(',').filter(Boolean);
const teamVon = t => [t.fahrerId, ...beifahrerVon(t)].filter(Boolean);
const tourenAm = tag => alle('touren').filter(t => t.datum === tag).sort((a, b) => (a.reihenfolge ?? 0) - (b.reihenfolge ?? 0) || String(a.id).localeCompare(String(b.id)));
const tourAuftraggeberName = t => (t.auftraggeberId && S.auftraggeber[t.auftraggeberId] && !S.auftraggeber[t.auftraggeberId].geloescht ? S.auftraggeber[t.auftraggeberId].name : t.auftraggeber || '');
const tourText = t => [t.tourNr && 'Tour ' + t.tourNr, tourAuftraggeberName(t), t.name, t.uhrzeit && 'ab ' + t.uhrzeit, t.einsatzart].filter(Boolean).join(' · ');
const tourGefahren = t => !!(t.kennzeichen && t.fahrerId) && t.status !== 'STORNIERT';
const einsatzartListe = () => alle('einsatzarten').sort((a, b) => String(a.name).localeCompare(String(b.name), 'de'));
const einsatzartZu = name => alle('einsatzarten').find(e => normal(e.name) === normal(name)) || null;
/** Fahrzeug zum Kennzeichen – auch über Aliase (andere Schreibweise, altes Kennzeichen, Kennzeichen aus der Fahrerkarte). */
const fahrzeugZumKz = kz => { const k = kzNormal(kz); return k ? alle('fahrzeuge').find(z => kzNormal(z.kennzeichen) === k) || alle('fahrzeuge').find(z => String(z.aliase || '').split(',').some(a => kzNormal(a) === k)) || null : null; };
/** Touren einer Firma (über Kennung oder gleichen Namen). */
const tourenVonFirma = (firma, von = '0000', bis = '9999') => alle('touren').filter(t => t.datum >= von && t.datum <= bis
  && (t.auftraggeberId === firma.id || (!t.auftraggeberId && normal(t.auftraggeber) === normal(firma.name))));
const tourenVonFahrzeug = (z, von = '0000', bis = '9999') => { const k = kzNormal(z.kennzeichen); return alle('touren').filter(t => t.datum >= von && t.datum <= bis && kzNormal(t.kennzeichen) === k); };
/** Schadensfälle je Tour (einmal je Datenstand gesammelt). */
function schaedenVonTour(t) {
  const c = schaedenVonTour, stand = speichere.zaehler + ':' + Object.keys(S.faelle).length;
  if (c.stand !== stand) { c.stand = stand; c.map = new Map(); for (const f of faelle()) if (f.tourId) (c.map.get(f.tourId) || c.map.set(f.tourId, []).get(f.tourId)).push(f); }
  return c.map.get(t.id) || [];
}

const TourAktionen = {
  undo: [],
  /** Stand eines Tages für „Rückgängig“ merken. */
  merken(tag) { this.undo.push({ tag, touren: tourenAm(tag).map(t => ({ ...t })) }); if (this.undo.length > 50) this.undo.shift(); },
  speichern(t, ohneUndo) {
    if (!ohneUndo) this.merken(t.datum);
    const x = merke('touren', { ...t, id: t.id || uuid(), firmaId: '', geaendertAm: jetztIso() });
    tourGeaendert(); return x.id;
  },
  neu(tag, vorgabe = {}) {
    this.merken(tag);
    const n = tourenAm(tag).reduce((m, t) => Math.max(m, t.reihenfolge ?? 0), 0) + 1;
    return this.speichern({ datum: tag, reihenfolge: n, ...vorgabe }, true);
  },
  loeschen(t) { this.merken(t.datum); for (const st of stoppsVon(t.id)) entferne('stopps', st, { firmaId: '', tourId: t.id, geaendertAm: jetztIso() }); entferne('touren', t, { firmaId: '', geaendertAm: jetztIso() }); tourGeaendert(); },
  verschieben(t, richtung) {
    const liste = tourenAm(t.datum), i = liste.findIndex(x => x.id === t.id), j = i + richtung;
    if (j < 0 || j >= liste.length) return;
    this.merken(t.datum);
    [liste[i], liste[j]] = [liste[j], liste[i]];
    liste.forEach((x, k) => { if ((x.reihenfolge ?? 0) !== k + 1) merke('touren', { ...x, reihenfolge: k + 1, geaendertAm: jetztIso() }); });
    tourGeaendert();
  },
  rueckgaengig() {
    const s = this.undo.pop(); if (!s) return false;
    const vorher = new Map(s.touren.map(t => [t.id, t]));
    for (const t of tourenAm(s.tag)) if (!vorher.has(t.id)) entferne('touren', t, { firmaId: '', geaendertAm: jetztIso() });
    for (const t of s.touren) merke('touren', { ...t, geloescht: undefined, geaendertAm: jetztIso() });
    ANSICHT.tourTag = s.tag; tourGeaendert(); return true;
  },
  /** Touren eines anderen Tages übernehmen (ersetzt den Tag); auf Wunsch mit Team (Abwesende bleiben draußen). */
  uebernehmen(von, nach, mitTeam) {
    this.merken(nach);
    for (const t of tourenAm(nach)) entferne('touren', t, { firmaId: '', geaendertAm: jetztIso() });
    const frei = id => id && !abwesendAm(id, nach) && maAktiv(maVon(id));
    tourenAm(von).forEach((t, i) => merke('touren', { id: uuid(), firmaId: '', datum: nach, reihenfolge: i + 1, kennzeichen: t.kennzeichen, tourNr: t.tourNr, auftraggeberId: t.auftraggeberId,
      auftraggeber: t.auftraggeber, name: t.name, uhrzeit: t.uhrzeit, einsatzart: t.einsatzart, notiz: t.notiz,
      fahrerId: mitTeam && frei(t.fahrerId) ? t.fahrerId : '', beifahrerIds: mitTeam ? beifahrerVon(t).filter(frei).join(',') : '', geaendertAm: jetztIso() }));
    tourGeaendert();
  },
};
/** Nach Änderungen an Touren: speichern, abgleichen und neu zeichnen, ohne den Eingabefokus zu verlieren. */
function tourGeaendert() {
  speichere(); planeAbgleich();
  clearTimeout(tourGeaendert.t);
  tourGeaendert.t = setTimeout(() => {
    const a = document.activeElement, schluessel = a && a.closest && a.closest('[data-tour-zeile]') && [a.closest('[data-tour-zeile]').dataset.tourZeile, a.dataset.feld, a.dataset.index];
    zeichne();
    if (schluessel) {
      const el = document.querySelector(`[data-tour-zeile="${schluessel[0]}"] [data-feld="${schluessel[1]}"]${schluessel[2] != null ? `[data-index="${schluessel[2]}"]` : ''}`);
      if (el) { el.focus(); if (el.select && el.tagName === 'INPUT') try { el.setSelectionRange(el.value.length, el.value.length); } catch {} }
    }
  }, 0);
}

// ---------- Prüfung ----------
/** Was an einem Tag belegt ist (für Doppelt-Prüfung und „frei“). */
function tagesLage(tag) {
  const touren = tourenAm(tag), personen = {}, fahrzeuge = {};
  for (const t of touren) { for (const id of teamVon(t)) personen[id] = (personen[id] || 0) + 1; const k = kzNormal(t.kennzeichen); if (k) fahrzeuge[k] = (fahrzeuge[k] || 0) + 1; }
  return { touren, personen, fahrzeuge };
}
const nichtBeiListe = m => String(m.nichtBei || '').split(',').map(normal).filter(Boolean);
/** Führerschein reicht für das Fahrzeug? (ohne Angabe: keine Prüfung) */
function fuehrerscheinOk(m, z) {
  if (!m.fuehrerschein || !z || !z.zgg) return true;
  const k = String(m.fuehrerschein).toUpperCase().split(/[\s,;/]+/);
  if (z.zgg > 7500) return k.some(x => /^C(E)?$/.test(x));
  if (z.zgg > 3500) return k.some(x => /^C1?(E)?$/.test(x));
  return true;
}
/** Hinweise zu einer Tour. */
function tourHinweise(t, lage = tagesLage(t.datum)) {
  const h = [], z = fahrzeugZumKz(t.kennzeichen), art = einsatzartZu(t.einsatzart), ag = normal(tourAuftraggeberName(t));
  if (t.kennzeichen) {
    if (lage.fahrzeuge[kzNormal(t.kennzeichen)] > 1) h.push(['rot', 'Fahrzeug mehrfach eingeplant']);
    if (z && z.status === 'WERKSTATT') h.push(['rot', 'Fahrzeug in der Werkstatt']);
    if (z && z.status === 'STILLGELEGT') h.push(['rot', 'Fahrzeug abgemeldet']);
    if (z) for (const f of fristenVon(z).filter(f => f.datum < t.datum && ['huBis', 'spBis', 'uvvBis', 'tachoBis', 'versicherungBis'].includes(f.feld))) h.push(['rot', `${f.label} abgelaufen`]);
    if (!z) h.push(['grau', 'nicht im Fuhrpark']);
  }
  if (t.kennzeichen && !t.fahrerId) h.push(['gelb', 'Fahrer fehlt']);
  for (const id of teamVon(t)) {
    const m = maVon(id); if (!m) { h.push(['rot', 'Mitarbeiter gelöscht']); continue; }
    const vorn = m.name.split(' ')[0];
    if (lage.personen[id] > 1) h.push(['rot', `${vorn} doppelt eingeplant`]);
    const a = abwesendAm(id, t.datum); if (a) h.push(['rot', `${vorn}: ${a.grund || 'abwesend'}`]);
    if (!maAktiv(m)) h.push(['rot', `${vorn} ist inaktiv`]);
    if (ag && nichtBeiListe(m).includes(ag)) h.push(['rot', `${vorn} nicht bei ${tourAuftraggeberName(t)}`]);
  }
  const f = maVon(t.fahrerId);
  if (f) {
    if (!kannFahren(f)) h.push(['gelb', `${f.name.split(' ')[0]} ist nur Beifahrer`]);
    if (!fuehrerscheinOk(f, z)) h.push(['rot', `Führerschein von ${f.name.split(' ')[0]} reicht nicht (${zahlText(z.zgg, 'kg')})`]);
    for (const [k, l] of [['fuehrerscheinBis', 'Führerschein'], ['fahrerkarteBis', 'Fahrerkarte'], ['modul95Bis', 'Modul 95']]) if (f[k] && f[k] < t.datum) h.push(['rot', `${l} von ${f.name.split(' ')[0]} abgelaufen`]);
  }
  if (art && t.kennzeichen) {
    const soll = art.beifahrer || 0, ist = beifahrerVon(t).length;
    if (ist < soll) h.push(['gelb', `${soll - ist} Beifahrer fehlt${soll - ist > 1 ? 'en' : ''}`]);
    if (art.monteurNoetig && !teamVon(t).some(id => maVon(id) && maVon(id).monteur)) h.push(['gelb', 'Monteur fehlt']);
  }
  return h;
}

// ---------- Teams auffüllen ----------
/**
 * Füllt Fahrer und Beifahrer der gewählten Touren auf: nur aktive, anwesende, an diesem Tag freie Leute, die beim Auftraggeber
 * eingesetzt werden dürfen und (für Fahrer) die Rolle und den Führerschein haben. Bevorzugt: fester Fahrer des Fahrzeugs,
 * wer dieses Fahrzeug bzw. diesen Auftraggeber kennt, Monteure wo nötig – und wer in den letzten 14 Tagen weniger gearbeitet hat.
 */
function teamsAuffuellen(tag, ids) {
  const lage = tagesLage(tag), belegt = new Set(Object.keys(lage.personen));
  const verlauf = alle('touren').filter(t => t.datum < tag && t.datum >= plusTage(tag, -60)), kurz = plusTage(tag, -14);
  const kennt = {}, arbeit = {};
  for (const t of verlauf) for (const id of teamVon(t)) {
    kennt[id + '|' + kzNormal(t.kennzeichen)] = (kennt[id + '|' + kzNormal(t.kennzeichen)] || 0) + 1;
    kennt[id + '|' + normal(tourAuftraggeberName(t))] = (kennt[id + '|' + normal(tourAuftraggeberName(t))] || 0) + 1;
    if (t.datum >= kurz) arbeit[id] = (arbeit[id] || 0) + 1;
  }
  const verfuegbar = mitarbeiterListe(true).filter(m => !abwesendAm(m.id, tag));
  let gesetzt = 0;
  const geaendert = [];
  for (const t of lage.touren.filter(t => ids.includes(t.id) && t.kennzeichen)) {
    const z = fahrzeugZumKz(t.kennzeichen), ag = normal(tourAuftraggeberName(t)), art = einsatzartZu(t.einsatzart);
    const darf = m => !belegt.has(m.id) && !(ag && nichtBeiListe(m).includes(ag));
    const punkte = (m, alsFahrer) => (alsFahrer && z && z.fahrer && nameSchluessel(z.fahrer) === nameSchluessel(m.name) ? 50 : 0)
      + 3 * Math.min(10, kennt[m.id + '|' + kzNormal(t.kennzeichen)] || 0) + 2 * Math.min(10, kennt[m.id + '|' + ag] || 0) - 2 * (arbeit[m.id] || 0)
      + (!alsFahrer && m.rolle !== 'FAHRER' ? 8 : 0) + (alsFahrer && m.rolle === 'FAHRER' ? 4 : 0);
    const bester = (kandidaten, alsFahrer) => kandidaten.sort((a, b) => punkte(b, alsFahrer) - punkte(a, alsFahrer) || a.name.localeCompare(b.name, 'de'))[0];
    let fahrerId = t.fahrerId, bf = beifahrerVon(t);
    if (!fahrerId) {
      const m = bester(verfuegbar.filter(m => darf(m) && kannFahren(m) && fuehrerscheinOk(m, z)), true);
      if (m) { fahrerId = m.id; belegt.add(m.id); gesetzt++; }
    }
    const soll = Math.min(BEIFAHRER_MAX, art ? art.beifahrer || 0 : bf.length);
    while (bf.length < soll) {
      const brauchtMonteur = art && art.monteurNoetig && ![fahrerId, ...bf].some(id => maVon(id) && maVon(id).monteur);
      const kandidaten = verfuegbar.filter(m => darf(m) && (!brauchtMonteur || m.monteur));
      const m = bester(kandidaten.length ? kandidaten : verfuegbar.filter(darf), false);
      if (!m) break;
      bf.push(m.id); belegt.add(m.id); gesetzt++;
    }
    if (fahrerId !== t.fahrerId || bf.join(',') !== beifahrerVon(t).join(',')) geaendert.push({ ...t, fahrerId: fahrerId || '', beifahrerIds: bf.join(',') });
  }
  if (geaendert.length) { TourAktionen.merken(tag); for (const t of geaendert) merke('touren', { ...t, geaendertAm: jetztIso() }); tourGeaendert(); }
  return gesetzt;
}

// ---------- Ansicht ----------
const wochentag = iso => ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'][alsTag(iso).getDay()];
function freiAm(tag) {
  const lage = tagesLage(tag), belegt = new Set(Object.keys(lage.personen));
  const aktive = mitarbeiterListe(true), weg = aktive.filter(m => abwesendAm(m.id, tag));
  const frei = aktive.filter(m => !belegt.has(m.id) && !abwesendAm(m.id, tag));
  const fz = fahrzeugListe().filter(z => z.status !== 'STILLGELEGT' && !z.leihfahrzeug);
  const fzFrei = fz.filter(z => z.status !== 'WERKSTATT' && !lage.fahrzeuge[kzNormal(z.kennzeichen)]);
  const klasse = (von, bis) => fzFrei.filter(z => (von === 0 ? !z.zgg : z.zgg > von && z.zgg <= bis));
  return { frei, weg, werkstatt: fz.filter(z => z.status === 'WERKSTATT'), fahrzeuge: fzFrei,
    gruppen: [['bis 3,5 t', klasse(1, 3500)], ['bis 7,5 t', klasse(3500, 7500)], ['über 7,5 t', klasse(7500, Infinity)], ['Gewicht unbekannt', klasse(0)]] };
}

/** Wird in der Tourenplanung gerade etwas getippt, das noch nicht gespeichert ist? */
function tourEingabeOffen() {
  const el = document.activeElement, z = el && el.closest && el.closest('[data-tour-zeile]');
  if (!z || !el.dataset.feld) return false;
  const t = S.touren[z.dataset.tourZeile]; if (!t) return false;
  const f = el.dataset.feld;
  const gespeichert = f === 'fahrer' ? maName(t.fahrerId) : f === 'beifahrer' ? maName(beifahrerVon(t)[Number(el.dataset.index)]) : f === 'auftraggeber' ? tourAuftraggeberName(t) : t[f] || '';
  return el.value.trim() !== String(gespeichert || '').trim();
}
/** Ähnliche Mitarbeiter zu einem unbekannten Namen (Tippfehler, nur Vor- oder Nachname, Anfang des Namens). */
function aehnlicheMitarbeiter(name, max = 4) {
  const abstand = (a, b) => { if (Math.abs(a.length - b.length) > 2) return 9; const d = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) { let vor = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++) { const tmp = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, vor + (a[i - 1] === b[j - 1] ? 0 : 1)); vor = tmp; } } return d[b.length]; };
  const w = nameSchluessel(name).split(' ').filter(Boolean); if (!w.length) return [];
  return mitarbeiterListe(true).map(m => {
    const t = [...nameSchluessel(m.name).split(' '), ...String(m.aliase || '').split(';').flatMap(a => nameSchluessel(a).split(' '))].filter(Boolean);
    const p = w.reduce((n, x) => n + Math.max(0, ...t.map(y => (y === x ? 3 : y.startsWith(x) && x.length >= 2 ? 2 : x.length >= 4 && abstand(x, y) <= (x.length >= 7 ? 2 : 1) ? 1.5 : 0))), 0);
    return { m, p };
  }).filter(x => x.p > 0).sort((a, b) => b.p - a.p || a.m.name.localeCompare(b.m.name, 'de')).slice(0, max).map(x => x.m);
}
/** Unbekannter Name in der Tourenplanung: nichts anlegen – Hinweis mit „Meintest du …?“. */
function unbekannterMitarbeiter(t, feld, index, name) {
  const v = aehnlicheMitarbeiter(name);
  dialog(`<div><h2>„${esc(name)}“ gibt es nicht im Personal</h2>${v.length ? `<p>Meintest du:</p><div id="meintest">${v.map(m => `<button class="vorlage" data-meintest="${m.id}"><b>${esc(m.name)}</b> <span class="leise">${esc(ROLLE[m.rolle] || '')}${abwesendAm(m.id, t.datum) ? ' · ' + esc(abwesendAm(m.id, t.datum).grund || 'abwesend') : ''}</span></button>`).join('')}</div>`
    : '<p class="leise">Kein ähnlicher Name gefunden. Neue Mitarbeiter bitte unter Personal anlegen.</p>'}
    <div class="dialog-knoepfe"><button class="knopf text" data-zu>Abbrechen</button></div></div>`);
  if (!v.length) return;

    else { const bf = beifahrerVon(x); bf[index] = b.dataset.meintest; x.beifahrerIds = [...new Set(bf.filter(Boolean))].join(','); }
    $('#dialog').close(); TourAktionen.speichern(x);

/** Eingabe in einer Tourzeile übernehmen (Namen → Mitarbeiter, Kennzeichen → Fuhrpark, Auftraggeber → Firma). */
function tourEingabe(t, el) {
  const feld = el.dataset.feld, wert = el.value.trim(), neu = { ...t };
  let unbekannt = '';
  const person = name => {
    if (!name) return '';
    const m = maZumNamen(name); if (m) return m.id;
    unbekannt = name; return null;
  };
  if (feld === 'kennzeichen') { const z = fahrzeugZumKz(wert); neu.kennzeichen = z ? z.kennzeichen : wert.toUpperCase(); }
  else if (feld === 'auftraggeber') {
    const f = wert ? firmaZumNamen(wert) : null;
    if (f || !wert) { neu.auftraggeberId = f ? f.id : ''; neu.auftraggeber = f ? f.name : ''; }
    else {
      neu.auftraggeberId = Aktionen.firmaSpeichern({ name: wert, status: 'AKTIV', notizen: 'Aus der Tourenplanung angelegt' }); neu.auftraggeber = wert;
      toast(`Firma „${wert}“ im CRM angelegt`, 4000);
    }
  } else if (feld === 'fahrer') { const id = person(wert); if (id !== null) neu.fahrerId = id; }
  else if (feld === 'beifahrer') {
    const bf = beifahrerVon(t), i = Number(el.dataset.index), id = person(wert);
    if (id) bf[i] = id; else if (id === '') bf.splice(i, 1);
    neu.beifahrerIds = bf.filter(Boolean).join(',');
  } else neu[feld] = wert;
  if (unbekannt) {
    el.value = feld === 'fahrer' ? maName(t.fahrerId) : maName(beifahrerVon(t)[Number(el.dataset.index)]) || '';
    setTimeout(() => unbekannterMitarbeiter(t, feld, Number(el.dataset.index), unbekannt), 0);
    return;
  }
  if (JSON.stringify(neu) !== JSON.stringify(t)) TourAktionen.speichern(neu);
}

const STOPP_ART = { LIEFERUNG: ['Lieferung', '📦'], ABHOLUNG: ['Abholung', '↩'], MONTAGE: ['Montage', '🔧'], SONSTIGES: ['Sonstiges', '•'] };
const stoppsVon = tourId => alle('stopps').filter(s => s.tourId === tourId).sort((a, b) => (a.reihenfolge ?? 0) - (b.reihenfolge ?? 0));
const StoppAktionen = {
  speichern(s) { const x = merke('stopps', { art: 'LIEFERUNG', status: 'OFFEN', ...s, id: s.id || uuid(), firmaId: '', geaendertAm: jetztIso() }); nachAenderung(); return x.id; },

  nummerieren(tourId) { stoppsVon(tourId).forEach((s, i) => { if (s.reihenfolge !== i + 1) merke('stopps', { ...s, reihenfolge: i + 1, geaendertAm: jetztIso() }); }); },

    const l = stoppsVon(s.tourId), i = l.findIndex(x => x.id === s.id), j = i + um; if (j < 0 || j >= l.length) return;
    [l[i], l[j]] = [l[j], l[i]]; l.forEach((x, k) => merke('stopps', { ...x, reihenfolge: k + 1, geaendertAm: jetztIso() })); nachAenderung();

// ---------- Rollkarte (PDF) → Stoppliste ----------
/**
 * Liest eine Rollkarte/Tourliste aus Textstücken eines PDFs ({ s, x, y, seite }; y wächst nach oben).
 * Spalten werden an den Überschriften erkannt (Name, Auftragsnummer, Adresse, Telefon, Zeitfenster, Betrag);
 * jeder Stopp hängt an seiner Auftragsnummer, mehrzeilige Zellen (z. B. Adresse) werden zusammengefügt.
 */
function rollkarteLesen(teile) {
  const KOPF = { name: /^name$/i, auftrag: /^auftrag(s)?(nummer|nr\.?)?$/i, adresse: /^(liefer)?adresse$/i, telefon: /^tel(efon)?(nummer|nr\.?)?$/i, zeit: /^zeitfenster$/i, betrag: /^(summe\s*\/\s*)?betrag$|^summe$/i, erledigt: /^erledigt$/i };
  const geld = t => { const m = String(t).replace(/\s/g, '').match(/-?\d{1,3}(?:\.\d{3})*,\d{2}|-?\d+,\d{2}/); return m ? Math.round(Number(m[0].replace(/\./g, '').replace(',', '.')) * 100) : null; };
  const ergebnis = { datum: '', titel: '', abfahrt: '', km: null, stopps: [], summeCent: null, hinweis: '' };
  const alleS = teile.map(t => t.s).join(' ');
  const d = alleS.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (d) ergebnis.datum = `${d[3]}-${d[2].padStart(2, '0')}-${d[1].padStart(2, '0')}`;
  const titel = teile.find(t => /rollkarte|tourenliste|ladeliste|tour\s/i.test(t.s)); if (titel) ergebnis.titel = titel.s.replace(/\s*\d{1,2}\.\d{1,2}\.\d{4}\s*/, ' ').trim();
  const rz = teile.find(t => /^route|^abfahrt/i.test(t.s.trim()));
  const route = rz ? teile.filter(t => t.seite === rz.seite && Math.abs(t.y - rz.y) < 3).sort((a, b) => a.x - b.x).map(t => t.s.trim()).join(' ') : '';
  const ab = route.match(/abfahrt\s*(\d{1,2}[:.]\d{2})/i); if (ab) ergebnis.abfahrt = ab[1].replace('.', ':').padStart(5, '0');
  const km = route.match(/(\d+[.,]?\d*)\s*km/i); if (km) ergebnis.km = Math.round(Number(km[1].replace(',', '.')));
  if (route) ergebnis.hinweis = route.replace(/^route:\s*/i, '');
  for (const seite of [...new Set(teile.map(t => t.seite))]) {
    const ts = teile.filter(t => t.seite === seite && String(t.s).trim());
    const kopf = {};
    for (const t of ts) for (const [k, re] of Object.entries(KOPF)) if (re.test(t.s.trim()) && (!kopf[k] || t.y > kopf[k].y)) kopf[k] = t;
    if (!kopf.auftrag || !kopf.name) continue;
    const spalten = Object.entries(kopf).map(([k, t]) => ({ k, x: t.x })).sort((a, b) => a.x - b.x);
    const spalte = t => { let s = spalten[0].k; for (const c of spalten) if (t.x + 4 >= c.x) s = c.k; return s; };
    const kopfZeilen = new Set(Object.values(kopf)), oben = Math.min(...[...kopfZeilen].map(t => t.y));
    // Unteres Ende: wiederholte Kopfzeile oder Routenzeile
    const ende = ts.filter(t => !kopfZeilen.has(t) && t.y < oben - 2 && (Object.values(KOPF).some(re => re.test(t.s.trim())) || /^route/i.test(t.s.trim()))).map(t => t.y);
    const unten = ende.length ? Math.max(...ende) : -1e9;
    const daten = ts.filter(t => !kopfZeilen.has(t) && t.y < oben - 2 && t.y > unten + 2 && !/^route/i.test(t.s));
    const anker = daten.filter(t => spalte(t) === 'auftrag' && /^\d{5,}$/.test(t.s.trim())).sort((a, b) => b.y - a.y);
    if (!anker.length) continue;
    const gruppen = anker.map(a => ({ a, teile: [] }));
    for (const t of daten) {
      let best = null; for (const g of gruppen) if (!best || Math.abs(g.a.y - t.y) < Math.abs(best.a.y - t.y)) best = g;
      // nicht zu weit weg (zwei Zeilen)
      if (best && Math.abs(best.a.y - t.y) < 30) best.teile.push(t);
    }
    for (const g of gruppen) {
      const zelle = k => g.teile.filter(t => spalte(t) === k).sort((a, b) => b.y - a.y || a.x - b.x).map(t => t.s.trim());
      const zeit = zelle('zeit');
      let adr = zelle('adresse').join(' ').replace(/\s+/g, ' ').replace(/\s+,/g, ',').replace(/(\p{L})-\s+(\p{L})/gu, '$1-$2'), tel = zelle('telefon').join(' ');
      // Telefonnummer, die im Text in die Adressspalte gerutscht ist
      const t2 = adr.match(/\s((?:\+|0)[\d /-]{6,})$/); if (t2 && !tel) { tel = t2[1]; adr = adr.slice(0, t2.index).trim(); }
      ergebnis.stopps.push({
        kundeName: zelle('name').join(' '), auftragNr: zelle('auftrag').join(' '), adresse: adr,
        kundeTelefon: tel.replace(/[^\d+ /-]/g, '').trim(),
        zeitfenster: (zeit.find(z => !/→|->|ca\./.test(z)) || '').replace(/\s*uhr$/i, ' Uhr').trim(),
        eta: ((zeit.find(z => /→|->|ca\./.test(z)) || '').match(/\d{1,2}:\d{2}/) || [''])[0],
        betragCent: geld(zelle('betrag').join(' ')),
      });
    }
  }
  if (ergebnis.stopps.some(s => s.betragCent != null)) ergebnis.summeCent = ergebnis.stopps.reduce((n, s) => n + (s.betragCent || 0), 0);
  return ergebnis;
}
/** Textstücke aus einer PDF-Datei (pdf.js liegt in der App unter pdfjs/). */
async function pdfTextteile(datei) {
  if (!window.pdfjsLib) await new Promise((ok, fehler) => { const s = document.createElement('script'); s.src = 'pdfjs/pdf.min.js'; s.onload = ok; s.onerror = () => fehler(new Error('PDF-Leser konnte nicht geladen werden')); document.head.appendChild(s); });
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await datei.arrayBuffer()) }).promise, teile = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const inhalt = await (await pdf.getPage(n)).getTextContent();
    for (const it of inhalt.items) if (it.str && it.str.trim()) teile.push({ s: it.str, x: it.transform[4], y: it.transform[5], seite: n });
  }
  return teile;
}
/** PDF wählen → Vorschau zum Prüfen → Stopps in die Tour (oder neue Tour anlegen). */
function rollkarteImport(zielTour = null) {
  const i = Object.assign(document.createElement('input'), { type: 'file', accept: 'application/pdf,.pdf' });
  i.onchange = async () => {
    if (!i.files[0]) return;
    toast('PDF wird gelesen …');
    try {
      const r = rollkarteLesen(await pdfTextteile(i.files[0]));
      if (!r.stopps.length) { toast('In dieser PDF wurde keine Stoppliste erkannt (Spalten „Name“ und „Auftragsnummer“ fehlen oder die PDF ist nur ein Bild).', 8000); return; }
      rollkarteVorschau(r, zielTour, i.files[0].name);
    } catch (x) { toast('PDF nicht lesbar: ' + x.message, 7000); }
  };
  i.click();
}
function rollkarteVorschau(r, zielTour, dateiname) {

    <div class="matrix-rahmen" tabindex="0"><table class="rk-tabelle"><thead><tr><th></th><th>#</th><th>Name</th><th>Adresse</th><th>Telefon</th><th>Zeitfenster</th><th>Auftrag</th><th>Betrag</th></tr></thead><tbody>
      ${r.stopps.map((s, n) => { const h = pruefen(s); return `<tr data-rk="${n}" class="${h.length ? 'pruefen' : ''}"><td><input type="checkbox" name="an" ${vorhanden.has(s.auftragNr) ? '' : 'checked'} aria-label="Stopp ${n + 1} übernehmen"></td><td>${n + 1}</td>
        <td><input name="kundeName" value="${esc(s.kundeName)}"></td><td><input name="adresse" value="${esc(s.adresse)}" style="min-width:220px">${h.length ? `<br><span class="fehlertext">${esc(h.join(' · '))}</span>` : ''}</td>
        <td><input name="kundeTelefon" value="${esc(s.kundeTelefon)}"></td><td><input name="zeitfenster" value="${esc(s.zeitfenster)}" style="width:110px">${s.eta ? `<br><span class="leise">→ ca. ${esc(s.eta)}</span>` : ''}</td>
        <td><input name="auftragNr" value="${esc(s.auftragNr)}" style="width:100px"></td><td><input name="betrag" value="${s.betragCent != null ? esc(geldOhneSymbol(s.betragCent)) : ''}" inputmode="decimal" style="width:90px"></td></tr>`; }).join('')}</tbody></table></div>
    ${r.hinweis ? `<p class="leise">Route laut PDF: ${esc(r.hinweis)}</p>` : ''}
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll">${ziel ? 'Stopps übernehmen' : 'Tour mit Stopps anlegen'}</button></div></form>`);
  const f = $('#rk-form');

/** Text einer Tour für WhatsApp/SMS. */
function tourNachricht(t) {
  const ag = S.auftraggeber[t.auftraggeberId], adr = ag ? rechnungsAdresse(ag.id) : null;
  const mitNr = id => { const m = maVon(id); return m ? m.name + (m.telefon ? ' – ' + m.telefon : '') : ''; };
  return [`Tour am ${datumMitTag(t.datum)}${t.tourNr ? ' – ' + t.tourNr : ''}`, tourAuftraggeberName(t) && 'Auftraggeber: ' + tourAuftraggeberName(t),
    adr && 'Adresse: ' + adresseText(adr), t.name && 'Tour: ' + t.name, t.kennzeichen && 'Fahrzeug: ' + t.kennzeichen, t.uhrzeit && 'Ladezeit: ' + t.uhrzeit,
    t.einsatzart && 'Einsatz: ' + t.einsatzart, t.fahrerId && 'Fahrer: ' + mitNr(t.fahrerId), ...beifahrerVon(t).map(id => 'Beifahrer: ' + mitNr(id)), t.notiz && 'Hinweis: ' + t.notiz,
    stoppsVon(t.id).length && 'Stopps:\n' + stoppsVon(t.id).map(s => `${s.reihenfolge}. ${STOPP_ART[s.art] ? STOPP_ART[s.art][0] + ': ' : ''}${stoppText(s)}${s.zeitfenster ? ' (' + s.zeitfenster + ')' : ''}${s.kundeTelefon ? ' ☎ ' + s.kundeTelefon : ''}${s.betragCent ? ' 💶 ' + geld(s.betragCent) : ''}${s.notiz ? ' – ' + s.notiz : ''}`).join('\n')].filter(Boolean).join('\n');
}
/** 💬 an der Tour: WhatsApp direkt mit dem Tourtext öffnen – dort Fahrer und Beifahrer gleichzeitig auswählen (wie in der alten Tourenplanung). */
const tourWhatsapp = t => oeffneLink(`https://wa.me/?text=${encodeURIComponent(tourNachricht(t))}`);
function tourSenden(t) {
  const text = tourNachricht(t), team = teamVon(t).map(maVon).filter(Boolean);
  const mitNr = team.filter(m => m.telefon);
  dialog(`<h2>Tour senden</h2><pre class="vorschau">${esc(text)}</pre>
    ${team.length > 1 ? `<div class="zeile" style="margin:8px 0;flex-wrap:wrap;gap:8px"><button class="knopf voll" id="tp-wa-alle">💬 WhatsApp an alle ${team.length}</button>${mitNr.length > 1 ? `<button class="knopf" id="tp-sms-alle">SMS an alle</button>` : ''}</div>
      <p class="leise" style="margin-top:0">WhatsApp öffnet sich mit dem Text – dort ${esc(team.map(m => m.name.split(' ')[0]).join(' und '))} gleichzeitig auswählen (oder die Team-Gruppe) und senden.</p>` : ''}
    <div id="tp-senden">${team.map(m => `<div class="zeile eng" style="margin:6px 0"><b class="fuell">${esc(m.name)}</b>
      ${m.telefon ? `<button class="knopf tonal" data-wa="${m.id}">💬 WhatsApp</button><button class="knopf" data-sms="${m.id}">SMS</button>` : '<span class="leise">keine Nummer</span>'}</div>`).join('')}</div>
    <div class="dialog-knoepfe"><button class="knopf" id="tp-teilen">Text teilen / kopieren</button><button class="knopf voll" data-zu>Fertig</button></div>`);
  $('#tp-senden').onclick = e => {
    const wa = e.target.closest('[data-wa]'), sms = e.target.closest('[data-sms]');
    if (wa) whatsapp(maVon(wa.dataset.wa).telefon, text);
    if (sms) oeffne(`sms:${intNummer(maVon(sms.dataset.sms).telefon)}?body=${encodeURIComponent(text)}`);
  };
  $('#tp-teilen').onclick = () => teile('Tour', text);
  if ($('#tp-wa-alle')) $('#tp-wa-alle').onclick = () => oeffneLink(`https://wa.me/?text=${encodeURIComponent(text)}`);
  if ($('#tp-sms-alle')) $('#tp-sms-alle').onclick = () => {
    const nr = mitNr.map(m => intNummer(m.telefon)).join(','), ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    oeffne(ios ? `sms://open?addresses=${nr}&body=${encodeURIComponent(text)}` : `sms:${nr}?body=${encodeURIComponent(text)}`);
  };
}
/** Alle Touren des Tages: je Person eine Nachricht (WhatsApp nacheinander) oder als CSV für Sammel-SMS. */
function alleSenden(tag) {
  const eintraege = tourenAm(tag).filter(t => t.kennzeichen).flatMap(t => teamVon(t).map(id => ({ m: maVon(id), t }))).filter(x => x.m);
  dialog(`<h2>Touren ${esc(datumText(tag))} an alle</h2><p class="leise">Je Person die eigene Tour. WhatsApp öffnet sich für jede Person einzeln.</p>
    <div id="tp-alle">${eintraege.map((x, i) => `<div class="zeile eng" style="margin:6px 0"><span class="fuell"><b>${esc(x.m.name)}</b><br><span class="leise">${esc(x.t.kennzeichen)} · ${esc(tourText(x.t))}</span></span>
      ${x.m.telefon ? `<button class="knopf tonal" data-alle-wa="${i}">💬</button>` : '<span class="leise">keine Nr.</span>'}</div>`).join('') || '<p class="leise">Noch kein Team eingeplant.</p>'}</div>
    <div class="dialog-knoepfe"><button class="knopf" id="tp-csv">CSV für Sammel-SMS</button><button class="knopf voll" data-zu>Fertig</button></div>`);
  $('#tp-alle').onclick = e => { const b = e.target.closest('[data-alle-wa]'); if (!b) return; const x = eintraege[Number(b.dataset.alleWa)]; whatsapp(x.m.telefon, `Hallo ${x.m.name.split(' ')[0]},\n${tourNachricht(x.t)}`); b.textContent = '✓'; };
  $('#tp-csv').onclick = () => {
    const zeilen = eintraege.filter(x => x.m.telefon).map(x => [intNummer(x.m.telefon), x.m.name.replace(/,/g, ' '), ('Hallo {name}, ' + tourNachricht(x.t).split('\n').join(' | '))]);
    ladeHerunter(`Touren_${tag}.csv`, ['nummer,name,nachricht', ...zeilen.map(z => z.map((v, i) => (i === 2 ? v : v)).join(','))].join('\r\n'));
  };
}

  }

    ['Fahrer', t => maName(t.fahrerId)], ...Array.from({ length: Math.max(1, ...touren.map(t => beifahrerVon(t).length)) }, (_, i) => [`Beifahrer ${i + 1}`, t => maName(beifahrerVon(t)[i])])]
    .filter(([, f]) => touren.some(t => f(t)));

    <h1>Tourenplan ${esc(wochentag(tag))}, ${esc(datumText(tag))}${firma ? ' – ' + firma : ''}</h1>
    <table><tr>${spalten.map(([l]) => `<th>${l}</th>`).join('')}</tr>${touren.map(t => `<tr>${spalten.map(([, f]) => `<td>${esc(f(t) || '')}</td>`).join('')}</tr>`).join('')}</table>
    <h3>Freies Personal</h3>${gruppe('Fahrer', fr.frei.filter(m => m.rolle === 'FAHRER').map(m => m.name)) + gruppe('Fahrer/Beifahrer', fr.frei.filter(m => m.rolle === 'BEIDES').map(m => m.name)) + gruppe('Beifahrer', fr.frei.filter(m => m.rolle === 'BEIFAHRER').map(m => m.name)) || '<p>keins</p>'}

async function fahrerPdf(tag) {
  const html = tagesplanHtml(tag, true);
  if (window.desktop && window.desktop.pdf && window.desktop.speichere) {
    try { const pfad = await window.desktop.speichere(`Tagestouren_${tag}.pdf`, await window.desktop.pdf(html)); if (pfad) toast('Gespeichert: ' + pfad); } catch (e) { toast('PDF nicht möglich: ' + e.message); }
  } else druckeHtml(html);
}

/** Auftraggeber-Bericht: je Auftraggeber und Einsatzart die Anzahl je Tag, dazu die einzelnen Touren. */
function auftraggeberBericht(von, bis, firmaId) {
  const tage = []; for (let d = von; d <= bis; d = plusTage(d, 1)) tage.push(d);
  const touren = alle('touren').filter(t => t.datum >= von && t.datum <= bis && tourGefahren(t) && (!firmaId || t.auftraggeberId === firmaId || (S.auftraggeber[firmaId] && normal(t.auftraggeber) === normal(S.auftraggeber[firmaId].name))));
  const nachAg = {};
  for (const t of touren) (nachAg[tourAuftraggeberName(t) || '(ohne Auftraggeber)'] = nachAg[tourAuftraggeberName(t) || '(ohne Auftraggeber)'] || []).push(t);
  const we = t => [0, 6].includes(alsTag(t).getDay());
  const kopf = titel => `<tr><th class="nm">${titel}</th>${tage.map(t => `<th class="${we(t) ? 'we' : ''}">${Number(t.slice(8))}</th>`).join('')}<th class="s">Σ</th></tr>`;
  const zeile = (label, l, fett) => { let s = 0; return `<tr${fett ? ' style="font-weight:700"' : ''}><td class="nm">${esc(label)}</td>${tage.map(t => { const n = l.filter(x => x.datum === t).length; s += n; return `<td class="${we(t) ? 'we' : ''}">${n || ''}</td>`; }).join('')}<td class="s">${s}</td></tr>`; };
  const bloecke = Object.keys(nachAg).sort((a, b) => a.localeCompare(b, 'de')).map(ag => {
    const l = nachAg[ag], arten = [...new Set(l.map(t => t.einsatzart || '–'))].sort();
    const tourGruppen = Object.values(l.reduce((o, t) => { const k = [t.tourNr, t.name, t.einsatzart].join('|'); (o[k] = o[k] || []).push(t); return o; }, {}));
    return `<div class="blk"><h2>${esc(ag)} · ${l.length} Touren · ${esc(datumText(von))} – ${esc(datumText(bis))}</h2><table>${kopf('Einsatzart')}${arten.map(a => zeile(a, l.filter(t => (t.einsatzart || '–') === a), true)).join('')}${zeile('Summe', l, true)}</table>
      <table style="margin-top:6px">${kopf('Tour')}${tourGruppen.map(g => zeile([g[0].tourNr, g[0].name, g[0].einsatzart && '(' + g[0].einsatzart + ')'].filter(Boolean).join(' – ') || 'Tour', g)).join('')}</table></div>`;
  }).join('');
  druckeHtml(`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Auftraggeber-Bericht</title><style>@page{size:A4 landscape;margin:8mm}body{font:8pt Arial,sans-serif}
    table{border-collapse:collapse;width:100%;table-layout:fixed}td,th{border:1px solid #999;text-align:center;padding:1px}.nm{width:60mm;text-align:left;padding-left:3px;white-space:nowrap;overflow:hidden}
    .s{width:9mm;font-weight:700}.we{background:#e6e6e6}h2{font-size:11pt}.blk+.blk{break-before:page}</style></head><body>${bloecke || '<h2>Keine gefahrenen Touren im Zeitraum.</h2>'}
    <p>Gezählt: Touren mit Fahrzeug und Fahrer.</p></body></html>`);
}
function tourenCsv(von, bis) {
  const tab = (kopf, zeilen) => '﻿' + [kopf, ...zeilen].map(z => z.map(csvZelle).join(';')).join('\r\n') + '\r\n';
  return tab(['Datum', 'Wochentag', 'Fahrzeug', 'Tour-Nr.', 'Auftraggeber', 'Name', 'Ladezeit', 'Einsatzart', 'Fahrer', 'Beifahrer', 'Abgerechnet', 'Notiz'],
    alle('touren').filter(t => t.datum >= von && t.datum <= bis).sort((a, b) => a.datum.localeCompare(b.datum) || (a.reihenfolge ?? 0) - (b.reihenfolge ?? 0))
      .map(t => [datumText(t.datum), wochentag(t.datum), t.kennzeichen, t.tourNr, tourAuftraggeberName(t), t.name, t.uhrzeit, t.einsatzart, maName(t.fahrerId), beifahrerVon(t).map(maName).join(', '),
        t.belegId && S.belege[t.belegId] ? S.belege[t.belegId].nummer : '', t.notiz]));
}

// ---------- Rechnung aus Touren ----------
/** Gültiger Preis je Bezeichnung zum Stichtag (der jüngste mit „gültig ab“ ≤ Stichtag). */
function preiseZum(firmaId, stichtag) {
  const beste = new Map();
  for (const p of vonFirma('preise', firmaId)) {
    if (p.gueltigAb && p.gueltigAb > stichtag) continue;
    const k = normal(p.bezeichnung), alt = beste.get(k);
    if (!alt || String(p.gueltigAb || '') > String(alt.gueltigAb || '')) beste.set(k, p);
  }
  return [...beste.values()].sort((a, b) => a.bezeichnung.localeCompare(b.bezeichnung, 'de'));
}
/** Passender Preis für eine Einsatzart: gleiche Bezeichnung, dann enthalten, sonst die einzige Tourpauschale. */
function preisFuerArt(preise, art) {
  const a = normal(art);
  return (a && (preise.find(p => normal(p.bezeichnung) === a) || preise.find(p => normal(p.bezeichnung).includes(a) || a.includes(normal(p.bezeichnung)))))
    || (l => (l.length === 1 ? l[0] : null))(preise.filter(p => /tour/i.test(p.bezeichnung + ' ' + (p.einheit || ''))));
}
const tageText = daten => daten.sort().map(t => `${t.slice(8)}.${t.slice(5, 7)}.`).join(', ');
/** Rechnung aus der Tourenplanung: noch nicht abgerechnete, gefahrene Touren × Preise der Firma; die Touren werden als abgerechnet markiert. */
function rechnungAusTouren(firmaId, von, bis) {
  const firmen = auftraggeberListe();
  if (!firmen.length) { toast('Bitte zuerst eine Firma anlegen.'); return; }
  const zr = zeitraum('LETZTER_MONAT');
  dialog(`<form method="dialog" id="tpr-form"><h2>Rechnung aus Touren</h2>
    <p class="leise">Zählt die gefahrenen, noch nicht abgerechneten Touren der Firma im Zeitraum und setzt die Preise aus ihrer Preisliste ein.</p>
    <label class="feld">Firma<select name="firma">${firmen.map(f => `<option value="${f.id}" ${f.id === firmaId ? 'selected' : ''}>${esc(firmaName(f))} (${tourenVonFirma(f).filter(t => tourGefahren(t) && !t.belegId).length} offen)</option>`).join('')}</select></label>
    <div class="zeile"><label class="feld fuell">Von<input name="von" type="date" value="${von || zr.von}" required></label><label class="feld fuell">Bis<input name="bis" type="date" value="${bis || zr.bis}" required></label></div>
    <label class="feld">Positionen<select name="aufteilung"><option value="ART">je Einsatzart (Anzahl × Preis)</option><option value="TOUR">je Tour (mit Tagen)</option></select></label>
    <p class="fehlertext" id="tpr-fehler" hidden></p>
    <div class="dialog-knoepfe"><button type="button" class="knopf text" data-zu>Abbrechen</button><button class="knopf voll">Weiter</button></div></form>`);
  $('#tpr-form').onsubmit = ev => {
    ev.preventDefault();
    const w = Object.fromEntries(new FormData(ev.target));
    if (w.bis < w.von) { $('#tpr-fehler').textContent = '„Bis“ liegt vor „Von“.'; $('#tpr-fehler').hidden = false; return; }
    rechnungAusTourenVorschau(S.auftraggeber[w.firma], w.von, w.bis, w.aufteilung);
  };
}
function rechnungAusTourenVorschau(firma, von, bis, aufteilung) {
  const abgerechnet = t => t.belegId && S.belege[t.belegId] && !S.belege[t.belegId].geloescht;
  const alleT = tourenVonFirma(firma, von, bis).filter(tourGefahren), touren = alleT.filter(t => !abgerechnet(t));
  const preise = preiseZum(firma.id, bis);
  const gruppen = {};
  for (const t of touren) {
    const k = aufteilung === 'TOUR' ? [t.tourNr, t.name, t.einsatzart].join('|') : t.einsatzart || '';
    (gruppen[k] = gruppen[k] || { art: t.einsatzart || '', text: aufteilung === 'TOUR' ? [t.tourNr && 'Tour ' + t.tourNr, t.name].filter(Boolean).join(' – ') + (t.einsatzart ? ` (${t.einsatzart})` : '') : t.einsatzart || 'Touren', touren: [] }).touren.push(t);

/**

function wkCache() {

// ============================== Statistik ==============================

  let zeilen = [...a.ergebnis.values()].map(e => {

function mitarbeiterBewertung(von, bis) {

    const schaeden = touren.reduce((n, t) => n + schaedenVonTour(t).length, 0) || a.schaeden.length;

  }).filter(z => z.touren >= 1);

/**
 * Die bisherige Tourenplanung (eigene Seite mit Google-Tabelle) wird einmalig – oder wiederholt bis zum Umstieg – übernommen:
 * Fahrzeuge → Fuhrpark, Personal → Mitarbeiter, Einsatzarten, Auftraggeber → Firmen, Abwesenheiten und alle Touren im Zeitraum.
 * Wiederholen ist gefahrlos: gleiche Kennzeichen, Namen und Tage werden zusammengeführt, nichts doppelt angelegt.
 */
const TP = { url: 'https://script.google.com/macros/s/AKfycby5KUa5VlCeza6mLZCDt1hajWjMGLXFjD_fW847ERpWn12DC2xZZfOlezVpBUv63WTG2g/exec' };
async function tpApi(pin, name, args) {
  const r = await (await fetch(TP.url, { method: 'POST', body: JSON.stringify({ pin, name, args }) })).json();
  if (r.error) throw new Error(/PIN/i.test(r.error) && !/GESPERRT/.test(r.error) ? 'Die PIN der Tourenplanung war falsch.' : String(r.error).replace(/^.*GESPERRT: /, ''));
  return r.ok;
}
/** Feste Kennung aus einem Text (gleiche Tour bei erneutem Import = gleiche Kennung). */
function kennungAus(text) {
  let h1 = 0x811c9dc5, h2 = 0x01000193, h3 = 0x12345678, h4 = 0x9e3779b9;
  for (let i = 0; i < text.length; i++) { const c = text.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); h3 = Math.imul(h3 ^ c, 3266489917); h4 = Math.imul(h4 ^ c, 668265263); }
  const x = [h1, h2, h3, h4].map(h => (h >>> 0).toString(16).padStart(8, '0')).join('');
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20, 32)}`;
}

/** Unterschrift auf dem Bildschirm (Finger oder Maus). */
function unterschriftFeld(canvas) {
  const ctx = canvas.getContext('2d'); let malt = false, leer = true;
  const pos = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height]; };
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  canvas.addEventListener('pointerdown', e => { malt = true; leer = false; canvas.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); e.preventDefault(); });
  canvas.addEventListener('pointermove', e => { if (!malt) return; ctx.lineTo(...pos(e)); ctx.stroke(); e.preventDefault(); });
  canvas.addEventListener('pointerup', () => { malt = false; });
  return { leer: () => leer, loeschen: () => { ctx.fillRect(0, 0, canvas.width, canvas.height); leer = true; }, blob: () => new Promise(ok => canvas.toBlob(ok, 'image/png')) };
}

async function sicherungEinspielen(text) {
  const d = JSON.parse(text);
  if (!d || d.art !== 'ayse-crm-sicherung') throw new Error('Das ist keine Sicherung dieser App.');
  let n = 0;
  for (const t of TABELLEN) for (const x of d[t] || []) { const alt = S[t][x.id]; if (!alt || String(x.geaendertAm || '') > String(alt.geaendertAm || '')) { merke(t, { ...x, geaendertAm: x.geaendertAm || jetztIso() }); n++; } }

// ============================== Firmen aus CSV/Excel-Liste ==============================
/** Liest eine CSV-Liste (z. B. aus Excel „Speichern unter → CSV“): Spalten werden am Namen erkannt (Firma, Telefon, E-Mail, Straße, PLZ, Ort, Ansprechpartner, Website, Notiz, Status). */
function firmenCsvImportieren(text) {
  const zeilen = text.replace(/^﻿/, '').split(/\r?\n/).filter(z => z.trim());
  if (zeilen.length < 2) throw new Error('Die Datei enthält keine Zeilen.');
  const trenner = (zeilen[0].match(/;/g) || []).length >= (zeilen[0].match(/,/g) || []).length ? ';' : ',';
  const teile = z => { const r = []; let f = '', q = false; for (const c of z) { if (c === '"') q = !q; else if (c === trenner && !q) { r.push(f); f = ''; } else f += c; } r.push(f); return r.map(x => x.trim()); };
  const kopf = teile(zeilen[0]).map(normal), finde = (...n) => kopf.findIndex(k => n.some(x => k.includes(x)));
  const sp = { name: finde('firma', 'name', 'unternehmen'), tel: finde('telefon', 'tel'), mail: finde('mail'), str: finde('straße', 'strasse', 'adresse'), plz: finde('plz', 'postleitzahl'), ort: finde('ort', 'stadt'),
    kontakt: finde('ansprech', 'kontakt'), web: finde('web', 'internet', 'homepage'), notiz: finde('notiz', 'bemerkung', 'info'), status: finde('status') };
  if (sp.name < 0) throw new Error('Keine Spalte „Firma“ oder „Name“ gefunden.');
  let neu = 0, vorhanden = 0;
  for (const z of zeilen.slice(1)) {
    const w = teile(z), g = i => (i >= 0 ? w[i] || '' : ''), name = g(sp.name); if (!name) continue;
    if (firmaZumNamen(name)) { vorhanden++; continue; }
    const st = normal(g(sp.status)), status = /aktiv|kunde/.test(st) ? 'AKTIV' : /ehemal/.test(st) ? 'EHEMALIG' : /paus/.test(st) ? 'PAUSIERT' : 'INTERESSENT';
    const id = uuid();
    merke('auftraggeber', { id, name, status, telefon: g(sp.tel), email: g(sp.mail), website: g(sp.web), notizen: [g(sp.notiz), 'Aus Liste importiert'].filter(Boolean).join('\n'), geaendertAm: jetztIso() });
    if (g(sp.ort) || g(sp.str)) merke('adressen', { id: uuid(), firmaId: id, art: 'HAUPTSITZ', strasse: g(sp.str), plz: g(sp.plz), ort: g(sp.ort), notiz: '', geaendertAm: jetztIso() });
    if (g(sp.kontakt)) merke('ansprechpartner', { id: uuid(), firmaId: id, name: g(sp.kontakt), thema: '', telefon: g(sp.tel), email: g(sp.mail), notiz: '', geaendertAm: jetztIso() });
    neu++;
  }
  nachAenderung(); return { neu, vorhanden };
}

    ...alle('belege').filter(b => (b.art === 'RECHNUNG' || b.art === 'GUTSCHRIFT') && b.datum >= von && b.datum <= bis && b.status !== 'ENTWURF').sort((a, b) => a.datum.localeCompare(b.datum) || a.nummer.localeCompare(b.nummer)).map(b => {
      const s = belegSummen(b), f = S.auftraggeber[b.firmaId] || {}, storno = (b.status === 'STORNIERT') !== (b.art === 'GUTSCHRIFT');

        zahl(storno ? -s.brutto : s.brutto), 'S', erloes, f.kundennummer || e.debitor || '10000', belegMarke(b)[0], datumText(b.bezahltAm), zahl(b.bezahltCent || 0)];

/** Einmal am Tag (und in den Apps als Benachrichtigung): was heute ansteht. */
function tagesHinweise() {
  const w = wiedervorlagen(), t = heute(), morgen = plusTage(t, 1);
  const l = [];
  if (w.ueberfaellig.length) l.push(`${w.ueberfaellig.length} überfällige Termine`);
  if (w.heute.length) l.push(`${w.heute.length} Termine heute`);
  const af = alle('aufgabenIntern').filter(a => !a.erledigt && a.faelligAm && a.faelligAm <= t).length; if (af) l.push(`${af} fällige Aufgaben`);
  if ([1, 2, 3, 4, 5].includes(alsTag(morgen).getDay()) && !feiertagAm(morgen) && alle('touren').length && !tourenAm(morgen).length) l.push('für morgen sind noch keine Touren geplant');
  const krank = mitarbeiterListe(true).filter(m => abwesendAm(m.id, t) && grundArt(abwesendAm(m.id, t).grund) === 'Krank'); if (krank.length) l.push(`krank: ${krank.map(m => m.name.split(' ')[0]).join(', ')}`);

}
function tagesHinweiseZeigen(versuch = 0) {
  const t = heute(); if (S.einstellungen.hinweisTag === t) return;
  // Keine andere Meldung überdecken und nicht in einen offenen Dialog hinein
  if (!$('#toast').hidden || $('#dialog').open) { if (versuch < 20) setTimeout(() => tagesHinweiseZeigen(versuch + 1), 6000); return; }
  const l = tagesHinweise(); if (!l.length) return;
  S.einstellungen.hinweisTag = t; speichere();
  toast('Heute: ' + l.join(' · '), 9000);
  if (window.desktop && window.desktop.benachrichtige) window.desktop.benachrichtige('Ayse CRM – heute', l.join('\n'), '#/').catch(() => {});
}

/** Kfz-Steuer wird jedes Jahr am Jahrestag von „fällig ab“ abgebucht: Ist die eingetragene Abbuchung vorbei, gilt die nächste. */
function steuerNaechste(z) {
  const bis = z.steuerBis, ab = z.kfzSteuerAb, h = heute();
  if (!bis || bis >= h || !/^\d{4}-\d{2}-\d{2}$/.test(ab || '')) return bis || null;
  for (let j = Number(h.slice(0, 4)); ; j++) { const d = j + ab.slice(4); if (d >= h && d > bis) return d; }
}
/** Alle Fristen eines Fahrzeugs (ohne abgemeldete Fahrzeuge), sortiert nach Datum. */
function fristenVon(z) {
  if (z.status === 'STILLGELEGT') return [];
  z = { ...z, steuerBis: steuerNaechste(z) };
  return FRISTEN.filter(([k]) => z[k]).map(([k, l]) => ({ feld: k, label: l, datum: z[k], tage: Math.round((new Date(z[k]) - new Date(heute())) / 86400000) }))
    .sort((a, b) => a.datum.localeCompare(b.datum));
}
const fristFarbe = f => (f.tage < 0 ? 'rot' : f.tage <= FRIST_VORLAUF ? 'gelb' : 'grau');
const fristText = f => (f.tage < 0 ? `seit ${datumText(f.datum)} überfällig` : f.tage === 0 ? 'heute fällig' : f.tage <= FRIST_VORLAUF ? `in ${f.tage} Tag${f.tage === 1 ? '' : 'en'} (${datumText(f.datum)})` : datumText(f.datum));

/** Fristen, die in den nächsten FRIST_VORLAUF Tagen fällig sind (oder überfällig) – für Termine und Übersicht. */
function fahrzeugTermine() {
  const bis = plusTage(heute(), FRIST_VORLAUF);
  return fahrzeugListe().flatMap(z => fristenVon(z).filter(f => f.datum <= bis).map(f => ({ art: 'fahrzeug', datum: f.datum, titel: `${f.label} · ${z.kennzeichen}`,
    zusatz: [z.bezeichnung, z.fahrer].filter(Boolean).join(' · '), z })));
}

function fahrzeugKosten(z) {
  const e = eintraegeVon(z.id), jahr = String(new Date().getFullYear());
  const summe = l => l.reduce((n, x) => n + (x.betragCent || 0), 0);
  const tanken = e.filter(x => x.art === 'TANKEN' && x.menge && x.kmStand).sort((a, b) => a.kmStand - b.kmStand);
  // Durchschnittsverbrauch: getankte Liter nach der ersten Tankung ÷ gefahrene km dazwischen
  let verbrauch = null;
  if (tanken.length >= 2) {
    const km = tanken[tanken.length - 1].kmStand - tanken[0].kmStand, liter = tanken.slice(1).reduce((n, x) => n + x.menge, 0) / 100;
    if (km > 0) verbrauch = liter / km * 100;
  }
  const kmWerte = e.filter(x => x.kmStand).map(x => x.kmStand);
  return { jahr: summe(e.filter(x => String(x.datum).startsWith(jahr))), gesamt: summe(e), tankenJahr: summe(e.filter(x => x.art === 'TANKEN' && String(x.datum).startsWith(jahr))),
    werkstattJahr: summe(e.filter(x => ['WARTUNG', 'REPARATUR', 'REIFEN', 'PRUEFUNG'].includes(x.art) && String(x.datum).startsWith(jahr))), verbrauch,
    proKm: kmWerte.length >= 2 && Math.max(...kmWerte) > Math.min(...kmWerte) ? summe(e) / (Math.max(...kmWerte) - Math.min(...kmWerte)) : null };
}

const fzKennungen = z => [z.kennzeichen, ...String(z.aliase || '').split(',')].map(kzNormal).filter(Boolean);

function fzDoppelte() {

    if (t.kennzeichen !== kz) merke('touren', { ...t, kennzeichen: kz, geaendertAm: jetzt });

  for (const a of alle('aufgabenIntern').filter(a => a.bezugArt === 'fahrzeug' && a.bezugId === weg.id)) merke('aufgabenIntern', { ...a, bezugId: ziel.id, geaendertAm: jetzt });
  let fehlt = 0;
  for (const a of anlagenVon(weg.id)) {
    try { await Dateien.adresse(a); } catch { /* unten geprüft */ }
    const blob = await Dateien.hole(a.id);
    if (!blob) { fehlt++; continue; }
    const neu = merke('anlagen', { id: uuid(), fallId: ziel.id, anzeigename: a.anzeigename, mimeType: a.mimeType, groesseBytes: blob.size, hinzugefuegtAm: a.hinzugefuegtAm || jetzt, vorhanden: false });
    await Dateien.lege(neu.id, blob);
    entferne('anlagen', a, { fallId: a.fallId }); Dateien.loesche(a.id);
  }
  if (fehlt) for (const a of anlagenVon(weg.id)) entferne('anlagen', a, { fallId: a.fallId });
  const aliase = [...new Map([ziel.kennzeichen, weg.kennzeichen, ...String(ziel.aliase || '').split(','), ...String(weg.aliase || '').split(',')]
    .map(x => String(x || '').trim().toUpperCase()).filter(x => x && kzNormal(x) !== kzNormal(kz)).map(x => [kzNormal(x), x])).values()].join(', ');
  const dazu = Object.fromEntries(Object.entries(weg).filter(([k, v]) => !['id', 'kennzeichen', 'aliase', 'notiz', 'geaendertAm', '_n', 'rev'].includes(k) && v != null && v !== '' && (ziel[k] == null || ziel[k] === '')));
  const km = Math.max(Number(ziel.kmStand) || 0, Number(weg.kmStand) || 0) || ziel.kmStand || weg.kmStand || null;
  merke('fahrzeuge', { ...ziel, ...dazu, kennzeichen: kz, aliase, kmStand: km, notiz: [ziel.notiz, weg.notiz].filter(Boolean).filter((x, i, l) => l.indexOf(x) === i).join('\n'), geaendertAm: jetzt });
  entferne('fahrzeuge', weg, { firmaId: '', geaendertAm: jetzt });

  return { fehlt };
}

/**
 * Fuhrpark-Import (z. B. aus eingelesenen Fahrzeugscheinen): { fahrzeuge: [{ kennzeichen, … }], dokumente: [{ kennzeichen, art, name, mimeType, base64 }] }.
 * Gleiches Kennzeichen = gleiches Fahrzeug: leere Felder werden ergänzt, vorhandene Angaben bleiben. Dokumente mit gleichem Namen kommen nicht doppelt.
 */
async function fuhrparkImportieren(text) {
  const d = JSON.parse(text);
  if (!d || !Array.isArray(d.fahrzeuge)) throw new Error('Das ist keine Fuhrpark-Datei.');
  const felder = new Set(FAHRZEUG_FELDER.flatMap(([, f]) => f.map(([k]) => k)).concat(['leasingRateCent', 'kfzSteuerCent', 'versicherungCent']));
  felder.delete('leihfahrzeug');
  const nachKz = new Map(alle('fahrzeuge').map(z => [kzNormal(z.kennzeichen), z]));
  let neu = 0, ergaenzt = 0, doks = 0;
  for (const roh of d.fahrzeuge) {
    const kz = kzNormal(roh.kennzeichen); if (!kz) continue;
    const sauber = Object.fromEntries(Object.entries(roh).filter(([k, v]) => felder.has(k) && v != null && v !== ''));
    const alt = nachKz.get(kz);
    if (!alt) { const id = FuhrparkAktionen.speichern({ art: 'TRANSPORTER', status: 'AKTIV', ...sauber }); nachKz.set(kz, S.fahrzeuge[id]); neu++; continue; }
    const dazu = Object.fromEntries(Object.entries(sauber).filter(([k]) => alt[k] == null || alt[k] === ''));
    if (Object.keys(dazu).length) { FuhrparkAktionen.speichern({ ...alt, ...dazu }); nachKz.set(kz, S.fahrzeuge[alt.id]); ergaenzt++; }
  }
  for (const dok of d.dokumente || []) {
    const z = nachKz.get(kzNormal(dok.kennzeichen)); if (!z || !dok.base64) continue;
    const name = `${dok.art || 'Sonstiges'} – ${dok.name}`;
    if (anlagenVon(z.id).some(a => a.anzeigename === name)) continue;
    const blob = blobAusBase64(dok.base64, dok.mimeType || 'application/pdf');
    const a = merke('anlagen', { id: uuid(), fallId: z.id, anzeigename: name, mimeType: blob.type, groesseBytes: blob.size, hinzugefuegtAm: jetztIso(), vorhanden: false });
    await Dateien.lege(a.id, blob); doks++;
  }
  nachAenderung();
  return { neu, ergaenzt, doks };
}

function fuhrparkCsv() {
  const tab = (kopf, zeilen) => '﻿' + [kopf, ...zeilen].map(z => z.map(csvZelle).join(';')).join('\r\n') + '\r\n';

  return {
