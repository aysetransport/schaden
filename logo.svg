<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Ayse CRM – App-Symbol nach Apples Richtlinien: ein klares Motiv (Straße in der Flucht = „A“), kein Text,
       Raster 1024 mit Motiv in der Sicherheitszone (Masken von iOS, Android, Windows), Ebenen statt eingebauter Effekte:
       Hintergrund (Verlauf) · Fahrbahn (weiß) · Mittellinie (halbdurchsichtig, Tiefe). Quelle für tools/icons.js. -->
  <defs>
    <linearGradient id="hintergrund" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF5A66"/><stop offset="1" stop-color="#C40F25"/></linearGradient>
    <radialGradient id="licht" cx=".3" cy=".08" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fahrbahn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#FFE9EC"/></linearGradient>
  </defs>
  <g id="ebene-hintergrund"><rect width="1024" height="1024" fill="url(#hintergrund)"/><rect width="1024" height="1024" fill="url(#licht)"/></g>
  <g id="ebene-motiv" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 786 512 262 766 786" stroke="url(#fahrbahn)" stroke-width="112"/>
    <g stroke="#fff" stroke-opacity=".62"><path d="M512 744v-56" stroke-width="46"/><path d="M512 610v-40" stroke-width="36"/><path d="M512 500v-24" stroke-width="26"/></g>
  </g>
</svg>
